<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>世界史一問一答 — FSRS問題集</title>
<style>
:root{
  --paper:#F7F5F0;
  --paper-2:#EFECE4;
  --ink:#20355E;
  --ink-soft:#5A6B8C;
  --ink-faint:#C4CCDC;
  --line:#DAD5C8;
  --seal:#B7362A;
  --seal-soft:#F3DEDA;
  --good:#2E6B4F;
  --card:#FFFFFF;
  --radius:14px;
  --shadow:0 1px 2px rgba(32,53,94,.06), 0 8px 24px rgba(32,53,94,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{min-height:100%}
button,input,select,textarea{touch-action:manipulation}
body{
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;display:flex;flex-direction:column}

/* ===== header ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.stamp{
  width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;border-radius:6px;
  font-size:15px;font-weight:700;letter-spacing:0;line-height:1;
  transform:rotate(-4deg);
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.04em}
.brand small{display:block;font-size:10px;color:var(--ink-soft);font-weight:400;letter-spacing:.12em}
nav{display:flex;gap:4px}
nav button{
  background:none;border:none;font:inherit;font-size:12px;color:var(--ink-soft);
  padding:7px 10px;border-radius:9px;cursor:pointer;
}
nav button.on{background:var(--ink);color:var(--paper)}

main{flex:1;display:flex;flex-direction:column;padding:6px 18px 24px}

/* ===== home ===== */
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 20px;margin-bottom:14px;
}
.hero .date{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:14px}
.counts{display:flex;gap:0}
.count{flex:1;text-align:center;position:relative}
.count+.count::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.count b{display:block;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.count.due b{color:var(--seal)}
.count.new b{color:var(--ink)}
.count.done b{color:var(--good)}
.count span{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
.start{
  width:100%;margin-top:20px;border:none;border-radius:12px;
  background:var(--ink);color:var(--paper);font:inherit;font-size:16px;font-weight:700;
  padding:15px;cursor:pointer;letter-spacing:.06em;
}
.start:active{transform:scale(.985)}
.start:disabled{background:var(--ink-faint);color:#fff}
.substat{
  display:flex;justify-content:space-between;background:var(--paper-2);
  border-radius:10px;padding:10px 14px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;
}
.substat b{color:var(--ink);font-variant-numeric:tabular-nums}
.notice{font-size:11px;color:var(--seal);background:var(--seal-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none}

/* ===== review card ===== */
.progress{height:3px;background:var(--paper-2);border-radius:2px;margin:4px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .25s}
.qtags{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.qtags .tag-new{color:var(--seal);font-weight:700}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;
}
.face{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 20px;position:relative;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;cursor:pointer;
}
.face.revealed{justify-content:flex-start;align-items:stretch;padding:22px 20px 14px;cursor:default}
.chapter-tag{
  font-size:11px;color:var(--seal);letter-spacing:.06em;margin-bottom:14px;text-align:center;
  font-weight:700;
}
.q-front{font-size:22px;font-weight:600;text-align:center;line-height:1.6;position:relative;z-index:1;word-break:break-word}
.q-front.long{font-size:19px}
.q-front.xlong{font-size:16px;font-weight:500}
.hint{margin-top:22px;font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.answer{width:100%;display:none;flex-direction:column;gap:0;text-align:center}
.answer.show{display:flex}
.answer .udel{margin-top:16px}
.reveal{
  border:none;border-top:1px solid var(--line);background:var(--card);
  font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:16px;cursor:pointer;
  letter-spacing:.1em;
}
.grades{display:none;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.grades.show{display:grid}
.grades button{
  border:none;background:var(--card);font:inherit;padding:11px 4px 13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.grades button+button{border-left:1px solid var(--line)}
.grades b{font-size:14px;font-weight:700}
.grades small{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.g1 b{color:var(--seal)} .g2 b{color:#A2691E} .g3 b{color:var(--ink)} .g4 b{color:var(--good)}
.grades button:active{background:var(--paper-2)}

/* finish */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.finish .bigstamp{
  width:88px;height:88px;border:3px solid var(--seal);color:var(--seal);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;
  transform:rotate(-6deg);
}
.finish p{color:var(--ink-soft);font-size:13px}

/* ===== browse ===== */
.search{
  width:100%;font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:var(--ink);margin-bottom:10px;outline:none;
}
.search:focus{border-color:var(--ink-soft)}
.chfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;-webkit-overflow-scrolling:touch}
.chfilter::-webkit-scrollbar{display:none}
.chfilter button{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  font:inherit;font-size:11px;padding:6px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
.chfilter button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer}
.bitem:active{background:var(--paper-2)}
.bitem .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bitem .qq{font-size:14px;font-weight:600;line-height:1.5}
.bitem .st{font-size:10px;color:var(--ink-soft);white-space:nowrap;flex:none}
.bitem .aa{font-size:12px;color:var(--seal);margin-top:4px}
.bmore{margin:12px auto;display:block;background:none;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;color:var(--ink-soft);padding:9px 22px;cursor:pointer}

/* ===== card detail modal ===== */
.modalOverlay{
  position:fixed;inset:0;background:rgba(32,53,94,.36);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modalOverlay.show{opacity:1;pointer-events:auto}
.modalSheet{
  width:100%;max-width:520px;max-height:82vh;background:var(--paper);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(32,53,94,.18);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(16px);transition:transform .2s;
  padding-bottom:env(safe-area-inset-bottom);
}
.modalOverlay.show .modalSheet{transform:translateY(0)}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.modalHead .tag{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
.modalClose{border:none;background:var(--paper-2);color:var(--ink-soft);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modalBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 8px;text-align:center}
.detail{text-align:center}
.detail .chap-d{font-size:11px;color:var(--seal);font-weight:700;letter-spacing:.06em;margin-bottom:10px}
.detail .q-d{font-size:19px;font-weight:600;line-height:1.6;word-break:break-word;text-align:left}
.detail .q-d.long{font-size:17px}
.detail .q-d.xlong{font-size:15px}
.detail hr{border:none;border-top:1px solid var(--line);margin:16px auto;width:56px}
.detail .a-d{font-size:19px;font-weight:700;line-height:1.6;text-align:left;color:var(--seal)}
.detail .n-block{margin-top:16px;text-align:left;display:flex;flex-direction:column;gap:10px}
.n-item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.n-item .n-zh{font-size:15px;font-weight:600;line-height:1.6}
.n-item .n-jp{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
.n-note{background:var(--seal-soft);color:var(--seal);border-radius:11px;padding:10px 13px;font-size:12.5px;line-height:1.7;text-align:left}
.n-plain{background:var(--paper-2);border-radius:11px;padding:10px 13px;font-size:13px;color:var(--ink-soft);line-height:1.7;text-align:left;white-space:pre-wrap}
.detail .modalStats{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mstat{background:var(--paper-2);border-radius:9px;padding:6px 11px;font-size:11px;color:var(--ink-soft)}
.mstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.modalFoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.modalFoot button{flex:1;border-radius:11px;font:inherit;font-size:14px;padding:12px;cursor:pointer}
.modalFoot .mEdit{border:none;background:var(--ink);color:var(--paper);font-weight:700}
.modalFoot .mStudy{border:1px solid var(--ink);background:none;color:var(--ink);font-weight:700}

/* ===== settings ===== */
.spanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:12px}
.srow+.srow{border-top:1px solid var(--line)}
.srow label{font-size:14px;font-weight:600}
.srow small{display:block;font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:2px}
.srow select,.srow input[type=number]{
  font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);width:92px;text-align:center;
}
.danger{width:100%;border:1px solid var(--seal);background:none;color:var(--seal);font:inherit;font-size:14px;font-weight:600;border-radius:11px;padding:12px;cursor:pointer}
.sinfo{font-size:11px;color:var(--ink-soft);line-height:1.7;padding:0 4px}
/* ===== add form ===== */
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.frow label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.04em}
.frow input,.frow textarea{
  width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);color:var(--ink);outline:none;
}
.frow textarea{resize:vertical;min-height:60px;font-size:14px}
.frow input:focus,.frow textarea:focus{border-color:var(--ink-soft)}
.fbtns{display:flex;gap:10px}
.ai-fill{
  flex:1;border:1px solid var(--ink);background:none;color:var(--ink);font:inherit;
  font-size:14px;font-weight:600;border-radius:11px;padding:12px;cursor:pointer;
}
.ai-fill:disabled{opacity:.5}
.fsave{flex:1;border:none;background:var(--ink);color:var(--paper);font:inherit;font-size:14px;font-weight:700;border-radius:11px;padding:12px;cursor:pointer}
.udel{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;padding:4px 0 0;text-decoration:underline}
input[type=file]{
  width:100%;font:inherit;font-size:12px;padding:9px;border:1px dashed var(--line);
  border-radius:10px;background:var(--paper);color:var(--ink-soft);
}
input[type=file]::-webkit-file-upload-button{
  font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);padding:6px 12px;margin-right:10px;cursor:pointer;
}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
.dbtn{
  flex:1;min-width:88px;border:1px solid var(--line);background:var(--card);
  font:inherit;font-size:12px;color:var(--ink-soft);border-radius:9px;padding:8px 6px;cursor:pointer;
}
.dbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.dbtn:active{transform:scale(.97)}
.ulabel{color:var(--seal);font-weight:700}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;padding:10px 18px;border-radius:24px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <div class="stamp">史</div>
    <h1>世界史一問一答<small>FSRS 問題集・全<span id="totalN">0</span>問</small></h1>
  </div>
  <nav>
    <button id="nav-home" class="on">学習</button>
    <button id="nav-browse">一覧</button>
    <button id="nav-add">追加</button>
    <button id="nav-set">設定</button>
  </nav>
</header>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div id="errbar" style="display:none;position:fixed;top:0;left:0;right:0;background:#B7362A;color:#fff;font-size:11px;padding:8px 12px;z-index:99;word-break:break-all"></div>
<noscript><div style="padding:30px 20px;text-align:center;font-size:14px;color:#B7362A">このアプリの動作にはJavaScriptが必要です。iPhoneの「ファイル」のプレビューではなく、共有ボタンから「Safariで開く」を選ぶか、Claudeアプリ内のプレビューでご利用ください。</div></noscript>

<script>
const CARDS=[{"id":1,"q":"1648年に締結され、各諸侯に主権を認め「主権国家体制（ウェストファリア体制）」の確立の契機となった条約は何か。","a":"ウェストファリア条約","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":2,"q":"ウェストファリア条約によって独立が正式に承認された、北海交易で繁栄した新興国家はどこか（2つ）。","a":"オランダ（ネーデルラント連邦共和国）、スイス","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":3,"q":"1713年のユトレヒト条約で、イギリスがスペインから獲得し、地中海進出の拠点とした戦略的要衝はどこか。","a":"ジブラルタル（およびミノルカ島）","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":4,"q":"1713年のユトレヒト条約で、イギリスがスペインから獲得した、黒人奴隷を供給する独占的権利を何と呼ぶか。","a":"アシエント（奴隷供給契約）","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":5,"q":"1756年にオーストリアのハプスブルク家が、プロイセンに対抗するために長年の宿敵であったフランス・ブルボン家と結んだ同盟（外交的転換）を何と呼ぶか。","a":"外交革命","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":6,"q":"シュレジエンの奪還を目指したシュレジエン戦争・七年戦争におけるプロイセンの国王は誰か。","a":"フリードリヒ2世（フリードリヒ大王）","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":7,"q":"イギリスとフランスの植民地争奪戦において、北米での七年戦争と並行して戦われた戦いは何か。","a":"フレンチ・インディアン戦争","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":8,"q":"1763年のパリ条約で、イギリスがフランスから獲得した北米の地域はどこか（主要な2つ）。","a":"カナダ、ミシシッピ川以東のルイジアナ","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":9,"q":"1772年、1793年、1795年の3回にわたり、ロシア・プロイセン・オーストリアによって実施された領土分割を何と呼ぶか。","a":"ポーランド分割","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":10,"q":"ポーランド分割に抵抗して義勇軍を率いて抵抗運動を展開した、アメリカ独立戦争にも参加したポーランドの愛国者は誰か。","a":"コシチュシコ","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":11,"q":"ウィーン会議（1814〜1815年）を主導し、欧州の勢力均衡と正統主義を重んじたオーストリアの外相（後に宰相）は誰か。","a":"メッテルニヒ","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":12,"q":"メッテルニヒらの反動体制に対し、ドイツの学生組合が結成し、自由と統一を求めて起こした運動は何か。","a":"ブルシェンシャフト運動","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":13,"q":"1830年の7月革命の影響を受けて起こり、1831年にオランダから独立を果たした立憲君主国はどこか。","a":"ベルギー","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":14,"q":"1848年の「諸国民の春」の中で、ドイツ統一と憲法制定を議論するために開かれた全ドイツの代表者会議は何か。","a":"フランクフルト国民議会","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":15,"q":"ドイツ統一の手法をめぐり、オーストリアを除外してプロイセンを中心に統一を図ろうとする立場を何と呼ぶか。","a":"小ドイツ主義","c":"【第1章】欧州主権国家体制の形成と変容（15題）"},{"id":16,"q":"16世紀半ばにボリビアで発見され、大量の銀が掘り出されてヨーロッパやアジアへ流出した有名な銀山は何か。","a":"ポトシ銀山","c":"【第2章】大西洋環流・銀とグローバル経済・交易網（15題）"},{"id":17,"q":"アメリカ大陸から大量の銀がヨーロッパに流入したことで激しいインフレーションが起こり、固定地代に頼る領主層が打撃を受けた現象を何と呼ぶか。","a":"価格革命","c":" /* ================= FSRS-5 ================= */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FACTOR=Math.pow(0.9,1/DECAY)-1; // =19/81
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const D0=g=>clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
const S0=g=>Math.max(W[g-1],0.1);
const retr=(t,S)=>Math.pow(1+FACTOR*t/S,DECAY);
const nextInterval=(S,rr)=>Math.max(1,Math.round(S/FACTOR*(Math.pow(rr,1/DECAY)-1)));
function nextD(D,g){
  const dd=-W[6]*(g-3);
  let Dp=D+dd*(10-D)/9;
  return clamp(W[7]*D0(4)+(1-W[7])*Dp,1,10);
}
function recallS(D,S,R,g){
  const hard=g===2?W[15]:1, easy=g===4?W[16]:1;
  return clamp(S*(1+Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-R))-1)*hard*easy),0.1,36500);
}
function forgetS(D,S,R){
  return clamp(Math.min(W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-R)),S),0.1,36500);
}
/* 学習ステップ（分）: 新規/再学習 */
const LEARN_STEPS=[1,10], RELEARN_STEPS=[10];
const DAY=86400000, MIN=60000;

/* ================= 状態 ================= */
let S={};          // cardId -> {st,step,D,S,due,last,reps,lapses}
let CFG={retention:0.9, newPerDay:20, order:'seq',
         sessionMax:0,      // 1回の学習で出題する問題数（0=無制限）
         bias:'review',     // 出題傾向 new=未学習優先 / review=復習優先 / mix=ランダム
         reviewEvery:0};    // N問ごとに復習カードを挿入（0=無効）
let LOG={date:'',newDone:0,revDone:0,streakDays:0,lastStudy:''};
let UC=[];         // ユーザー追加カード [{id:'u...',q,a,c,n}]
let OV={};         // 既存カードの修正内容 id -> {q,a,c,n}
let DL=[];         // 削除した既存カードのid
let storageOK=true, storageKind='none', dirty=false, saveTimer=null;

/* ===== 復習履歴（revlog） =====
   1件 = [カードID, 採点時刻(秒), 評価1-4, 前回からの経過日数, 採点前の状態]
   本体データとは別キーに保存する。履歴の保存に失敗しても学習状況の保存は妨げない。 */
const RL_KEY='wh-fsrs-v1-revlog';
const RL_MAX=50000;        // 上限。超過分は古い順に破棄
let RL=[], rlDirty=false, rlTimer=null;
const today=()=>new Date().toISOString().slice(0,10);
const isUserCard=id=>typeof id==='string'&&id[0]==='u';

/* 保存先の抽象化:
   1) Claude.ai のプレビュー内では window.storage を使う
   2) ローカルファイル／実ブラウザ（Documents by Readdle 等）では localStorage を使う
   どちらも使えない場合のみ、セッション内メモリのみの動作にフォールバックする */
async function storageGet(key){
  if(window.storage){
    return await window.storage.get(key);
  }
  try{
    const v=localStorage.getItem(key);
    return v!=null?{key,value:v}:null;
  }catch(e){ throw e; }
}
async function storageSet(key,value){
  if(window.storage){
    const r=await window.storage.set(key,value);
    if(!r)throw new Error('保存先がnull応答を返しました（一時的なエラーの可能性）');
    return r;
  }
  try{
    localStorage.setItem(key,value);
    return {key,value};
  }catch(e){ throw e; }
}
function safetyBackup(payload){
  try{ localStorage.setItem('wh-fsrs-v1-backup', payload); return true; }
  catch(e){ return false; }
}
function detectStorageKind(){
  if(window.storage){storageKind='claude';return true}
  try{
    const t='__wh_test__';
    localStorage.setItem(t,'1');localStorage.removeItem(t);
    storageKind='local';return true;
  }catch(e){storageKind='none';return false}
}

function applyLoadedPayload(value){
  const o=JSON.parse(value);
  S=o.s||{};CFG=Object.assign(CFG,o.cfg||{});LOG=Object.assign(LOG,o.log||{});
  UC=o.uc||[];OV=o.ov||{};DL=o.dl||[];
  for(const c of UC)CARDS.push(c);
  for(const id in OV){const c=CARDS.find(x=>String(x.id)===String(id));if(c)Object.assign(c,OV[id]);}
  if(DL.length){const del=new Set(DL.map(String));
    for(let i=CARDS.length-1;i>=0;i--){if(del.has(String(CARDS[i].id)))CARDS.splice(i,1);}}
}
async function loadState(){
  storageOK=detectStorageKind();
  if(!storageOK)return;
  let applied=false;
  try{
    const r=await storageGet('wh-fsrs-v1');
    if(r&&r.value){ applyLoadedPayload(r.value); applied=true; }
  }catch(e){/* 初回：キー無し、または保存先エラー */}
  if(!applied && storageKind==='claude'){
    try{
      const bk=localStorage.getItem('wh-fsrs-v1-backup');
      if(bk){
        applyLoadedPayload(bk);
        dirty=true;
        showPending('⚠️ 前回保存できなかった内容をこの端末から復元しました。再保存を試みています…');
        ensureBgRetry();
      }
    }catch(e){/* 復元できなければ何もしない */}
  }
}
function scheduleSave(){
  dirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState,600);
}
function errText(e){
  if(!e)return '不明なエラー';
  if(typeof e==='string')return e;
  if(e.message)return e.message;
  try{return JSON.stringify(e)}catch(x){return String(e)}
}
let bgRetryTimer=null;
function ensureBgRetry(){
  if(bgRetryTimer)return;
  bgRetryTimer=setInterval(async()=>{
    if(!dirty){clearInterval(bgRetryTimer);bgRetryTimer=null;return}
    const ok=await saveState();
    if(ok){
      clearInterval(bgRetryTimer);bgRetryTimer=null;
      toast('保存待ちだった内容の保存が完了しました');
      hidePending();
    }
  },8000);
}
async function loadRL(){
  if(!storageOK){RL=[];return}
  try{
    const r=await storageGet(RL_KEY);
    if(r&&r.value){
      const a=JSON.parse(r.value);
      RL=Array.isArray(a)?a:[];
    }
  }catch(e){ RL=[]; }
}
function scheduleSaveRL(){
  rlDirty=true;
  clearTimeout(rlTimer);
  rlTimer=setTimeout(saveRL,1200);
}
async function saveRL(){
  if(!storageOK||!rlDirty)return false;
  clearTimeout(rlTimer);
  try{
    await storageSet(RL_KEY, JSON.stringify(RL));
    rlDirty=false;
    return true;
  }catch(e){
    return false;
  }
}
function logReview(id,g,c){
  const now=Date.now();
  const dt = c.last ? Math.round((now-c.last)/DAY*100)/100 : 0;
  RL.push([id, Math.floor(now/1000), g, dt, c.st|0]);
  if(RL.length>RL_MAX) RL.splice(0, RL.length-RL_MAX);
  scheduleSaveRL();
}
function showPending(msg){
  let p=document.getElementById('pendingBox');
  if(!p){
    p=document.createElement('div');
    p.id='pendingBox';
    p.style.cssText='position:fixed;left:12px;right:12px;bottom:70px;background:var(--seal-soft);color:var(--seal);border-radius:11px;padding:10px 13px;font-size:12px;line-height:1.6;z-index:40;box-shadow:var(--shadow)';
    document.body.appendChild(p);
  }
  p.innerHTML=(msg||'⚠️ この変更はまだ保存されていません。自動で再試行しています…')
    +' <button id="pendingRetry" style="margin-left:6px;border:1px solid var(--seal);background:none;color:var(--seal);border-radius:7px;padding:3px 8px;font:inherit;font-size:11px;cursor:pointer">今すぐ再試行</button>';
  p.style.display='block';
  const btn=document.getElementById('pendingRetry');
  if(btn)btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='再試行中…';
    const ok=await saveState();
    if(ok){toast('保存できました');hidePending();}
    else{btn.disabled=false;btn.textContent='今すぐ再試行';}
  };
}
function hidePending(){
  const p=document.getElementById('pendingBox');
  if(p)p.style.display='none';
}
let saveInFlight=null;
async function saveState(){
  if(!storageOK){
    showErr('保存先が利用できないため保存できません（設定画面で保存先を確認してください）');
    return false;
  }
  if(!dirty)return true;
  clearTimeout(saveTimer);
  if(saveInFlight){
    await saveInFlight.catch(()=>{});
    if(!dirty)return true;
  }
  const task=(async()=>{
    const payload=JSON.stringify({s:S,cfg:CFG,log:LOG,uc:UC,ov:OV,dl:DL});
    let lastErr='';
    const delays=[500,1200,2500];
    for(let attempt=1;attempt<=delays.length+1;attempt++){
      try{
        await storageSet('wh-fsrs-v1',payload);
        dirty=false;
        safetyBackup(payload);
        return true;
      }catch(e){
        lastErr=errText(e);
        if(attempt<=delays.length)await new Promise(r=>setTimeout(r,delays[attempt-1]));
      }
    }
    const kb=Math.round(payload.length/1024);
    const backedUp=safetyBackup(payload);
    showErr('保存に失敗しました（保存先からの応答：'+lastErr+'／データ量 約'+kb+'KB）。'
      +'このメッセージの内容を教えていただければ原因を特定できます。'
      +(backedUp?'（このブラウザ内には退避コピーを保存しました）':''));
    toast('保存に失敗しました。自動で再試行します（詳細は上部の赤帯）');
    showPending();
    ensureBgRetry();
    return false;
  })();
  saveInFlight=task;
  try{
    return await task;
  }finally{
    if(saveInFlight===task)saveInFlight=null;
  }
}

/* ================= 採点 ================= */
function getSt(id){return S[id]||(S[id]={st:0,step:0,D:0,S:0,due:0,last:0,reps:0,lapses:0})}
function previewIvl(c,g){
  const now=Date.now();
  if(c.st===0||c.st===1||c.st===3){
    const steps=c.st===3?RELEARN_STEPS:LEARN_STEPS;
    if(g===1)return fmtIvl(steps[0]*MIN);
    if(g===4)return fmtIvl(nextInterval(c.st===0?S0(4):Math.max(c.S,S0(4)),CFG.retention)*DAY);
    const ns=c.step+(g===3?1:0);
    if(g===3&&ns>=steps.length){
      const s=c.st===0?S0(3):Math.max(c.S,S0(3));
      return fmtIvl(nextInterval(s,CFG.retention)*DAY);
    }
    return fmtIvl(steps[Math.min(g===2?c.step:ns,steps.length-1)]*MIN);
  }
  const t=Math.max(0,(now-c.last)/DAY);
  const R=retr(t,c.S);
  if(g===1)return fmtIvl(RELEARN_STEPS[0]*MIN);
  return fmtIvl(nextInterval(recallS(c.D,c.S,R,g),CFG.retention)*DAY);
}
function rate(id,g){
  const c=getSt(id), now=Date.now();
  const isNew=c.st===0;
  logReview(id,g,c);
  if(c.st===0||c.st===1||c.st===3){
    const steps=c.st===3?RELEARN_STEPS:LEARN_STEPS;
    if(c.st===0){c.D=D0(g);c.S=S0(g);}
    if(g===1){c.step=0;c.due=now+steps[0]*MIN;c.st=c.st===3?3:1;}
    else if(g===2){c.due=now+steps[Math.min(c.step,steps.length-1)]*MIN;c.st=c.st===0?1:c.st;}
    else if(g===4){
      c.S=Math.max(c.S,S0(4));c.D=c.D||D0(4);
      c.st=2;c.step=0;c.due=now+nextInterval(c.S,CFG.retention)*DAY;
    }else{
      c.step++;
      if(c.step>=steps.length){c.st=2;c.step=0;c.S=Math.max(c.S,S0(3));c.D=c.D||D0(3);c.due=now+nextInterval(c.S,CFG.retention)*DAY;}
      else{c.st=c.st===0?1:c.st;c.due=now+steps[c.step]*MIN;}
    }
  }else{
    const t=Math.max(0,(now-c.last)/DAY), R=retr(t,c.S);
    if(g===1){
      c.S=forgetS(c.D,c.S,R);c.D=nextD(c.D,1);c.lapses++;
      c.st=3;c.step=0;c.due=now+RELEARN_STEPS[0]*MIN;
    }else{
      c.S=recallS(c.D,c.S,R,g);c.D=nextD(c.D,g);
      c.due=now+nextInterval(c.S,CFG.retention)*DAY;
    }
  }
  c.last=now;c.reps++;
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0;}
  if(isNew)LOG.newDone++;else if(c.st===2||g===1)LOG.revDone++;
  if(LOG.lastStudy!==today()){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    LOG.streakDays=(LOG.lastStudy===y)?(LOG.streakDays||0)+1:1;
    LOG.lastStudy=today();
  }
  scheduleSave();
}
function fmtIvl(ms){
  const m=ms/MIN;
  if(m<60)return '<'+Math.max(1,Math.round(m))+'分';
  if(ms<DAY)return Math.round(ms/3600000)+'時間';
  const d=ms/DAY;
  if(d<30)return Math.round(d)+'日';
  if(d<365)return (d/30.4).toFixed(1).replace(/\.0$/,'')+'ヶ月';
  return (d/365).toFixed(1).replace(/\.0$/,'')+'年';
}

/* ================= キュー ================= */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function isReviewCard(c){
  const st=S[c.id];
  return !!st&&(st.st===2||st.st===3);
}
function interleaveReview(q,n){
  if(!(n>0))return q;
  const out=q.slice();
  for(let pos=n-1; pos<out.length; pos+=n){
    if(isReviewCard(out[pos]))continue;
    let j=-1;
    for(let k=pos+1;k<out.length;k++){ if(isReviewCard(out[k])){j=k;break} }
    if(j<0)break;
    const [card]=out.splice(j,1);
    out.splice(pos,0,card);
  }
  return out;
}
function buildQueue(){
  const now=Date.now();
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0;}
  const due=[],learn=[],fresh=[];
  for(const c of CARDS){
    const st=S[c.id];
    if(!st||st.st===0){fresh.push(c);continue}
    if(st.due<=now){(st.st===2?due:learn).push(c)}
  }
  due.sort((a,b)=>S[a.id].due-S[b.id].due);
  learn.sort((a,b)=>S[a.id].due-S[b.id].due);
  const newLimit=Math.max(0,CFG.newPerDay-LOG.newDone);
  let newCards=fresh;
  if(CFG.order==='rand'){newCards=shuffle(fresh.slice());}
  newCards=newCards.slice(0,newLimit);

  let q;
  if(CFG.bias==='new'){
    q=[...newCards, ...learn, ...due];
  }else if(CFG.bias==='mix'){
    q=[...learn, ...shuffle([...due, ...newCards])];
  }else{
    q=[...learn, ...due, ...newCards];
  }

  q=interleaveReview(q, CFG.reviewEvery|0);

  const cap=CFG.sessionMax|0;
  if(cap>0&&q.length>cap)q=q.slice(0,cap);

  return {queue:q, dueN:due.length+learn.length, newN:newCards.length,
          freshTotal:fresh.length, capped:(cap>0&&(learn.length+due.length+newCards.length)>cap)};
}
function futureDue(){
  const now=Date.now();let n=0;
  for(const id in S){const c=S[id];if(c.st>0&&c.due>now&&c.due<=now+DAY)n++}
  return n;
}

/* ================= UI ================= */
const $=s=>document.querySelector(s);
const main=$('#main');
let view='home', queue=[], qi=0, revealed=false, sessionDone=0, sessionTotal=0;

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function setNav(v){view=v;['home','browse','add','set'].forEach(k=>$('#nav-'+k).classList.toggle('on',k===v))}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function sizeClass(s){return (s||'').length>60?'xlong':(s||'').length>36?'long':''}

/* --- home --- */

  const {dueN,newN,freshTotal,queue:q0}=buildQueue();

  <div class="hero">

  <div class="substat"><span>明日までの復習予定 <b>${futureDue()}</b> 問</span><span>目標記憶率 <b>${Math.round(CFG.retention*100)}%</b></span></div>
  <div class="substat"><span>出題傾向 <b>${biasName}</b></span><span>今回の出題 <b>${q0.length}</b> 問${CFG.reviewEvery?`／${CFG.reviewEvery}問ごとに復習`:''}</span></div>`;

/* --- review --- */
function startSession(){
  const q=buildQueue();
  queue=q.queue;qi=0;sessionDone=0;sessionTotal=queue.length;revealed=false;
  renderCard();
}
function renderCard(){
  setNav('home');
  if(qi>=queue.length){renderFinish();return}
  let guard=queue.length-qi;
  while(guard-->0){
    const st=S[queue[qi].id];
    const notReady=st&&(st.st===1||st.st===3)&&st.due>Date.now()+2000;
    if(notReady&&qi<queue.length-1){queue.push(queue.splice(qi,1)[0]);}else break;
  }
  const card=queue[qi];
  const st=getSt(card.id);
  const isNew=st.st===0;
  revealed=false;
  const front=`<div class="chapter-tag">${esc(card.c||'')}</div><div class="q-front ${sizeClass(card.q)}">${esc(card.q)}</div>`;
  main.innerHTML=`
  <div class="progress"><i style="width:${sessionTotal?Math.round(sessionDone/sessionTotal*100):0}%"></i></div>
  <div class="qtags"><span class="${isNew?'tag-new':''}">${isNew?'新規':st.st===2?'復習':'学習中'}</span><span>残り ${queue.length-qi} 問</span></div>
  <div class="card">
    <div class="face" id="face">${front}<div class="hint" id="hint">タップして答えを表示</div>
      <div class="answer detail" id="ans">
        ${detailHTML(card)}
        <button class="udel" id="editInReview">この問題を修正・削除</button>
      </div>
    </div>
    <button class="reveal" id="revealBtn">答えを見る</button>
    <div class="grades" id="grades">
      <button class="g1"><b>もう一度</b><small>${previewIvl(st,1)}</small></button>
      <button class="g2"><b>難しい</b><small>${previewIvl(st,2)}</small></button>
      <button class="g3"><b>普通</b><small>${previewIvl(st,3)}</small></button>
      <button class="g4"><b>簡単</b><small>${previewIvl(st,4)}</small></button>
    </div>
  </div>`;
  const show=()=>{
    if(revealed)return;revealed=true;
    $('#face').firstElementChild.style.display='none';
    $('#face').children[1].style.display='none'; // hint
    $('#face').classList.add('revealed');
    $('#face').scrollTop=0;
    $('#ans').classList.add('show');
    $('#revealBtn').style.display='none';
    $('#grades').classList.add('show');
  };
  $('#face').onclick=e=>{if(e.target.id!=='editInReview')show()};
  $('#revealBtn').onclick=show;
  $('#editInReview').onclick=e=>{e.stopPropagation();renderEdit(card.id,'review')};
  document.querySelectorAll('.grades button').forEach((b,i)=>{
    b.onclick=e=>{e.stopPropagation();
      rate(card.id,i+1);
      const st2=S[card.id];
      if(CFG.bias==='review'&&st2.st!==2&&st2.due<=Date.now()+15*MIN){
        queue.push(card);
        sessionTotal++;
      }
      sessionDone++;qi++;

function formatNotes(n){

function extractJSON(text){
  let t=String(text).replace(/```json/gi,'').replace(/```/g,'');
  const start=t.indexOf('{');
  if(start<0)return null;
  const end=t.lastIndexOf('}');
  if(end<start)return null;
  let cand=t.slice(start,end+1);

  const direct=tryParse(cand);
  if(direct)return direct;

  const fixed=normalizeSmartQuotes(cand);
  const parsed=tryParse(fixed);
  if(parsed)return parsed;

  const sub=firstObject(fixed) || firstObject(cand);
  if(sub){
    const p2=tryParse(sub)||tryParse(normalizeSmartQuotes(sub));
    if(p2)return p2;
  }
  return null;
}
function tryParse(s){ try{return JSON.parse(s)}catch(e){return null} }

function normalizeSmartQuotes(s){
  const DQ=/[\u201C\u201D\u201E\u201F\u2033\u3003\uFF02]/;
  let out='', inStr=false, esc=false;
  for(let i=0;i<s.length;i++){
    let ch=s[i];
    if(inStr){
      if(esc){out+=ch;esc=false;continue;}
      if(ch==='\\'){out+=ch;esc=true;continue;}
      if(ch==='"'||DQ.test(ch)){
        let j=i+1; while(j<s.length&&/\s/.test(s[j]))j++;
        const nx=s[j];
        if(nx===undefined||nx===','||nx==='}'||nx===']'||nx===':'){
          out+='"'; inStr=false; continue;
        }
        if(ch==='"'){out+='\\"';}
        else{out+=ch;}
        continue;
      }
      out+=ch; continue;
    }else{
      if(ch==='"'||DQ.test(ch)){out+='"';inStr=true;continue;}
      out+=ch; continue;
    }
  }
  return out;
}
function firstObject(t){
  const start=t.indexOf('{');
  if(start<0)return null;
  let depth=0,inStr=false,esc=false;
  const DQ=/[\u201C\u201D\u201E\u201F\uFF02]/;
  for(let i=start;i<t.length;i++){
    const ch=t[i];
    if(inStr){
      if(esc)esc=false;
      else if(ch==='\\')esc=true;
      else if(ch==='"'||DQ.test(ch))inStr=false;
    }else{
      if(ch==='"'||DQ.test(ch))inStr=true;
      else if(ch==='{')depth++;
      else if(ch==='}'){depth--;if(depth===0)return t.slice(start,i+1);}
    }
  }
  return null;
}

      for(let i=queue.length-1;i>=0;i--){if(String(queue[i].id)===String(card.id)){queue.splice(i,1);if(i<qi)qi--;}}
      sessionTotal=Math.max(sessionTotal-1,sessionDone);
      renderCard();
    }else{renderBrowse()}
  };
}
async function applyEdit(card, vals){
  Object.assign(card, vals);
  if(isUserCard(card.id)){
    const u=UC.find(x=>x.id===card.id);
    if(u)Object.assign(u, vals);
  }else{
    OV[card.id]={q:card.q,a:card.a,c:card.c,n:card.n};
  }
  dirty=true;
  const ok=await saveState();
  if(!ok){
    return {saved:false};
  }
  return {saved:true};
}
function renderDiff(card, j, from){
  const cur={a:$('#e-a').value.trim(), c:$('#e-c').value.trim(), n:$('#e-n').value.trim()};
  const neu={a:(j.a||'').trim(), c:(j.c||'').trim(), n:(j.n||'').trim()};
  const fields=[
    {key:'a', label:'解答'},
    {key:'c', label:'章・分野'},
    {key:'n', label:'解説・補足'}
  ];
  const review=(j.review||'').trim();
  let html='<div class="fpanel">';
  html+='<p class="sinfo" style="margin:0"><b>比較して反映する</b><br>項目ごとに、どう扱うか選んでください。</p>';
  if(review){
    html+='<div style="background:var(--seal-soft);color:var(--seal);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap">⚠️ Claudeの指摘：'+esc(review)+'</div>';
  }
  for(const f of fields){
    const oldV=cur[f.key], newV=neu[f.key];
    const same = oldV===newV;
    const hasNew = !!newV;
    html+='<div style="border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px">';
    html+='<div style="font-size:12px;font-weight:700;letter-spacing:.04em">'+f.label
        + (same&&hasNew?'<span style="color:var(--ink-soft);font-weight:400">（変更なし）</span>':'')
        + (!hasNew?'<span style="color:var(--ink-soft);font-weight:400">（AIの提案なし）</span>':'')
        + '</div>';
    html+='<div><div style="font-size:10px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:2px">現在</div>'
        + '<div style="font-size:13px;background:var(--paper-2);border-radius:8px;padding:8px 10px;line-height:1.7;white-space:pre-wrap;word-break:break-word">'
        + (oldV?esc(oldV):'<span style="color:var(--ink-faint)">（未入力）</span>')+'</div></div>';
    if(hasNew && !same){
      html+='<div><div style="font-size:10px;color:var(--good);letter-spacing:.08em;margin-bottom:2px">Claudeの提案</div>'
          + '<div style="font-size:13px;background:#EDF5F0;border:1px solid #CFE3D8;border-radius:8px;padding:8px 10px;line-height:1.7;white-space:pre-wrap;word-break:break-word">'
          + esc(newV)+'</div></div>';
      html+='<div style="display:flex;gap:6px;flex-wrap:wrap">'
          + '<button class="dbtn" data-k="'+f.key+'" data-a="keep">現在のまま</button>'
          + '<button class="dbtn on" data-k="'+f.key+'" data-a="replace">置き換え</button>'
          + '<button class="dbtn" data-k="'+f.key+'" data-a="append">追記</button>'
          + '</div>';
    }
    html+='<div><div style="font-size:10px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:2px">反映される内容（自由に編集できます）</div>'
        + '<textarea class="dres" id="d-'+f.key+'" style="width:100%;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);min-height:'+(f.key==='n'?'96px':'44px')+';resize:vertical"></textarea></div>';
    html+='</div>';
  }
  html+='<button class="fsave" id="dSave" style="width:100%">この内容で問題を更新</button>';
  html+='<button class="ai-fill" id="dCancel" style="width:100%">比較をやめる</button>';
  html+='</div>';
  const area=document.getElementById('diffArea');
  area.innerHTML=html;

  const setVal=(k)=>{
    const oldV=cur[k], newV=neu[k];
    const ta=document.getElementById('d-'+k);
    ta.value=(newV && newV!==oldV) ? newV : oldV;
  };
  for(const f of fields)setVal(f.key);

  area.querySelectorAll('.dbtn').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k, a=b.dataset.a;
      area.querySelectorAll('.dbtn[data-k="'+k+'"]').forEach(x=>x.classList.toggle('on', x===b));
      const ta=document.getElementById('d-'+k);
      const oldV=cur[k], newV=neu[k];
      if(a==='keep')ta.value=oldV;
      else if(a==='replace')ta.value=newV;
      else if(a==='append')ta.value=oldV ? (oldV+' ／ '+newV) : newV;
    };
  });
  document.getElementById('dCancel').onclick=()=>{area.innerHTML=''};
  document.getElementById('dSave').onclick=async()=>{
    const q=$('#e-q').value.trim();
    const a=document.getElementById('d-a').value.trim();
    const c=document.getElementById('d-c').value.trim();
    const n=document.getElementById('d-n').value.trim();
    if(!q||!a){toast('問題文と解答は必須です');return}
    const b=document.getElementById('dSave'); b.disabled=true; b.textContent='保存中…';
    const r=await applyEdit(card,{q,a,c,n});
    b.disabled=false; b.textContent='この内容で問題を更新';
    toast(r.saved?'更新しました':'更新は反映されましたが、保存はまだ完了していません');
    if(from==='review'){renderCard()}else{renderBrowse()}
  };
  area.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function deleteCard(id){
  if(isUserCard(id)){UC=UC.filter(x=>x.id!==id);}
  else if(!DL.some(d=>String(d)===String(id))){DL.push(id);}
  const i=CARDS.findIndex(x=>String(x.id)===String(id));
  if(i>=0)CARDS.splice(i,1);
  delete S[id];
  dirty=true;saveState();
  $('#totalN').textContent=CARDS.length;
}

/* ================= CSV ================= */
function showErr(msg){
  try{
    const e=document.getElementById('errbar');
    if(!e){ console.error(msg); return; }
    e.style.display='block';
    e.textContent=msg;
    setTimeout(()=>{e.style.display='none'},15000);
  }catch(x){ try{console.error(msg)}catch(y){} }
}
const CSV_COLS=['問題文','解答','章・分野','解説・補足','状態','復習予定日','安定度','難易度','復習回数','間違えた回数'];
const ST_NAME={0:'未着手',1:'学習中',2:'復習',3:'再学習'};
const ST_CODE={'未着手':0,'学習中':1,'復習':2,'再学習':3};

function csvCell(v){
  const s=(v==null?'':String(v));
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function baseName(){
  try{
    const path=decodeURIComponent(location.pathname||'');
    const file=(path.split('/').pop()||'').split('\\').pop()||'';
    const name=file.replace(/\.[^.]*$/,'').trim();
    return name||'world-history';
  }catch(e){ return 'world-history'; }
}
function stampNow(){
  const d=new Date(), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
}
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(){
  const rows=[CSV_COLS.join(',')];
  for(const c of CARDS){
    const st=S[c.id]||{};
    const due=st.due?new Date(st.due).toISOString():'';
    rows.push([
      c.q, c.a, c.c||'', c.n||'',
      ST_NAME[st.st||0]||'未着手',
      due,
      st.S?st.S.toFixed(4):'',
      st.D?st.D.toFixed(4):'',
      st.reps||0,
      st.lapses||0
    ].map(csvCell).join(','));
  }
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const fn=baseName()+'_'+stampNow()+'.csv';
  downloadBlob(blob, fn);
  toast(CARDS.length+' 問を '+fn+' に書き出しました');
}
const RLOG_COLS=['問題文','問題ID','復習日時','評価','経過日数','復習前の状態'];
const GRADE_NAME={1:'もう一度',2:'難しい',3:'普通',4:'簡単'};
function exportRevlogCSV(){
  if(!RL.length){toast('復習履歴がまだありません');return}
  const qById={};
  for(const c of CARDS)qById[c.id]=c.q;
  const rows=[RLOG_COLS.join(',')];
  for(const e of RL){
    const [id,ts,g,dt,st0]=e;
    rows.push([
      qById[id]||'（削除済み）',
      id,
      new Date(ts*1000).toISOString(),
      GRADE_NAME[g]||g,
      dt,
      ST_NAME[st0]||'未着手'
    ].map(csvCell).join(','));
  }
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const fn=baseName()+'_revlog_'+stampNow()+'.csv';
  downloadBlob(blob, fn);
  toast(RL.length+' 件の履歴を書き出しました');
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else inQ=false;
      }else cell+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(cell);cell='';}
      else if(ch==='\r'){/* skip */}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=ch;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function importCSV(){
  const f=$('#csvFile').files&&$('#csvFile').files[0];
  if(!f){toast('CSVファイルを選んでください');return}
  const withProg=$('#csvProg').checked;
  const reader=new FileReader();
  reader.onerror=()=>toast('ファイルを読み込めませんでした');
  reader.onload=()=>{
    try{
      const rows=parseCSV(String(reader.result||''));
      if(rows.length<2){toast('データ行がありません');return}
      const head=rows[0].map(h=>h.trim());
      const ix=name=>head.indexOf(name);
      const iQ=ix('問題文'), iA=ix('解答'), iC=ix('章・分野'), iN=ix('解説・補足');
      if(iQ<0||iA<0){
        toast('形式が違います（「問題文」「解答」列が必要です）');
        return;
      }
      const iSt=ix('状態'), iDue=ix('復習予定日'), iS=ix('安定度'), iD=ix('難易度'),
            iR=ix('復習回数'), iL=ix('間違えた回数');
      let added=0, updated=0, prog=0, skipped=0;
      for(let r=1;r<rows.length;r++){
        const row=rows[r];
        const q=(row[iQ]||'').trim();
        const a=(iA>=0?row[iA]:'' ).trim();
        if(!q||!a){skipped++;continue}
        const c=(iC>=0?row[iC]:'').trim();
        const n=(iN>=0?row[iN]:'').trim();
        let card=CARDS.find(x=>x.q===q);
        if(card){
          card.a=a; card.c=c; card.n=n;
          if(isUserCard(card.id)){
            const u=UC.find(x=>x.id===card.id);
            if(u)Object.assign(u,{q,a,c,n});
          }else{
            OV[card.id]={q,a,c,n};
          }
          updated++;
        }else{
          card={id:'u'+Date.now()+'_'+r, q, a, c, n};
          UC.push(card); CARDS.push(card);
          added++;
        }
        if(withProg && iSt>=0){
          const stName=(row[iSt]||'').trim();
          const stCode=ST_CODE[stName];
          if(stCode!==undefined && stCode!==0){
            const dueRaw=(iDue>=0?row[iDue]:'').trim();
            const dueMs=dueRaw?Date.parse(dueRaw):NaN;
            const sv=parseFloat(iS>=0?row[iS]:''), dv=parseFloat(iD>=0?row[iD]:'');
            S[card.id]={
              st:stCode, step:0,
              S: isFinite(sv)&&sv>0 ? sv : 1,
              D: isFinite(dv)&&dv>0 ? clamp(dv,1,10) : 5,
              due: isFinite(dueMs) ? dueMs : Date.now(),
              last: Date.now(),
              reps: parseInt(iR>=0?row[iR]:'0')||0,
              lapses: parseInt(iL>=0?row[iL]:'0')||0
            };
            prog++;
          }
        }
      }
      dirty=true; saveState();
      $('#totalN').textContent=CARDS.length;
      let msg='追加 '+added+' 件、更新 '+updated+' 件';
      if(withProg)msg+='、進捗 '+prog+' 件';
      if(skipped)msg+='（不備 '+skipped+' 行は除外）';
      toast(msg);
      renderSet();
    }catch(e){
      showErr('CSVの取り込みに失敗: '+((e&&e.message)||e));
      toast('取り込みに失敗しました');
    }
  };
  reader.readAsText(f,'UTF-8');
}
