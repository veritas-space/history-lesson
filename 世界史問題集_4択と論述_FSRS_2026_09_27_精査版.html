"],"a":2,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"ex":"山東の旧ドイツ権益が日本に引き継がれたことへの抗議として北京大学の学生から始まり、商工業者や労働者を巻き込んで全国に広がった。中国政府はヴェルサイユ条約の調印を拒否した。陳独秀らの新文化運動を思想的基盤とし、中国共産党結成や国民革命の前提となる。","w":"五四運動"},{"id":"n019","t":"mc","q":"1947年、台湾で本省人の抗議行動を国民党政権が武力で弾圧した事件を何と呼ぶか。","o":["霧社事件","二・二八事件","天安門事件","台湾出兵"],"a":1,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1947,"ex":"日本の敗戦後に台湾を接収した国民党政権の腐敗や経済混乱、大陸出身の外省人による要職の独占に対し、日本統治期から台湾に住む本省人が反発した。弾圧で多数が犠牲となった。国共内戦に敗れて台湾へ移った国民党は1949〜87年に長期の戒厳令を敷き、本省人と外省人の対立は民主化まで尾を引いた。1930年の霧社事件は日本統治期の先住民の蜂起で、時期も主体も異なる。","w":"二・二八事件"},{"id":"n020","t":"mc","q":"1972年、日本と中華人民共和国が国交を正常化した際に発表された文書は何か。","o":["日中平和友好条約","日華平和条約","日中共同声明","上海コミュニケ"],"a":2,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1972,"ex":"1971年に国連の中国代表権が中華民国から中華人民共和国へ移り、ニクソン訪中が実現した流れのなかで結ばれた。これにより日本は中華民国と結んでいた日華平和条約を終了させた。条約としての日中平和友好条約の締結は1978年で、6年の差がある点に注意したい。","w":"日中共同声明"},{"id":"n021","t":"mc","q":"1857年に始まり、東インド会社の解散とムガル帝国の滅亡をもたらしたインドの大規模な反乱は何か。","o":["プラッシーの戦い","シパーヒーの反乱（インド大反乱）","ベンガル分割令反対運動","非暴力・不服従運動"],"a":1,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1857,"ex":"牛と豚の脂を用いた薬包の使用が直接の契機だが、背景には失権の原則による藩王国の併合、重い地税、社会慣行への干渉に対する広範な反発があった。旧支配層や農民も加わる大反乱となったが、鎮圧後ムガル皇帝は廃位され、1858年に東インド会社は解散してイギリス本国の直接統治へ移行した。会社の商業活動停止（1833）や1877年のインド帝国成立と年代を混同しないこと。","w":"シパーヒーの反乱（インド大反乱）"},{"id":"n022","t":"mc","q":"1877年、ヴィクトリア女王が皇帝を兼ねる形で成立した、イギリスによるインド直接統治の体制を何と呼ぶか。","o":["ムガル帝国","インド帝国","インド連邦","東インド会社領"],"a":1,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1877,"ex":"ディズレーリ保守党内閣が、スエズ運河会社株の買収（1875）と並行して進めた帝国主義政策の一環である。全土を直轄領と藩王国に分け、藩王を温存して分割統治を行った。本国による直接統治の開始はシパーヒーの反乱後の1858年で、1877年はその上に皇帝位を加えた年である点を区別したい。1885年には、当初は対英協調的なインド国民会議が発足した。","w":"インド帝国"},{"id":"n023","t":"mc","q":"1905年のベンガル分割令に反発したインド国民会議が、1906年のカルカッタ大会で採択した四綱領に含まれないものはどれか。","o":["英貨排斥","スワデーシ（国産品愛用）","スワラージ（自治獲得）","プールナ＝スワラージ（完全独立）"],"a":3,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1905,"ex":"1905年、総督カーゾンは反英運動の中心ベンガルを、ヒンドゥー教徒の多い西部とムスリムの多い東部に分割した。国民会議派はカルカッタ大会で英貨排斥・スワデーシ・スワラージ・民族教育の四綱領を採択して急進化し、同年イギリスの支援で全インド＝ムスリム連盟が結成された。分割令は1911年に撤回。完全独立（プールナ＝スワラージ）は1929年ラホール大会の決議である。","w":"プールナ＝スワラージ（完全独立）"},{"id":"n024","t":"mc","q":"1930年にガンディーが「塩の行進」を始め、第2次非暴力・不服従運動を展開した直接の背景として最も適当なものはどれか。","o":["前年の国民会議派ラホール大会がプールナ＝スワラージ（完全独立）を決議し、不服従運動の開始を決めた","ローラット法の制定とアムリットサール事件に抗議し、国民会議派が非協力運動を決定した","イギリスがインドの同意なく第二次世界大戦への参戦を決めたことに抗議した","1935年インド統治法が州の自治を一切認めなかったことに反発した"],"a":0,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1930,"ex":"大戦中の自治の約束が守られず、インド人を含まないサイモン委員会の派遣が反発を強めた。1929年のラホール大会で完全独立を掲げた会議派のもと、ガンディーは生活必需品である塩への課税という、誰にでもわかる争点を選んだ。ローラット法とアムリットサール事件（1919）を受けた第1次非協力運動とは時期が異なる。運動は円卓会議を経て1935年インド統治法につながった。","w":"前年の国民会議派ラホール大会がプールナ＝スワラージ（完全独立）を決議し、不服従運動の開始を決めた"},{"id":"n025","t":"mc","q":"1947年、インドとパキスタンが分離して独立する根拠となったイギリスの法は何か。","o":["インド統治法（1935年）","インド独立法","ラホール決議","クリップス提案"],"a":1,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1947,"ex":"大戦後、アトリー労働党政権は撤退を決め、ジンナーの二民族論（1940年ラホール決議でパキスタン建国を要求）に沿って宗教別に二つの自治領を成立させた。統一を求めたガンディーは翌年ヒンドゥー教徒の急進派に暗殺される。住民大移動で多数が犠牲となり、カシミール帰属をめぐる印パ戦争が続いた。州自治を認めた1935年インド統治法と区別したい。","w":"インド独立法"},{"id":"f01","t":"essay","q":"800年のカールの戴冠が持つ歴史的意義について、フランク王国と教皇およびビザンツ帝国との関係に触れながら述べなさい。また、イスラーム勢力の地中海進出が西ヨーロッパ世界の成立に果たした役割をめぐる議論（ピレンヌ＝テーゼ）にも言及しなさい。（400字以内）","pts":["ゲルマン人の大移動後、フランク王国はクローヴィスのアタナシウス派（カトリック）への改宗によってローマ系住民とローマ教会の支持を得た","ローマ教会は聖像禁止令（726）をめぐってビザンツ皇帝と対立し、ランゴバルド人の圧迫に対抗する保護者を求めた。ピピンの寄進（756）で教皇領が成立し、教会とフランク王権の提携が形をとった","カールはランゴバルド王国を滅ぼし、イスラーム勢力やアヴァール人と戦って西方キリスト教世界の守護者となった","戴冠は西ローマ帝国の復活を意味し、ローマ教会はビザンツ皇帝から自立した政治的保護者を得た。ビザンツ側はこれに反発し、東西キリスト教世界の分立が進んだ（のちの1054年の東西教会の分裂へ）","ローマの古典文化・キリスト教・ゲルマンの要素が融合した西ヨーロッパ世界が成立し、カロリング＝ルネサンスがその文化的表現となった。一方、教皇が帝冠を授ける形式は、のちの皇帝権と教皇権の争いの種を残した","ピレンヌ＝テーゼは、ゲルマン人の移動ではなくイスラーム勢力の地中海制圧が古代地中海世界の一体性を断ち、西欧が内陸の農業社会として自立する契機になったと説き、「ムハンマドなくしてシャルルマーニュ（カール）なし」と要約される","この説には地中海交易が完全には途絶しなかったとの批判があり断定はできないが、西欧世界の成立を地中海全体の構造変動から捉える視点を提供した"],"lim":400,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":800,"ex":"骨格は①フランク王国とローマ教会の提携（改宗・寄進）②ビザンツからの教会の自立と西ヨーロッパ世界の成立③ピレンヌ＝テーゼの紹介と評価、の三段。差がつくのはビザンツとの関係で、戴冠が東西キリスト教世界の分立を進めた点を書けるかどうか。ピレンヌ説は通説として断定せず「議論」として扱い、批判にも触れる。962年のオットー1世の戴冠と混同しないこと。","w":"800年のカールの戴冠が持つ歴史的意義について、"},{"id":"f02","t":"essay","q":"オットー1世の戴冠によって成立した神聖ローマ帝国の統治構造について、帝国教会政策の内容と意義を説明し、この帝国がフランスやイギリスと異なる発展をたどった理由を述べなさい。（400字以内）","pts":["オットー1世はマジャール人をレヒフェルトの戦いで撃退し、西方キリスト教世界の防衛者としての権威を得て教皇から戴冠された","部族大公の自立が強く世襲的な家産的基盤が弱かったため、皇帝は世襲しない聖職者を統治に用いた","帝国教会政策により司教・修道院長を任命して封土を与え、その軍事力と財力を帝国統治の支柱とした","この体制は聖職叙任権を前提とするため、教会改革運動と正面から衝突して叙任権闘争を招いた","皇帝はローマ皇帝の称号にこだわってイタリア政策を繰り返し、ドイツを留守にしたため諸侯の自立が進んだ","大空位時代を経て金印勅書（1356）が七選帝侯による皇帝選挙を定め、分権が法的に固定された","フランスではカペー朝が王領を拡大し、百年戦争を経て常備軍と官僚制を整えて集権化し、イギリスではノルマン征服以来の強い王権が議会と結びつきつつ統一的な国家を形成したのに対し、帝国は領邦の集合体にとどまり、統一は19世紀まで遅れた"],"lim":400,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":962,"ex":"骨格は①部族大公の自立と帝国教会政策の採用②叙任権闘争で支柱を失う③イタリア政策と大空位時代④金印勅書による分権の固定⑤英仏との対比。叙任権闘争やイタリア政策の詳述（e01・e04の論点）に字数を割きすぎず、比較の結論に字数を残すのが得点の分かれ目。英仏の集権化を「常備軍」で一括せず、フランスの王領拡大とイギリスの王権と議会の結びつきという違いまで書けると評価が高い。","w":"オットー1世の戴冠によって成立した神聖ローマ帝国"},{"id":"f03","t":"essay","q":"11世紀から13世紀の西ヨーロッパにおける大開墾運動と東方植民について、その前提となった農業技術の変化を説明し、これらが社会と経済にもたらした影響を述べなさい。（400字以内）","pts":["三圃制の普及、重量有輪犂と牛馬による耕作、水車の利用によって農業生産力が上昇した","生産力の上昇が人口増加をもたらし、新たな耕地を求める動きが強まった","シトー修道会が森林の開墾を主導し、フランドルやオランダでは沼沢地の干拓が進んだ","ドイツ人はエルベ川以東のスラヴ人地域へ東方植民を行い、諸侯やドイツ騎士団が農村と都市を建設した。入植者には移住を促すため賦役の軽減など有利な条件が与えられた","余剰生産物が定期市や遠隔地商業を支え、都市の発展と貨幣経済の浸透を促した","開墾地の有利な条件と貨幣経済の浸透を背景に、領主は賦役を廃して貨幣地代へ移行し、農民の地位が向上して古典荘園は解体に向かった","一方エルベ以東は近世に農場領主制（グーツヘルシャフト）と再版農奴制の地帯となり、西欧へ穀物を輸出する国際分業の一方の極となった"],"lim":400,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1150,"ex":"技術革新→人口増加→開墾・干拓・東方植民→商業と都市の発展→貨幣地代への移行と荘園の解体、という連鎖が骨格。差がつくのは、開墾地や植民地で入植者に有利な条件が与えられたことが旧来の荘園にも波及し、農民の地位向上につながった点を示せるか。黒死病は14世紀の別の要因なので主軸にしない。東方植民地帯が近世には再版農奴制の地域となり、東西の分業が生まれる点まで結べると評価が高い。","w":"11世紀から13世紀の西ヨーロッパにおける大開墾"},{"id":"f04","t":"essay","q":"中世西ヨーロッパにおける教皇権の絶頂から衰退までの過程を、世俗権力との関係の変化に着目して述べなさい。（400字以内）","pts":["クリュニー修道院を中心とする改革運動と叙任権闘争を経て、教会は世俗権力からの自立を進めた（前提として簡潔に）","インノケンティウス3世の時代に教皇権は絶頂に達し、イギリス王ジョンやフランス王フィリップ2世を破門して屈服させ、「教皇は太陽、皇帝は月」と述べた","第4回十字軍がコンスタンティノープルを占領してラテン帝国を建てるなど十字軍は逸脱と失敗に終わり、提唱者である教皇の権威を傷つけた","貨幣経済の浸透による荘園制の動揺と諸侯・騎士の没落を背景に、国王は都市の市民と結んで王権を伸ばし、国家単位の統治が強まった","フィリップ4世は聖職者課税をめぐりボニファティウス8世と対立し、三部会（1302）を招集して国内の支持を固め、アナーニ事件（1303）で教皇を捕らえた。カノッサとは逆に世俗権力の優位が示された","教皇庁がアヴィニョンへ移されて「教皇のバビロン捕囚」となり、続く教会大分裂で複数の教皇が並立して権威は失墜した","コンスタンツ公会議が分裂を収拾しフスを処刑したが、ウィクリフ・フスの教会批判はのちの宗教改革の先駆となった"],"lim":400,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1198,"ex":"骨格は絶頂（インノケンティウス3世）→十字軍の失敗→王権の伸長とアナーニ事件→バビロン捕囚・大分裂→教会批判。カノッサとアナーニの力関係の逆転が転換点である。差がつくのは、王権伸長の理由を荘園制の解体や都市市民との結びつきという社会経済の変化から説明できるかどうかで、事件の列挙だけでは点が伸びない。叙任権闘争（e01）と十字軍（e02）は前提として一文で済ませ、絶頂以降に字数を使う。","w":"中世西ヨーロッパにおける教皇権の絶頂から衰退まで"},{"id":"f05","t":"essay","q":"中世後期のイギリスとフランスにおける身分制議会の成立について、それぞれの成立事情と王権との関係の違いに着目して述べなさい。（300字以内）","pts":["封建社会では国王も封建的契約に拘束され、重要事項には家臣の助言と同意を必要とした","イギリスではジョン王の失政と重税に対し、貴族がマグナ＝カルタ（1215）を認めさせ、課税には高位聖職者と貴族の同意を要すると定めた","シモン＝ド＝モンフォールの反乱を経て、エドワード1世が模範議会（1295）を招集し、騎士と市民が参加した","のち貴族院と庶民院の二院制となり、課税承認権を通じて王権を制限する伝統が育った","フランスではフィリップ4世が教皇との対立に際して三部会（1302）を招集し、国内の支持を得るために用いた","三部会は身分別に分かれ、王権を制限するよりも王権を補強する機能を果たし、百年戦争後は常設の課税権を得た王によってほとんど開かれなくなった","この違いが、のちのイギリスの議会政治とフランスの絶対王政という対照的な展開の前提となった"],"lim":300,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1215,"ex":"同じ身分制議会でも、王権を制限する方向に働いたイギリスと、王権を補強する道具となったフランスという違いが論点である。マグナ＝カルタの課税同意原則が議会の淵源となり、三部会は絶対王政期に停止される。近代の議会制民主主義と同一視しないよう注意したい。","w":"中世後期のイギリスとフランスにおける身分制議会の"},{"id":"f06","t":"essay","q":"大航海時代が始まった背景を説明し、それが世界の結びつきとヨーロッパ経済にもたらした変化について述べなさい。（400字以内）","pts":["アジアの香辛料はムスリム商人とイタリア商人の仲介を経て高価であり、オスマン帝国の東地中海進出もあって、香辛料を直接入手する動機が強まった","マルコ＝ポーロ『世界の記述』による東方への関心、レコンキスタの延長としての布教熱に加え、羅針盤の実用化・カラベル船・地球球体説など航海の前提が整った","ポルトガルはエンリケの事業を起点にアフリカ西岸を南下し、ヴァスコ＝ダ＝ガマがインド航路を開いた。その後ゴア（1510）・マラッカ（1511）を拠点に香辛料貿易の独占を図った","スペインはコロンブスの航海以後アメリカ大陸へ進出し、コルテス・ピサロがアステカ・インカを滅ぼした。その後スペインはポトシなどの銀山を開発した。先住民は酷使と疫病で激減し、労働力としてアフリカから奴隷が運ばれた","商業革命により貿易の中心が地中海から大西洋岸（リスボン、アントウェルペン、のちアムステルダム）へ移り、イタリア諸都市は相対的に衰退した","アメリカ銀の流入が価格革命を起こし、固定地代に依存する領主層が没落する一方、商工業者が資本を蓄積した","西欧の商工業発展が東欧からの穀物輸入を増やし、エルベ川以東では農場領主制（再版農奴制）が広がって西欧を中心とする国際分業が形成された。銀はガレオン貿易などでアジアへも流れ、世界が一つの交易網で結ばれた"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1492,"ex":"背景（香辛料需要・布教熱・航海技術）→ポルトガルとスペインの進出→商業革命・価格革命→東欧を含む国際分業の形成、の順で書く。「オスマン帝国が東方貿易路を遮断した」と断定するのは避け、香辛料が仲介を経て高価だったことを主因に置く。差がつくのは結果を西欧内部の変化にとどめず、東欧の再版農奴制やアジアへの銀の流出まで「世界の一体化」として示せるかどうか。銀の影響の詳細はe10、生態系の交換はf07に譲る。","w":"大航海時代が始まった背景を説明し、それが世界の結"},{"id":"f07","t":"essay","q":"コロンブス交換とは何か説明し、それがアメリカ大陸・ヨーロッパ・アフリカの社会にそれぞれどのような影響を与えたかを述べなさい。（400字以内）","pts":["新旧両大陸の間で作物・家畜・人間・病原菌が双方向に移動した現象を指す","アメリカ大陸には小麦・サトウキビ・馬・牛が持ち込まれ、大農園と牧畜が広がって先住民の生活と景観を変えた","天然痘・麻疹など免疫のない病原菌が持ち込まれて先住民人口が激減し、少数のスペイン人による征服を容易にした要因の一つとなった","エンコミエンダ制やミタ制のもとでの酷使が人口減少に拍車をかけた","旧大陸にはトウモロコシ・ジャガイモ・サツマイモなどが伝わり、寒冷地や痩せ地でも栽培できたためヨーロッパや中国の人口増加を支えた。一方でジャガイモへの依存はアイルランドのジャガイモ飢饉のような脆弱性も生んだ","砂糖・タバコ・綿花はプランテーション作物となり、先住民労働力の激減を補うため大西洋奴隷貿易が拡大した","アフリカは働き盛りの人口の流出と奴隷狩りをめぐる戦争で社会が混乱した。一方ヨーロッパは三角貿易の利潤を蓄積し、それが産業革命の資本の一部になったとされる"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1500,"ex":"生態系の交換が三大陸の人口構造を変えたという視点で書く。旧大陸では新作物が人口を支え、新大陸では疫病と酷使で人口が激減し、その労働力不足がアフリカからの奴隷貿易を生んだという連鎖が骨格。差がつくのは三大陸を「それぞれ」書き分けられるかどうかで、アフリカへの影響を落とす答案が多い。疫病を征服の唯一の原因とする書き方や、奴隷貿易の利潤を産業革命の主因と断定する書き方は避ける。","w":"コロンブス交換とは何か説明し、それがアメリカ大陸"},{"id":"f08","t":"essay","q":"16世紀に「太陽の沈まぬ国」と呼ばれたスペインが、17世紀に入って衰退した理由について述べなさい。（400字以内）","pts":["カルロス1世（カール5世）はハプスブルク家の広大な領土を継ぎ、フェリペ2世はポルトガルを併合して世界的な帝国を築いた","ポトシ銀山などアメリカの銀が富の源泉であったが、国内産業の育成に向かわず輸入品の支払いに流出した","銀の流入による物価騰貴が国内の毛織物工業の競争力を奪い、ユダヤ教徒・ムスリムの追放が商工業の担い手を失わせた","カトリックの盟主を自任して対オスマン戦、オランダ独立戦争、イギリスとの戦いを同時に抱え、戦費が財政を圧迫して国家財政は繰り返し破綻した","ネーデルラントの重税と新教徒弾圧が独立戦争を招き、北部7州が独立して最も富裕な地域を失った","無敵艦隊の敗北（1588）は制海権喪失の象徴とされるが、艦隊は再建されており衰退の決定的原因ではない","三十年戦争とウェストファリア条約でオランダの独立が国際的に承認され、覇権はオランダ、ついでイギリスへ移った"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1556,"ex":"銀という富が国内産業に結びつかず流出した構造的要因と、多方面の戦費という財政要因を軸に書く。無敵艦隊の敗北を衰退の原因と短絡させないことが差のつく点である。最も富裕なネーデルラントを失ったことが、覇権移動を決定づけた。","w":"16世紀に「太陽の沈まぬ国」と呼ばれたスペインが"},{"id":"f09","t":"essay","q":"17世紀にオランダが世界商業の覇権を握ることができた理由を説明し、その覇権が後退していった経緯について述べなさい。（400字以内）","pts":["スペインからの独立戦争を通じて商工業者が主導する連邦共和国が生まれ、アントウェルペン陥落後はその商人と技術がアムステルダムへ流入した","バルト海貿易で穀物と木材を扱い、造船業と安価な輸送力（フライト船）で中継貿易を握った","東インド会社が株式会社として資本を集め、条約締結権と軍隊保有権を持ってバタヴィアを拠点に香辛料貿易を独占し、アンボイナ事件でイギリスを排除した","アムステルダム銀行と証券取引所が国際金融の中心となり、宗教的寛容が各地から人材と資本を呼び込んだ","中継貿易と金融に依存して国内工業の基盤が相対的に弱かったため、イギリスの航海法と三次にわたる英蘭戦争で中継貿易の利益を削られた","ルイ14世の侵略戦争（オランダ侵略戦争など）への対抗に軍事費を費やし、陸続きの大国との戦いで財政が消耗した","名誉革命でオランダ総督ウィレムがイギリス王を兼ねたのち、イギリスがイングランド銀行と国債制度を整えて植民地を拡大し、18世紀には覇権がイギリスへ移った（アムステルダムは金融の中心としてなお存続した）"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1648,"ex":"中継貿易と金融という強みが、同時に国内工業基盤の弱さという弱点でもあった点を軸に書く。航海法と英蘭戦争はその弱点を突く政策であった。差がつくのは、衰退を絶対的な没落ではなく、陸の大国フランスと海の大国イギリスに挟まれた相対的な後退として描けるかどうかで、18世紀にも金融の中心として残った点に触れると精度が上がる。覇権の理由を東インド会社だけで説明する答案は評価が低くなりやすい。","w":"17世紀にオランダが世界商業の覇権を握ることがで"},{"id":"f10","t":"essay","q":"17世紀から18世紀にかけてのイギリスとフランスの植民地抗争について、重商主義政策との関係に触れながら、その経過と結果を述べなさい。（400字以内）","pts":["重商主義は国富の増大を貴金属の蓄積や貿易差額に求め、輸出振興・保護関税・特権会社・植民地獲得を国家が主導した","フランスはコルベールのもとで特権マニュファクチュアと東インド会社を整備し、イギリスは航海法でオランダを排除したため、英仏の対立が前面に出た","北米ではイギリスの13植民地とフランスのカナダ・ルイジアナが対立し、インドでは南インド（カーナティック戦争）やベンガルで両国が現地勢力と結んで争った","植民地抗争はヨーロッパの戦争と連動し、スペイン継承戦争のユトレヒト条約でイギリスはニューファンドランド・アカディアなどとアシエントを得た","七年戦争と並行して北米でフレンチ＝インディアン戦争、インドでプラッシーの戦いが戦われ、パリ条約（1763）でイギリスはカナダとミシシッピ川以東のルイジアナを獲得し、フランスは北米の領土とインドでの政治的拠点をほぼ失った","イギリスは海軍力と国債による戦費調達で優位に立ち、植民地市場と奴隷貿易の利潤が資本蓄積を支えて産業革命の前提となった","一方で戦費が本国の財政を圧迫し、イギリスでは植民地への課税強化がアメリカ独立革命を、フランスでは財政危機が革命を招いた"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1756,"ex":"第2次英仏百年戦争を、重商主義の論理が生んだ抗争として描く。骨格は重商主義の定義→対立の舞台（北米・インド）→ユトレヒト条約→七年戦争とパリ条約→帰結。差がつくのは、イギリスの勝因を海軍力と国債による財政力から説明できるか、そして勝ったイギリスも負けたフランスも戦費負担が本国の政治危機（アメリカ独立とフランス革命）を招いたという逆説まで書けるかどうか。条約で得た領土の列挙に字数を使いすぎないこと。","w":"17世紀から18世紀にかけてのイギリスとフランス"},{"id":"f11","t":"essay","q":"イギリスにおける奴隷貿易廃止から奴隷制度廃止に至る過程を説明し、奴隷制が廃止された理由を複数の観点から述べなさい。（400字以内）","pts":["大西洋三角貿易でイギリスはリヴァプールなどを拠点に奴隷貿易の最大の担い手となっていた","啓蒙思想の人権意識とクエーカー・福音主義の宗教的動機から、ウィルバーフォースらが廃止運動を組織した","ハイチ革命（1791年蜂起、1804年独立）は黒人自身の蜂起によって奴隷制を打ち破り、奴隷制維持の費用と危険を強く印象づけた","産業革命の進展で自由貿易を求める産業資本家が台頭し、西インド諸島の砂糖植民地の比重が低下したとする見方（ウィリアムズ説）があるが、奴隷制はなお収益性が高かったとする反論もあり、経済要因だけでは説明できない","1807年に奴隷貿易廃止法が成立し、1833年の奴隷制度廃止法で植民地の奴隷制そのものが廃止された（奴隷所有者には補償金が支払われた）","イギリスは海軍力で他国の奴隷貿易も取り締まり、人道主義を掲げつつ自国の優位を確保した","解放後の労働力不足を補うためインドや中国から年季契約労働者（インデンチャー・レイバー、苦力）が導入され、新たな移民社会と搾取が生まれた"],"lim":400,"c":"【近現代欧米】市民社会と政治・社会変動","y":1833,"ex":"人道主義だけで説明せず、宗教・啓蒙の人道主義、ハイチ革命という奴隷自身の抵抗、産業革命による経済構造の転換を並べるのが要点。経済要因はウィリアムズ説として示し、断定は避ける。貿易廃止（1807）と制度廃止（1833）の区別、奴隷所有者への補償、廃止後に年季契約労働者が導入され搾取が形を変えた点まで書けると差がつく。","w":"イギリスにおける奴隷貿易廃止から奴隷制度廃止に至"},{"id":"f12","t":"essay","q":"アメリカ南北戦争が起こった原因を経済構造の違いから説明し、戦争の結果と、戦後の再建が抱えた限界について述べなさい。（400字以内）","pts":["北部は保護関税を求める商工業地帯で自由労働に基づき、南部は綿花のプランテーションを軸にイギリスへの輸出を重視して自由貿易と奴隷制を求めた","西部の新州を自由州とするか奴隷州とするかをめぐり、ミズーリ協定やカンザス・ネブラスカ法で対立が激化した","共和党のリンカンの当選（1860）を機に南部諸州が連邦を離脱してアメリカ連合国を結成し、戦争が始まった","リンカンはホームステッド法で西部農民の支持を集め、奴隷解放宣言でイギリスなどの南部支援を封じて戦争の大義を掲げた","北部の工業力が勝敗を決して連邦が維持され、憲法修正第13条で奴隷制が廃止された。国内市場の統一と保護関税、大陸横断鉄道の開通により急速な工業化が進み、19世紀末には世界最大の工業国となった","再建期には修正第14・15条で市民権と黒人男性の選挙権が定められたが、解放された黒人に土地は与えられず、分益小作（シェアクロッパー）として経済的に従属した","1877年に再建期が終わり連邦軍が南部から撤退すると、ジム＝クロウ法と「分離すれど平等」の判決（1896）により人種隔離が法制化され、実質的平等は1960年代の公民権運動まで実現しなかった"],"lim":400,"c":"【近現代欧米】市民社会と政治・社会変動","y":1861,"ex":"原因は奴隷制の道徳問題に還元せず、関税・西部・労働力をめぐる二つの経済構造の対立として説明する。結果として工業国アメリカが誕生した。一方で、再建期に修正第14・15条で法的平等が定められながら、解放が土地を伴わず、1877年の再建終了後に人種隔離が法制化されたという「限界」が問われやすい。奴隷解放宣言を開戦の原因としたり、全奴隷を即時に解放したと書いたりする誤りに注意。","w":"アメリカ南北戦争が起こった原因を経済構造の違いか"},{"id":"f13","t":"essay","q":"1848年に各国で起きた革命（諸国民の春）の展開を説明し、それらが短期的には挫折しながら、ヨーロッパの政治と社会に何を残したかを述べなさい。（400字以内）","pts":["ウィーン体制のもとで抑えられていた自由主義とナショナリズムが、産業革命による社会問題と凶作・恐慌を背景に噴出した","フランスの二月革命で七月王政が倒れて第二共和政が成立し男性普通選挙が実現したが、国立作業場の廃止に反発した労働者の六月蜂起が鎮圧され、市民層と労働者の分裂のなかでルイ＝ナポレオンが大統領に選ばれた","ウィーン三月革命でメッテルニヒが失脚してウィーン体制は崩壊し、ベルリンでも三月革命が起きた","フランクフルト国民議会が統一と憲法を討議したが、小ドイツ主義と大ドイツ主義の対立とプロイセン王の帝冠拒否で失敗した","ハンガリーのコシュートやベーメンの民族運動、イタリアのサルデーニャの対オーストリア戦争やマッツィーニらのローマ共和国は、オーストリア軍・ロシア軍・フランス軍によって鎮圧された","多くは挫折したが、オーストリアでの農民解放（賦役の廃止）、男性普通選挙の経験、プロイセンの憲法制定など、立憲制と国民国家を求める要求は定着した","自由主義的な統一の失敗は、ドイツ・イタリアで「上からの統一」（ビスマルク、カヴール）という現実主義の路線を準備した"],"lim":400,"c":"【近現代欧米】市民社会と政治・社会変動","y":1848,"ex":"自由主義とナショナリズムの噴出、市民層と労働者の分裂や民族間の対立による挫折、その後の上からの統一への転換という三段で構成する。六月蜂起は自由主義と社会主義が袂を分かった瞬間として重要である。差がつくのは「何を残したか」で、農民解放・普通選挙の経験・憲法の定着と、統一路線の転換を具体的に書けるかどうか。フランス・ドイツだけでなく、イタリアや多民族帝国の民族運動も押さえること。","w":"1848年に各国で起きた革命（諸国民の春）の展開"},{"id":"f14","t":"essay","q":"19世紀後半から20世紀前半にかけての欧米における参政権の拡大について、その要因を説明し、大衆社会の成立と結びつけて述べなさい。（400字以内）","pts":["産業革命により都市労働者が増加し、労働組合や社会主義政党が組織されて政治参加を求めた。義務教育の普及と安価な大衆新聞が世論形成の基盤となった","イギリスでは第2回・第3回選挙法改正で都市労働者、ついで農業・鉱山労働者へ参政権が拡大したが、21歳以上の男性普通選挙が実現したのは1918年の第4回改正である","ドイツでは帝国議会が男性普通選挙で選ばれ、社会民主党が第一党へ成長した","女性参政権運動は当初弾圧されたが、第一次世界大戦の総力戦で女性が軍需生産を担ったことが決定的な契機となった","イギリスは1918年に30歳以上の女性、1928年に男女平等の普通選挙を実現し、アメリカは1920年、フランスは1944年であった","大衆が有権者となったことで政党は組織化と宣伝を重視し、大衆迎合的な政治やナショナリズムの動員も可能になった","戦間期には大衆の支持を背景にファシズムが台頭し、大衆社会が民主主義と独裁の双方の基盤になりうることが示された"],"lim":400,"c":"【近現代欧米】市民社会と政治・社会変動","y":1918,"ex":"参政権の拡大を権利の進歩としてだけでなく、総力戦による動員の見返りという側面から説明するのが要点である。大衆社会の成立は民主主義の基盤であると同時に、宣伝による動員とファシズム台頭の条件でもあったという両義性まで書きたい。第3回選挙法改正で男性普通選挙が実現したと書く誤りが多いので注意（実現は1918年）。","w":"19世紀後半から20世紀前半にかけての欧米におけ"},{"id":"f15","t":"essay","q":"第2次産業革命の特徴を第1次産業革命と比較して説明し、それが企業のあり方と国際関係に与えた影響について述べなさい。（300字以内）","pts":["第1次が軽工業（綿工業）と石炭・蒸気機関を基盤としたのに対し、第2次は重化学工業（鉄鋼・電気・化学・石油）を中心とする","技術は科学的研究と結びつき、ドイツとアメリカが先行してイギリスの優位が揺らいだ","1873年に始まる大不況のもとで競争が激化し、自由貿易を維持したイギリスを除く各国（ドイツは1879年）は保護関税政策へ転じ、巨額の設備投資を要する企業は銀行資本と結合した独占体（カルテル・トラスト・コンツェルン）を形成した","資本の集中が金融資本を生み、国外への資本輸出が利潤の重要な源泉となった","原料供給地・市場・投資先を求める動きが帝国主義的な植民地獲得競争を加速させた","列強間の経済的対立が同盟関係の形成と軍拡競争を招き、第一次世界大戦の背景となった"],"lim":300,"c":"【近現代欧米】市民社会と政治・社会変動","y":1870,"ex":"軽工業から重化学工業へ、個人企業から独占資本へ、自由貿易から保護関税・資本輸出と帝国主義へ、という三つの転換で整理する。差がつくのは、1873年からの大不況が独占の形成と保護主義への転換の契機となった点を示せるかどうか。イギリスの相対的後退とドイツ・アメリカの台頭が、第一次世界大戦に至る国際対立の経済的基盤をなした点が結論になる。300字なので技術の具体例の列挙は最小限にする。","w":"第2次産業革命の特徴を第1次産業革命と比較して説"},{"id":"f16","t":"essay","q":"17世紀から20世紀半ばにかけて、台湾の帰属と統治はどのように変化したかを、その時々の国際関係と結びつけて述べなさい。（400字以内）","pts":["17世紀にオランダが南部を拠点化し、鄭成功がこれを追って反清活動の根拠地としたのち、康熙帝の時代に清朝に編入され福建省の一部とされた","19世紀後半、列強の進出と日本の台湾出兵を受けて清は防衛を強化し、1885年に台湾省を設置した","日清戦争の下関条約（1895）で日本へ割譲され、台湾民主国などの抵抗を鎮圧して台湾総督府が統治した","日本統治下ではインフラ整備と製糖業の育成が進む一方、同化政策と差別が行われ、霧社事件のような抵抗も起きた","第二次世界大戦中のカイロ宣言で中国への返還が表明され、日本の敗戦により中華民国の統治下に入った","国民党政権への本省人の不満から二・二八事件（1947）が起こって武力弾圧され、国共内戦に敗れた国民党政権は1949年に台北へ移り、戒厳令のもとで中華民国政府が台湾を統治する体制となった","朝鮮戦争の勃発でアメリカが台湾海峡に第7艦隊を派遣し、台湾は東アジア冷戦の最前線に組み込まれた"],"lim":400,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1895,"ex":"帰属の変化を、その都度の国際関係（明清交替と鄭氏、日清戦争、第二次世界大戦、国共内戦と冷戦）と結びつけて時系列で整理する。二・二八事件（1947）と1949年の政府移転の順序を取り違えないこと。差がつくのは、清にとって台湾が海防上の辺境から省へと位置づけを変えた点と、朝鮮戦争が台湾の地位を冷戦構造のなかで固定した点を示せるかどうか。","w":"17世紀から20世紀半ばにかけて、台湾の帰属と統"},{"id":"f17","t":"essay","q":"日本による朝鮮の植民地化の過程を説明し、それに対する朝鮮の民族運動がどのように展開したかを述べなさい。（400字以内）","pts":["日朝修好条規（1876）は朝鮮を「自主の邦」と規定して清の宗主権を否定し、日清戦争後の下関条約で清は朝鮮の独立を承認した","三国干渉後はロシアの影響力が強まったが、日露戦争中の第1次日韓協約で財政・外交に顧問を置き、戦後の第2次日韓協約（1905）で外交権を奪って保護国化し、統監府を置いた","ハーグ密使事件を口実に皇帝を退位させ軍隊を解散させると、元兵士が加わった義兵闘争が広がった","1910年の韓国併合条約で植民地化し、朝鮮総督府が憲兵警察による武断政治を行った","土地調査事業により申告制度を利用して多くの農民が土地を失い、日本人地主と東洋拓殖会社の所有が拡大した","パリ講和会議の民族自決に刺激され、1919年に三・一独立運動が全土に広がったが武力で鎮圧された","日本は統治方法を「文化政治」へ転換し、一方で上海に大韓民国臨時政府が樹立され、国外の独立運動が続いた"],"lim":400,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1910,"ex":"段階的な権益の剥奪（修好条規→協約→保護国→併合）を順に押さえ、それぞれに対応する抵抗（義兵闘争→三・一独立運動）を対置する。三・一独立運動が武断政治から文化政治への転換をもたらした点が因果として重要。1895年以前の清日対立はe22の論点なので一文にとどめ、日露戦争以後に字数を使う。日韓協約の順序と内容（顧問→外交権→内政権と軍隊解散）の混同が典型的な失点である。","w":"日本による朝鮮の植民地化の過程を説明し、それに対"},{"id":"f18","t":"essay","q":"五四運動が起こった背景を説明し、この運動が中国の政治と思想にもたらした変化について述べなさい。（400字以内）","pts":["辛亥革命後も袁世凱の独裁と軍閥割拠が続き、共和政は実質を伴わなかった","第一次世界大戦中、日本は二十一カ条の要求を突きつけて山東の旧ドイツ権益などを認めさせた","大戦で列強のアジアへの関与が薄れたことにより民族資本が成長し、都市の労働者と学生層が厚みを増した","陳独秀の『新青年』や胡適の白話運動など新文化運動が儒教道徳を批判して民主と科学を掲げ、ロシア革命の影響で李大釗らがマルクス主義を紹介し始めていた","パリ講和会議で二十一カ条の取り消しが認められず、1919年5月4日に北京の学生が抗議し、商人や労働者を巻き込んで全国に拡大した","中国政府はヴェルサイユ条約の調印を拒否し、大衆運動が外交を動かしうることが示された","運動後、知識人の一部がマルクス主義に向かい、カラハン宣言（1919年7月）の不平等条約放棄の表明もソヴィエトへの共感を強めて、中国共産党の結成（1921）につながった。孫文も大衆の力を重視して中華革命党を中国国民党に改め、のち改組して第1次国共合作へ向かった"],"lim":400,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"ex":"二十一カ条という直接の契機だけでなく、新文化運動・民族資本の成長・ロシア革命という三つの下地を示すのが要点である。カラハン宣言は1919年7月で運動の後の出来事なので、背景に入れると誤りになる。運動の意義は、知識人の思想運動が労働者・商人を巻き込む大衆運動へ転化し、国民党の改組と共産党の結成という政党政治の再編を準備した点にある。辛亥革命（e24）との違いは大衆の登場である。","w":"五四運動が起こった背景を説明し、この運動が中国の"},{"id":"f19","t":"essay","q":"1920年代から1940年代にかけての中国国民党と共産党の関係の変遷を、日本の中国侵略との関連に着目して述べなさい。（400字以内）","pts":["ソ連とコミンテルンの支援のもと第1次国共合作（1924）が成立し、黄埔軍官学校を基盤に北伐が進められた","蒋介石は上海クーデタ（1927）で共産党を弾圧して南京国民政府を樹立し、合作は崩壊した","共産党は農村に根拠地を築いて瑞金に中華ソヴィエト共和国臨時政府を樹立したが、国民党の包囲攻撃を受けて長征を行い、延安を拠点とした","満洲事変と満洲国建国に対し蒋介石は「安内攘外」を掲げて共産党討伐を優先したが、共産党は八・一宣言（1935）で内戦停止と抗日民族統一戦線を呼びかけ、西安事件（1936）で張学良が蒋介石を監禁して内戦停止を迫った","盧溝橋事件（1937）による日中戦争の全面化を受け第2次国共合作が成立し、抗日民族統一戦線が形成された","国民政府は重慶へ移って持久戦を続けたが、合作下でも両党の衝突（皖南事件など）は続き、共産党は農村で抗日根拠地を広げて支持を拡大した","日本の敗戦後に国共内戦が再燃し、1949年に中華人民共和国が成立、国民党政権は台湾へ移った"],"lim":400,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1937,"ex":"合作と決裂の反復を、日本の侵略という外圧が両者を結びつけ、その終息が再び対立を呼ぶという構図で整理する。転換点は八・一宣言と西安事件で、第2次国共合作の正式成立は盧溝橋事件後の1937年である（西安事件で直ちに成立したと書く誤りが多い）。差がつくのは、戦時下に共産党が農村で支持を拡大したことが戦後の内戦の帰趨を決めた点まで結べるかどうか。","w":"1920年代から1940年代にかけての中国国民党"},{"id":"f20","t":"essay","q":"朝鮮戦争が東アジアの国際秩序に与えた影響について、関係する諸国への影響に触れながら述べなさい。（400字以内）","pts":["日本の敗戦後、朝鮮半島は北緯38度線で米ソに分割占領され、1948年に大韓民国と朝鮮民主主義人民共和国が成立した","1950年に北朝鮮が南進して開戦し、国連軍（実質は米軍中心）が介入、中国人民義勇軍が参戦して戦線は38度線付近で膠着し、1953年に休戦協定が結ばれた","朝鮮半島の分断が固定化され、現在まで平和条約は結ばれていない","アメリカは台湾海峡に第7艦隊を派遣し、台湾の国民党政権を防衛して中華人民共和国との対立を固定化した","中国は米国と直接戦火を交えたことで国際的孤立が深まる一方、ソ連への依存を強めた","日本は特需景気で経済復興が加速し、警察予備隊の創設（のちの自衛隊）で再軍備が始まり、1951年にサンフランシスコ平和条約と日米安全保障条約に調印して、翌1952年に西側陣営の一員として独立を回復した","冷戦はアジアで熱戦となり、アメリカは米韓相互防衛条約・米華相互防衛条約などで日韓台を結ぶ同盟網を築き、封じ込めをアジアへ広げた"],"lim":400,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1950,"ex":"一国の戦争ではなく、東アジア全体の冷戦構造を確定させた出来事として書く。朝鮮の分断固定、台湾海峡への米軍介入、日本の独立と再軍備という三方向の影響を並べるのが定石である。差がつくのは、中国の参戦が米中対立と台湾問題を固定した点を示せるかどうか。戦争の経過の記述に字数を使いすぎないこと。歴史総合型の設問では日本への影響が問われやすい。","w":"朝鮮戦争が東アジアの国際秩序に与えた影響について"},{"id":"f21","t":"essay","q":"イギリスによるインド支配の確立過程を説明し、その支配がインドの経済構造をどのように変えたかを述べなさい。（400字以内）","pts":["プラッシーの戦い（1757）でフランスとベンガル太守の連合軍を破ってベンガルでの優位を確立し、ブクサールの戦いを経て1765年にムガル皇帝からディーワーニー（徴税権）を獲得して支配の財源とした","マイソール戦争・マラーター戦争・シク戦争を経て全域を制圧し、藩王国を温存して分割統治を行った","ザミンダーリー制やライヤットワーリー制を導入して地税を貨幣で徴収し、土地の私有と課税を固定化した","重い地税が農民を現金作物の栽培や借金に追い込み、飢饉への抵抗力を弱めた","本国の産業資本家の要求で東インド会社の貿易独占権が廃止され（1813年インド貿易、1833年には商業活動を停止）、機械制の安価なイギリス製綿布が流入してダッカなどの伝統的綿織物業が衰退し「脱工業化」が進んだ","インドは綿花・藍・茶などの原料供給地かつイギリス製品の市場へと転換し、アヘンは中国へ輸出されてイギリス・インド・中国を結ぶ三角貿易に組み込まれた","鉄道や灌漑は整備されたが、原料の搬出とイギリス資本の利益に奉仕する構造であった"],"lim":400,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1793,"ex":"骨格は①プラッシーの戦いと徴税権の獲得②戦争による全域支配③地税制度④自由貿易化と「脱工業化」⑤原料供給地・市場への転換と三角貿易。差がつくのは、会社の貿易独占権の廃止（1813・1833年）が本国の産業資本の要求によるもので、綿布流入の制度的前提だった点を書けるかどうか。インドが元来は綿布の輸出地だったという逆転を明示し、鉄道などの近代化も本国の利益に沿うものだった点を落とさないこと。","w":"イギリスによるインド支配の確立過程を説明し、その"},{"id":"f22","t":"essay","q":"シパーヒーの反乱（インド大反乱）が起こった原因を説明し、その結果イギリスのインド統治がどのように変わったかを述べなさい。（300字以内）","pts":["東インド会社は後継者のない藩王国を接収する併合政策などで領土を広げて藩王・地主層の不満を高め、重い地税と綿織物業の衰退で農民・手工業者も困窮していた","サティー（寡婦殉死）の禁止など社会慣行への干渉や布教活動が、宗教への介入と受け取られた","牛と豚の脂を塗ったとされる薬包が、ヒンドゥー・ムスリム双方の宗教感情を害し、直接の契機となった","シパーヒーの蜂起に旧支配層や農民が合流し、ムガル皇帝を擁立して北インドに広がったが、統一的な指導を欠き、藩王やシク教徒の一部がイギリス側についたため鎮圧された","ムガル皇帝は廃位されて帝国は滅亡し、東インド会社は解散して本国政府による直接統治に移行し、1877年にヴィクトリア女王を皇帝とするインド帝国が成立した","イギリスは併合政策をやめて藩王国を温存・懐柔し、宗教・社会慣行への干渉を控え、軍でのイギリス兵の比率を高めるなど統治方針を転換し、宗教・カーストの違いを利用する分割統治を強めた"],"lim":300,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1857,"ex":"薬包の噂は引き金にすぎず、併合政策・地税・社会慣行への干渉という構造的な不満が本体である点を示す。結果は会社統治から本国の直接統治への移行とインド帝国の成立だが、差がつくのは統治方針の転換（藩王国の温存、宗教・慣行への不干渉、軍の再編、分割統治）まで書けるかどうか。300字なので原因と結果の配分をおおむね半々にし、反乱の経過の記述は一文にとどめる。","w":"シパーヒーの反乱（インド大反乱）が起こった原因を"},{"id":"f23","t":"essay","q":"インド国民会議の結成から第二次世界大戦期に至るインド民族運動の展開について、イギリスの対応とヒンドゥー・ムスリム関係の変化に触れながら述べなさい。（400字以内）","pts":["1885年に結成されたインド国民会議は、当初は知識人を中心とする対英協調的で穏健な組織であった","ベンガル分割令（1905）に反発してカルカッタ大会（1906）で英貨排斥・スワデーシ・スワラージ・民族教育の四綱領を採択し、急進化した","イギリスの支援で全インド＝ムスリム連盟が結成され（1906）、宗教別選挙区の導入（1909）が両者の分断を制度化した","第一次世界大戦後の自治の約束に反し、1919年インド統治法は限定的で、ローラット法が令状なしの逮捕を認め、アムリットサール事件が起きた","ガンディーが非暴力・不服従を掲げて運動を大衆化し、オスマン帝国のカリフ擁護を求めるヒラーファト運動と結んでヒンドゥー・ムスリムの協力が一時頂点に達したが、運動の停止後は両者の対立が再燃した","ネルーらの主導でプールナ＝スワラージ（完全独立）を決議し（1929）、塩の行進（1930）が第2次不服従運動の象徴となった。円卓会議を経た1935年インド統治法は州自治を認めたが中央の権限は残った","第二次世界大戦でイギリスが協議なくインドを参戦させたため、国民会議派は非協力を強め（1942年「インドを立ち去れ」運動）、ムスリム連盟はジンナーのもとパキスタン建国を決議（1940）して対立が決定的となった"],"lim":400,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1920,"ex":"穏健な協議機関が大衆運動へ転化する過程と、イギリスの譲歩が常に小出しで不十分だったことを対にして書く。ヒンドゥー・ムスリム関係は一直線に悪化したのではなく、ヒラーファト運動との提携で協力が頂点に達した後に対立が再燃した、という変化を示すと差がつく。ベンガル分割令と宗教別選挙区が宗教対立を制度に埋め込んだ点が因果の軸。分離独立の過程と帰結はf24の論点なので、1940年のパキスタン決議で締めくくる。","w":"インド国民会議の結成から第二次世界大戦期に至るイ"},{"id":"f24","t":"essay","q":"インドとパキスタンが分離して独立するに至った要因を説明し、分離独立がもたらした帰結について述べなさい。（400字以内）","pts":["イギリスの分割統治と宗教別選挙区が、宗教の違いを政治的利害の対立に転化させていた（前提として簡潔に）","国民会議派はヒンドゥー中心の組織とみなされ、1937年の州選挙で会議派が大勝して連盟を政権から排除すると、少数派のムスリムは独立後の地位に不安を強めた","ジンナーは二民族論を唱え、1940年のラホール決議でムスリム国家パキスタンの樹立を掲げた","大戦中、会議派が「インドを立ち去れ」運動で弾圧される一方、戦争に協力したムスリム連盟は勢力を伸ばし、戦後の統一インド案（1946年の内閣使節団案）も合意に至らず宗派間の暴動が激化した","戦争で疲弊したイギリスは早期撤退を決め、1947年のインド独立法でインドとパキスタンの二つの自治領が成立した","宗教別の住民大移動と暴動で多数の犠牲者が出て、統一を訴えたガンディーは翌年ヒンドゥー至上主義者に暗殺された","藩王国カシミールの帰属をめぐって印パ戦争が繰り返され、東パキスタンは1971年にバングラデシュとして独立し、両国の対立は核保有を含めて現在まで続いている"],"lim":400,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1947,"ex":"分離を宗教対立の必然とせず、分割統治と宗教別選挙区が対立を制度化した結果として説明する。f23と重ならないよう、要因は1937年以降の会議派と連盟の関係悪化、二民族論、大戦中の両者の立場の差、イギリスの早期撤退に重点を置く。帰結は住民移動の惨禍、ガンディー暗殺、カシミール問題、バングラデシュ独立まで示すと差がつく。インド独立法を「インド統治法」と取り違える誤りに注意。","w":"インドとパキスタンが分離して独立するに至った要因"},{"id":"f25","t":"essay","q":"第二次世界大戦後のアジア・アフリカ諸国による非同盟の動きについて、その成立の背景と展開を説明し、南北問題との関係にも触れながら述べなさい。（400字以内）","pts":["戦後の脱植民地化で多くの独立国が生まれたが、冷戦の二極構造のもとで陣営への従属を迫られた","インドのネルーと中国の周恩来が平和五原則（1954）で主権尊重・内政不干渉・平和共存を確認した","バンドン会議（1955）は反植民地主義と平和共存を掲げる平和十原則を採択し、アジア・アフリカ諸国が国際政治の主体として登場した","1960年の「アフリカの年」を経て、ティトー・ナセル・ネルーらが主導し第1回非同盟諸国首脳会議（1961）がベオグラードで開かれたが、中印国境紛争（1962）などアジア・アフリカ諸国の間の対立も表面化した","政治的独立を得ても経済は旧宗主国に従属し、単一の一次産品に依存するモノカルチャー経済が残った","先進国と途上国の経済格差が南北問題として意識され、国連貿易開発会議（UNCTAD、1964）が交渉の場となった","資源ナショナリズムの高まりと石油危機を背景に新国際経済秩序（NIEO）樹立宣言（1974）が採択されたが、産油国と非産油国の格差（南南問題）も表面化し、この系譜が今日のグローバルサウスの主張につながる"],"lim":400,"c":"【近現代インド】脱植民地化とグローバルサウス","y":1955,"ex":"非同盟を冷戦の二極構造に対する第三の立場として位置づけ、政治的独立が経済的自立を伴わなかったために課題が南北問題へ移行した流れで書く。バンドン会議（1955）と非同盟諸国首脳会議（1961）は別の会議で、中国は後者の加盟国ではない点に注意。差がつくのは、UNCTADやNIEOを通じた途上国の要求と、産油国と非産油国の格差（南南問題）という展開まで示せるかどうか。","w":"第二次世界大戦後のアジア・アフリカ諸国による非同"},{"id":"g001","t":"mc","q":"叙任権闘争で、教皇グレゴリウス7世と対立した神聖ローマ皇帝は誰か。","o":["ハインリヒ4世","ハインリヒ3世","オットー1世","フリードリヒ1世（バルバロッサ）"],"a":0,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1077,"ex":"クリュニー修道院の改革運動の影響を受けたグレゴリウス7世は、帝国教会政策の要である皇帝の聖職叙任を否定した。ハインリヒ4世は教皇の廃位を宣言したが逆に破門され、諸侯の離反を恐れて1077年にカノッサで赦しを請うた。1122年のヴォルムス協約は次のハインリヒ5世と教皇カリクストゥス2世との妥協であり、混同に注意。この闘争で教皇権は伸長し、ドイツでは諸侯の自立が進んだ。","w":"ハインリヒ4世"},{"id":"h01","t":"essay","q":"明の海禁と朝貢を一体とした対外体制は、16世紀にどのように動揺したか。その動揺が明の滅亡と清による中国支配の確立にどのように結びついたかを、朝鮮・日本との関係にも触れながら、17世紀末まで述べなさい。（400字以内）","pts":["明は民間の海上貿易を禁じる海禁と朝貢を一体化し、周辺諸国との交易を朝貢に限定した","16世紀、日本銀やアメリカ大陸の銀への需要から密貿易が拡大し、中国人が主体の後期倭寇が活発化した。北ではアルタン＝ハンのモンゴルが侵入した（北虜南倭）","明は1567年ごろ海禁を緩めて民間の東南アジア渡航を認め（日本との通交は除く）、1571年にアルタンと和議を結んで互市を開いた。流入した銀を背景に一条鞭法が広まった","豊臣秀吉の朝鮮侵攻（壬辰・丁酉倭乱、1592〜98）への援軍などで明の財政は悪化し、増税が民衆反乱を招いた。この間に女真のヌルハチが自立して後金を建てた","ホンタイジは1636年に国号を清とし、丙子胡乱で朝鮮を服属させた（朝鮮の「小中華」意識の起点）。1644年に李自成が北京を占領して明が滅ぶと、清は呉三桂の先導で北京に入った","清は鄭氏の台湾に遷界令で対抗し、三藩の乱を平定して1683年に台湾を領有、1684年に海禁を解いて海関を置き、民間の互市を管理のもとで認めた","朝貢と互市が並存する清の対外秩序が成立し、日本は朝貢せず長崎で清の商船と交易した"],"lim":400,"c":"【近世・東アジア】明清交代と東アジア国際秩序","y":1644,"ex":"骨格は①明の海禁＝朝貢体制→②銀需要による密貿易と北虜南倭→③海禁の緩和・互市と銀の流入→④朝鮮出兵への援軍による財政悪化と女真の自立→⑤明の滅亡と清の入関→⑥台湾平定と海禁解除、の順。倭寇を「日本人の海賊」とだけ書くのは典型的な誤りで、後期倭寇は中国人の密貿易者が主体だった。1567年の緩和でも日本との通交は認められなかった点、清が朝貢と互市を併用して秩序を組み直した点まで書けると差がつく。","w":"明の海禁と朝貢を一体とした対外体制は、16世紀に"},{"id":"j001","t":"mc","q":"清がモンゴル・青海・チベット・新疆などの藩部を統轄するために設けた中央の機関はどれか。","o":["礼部","軍機処","理藩院","総理各国事務衙門"],"a":2,"c":"【近世・東アジア】清の支配体制と藩部","y":1759,"ex":"清は中国内地を直轄地として科挙官僚で治め、モンゴル・チベット・新疆などの藩部は理藩院が統轄して、現地の王侯や宗教指導者による自治を認めた。朝鮮・琉球などの朝貢国との儀礼は礼部が扱い、統治はしなかった。直轄地・藩部・朝貢国という三層の秩序が、マカートニー使節を迎えた乾隆帝期の清の対外観の基盤である。雍正帝の軍機処、1861年設置の総理衙門と区別する。","w":"理藩院"},{"id":"h02","t":"essay","q":"中華人民共和国の成立から1980年代末までの政治・経済路線の変遷を、指導部内の路線対立と対外関係に着目して述べなさい。（400字以内）","pts":["1949年の成立後、中ソ友好同盟相互援助条約（1950）でソ連と結び、朝鮮戦争に参戦する一方、土地改革を実施した","第1次五か年計画（1953〜）でソ連型の重工業化と農業集団化を進め、社会主義化を急いだ","スターリン批判後、百花斉放・百家争鳴で批判を許したが反右派闘争（1957）に転じ、1958年からの大躍進政策と人民公社は多数の餓死者を出して失敗した","毛沢東は国家主席を劉少奇に譲り、劉少奇・鄧小平が調整政策で経済を立て直した。同じころ平和共存路線をめぐって中ソ対立が深まり、ソ連は技術者を引き揚げ、1969年には国境で武力衝突が起きた","1966年、毛沢東は文化大革命を発動し、紅衛兵を動員して劉少奇・鄧小平を「実権派（走資派）」として失脚させ、経済と教育は混乱した","ソ連への対抗から米中接近に転じ（1971年に国連代表権を獲得、1972年ニクソン訪中）、1976年の毛沢東の死後に四人組が逮捕された","1978年以降、鄧小平のもとで改革開放と「四つの現代化」に転じ、人民公社の解体、生産責任制、経済特区の設置で市場経済を導入したが、政治の民主化要求は1989年の天安門事件で弾圧された"],"lim":400,"c":"【現代・中国】中華人民共和国の路線対立","y":1966,"ex":"骨格は、ソ連型の建設→毛沢東の急進路線（大躍進）→調整政策→文化大革命→米中接近→改革開放と、「急進」と「調整」の振り子で整理すること。対外関係は中ソ同盟→中ソ対立→米中接近と対応させ、国内の路線対立と結びつけると差がつく。文化大革命を単なる文化運動とせず、毛沢東による権力奪回の政治闘争として書くこと。改革開放は経済の自由化であり、政治の民主化を伴わなかった点（天安門事件）で結ぶ。","w":"中華人民共和国の成立から1980年代末までの政治"},{"id":"j002","t":"mc","q":"1958年に毛沢東の主導で始まり、農業・工業の急激な増産をめざして人民公社を全国に組織したが、多数の餓死者を出して失敗した運動はどれか。","o":["百花斉放・百家争鳴","大躍進","文化大革命","四つの現代化"],"a":1,"c":"【現代・中国】大躍進と人民公社","y":1958,"ex":"第1次五か年計画でソ連型の工業化を進めた中国は、スターリン批判後のソ連との路線の違いもあって独自の急進路線に転じた。行政と生産を一体化した人民公社を組織し、鉄鋼の増産も強行したが、自然災害も重なって大飢饉を招いた。毛沢東は国家主席を劉少奇に譲り、劉少奇・鄧小平が調整政策を進めたが、これへの反撃が1966年の文化大革命である。人民公社の解体は改革開放期。","w":"大躍進"},{"id":"h03","t":"essay","q":"14〜16世紀に、西ヨーロッパとエルベ川以東の東ヨーロッパとで農民の地位が逆方向に変化した理由を、両地域の経済的な結びつきに触れながら述べなさい。（400字以内）","pts":["西欧では商業の復活と貨幣経済の浸透により、領主は賦役による直営地経営から生産物地代・貨幣地代へと移行し、古典荘園は解体に向かっていた","14世紀の寒冷化と飢饉、黒死病（1348年〜）で人口が激減して労働力が不足し、農民の地位が向上した","領主が賃金の抑制や重い課税で支配を強めようとすると（領主反動）、フランスのジャックリーの乱（1358）、イギリスのワット＝タイラーの乱（1381）が起こった","反乱は鎮圧されたが農奴解放の流れは止まらず、イギリスでは独立自営農民（ヨーマン）が成長した。地代収入の減った諸侯・騎士は没落し、王権の伸長を促した","15〜16世紀、西欧の人口回復と都市の発展、価格革命により穀物需要が高まった","エルベ川以東では領主（ユンカーなど）が輸出向けの穀物生産のため直営地経営（グーツヘルシャフト）を拡大し、農民の移動を禁じて賦役を強化した（再版農奴制）","穀物はダンツィヒなどからオランダ船で西欧へ運ばれ、商工業の西欧と穀物供給地の東欧という国際分業が成立した。東欧では領主貴族の力が強まり、王権や都市の発展は抑えられた"],"lim":400,"c":"【中世ヨーロッパ】封建社会の動揺と東西の分岐","y":1381,"ex":"西欧の「解放」と東欧の「再強化」を別々に書くのではなく、同じ商品経済の拡大が、労働力と市場の条件の違いによって逆の結果を生んだ、という一つの因果で結ぶのが得点の核心。西欧側は黒死病による労働力不足、領主反動と農民反乱、ヨーマンの成長を、東欧側は西欧の穀物需要→輸出向け直営地経営→農民の移動禁止の順に書く。東方植民の時代から農奴制が強かったと誤解するのが典型的な失点で、入植当初の農民はむしろ有利な条件を得ていた。","w":"14〜16世紀に、西ヨーロッパとエルベ川以東の東"},{"id":"j003","t":"mc","q":"1381年にイギリスで起こったワット＝タイラーの乱の直接の契機として最も適当なものはどれか。","o":["百年戦争の戦費をまかなうための人頭税の徴収","第1次囲い込みによる農民の土地の喪失","ジョン王の重税と大憲章（マグナ＝カルタ）の破棄","ヘンリ8世の修道院解散による教会領の没収"],"a":0,"c":"【中世ヨーロッパ】封建社会の動揺と農民反乱","y":1381,"ex":"黒死病後の労働力不足で農民の地位が高まるなか、議会は賃金を抑える労働者規制法を定め、さらに百年戦争の戦費のため人頭税を課した。これに反発して1381年に反乱が起こり、「アダムが耕しイヴが紡いだとき、だれが貴族であったか」と説いたジョン＝ボールも加わって農奴制の廃止を求めた。反乱は鎮圧されたが、農奴解放と独立自営農民の成長は進んだ。囲い込みは15世紀末以降の現象である。","w":"百年戦争の戦費をまかなうための人頭税の徴収"},{"id":"h04","t":"essay","q":"11〜14世紀のヨーロッパで形成された二つの遠隔地商業圏について、それぞれの中心となった都市と主な取引品を説明したうえで、中世都市の経済がもった「開放的」な側面と「閉鎖的」な側面を具体的に述べなさい。（400字以内）","pts":["農業生産力の上昇と人口増加、十字軍による交通の発達を背景に、遠隔地商業が復活した（商業の復活）","地中海商業圏では、ヴェネツィア・ジェノヴァなど北イタリア諸都市が東方（レヴァント）貿易で香辛料・絹織物などのアジア産品を輸入し、フィレンツェは毛織物業や金融で栄えた","北ヨーロッパ商業圏では、リューベックを盟主とするハンザ同盟が海産物・穀物・木材・毛皮などを扱い、ロンドン・ブリュージュ・ベルゲン・ノヴゴロドに在外商館を置いた。フランドルは毛織物の産地として栄えた","両商業圏はシャンパーニュ地方の大市や、のちアウクスブルクなど南ドイツの内陸都市によって結ばれた","開放的な側面：遠隔地の商人や職人、ユダヤ人の金融業者を受け入れ、「都市の空気は自由にする」の原則で逃亡農奴も一定期間の居住で自由身分を得た。学生と教師の組合から大学が生まれた","閉鎖的な側面：商人ギルドや同職ギルド（ツンフト）が生産量・価格・品質・徒弟制を統制して競争を排除し、市民権や市政への参加は有力市民に限られたため、手工業者はツンフト闘争で市政参加を求めた","都市は皇帝や国王の特許状で自治を得て、ロンバルディア同盟やハンザ同盟のような都市同盟で特権を守った"],"lim":400,"c":"【中世ヨーロッパ】遠隔地商業と中世都市","y":1250,"ex":"骨格は、商業の復活の背景→二つの商業圏（担い手・取引品・結節点）→開放性→閉鎖性の順。地中海圏を奢侈品、北海・バルト海圏を生活必需品中心と対比し、両者をつなぐ大市と内陸都市に触れると構造が伝わる。都市を自由と開放の象徴としてのみ描くのが典型的な誤りで、ギルドによる競争の制限と市民身分の排他性を必ず対置すること。2024年の一橋大問1は、都市経済を「閉鎖的」とみる説を批判的に検討させており、両面を書く力が問われる。","w":"11〜14世紀のヨーロッパで形成された二つの遠隔"},{"id":"j004","t":"mc","q":"ハンザ同盟について述べた文として最も適当なものはどれか。","o":["リューベックを盟主とする北ドイツ諸都市の同盟で、ロンドンやノヴゴロドなどに在外商館を置き、北海・バルト海の交易を担った。","北イタリアの諸都市が神聖ローマ皇帝フリードリヒ1世のイタリア政策に対抗して結成し、レニャーノの戦いで皇帝軍を破った。","ヴェネツィアとジェノヴァを中心に結成され、香辛料や絹織物などのアジア産品を扱う東方貿易を独占した。","16世紀に最盛期を迎え、大航海時代の到来とともにアジア貿易に進出して繁栄を続けた。"],"a":0,"c":"【中世ヨーロッパ】遠隔地商業と中世都市","y":1370,"ex":"北ドイツ商人の団体から発展したハンザは、リューベックを盟主に多数の都市が加わり、海産物・穀物・木材・毛皮などの生活必需品を扱った。1370年にデンマークとの戦争に勝ってバルト海の覇権を握ったが、15世紀以降、領邦国家の台頭やオランダ・イギリス商人の進出、商業の中心の大西洋への移動で衰えた。皇帝に対抗した北イタリアのロンバルディア同盟や、地中海の東方貿易と区別する。","w":"リューベックを盟主とする北ドイツ諸都市の同盟で、ロンドンやノヴゴロドなどに在外商館を置き、北海・バルト海の交易を担った。"},{"id":"h05","t":"essay","q":"10世紀から13世紀にかけて、中国と周辺諸国との関係はどのように変化したか。唐の滅亡後に周辺諸国が自立していったことと、宋代の海上交易の発展に触れながら、モンゴルによる統合までを述べなさい。（400字以内）","pts":["唐の滅亡（907）後、周辺諸民族は自立して国家を形成し、契丹（遼）・西夏・高麗・大越（李朝）などが独自の制度を整え、契丹や西夏は独自の文字もつくった","契丹は燕雲十六州を獲得し、遊牧民を部族制で、農耕民を州県制で治める二重統治体制をとった","宋は文治主義のもとで科挙官僚による統治を進めたが軍事的に劣勢で、澶淵の盟（1004）で契丹に毎年銀・絹を贈り、西夏とも和約を結んだ。中国を唯一の中心とする冊封秩序は相対化された","女真の金が遼を滅ぼし、靖康の変（1126〜27）で北宋は滅んだ。南宋は紹興の和議（1142）で金に臣下の礼をとった","江南の開発と商業・貨幣経済の発展を背景に、宋は広州・泉州・明州に市舶司を置いて海上交易を管理し、ムスリム商人が来航して陶磁器・絹が輸出された。日宋貿易のように朝貢によらない民間交易も盛んになった","モンゴル帝国は金（1234）と南宋（1279）を滅ぼして高麗を服属させ、元は駅伝制や大運河・海運で陸と海の交易網を結びつけ、泉州は世界的な港となった"],"lim":400,"c":"【中世・東アジア】唐滅亡後の多国家体制と海上交易","y":1004,"ex":"唐の時代の一元的な冊封秩序が崩れ、宋が契丹や金と対等あるいは劣位の関係を結ぶ多国家並立の時代になった点が骨格。澶淵の盟を「宋の屈辱」とだけ書くのは不十分で、歳幣と引き換えに長期の平和と交易を得た選択でもあった。政治・軍事では劣勢でも、海上交易と銭の流通を通じて宋が東アジア経済の中心であり続けた二面性を書けると差がつく。元は陸と海の交易網を結びつけ、分立の時代を終わらせた。","w":"10世紀から13世紀にかけて、中国と周辺諸国との"},{"id":"j005","t":"mc","q":"1004年、宋が契丹（遼）と結び、宋が毎年銀や絹を贈ることで和平を得た盟約はどれか。","o":["慶暦の和約","紹興の和議","澶淵の盟","海上の盟"],"a":2,"c":"【中世・東アジア】宋と北方民族","y":1004,"ex":"燕雲十六州を得て華北をうかがう契丹に対し、文治主義をとる宋は軍事的に劣勢で、1004年の澶淵の盟で国境を定め、毎年銀・絹を歳幣として贈った。両国は兄弟関係とされ、宋を唯一の中心とする冊封秩序の相対化を示す。歳幣は財政の負担となったが、長期の平和と国境での交易をもたらした。西夏との慶暦の和約（1044年）、南宋が金に臣下の礼をとった紹興の和議（1142年）と区別する。","w":"澶淵の盟"},{"id":"h06","t":"essay","q":"17世紀末から19世紀前半のヨーロッパで、コーヒーハウス・サロン・読書協会などの自発的な結社や社交の場が発達した背景を、ギルドなど近世的な団体との違いに触れて説明し、その政治的な意義と限界を述べなさい。（400字以内）","pts":["大西洋貿易とアジア貿易でコーヒー・茶・砂糖・タバコなどの植民地物産が普及し、ロンドンのコーヒーハウスやパリのカフェが広がった","出版・新聞・雑誌などメディアの発達と識字の拡大を背景に、サロン・読書協会・フリーメーソンなどが生まれた","ギルドや身分団体は生まれや職業によって加入が決まる強制的・閉鎖的な団体であったのに対し、新しい結社は自由意思で加わる個人の結合で、貴族と市民が身分を越えて議論した","結社は啓蒙思想を広め、世論（公論）を形成して絶対王政や特権身分への批判の場となり、フランス革命ではジャコバン＝クラブなどの政治クラブが政治を動かした","ウィーン体制下では政治結社が禁じられ監視されたが（カールスバート決議、1819）、ブルシェンシャフトや体操・合唱協会などが自由主義とナショナリズムの受け皿となり、1848年革命につながった","限界：参加者は財産と教養をもつ男性市民が中心で、女性・労働者・植民地の人々は排除された。労働者はのちに独自の労働組合や社会主義の結社をつくった"],"lim":400,"c":"【近代・ヨーロッパ】市民的公共圏と結社","y":1750,"ex":"骨格は背景（植民地物産とメディアの発達）→近世的団体との違い（強制・身分制に対する自発・平等）→意義（世論の形成と啓蒙の普及、革命・ナショナリズムへの接続）→限界（排除された人々）の順。結社を単なる社交の場として描くと得点にならず、身分の枠を越えた議論が世論という新しい政治的な力を生んだ点を示すこと。開かれた場であることを強調しすぎて、財産と教養をもつ男性に限られた排除の側面を落とすのが典型的な失点。2025年一橋大問2の主題である。","w":"17世紀末から19世紀前半のヨーロッパで、コーヒ"},{"id":"h07","t":"essay","q":"16世紀後半から18世紀にかけて、フランス王権のユグノー（カルヴァン派）に対する政策はどのように変化したか。その理由を王権の強化と関連づけて説明し、ブランデンブルク＝プロイセンなど他地域に与えた影響を述べなさい。（400字以内）","pts":["カルヴァン派は貴族や商工業者に広がり、ギーズ家とブルボン家など貴族の党派争いと結びついてユグノー戦争（1562〜98）が起こった。サン＝バルテルミの虐殺（1572）などで王権は弱体化し、スペインも介入した","ブルボン朝を開いたアンリ4世はカトリックに改宗し、ナントの王令（1598）でユグノーに信仰の自由と公職就任を認めて内乱を終わらせた。宗教的統一より国家の統一と平和を優先する立場であった","リシュリューはラ＝ロシェルを攻略してユグノーの政治的・軍事的特権を奪う一方、信仰は容認し、三十年戦争では国家理性に基づいて新教側で参戦した","ルイ14世は「一つの王、一つの法、一つの信仰」をめざしてナントの王令を廃止し（1685）、多くのユグノーの商工業者がオランダ・イギリス・ブランデンブルクなどへ亡命して、フランスの産業は打撃を受けた。18世紀も迫害は続き（カミザールの反乱）、プロテスタントの市民身分が回復されたのは1787年の寛容令によってであった","ブランデンブルク選帝侯はポツダム勅令（1685）でユグノーを受け入れ、ベルリンの商工業が発展した","ユグノーの技術と資本はプロイセンの重商主義と産業育成を支え、宗教的寛容による人材誘致は国家の方針として定着し、フリードリヒ2世の啓蒙専制下の寛容政策にも引き継がれた","寛容は信仰の自由の理念からではなく、国家の統一と経済的利益という国家理性の論理から進められた"],"lim":400,"c":"【近世ヨーロッパ】宗教対立と寛容","y":1598,"ex":"骨格は、内乱による王権の弱体（ユグノー戦争）→統一を優先した寛容（ナントの王令）→政治的特権の剝奪（リシュリュー）→信仰の統一による絶対王政の完成（王令の廃止）→亡命と受け入れ国の発展、の順。寛容から不寛容への変化を王権の強さと結びつけ、弱い王権は寛容で内乱を収め、強い王権は信仰の統一を求めたと説明できると差がつく。ナントの王令を近代的な信教の自由と同一視するのは誤りで、カトリックを国教としたままの限定的な容認だった点に注意。","w":"16世紀後半から18世紀にかけて、フランス王権の"},{"id":"j006","t":"mc","q":"プラハ大学で教会の世俗化や聖職者の特権を批判し、コンスタンツ公会議で異端とされて1415年に火刑に処されたベーメンの宗教改革者は誰か。","o":["ウィクリフ","フス","サヴォナローラ","ツヴィングリ"],"a":1,"c":"【中世ヨーロッパ】教会批判とフス戦争","y":1415,"ex":"ウィクリフの影響を受けたフスは、聖書を信仰の基準とし、教会の土地所有や贖宥状を批判した。教会大分裂を収拾するために開かれたコンスタンツ公会議で火刑となると、ドイツ人の聖職者・貴族の支配への反発と結びついたチェック人の民族運動としてフス戦争（1419〜36年）が起こった。約1世紀後のルターの宗教改革の先駆である。同じ公会議で死後に異端とされたイギリスのウィクリフと区別する。","w":"フス"},{"id":"h08","t":"essay","q":"第二次世界大戦後の西ヨーロッパ統合の動機と展開を、独仏関係と冷戦に触れながら1990年代初めまで説明し、同時期の東南アジア諸国連合（ASEAN）との性格の違いを述べなさい。（400字以内）","pts":["動機は、二度の大戦への反省から独仏の和解を図り、戦争に不可欠な石炭・鉄鋼を共同管理して戦争を不可能にすることと、米ソの間で西欧の経済的地位を回復することにあった","冷戦下、マーシャル＝プランの受け入れ機関OEEC（1948）を通じて西欧の協力が進み、西ドイツを西側陣営に組み込むことも統合の目的となった","シューマン＝プラン（1950）に基づきヨーロッパ石炭鉄鋼共同体（ECSC、1952）がフランス・西ドイツ・イタリア・ベネルクス3国で発足し、ローマ条約によるEEC・EURATOM（1958）を経て、三者を統合したEC（1967）へと発展した","イギリスは当初参加せずEFTA（1960）を組織し、ド＝ゴールに加盟を拒まれたのち1973年に加盟した。1980年代には民主化したギリシア・スペイン・ポルトガルが加わった","冷戦の終結とドイツ統一（1990）を受け、統一ドイツを統合に組み込む意図もあってマーストリヒト条約によりEU（1993）が発足し、共通通貨の導入が決まった","ASEAN（1967）はベトナム戦争下に反共の5か国で結成され、内政不干渉と全会一致を原則とする政府間協力にとどまり、主権の一部を共同機関に委ねるEC・EUとは性格が異なる。冷戦後にはベトナムなども加盟した"],"lim":400,"c":"【現代・ヨーロッパ】ヨーロッパ統合","y":1952,"ex":"骨格は、動機（独仏和解・経済的地位の回復・冷戦下の西側結束）→ECSC→EEC→ECの展開→拡大→EUの発足→ASEANとの比較の順。統合を経済協力としてのみ説明するのは不十分で、石炭・鉄鋼の共同管理が独仏の戦争を不可能にする政治的な装置であった点が核心。ASEANとの比較では、主権の一部を共同機関に委ねる超国家性の有無を軸にすると差がつく。ユーロの現金流通は2002年で、マーストリヒト条約で導入が決まった段階と区別する。","w":"第二次世界大戦後の西ヨーロッパ統合の動機と展開を"},{"id":"j007","t":"mc","q":"ヨーロッパ統合の出発点となったヨーロッパ石炭鉄鋼共同体（ECSC）について述べた文として正しいものはどれか。","o":["1950年のフランス外相シューマンの提案に基づき、独仏対立の原因となってきた石炭・鉄鋼を超国家的な機関のもとで共同管理した。","イギリスが中心となって提唱し、原加盟国にはイギリス・フランス・西ドイツが含まれた。","マーシャル＝プランの受け入れ機関として、アメリカの提唱により1948年に発足した。","1957年に調印されたローマ条約によって設立され、関税同盟と共同市場の形成をめざした。"],"a":0,"c":"【現代・ヨーロッパ】ヨーロッパ統合","y":1952,"ex":"二度の大戦の火種となったルール・ザールの石炭・鉄鋼を共同管理すれば独仏の戦争は不可能になる、という発想から1952年に6か国で発足した。加盟国の上に立つ最高機関を置いた超国家的な性格が、のちのEEC（1958年）、EC（1967年）の原型となった。イギリスは主権の制約を嫌って参加せず、1960年にEFTAを組織した。マーシャル＝プランの受け入れ機関OEECや、ローマ条約によるEECと区別する。","w":"1950年のフランス外相シューマンの提案に基づき、独仏対立の原因となってきた石炭・鉄鋼を超国家的な機関のもとで共同管理した。"},{"id":"j008","t":"mc","q":"ロシア革命後のソヴィエト政権で、1921年に戦時共産主義から新経済政策（ネップ）へ転換した際の内容として正しいものはどれか。","o":["穀物の強制徴発をやめて現物税を導入し、農民が余剰穀物を販売することや中小企業の私的経営を認めた。","農業の集団化を進めてコルホーズ・ソフホーズを組織し、重工業化を優先する計画経済を始めた。","企業の国有化と穀物の強制徴発を進め、内戦と対ソ干渉戦争に必要な物資を確保した。","農奴解放令を出して農民に人格的自由を与え、土地はミール（農村共同体）を通じて有償で分与した。"],"a":0,"c":"【近現代・ロシア】ロシア革命とソヴィエト政権","y":1921,"ex":"十月革命後、ボリシェヴィキ政権は内戦と対ソ干渉戦争のなかで戦時共産主義をとったが、穀物の強制徴発は農民の反発と生産の激減を招き、1921年にはクロンシュタットの反乱が起きた。レーニンは新経済政策に転じて市場と私営を一部認め、経済は回復した。スターリンは1928年から五か年計画で重工業化と農業集団化を強行し、ネップを終わらせた。1861年の農奴解放令と時期を混同しないこと。","w":"穀物の強制徴発をやめて現物税を導入し、農民が余剰穀物を販売することや中小企業の私的経営を認めた。"},{"id":"j009","t":"mc","q":"1933年にヒトラーが首相に就任したのち、ナチ党が一党独裁を確立する法的な根拠となった、政府に立法権を委ねる法律はどれか。","o":["ニュルンベルク法","全権委任法","社会主義者鎮圧法","国家総動員法"],"a":1,"c":"【近現代・ドイツ】ヴァイマル共和国とナチス","y":1933,"ex":"世界恐慌で米資本が引き揚げられると失業者が急増し、大統領緊急令に頼る政治が続くなか、ナチ党はヴェルサイユ体制の打破と反共産主義を掲げて中間層や農民の支持を集め、1932年に第一党となった。1933年に首相となったヒトラーは国会議事堂放火事件を利用して共産党を弾圧し、全権委任法で政府に立法権を与えてヴァイマル憲法を空洞化させた。ユダヤ人の公民権を奪ったニュルンベルク法（1935年）と区別する。","w":"全権委任法"}];

function foldQ(s){
  return String(s==null?'':s)
    .replace(/～/g,'〜')
    .replace(/[−－‐‑–—―]/g,'-')
    .replace(/　/g,' ').replace(/\s+/g,'');

/* 文字化けを考慮した一致判定。a側の「?」は任意の1文字とみなす
   （Shift_JISで保存したCSVでは 〜 や簡体字が「?」に置き換わってしまう） */
function sameOrDamaged(a,b){
  a=foldQ(a);b=foldQ(b);
  if(a===b)return true;
  if(a.length!==b.length)return false;
  for(let i=0;i<a.length;i++){
    const x=a[i];
    if(x!==b[i]&&x!=='?'&&x!=='？')return false;
  }
  return true;
}
function sameField(a,b){
  if(Array.isArray(a)||Array.isArray(b)){
    const A=Array.isArray(a)?a:[],B=Array.isArray(b)?b:[];
    if(A.length!==B.length)return false;
    for(let i=0;i<A.length;i++)if(!sameOrDamaged(A[i],B[i]))return false;
    return true;
  }
  if(typeof a==='string'||typeof b==='string')return sameOrDamaged(a==null?'':a,b==null?'':b);
  return (a==null?'':a)===(b==null?'':b);
}
function progScore(c){return c?(c.reps||0)*1000+(c.st||0):-1}
function migrateData(){
  let dropped=0,moved=0,ovClean=0;
  /* (1) 収録問題と内容が同じ「追加問題」を片付ける */
  for(let i=UC.length-1;i>=0;i--){
    const u=UC[i];
    if(!isUserQ(u.id))continue;
    let b=BASE.find(x=>sameOrDamaged(u.q,x.q));
    if(!b){   /* 前の版の問題の重複（精査で問題文が変わったもの） */
      const fp=cardFP(u);
      const pid=Object.keys(PREV_FP).find(k=>PREV_FP[k]===fp);
      if(pid)b=BASE.find(x=>String(x.id)===pid);
      if(pid&&!b){   /* 精査で削除した問題の重複：統合先がないので進捗ごと片付ける */
        delete S[u.id];UC.splice(i,1);
        const j=QS.findIndex(x=>String(x.id)===String(u.id));if(j>=0)QS.splice(j,1);
        dropped++;continue;
      }
    }
    if(!b)continue;
    if(S[u.id]){
      if(progScore(S[u.id])>progScore(S[b.id])){S[b.id]=S[u.id];moved++}
      delete S[u.id];
    }
    UC.splice(i,1);
    const j=QS.findIndex(x=>String(x.id)===String(u.id));
    if(j>=0)QS.splice(j,1);
    dropped++;
  }
  /* (2) 収録データと同じ内容になった修正を削除する */
  for(const id in OV){
    if(!BASE_ID.has(String(id))){   /* 精査で削除した問題への、前の版そのままの上書き */
      if(PREV_FP[id]&&cardFP(OV[id])===PREV_FP[id]){delete OV[id];ovClean++}
      continue;
    }
    const b=BASE.find(x=>String(x.id)===String(id));
    const ov=OV[id];
    const keys=new Set(Object.keys(ov).concat(['t','q','o','a','pts','lim','c','y','ex']));
    let same=true;
    for(const k of keys){
      if(k==='id'||k==='w')continue;
      if(!(k in ov)&&!(k in b))continue;
      if(!sameField(ov[k],b[k])){same=false;break}
    }
    if(!same&&PREV_FP[id]&&cardFP(ov)===PREV_FP[id])same=true;   /* 前の版そのままの上書き */
    if(same){
      delete OV[id];
      const q=QS.find(x=>String(x.id)===String(id));
      if(q)Object.assign(q,JSON.parse(JSON.stringify(b)));
      ovClean++;

  let reset=0,orphan=0;

    for(const id of RESET_IDS){
      if(OV[id])continue;                 /* 利用者が自分で書き換えた問題は記録を残す */
      if(S[id]){delete S[id];reset++}
    }

    for(const id in S){if(!live.has(String(id))){delete S[id];orphan++}}
    CFG.dataVer=DATA_VER;dirty=true;
  }
  if(dropped||moved||ovClean||reset){
    dirty=true;
    MIG_NOTE='この端末に保存されていた内容を、新しい収録データに合わせて整理しました。'
      +(dropped?'二重登録されていた問題 '+dropped+' 件を収録データに統合'
        +(moved?'（うち '+moved+' 件は学習進捗を収録問題側へ引き継ぎ）':'')+'。':'')
      +(ovClean?'収録済みになった修正 '+ovClean+' 件を削除。':'')
      +(reset?'内容を差し替えた問題 '+reset+' 問は、新しい問題として学習し直せるよう記録をリセット。':'');
  }

}

  if(c.st===0){
    c.D=D0(g);c.S=S0(g);
    if(g<=2){c.st=1;c.step=0;c.due=now+LEARN_STEPS[0]*MIN}
    else if(g===3){ if(LEARN_STEPS.length>1){c.st=1;c.step=1;c.due=now+LEARN_STEPS[1]*MIN} else {c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY} }
    else{c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }else if(c.st===1||c.st===3){
    const steps=c.st===3?RELEARN_STEPS:LEARN_STEPS;
    if(g===1){c.step=0;c.due=now+steps[0]*MIN}
    else if(g===2){c.due=now+steps[Math.min(c.step,steps.length-1)]*MIN}
    else if(g===3){ if(c.step+1<steps.length){c.step++;c.due=now+steps[c.step]*MIN} else {c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY} }
    else{c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }else{
    const t=Math.max(0,(now-c.last)/DAY), R=retr(t,c.S);
    const D=nextD(c.D,g);
    if(g===1){c.S=forgetS(c.D,c.S,R);c.D=D;c.lapses++;c.st=3;c.step=0;c.due=now+RELEARN_STEPS[0]*MIN}
    else{c.S=recallS(c.D,c.S,R,g);c.D=D;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }
  c.last=now;c.reps++;
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0}
  if(isNew)LOG.newDone++;else LOG.revDone++;
  if(correct===true){LOG.correct=(LOG.correct|0)+1}
  if(correct!==null&&correct!==undefined){LOG.total=(LOG.total|0)+1}
  if(LOG.lastStudy!==today()){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    LOG.streakDays=(LOG.lastStudy===y)?(LOG.streakDays||0)+1:1;
    LOG.lastStudy=today();
  }
  scheduleSave();
}
function fmtIvl(ms){
  const m=ms/MIN;
  if(m<60)return '<'+Math.max(1,Math.round(m))+'分';
  if(ms<DAY)return Math.round(ms/3600000)+'時間';
  const d=ms/DAY;
  if(d<30)return Math.round(d)+'日';
  if(d<365)return (d/30.4).toFixed(1).replace(/\.0$/,'')+'ヶ月';
  return (d/365).toFixed(1).replace(/\.0$/,'')+'年';
}

/* ============ キュー ============ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){
  const now=Date.now();
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0}
  const due=[],learn=[],fresh=[];
  for(const q of QS){
    const st=S[q.id];
    if(!st||st.st===0){fresh.push(q);continue}
    if(st.due<=now){(st.st===2?due:learn).push(q)}
  }
  due.sort((a,b)=>S[a.id].due-S[b.id].due);
  learn.sort((a,b)=>S[a.id].due-S[b.id].due);
  const lim=Math.max(0,CFG.newPerDay-LOG.newDone);
  let nw=CFG.order==='rand'?shuffle(fresh.slice()):fresh;
  nw=nw.slice(0,lim);
  let q = CFG.bias==='new' ? [...nw,...learn,...due]
        : CFG.bias==='mix' ? [...learn,...shuffle([...due,...nw])]
        : [...learn,...due,...nw];
  const cap=CFG.sessionMax|0;
  if(cap>0&&q.length>cap)q=q.slice(0,cap);
  return {queue:q,dueN:due.length+learn.length,newN:nw.length,freshTotal:fresh.length};
}
function futureDue(){const now=Date.now();let n=0;for(const id in S){const c=S[id];if(c.st>0&&c.due>now&&c.due<=now+DAY)n++}return n}

let listQuery='',listSort='regOld',listType='all';

function sortItems(items){
  const pos=new Map(QS.map((x,i)=>[x.id,i]));
  const yv=x=>{const n=Number(x.y);return isFinite(n)?n:null};
  const a=items.slice();
  if(listSort==='regNew')a.sort((x,y)=>pos.get(y.id)-pos.get(x.id));
  else if(listSort==='regOld')a.sort((x,y)=>pos.get(x.id)-pos.get(y.id));
  else{
    const dir=listSort==='histNew'?-1:1;
    a.sort((x,y)=>{
      const vx=yv(x),vy=yv(y);
      if(vx===null&&vy===null)return pos.get(x.id)-pos.get(y.id);
      if(vx===null)return 1;   /* 年代未設定は常に末尾 */
      if(vy===null)return -1;
      if(vx!==vy)return (vx-vy)*dir;
      return pos.get(x.id)-pos.get(y.id);
    });
  }
  return a;
}

function extractJSON(text){
  let t=String(text).replace(/```json/gi,'').replace(/```/g,'');
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s<0||e<s)return null;
  const cand=t.slice(s,e+1);
  const d=tryParse(cand); if(d)return d;
  const f=normalizeQuotes(cand);
  return tryParse(f)||tryParse(firstObject(f)||'')||null;
}
function tryParse(s){try{return JSON.parse(s)}catch(e){return null}}
function normalizeQuotes(s){
  const DQ=/[“”„‟″〃＂]/;
  let out='',inStr=false,es=false;
  for(let i=0;i<s.length;i++){
    let ch=s[i];
    if(inStr){
      if(es){out+=ch;es=false;continue}
      if(ch==='\\'){out+=ch;es=true;continue}
      if(ch==='"'||DQ.test(ch)){
        let j=i+1;while(j<s.length&&/\s/.test(s[j]))j++;
        const nx=s[j];
        if(nx===undefined||nx===','||nx==='}'||nx===']'||nx===':'){out+='"';inStr=false;continue}
        out+=(ch==='"')?'\\"':ch;continue;
      }
      out+=ch;continue;
    }
    if(ch==='"'||DQ.test(ch)){out+='"';inStr=true;continue}
    out+=ch;
  }
  return out;
}
function firstObject(t){
  const s=t.indexOf('{');if(s<0)return null;
  let d=0,inStr=false,es=false;
  for(let i=s;i<t.length;i++){
    const ch=t[i];
    if(inStr){if(es)es=false;else if(ch==='\\')es=true;else if(ch==='"')inStr=false}
    else{if(ch==='"')inStr=true;else if(ch==='{')d++;else if(ch==='}'){d--;if(!d)return t.slice(s,i+1)}}
  }
  return null;
}
/* Claudeの返答を共通形式へ */
function normalizeReply(j,fallbackType){
  const type=(j.t==='essay'||j.t==='論述'||(Array.isArray(j.pts)&&j.pts.length&&!Array.isArray(j.o)))?'essay':
             (j.t==='mc'||Array.isArray(j.o))?'mc':fallbackType;
  const yv=(j.y===undefined||j.y===null||j.y==='')?'':(isFinite(Number(j.y))?String(parseInt(j.y,10)):'');
  const o=Array.isArray(j.o)?j.o.slice(0,4).map(x=>String(x)):null;
  return {t:type,
    q:j.q?String(j.q):'',
    o:(o&&o.length===4&&o.every(x=>x.trim()))?o:null,
    a:Math.max(0,Math.min(3,parseInt(j.a)||0)),
    pts:Array.isArray(j.pts)?ptsList(j.pts):(j.pts?ptsList(j.pts):null),
    lim:isFinite(Number(j.lim))&&Number(j.lim)>0?String(parseInt(j.lim,10)):'',
    c:j.c?String(j.c):'', y:yv, ex:j.ex?String(j.ex):''};
}

/* ---- 現在の内容とClaudeの提案の比較 ---- */
function optsHTML(o,a){
  if(!o||!o.length||o.every(x=>!x))return '<span class="dempty">（未入力）</span>';
  return o.map((x,i)=>`${i+1}. ${esc(x||'')}${i===a?' <span class="dmark">✓ 正解</span>':''}`).join('<br>');
}
function ptsHTML(p){
  const a=ptsList(p);
  if(!a.length)return '<span class="dempty">（未入力）</span>';
  return a.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>');
}
function sameOpts(c,n){
  if(!c.o||!n.o)return false;
  if(c.a!==n.a)return false;
  for(let i=0;i<4;i++){if((c.o[i]||'')!==(n.o[i]||''))return false}
  return true;
}
/* cur/neu = {t,q,o,a,pts,lim,c,y,ex}。項目ごとに「現在のまま／置き換え／追記」を選び、
   自由に手直ししたうえで onCommit(結果) に渡す。 */
function renderDiffPanel(host,cur,neu,commitLabel,onCommit,onCancel){
  const type=neu.t||cur.t||'mc';
  const essay=type==='essay';
  const hasOptsNew=!!(neu.o&&neu.o.length===4&&neu.o.every(x=>x&&String(x).trim()));
  const hasPtsNew=ptsList(neu.pts).length>0;
  const fields=[{k:'q',label:'問題文',append:false}]
    .concat(essay?[{k:'pts',label:'要点（1行に1項目）',append:true},{k:'lim',label:'字数',append:false}]
                 :[{k:'opts',label:'選択肢と正解',append:false}])
    .concat([{k:'c',label:'章・分野',append:false},{k:'y',label:'年代（西暦）',append:false},{k:'ex',label:'解説',append:true}]);
  let html='<div class="fpanel"><div class="hd"><b>現在の内容と比べて反映する</b><br>項目ごとに、どう扱うかを選んでください。反映される内容はそのまま手直しできます。</div>';
  if(cur.t&&neu.t&&cur.t!==neu.t){
    html+=`<div class="warnbox">⚠️ 形式が異なります（現在：${cur.t==='essay'?'論述':'4択'} → 提案：${essay?'論述':'4択'}）。反映すると形式が変わります。</div>`;
  }
  for(const f of fields){
    let curV,newV,same,hasNew;
    if(f.k==='opts'){
      curV=optsHTML(cur.o,cur.a); newV=optsHTML(neu.o,neu.a);
      hasNew=hasOptsNew; same=hasNew&&sameOpts(cur,neu);
    }else if(f.k==='pts'){
      curV=ptsHTML(cur.pts); newV=ptsHTML(neu.pts);
      hasNew=hasPtsNew; same=hasNew&&ptsList(cur.pts).join('\n')===ptsList(neu.pts).join('\n');
    }else{
      const cv=String(cur[f.k]||'').trim(), nv=String(neu[f.k]||'').trim();
      curV=cv?esc(cv):'<span class="dempty">（未入力）</span>';
      newV=esc(nv); hasNew=!!nv; same=hasNew&&cv===nv;
    }
    html+='<div class="dfield">';
    html+='<div class="dlab">'+f.label
      +(same?'<span>（変更なし）</span>':'')
      +(!hasNew?'<span>（Claudeの提案なし）</span>':'')+'</div>';
    html+='<div><div class="dsub">現在</div><div class="dcur">'+curV+'</div></div>';
    if(hasNew&&!same){
      html+='<div><div class="dsub new">Claudeの提案</div><div class="dnew">'+newV+'</div></div>';
      html+='<div class="dbtns">'
        +'<button class="dbtn" data-k="'+f.k+'" data-a="keep">現在のまま</button>'
        +'<button class="dbtn on" data-k="'+f.k+'" data-a="replace">置き換え</button>'
        +(f.append?'<button class="dbtn" data-k="'+f.k+'" data-a="append">追記</button>':'')
        +'</div>';
    }
    html+='<div class="dres"><div class="dsub">反映される内容（編集できます）</div>';
    if(f.k==='opts')html+='<div id="dOptWrap"></div>';
    else if(f.k==='pts')html+='<textarea id="d-pts" style="min-height:130px"></textarea>';
    else html+='<textarea id="d-'+f.k+'" style="min-height:'+(f.k==='q'?'64px':f.k==='ex'?'80px':'42px')+'"></textarea>';
    html+='</div></div>';
  }
  html+='<button class="fbtn" id="dCommit">'+esc(commitLabel)+'</button>';
  html+='<button class="fbtn2" id="dCancel">比較をやめる</button>';
  html+='</div>';
  host.innerHTML=html;

  if(!essay){
    const setOpts=(o,a)=>{document.getElementById('dOptWrap').innerHTML=optRows(o,a,'dAns','d-o')};
    const useNew=hasOptsNew&&!sameOpts(cur,neu);
    setOpts(useNew?neu.o.map(x=>String(x)):(cur.o||['','','','']), useNew?neu.a:(cur.a|0));
    host._setOpts=setOpts;
  }
  for(const f of fields){
    if(f.k==='opts')continue;
    if(f.k==='pts'){
      const cv=ptsList(cur.pts).join('\n'), nv=ptsList(neu.pts).join('\n');
      document.getElementById('d-pts').value=(nv&&nv!==cv)?nv:cv;
      continue;
    }
    const cv=String(cur[f.k]||'').trim(), nv=String(neu[f.k]||'').trim();
    document.getElementById('d-'+f.k).value=(nv&&nv!==cv)?nv:cv;
  }
  host.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,a=b.dataset.a;
    host.querySelectorAll('.dbtn[data-k="'+k+'"]').forEach(x=>x.classList.toggle('on',x===b));
    if(k==='opts'){
      if(a==='keep')host._setOpts(cur.o||['','','',''],cur.a|0);
      else host._setOpts(neu.o.map(x=>String(x)),neu.a);
      return;
    }
    const ta=document.getElementById('d-'+k);
    let cv,nv;
    if(k==='pts'){cv=ptsList(cur.pts).join('\n');nv=ptsList(neu.pts).join('\n')}
    else{cv=String(cur[k]||'').trim();nv=String(neu[k]||'').trim()}
    if(a==='keep')ta.value=cv;
    else if(a==='replace')ta.value=nv;
    else ta.value=cv?(cv+(k==='pts'?'\n':' ／ ')+nv):nv;
  });
  document.getElementById('dCancel').onclick=()=>{host.innerHTML='';if(onCancel)onCancel()};
  document.getElementById('dCommit').onclick=()=>{
    const r={t:type,
      q:document.getElementById('d-q').value.trim(),
      c:document.getElementById('d-c').value.trim(),
      y:document.getElementById('d-y').value.trim(),
      ex:document.getElementById('d-ex').value.trim()};
    if(essay){
      r.pts=ptsList(document.getElementById('d-pts').value);
      r.lim=document.getElementById('d-lim').value.trim();
    }else{
      r.o=[0,1,2,3].map(i=>document.getElementById('d-o'+i).value.trim());
      const sel=host.querySelector('input[name=dAns]:checked');
      r.a=sel?+sel.value:0;
    }
    onCommit(r);
  };
  host.scrollIntoView({behavior:'smooth',block:'nearest'});
}

let addType='mc';
function optRows(vals,ans,name,idPrefix){
  const nm=name||'ansSel', px=idPrefix||'f-o';
  return [0,1,2,3].map(i=>`<div class="optrow">
    <input type="radio" name="${nm}" value="${i}" ${ans===i?'checked':''}>
    <input type="text" id="${px}${i}" placeholder="選択肢${i+1}" value="${esc(vals&&vals[i]||'')}">
  </div>`).join('');
}
function formFields(type,v){
  v=v||{};
  const mid = type==='essay'
    ? `<div class="frow"><label>要点（必須・1行に1項目）</label><textarea id="f-pts" style="min-height:140px" placeholder="合格答案に必要な論点を1行ずつ">${esc(ptsList(v.pts).join('\n'))}</textarea></div>
       <div class="frow"><label>字数の目安</label><input type="text" id="f-lim" inputmode="numeric" placeholder="400" value="${esc(v.lim||'')}"></div>`
    : `<div class="frow"><label>選択肢（必須・正解を選択）</label><div id="optWrap">${optRows(v.o,v.a|0)}</div></div>`;
  return `<div class="frow"><label>問題文（必須）</label><textarea id="f-q" style="min-height:76px">${esc(v.q||'')}</textarea></div>
  ${mid}
  <div class="frow"><label>章・分野</label><input type="text" id="f-c" placeholder="例：【近代ヨーロッパ】絶対王政" value="${esc(v.c||'')}"></div>
  <div class="frow"><label>年代（西暦の数字。並び替えに使います）</label><input type="text" id="f-y" inputmode="numeric" placeholder="例：1648（紀元前は -221）" value="${esc(v.y===undefined?'':String(v.y))}"></div>
  <div class="frow"><label>解説（150文字程度・背景と因果を書く）</label><textarea id="f-ex" style="min-height:96px">${esc(v.ex||'')}</textarea></div>`;
}

/* 手順①の入力が「問題文」として成立していそうなら、それを現在の内容として扱う */
function questionLikeInput(){

function readForm(){

function validate(v){
  if(!v.q)return '問題文は必須です';
  if(v.t==='essay'){
    if(ptsList(v.pts).length<2)return '要点を2つ以上、1行に1項目で入力してください';
  }else{
    if((v.o||[]).some(x=>!x))return '4つの選択肢はすべて必須です';
    if(new Set(v.o).size<4)return '選択肢が重複しています';
  }
  if(!v.ex)return '解説は必須です（150文字程度で背景と因果を書いてください）';
  if(v.y&&!/^-?\d{1,4}$/.test(v.y))return '年代は西暦の数字で入力してください（紀元前は -221 のように）';
  return '';
}
/* Shift_JISで保存されたCSVでは 〜 や簡体字が「?」に置き換わる。
   取り込む値がその「?」欠落版にすぎない場合は、元の文字を守る。 */
function unDamage(neu,cur){
  let n=0;
  const one=(a,b)=>(typeof a==='string'&&typeof b==='string'&&a!==b&&sameOrDamaged(a,b))?(n++,b):a;
  if(cur){
    neu.q=one(neu.q,cur.q);
    neu.c=one(neu.c,cur.c);
    neu.ex=one(neu.ex,cur.ex);
    if(Array.isArray(neu.o)&&Array.isArray(cur.o)&&neu.o.length===cur.o.length)
      neu.o=neu.o.map((x,i)=>one(x,cur.o[i]));
    if(Array.isArray(neu.pts)&&Array.isArray(cur.pts)&&neu.pts.length===cur.pts.length)
      neu.pts=neu.pts.map((x,i)=>one(x,cur.pts[i]));
    if(typeof neu.w==='string'&&typeof cur.w==='string')neu.w=one(neu.w,cur.w);
  }
  return n;
}
function toCard(v,id){
  const card={id:id,t:v.t,q:v.q,c:v.c,ex:v.ex};
  if(v.y!=='')card.y=parseInt(v.y,10);
  if(v.t==='essay'){card.pts=ptsList(v.pts);card.lim=v.lim?parseInt(v.lim,10):400;card.w=v.q.slice(0,24)}
  else{card.o=v.o;card.a=v.a|0;card.w=v.o[v.a|0]}
  return card;
}

const ST_CODE={'未着手':0,'学習中':1,'復習':2,'再学習':3};
function csvCell(v){const s=(v==null?'':String(v));return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function stampNow(){const d=new Date(),z=n=>String(n).padStart(2,'0');

function downloadBlob(blob,fn){

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],cell='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else inQ=false }
      else cell+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(cell);cell=''}
      else if(ch==='\r'){}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else cell+=ch;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
/* CSVの文字コードを判定してテキストに変換する。
   Excel（日本語Windows）が既定で保存するShift_JIS(CP932)にも対応する。
   BOMがあればそれに従い、無い場合はUTF-8とShift_JISの両方で解釈して
   ヘッダー語（問題文）を含む方を採用する。 */
function decodeCSV(buf){
  const b=new Uint8Array(buf);
  const dec=(enc,slice)=>{try{return new TextDecoder(enc).decode(slice||b)}catch(e){return null}};
  if(b.length>=3&&b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){
    const t=dec('utf-8',b.subarray(3)); if(t!=null)return{text:t,enc:'UTF-8 (BOM付き)'};
  }
  if(b.length>=2&&b[0]===0xFF&&b[1]===0xFE){const t=dec('utf-16le');if(t!=null)return{text:t,enc:'UTF-16LE'}}
  if(b.length>=2&&b[0]===0xFE&&b[1]===0xFF){const t=dec('utf-16be');if(t!=null)return{text:t,enc:'UTF-16BE'}}
  const cands=[];
  try{cands.push({enc:'UTF-8',text:new TextDecoder('utf-8',{fatal:true}).decode(b)})}catch(e){}
  const sj=dec('shift_jis'); if(sj!=null)cands.push({enc:'Shift_JIS',text:sj});
  const u8=dec('utf-8'); if(u8!=null)cands.push({enc:'UTF-8',text:u8});
  const good=cands.find(c=>c.text.indexOf('問題文')>=0);
  return good||cands[0]||{text:'',enc:'判定できません'};
}
/* 問題文などの照合用に、字形が似ていて環境により入れ替わる文字を揃える。
   Shift_JISを往復すると 〜(U+301C) が ～(U+FF5E) に変わるため、
   これを吸収しないと同じ問題が新規として二重登録されてしまう。 */
function foldText(s){
  return String(s==null?'':s)
    .replace(/～/g,'〜')
    .replace(/[−－‐‑–—―]/g,'-')
    .replace(/　/g,' ')
    .replace(/\s+/g,'');
}
/* 列名のゆらぎ（前後の空白・引用符・全角空白・中黒の字種）を吸収する */
function normHead(s){
  return String(s==null?'':s).replace(/^﻿/,'')
    .replace(/[\s　"']/g,'').replace(/[･·∙‧]/g,'・');
}
/* ヘッダー行は1行目に限らず、先頭10行から「問題文」を含む行を探す */
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){
    if(rows[i].some(c=>normHead(c)==='問題文'))return i;
  }
  return -1;
}
let lastImport=null;   /* 直前の取り込み結果（設定画面に表示して残す） */
function importCSV(){
  const inp=$('#csvFile');
  const f=inp&&inp.files&&inp.files[0];
  if(!f){
    lastImport={ng:true,msg:'ファイルが選ばれていません。「ファイルを選択」からCSVを指定してください。'};
    toast('CSVファイルを選んでください');renderSet();return;
  }
  const withProg=$('#csvProg').checked;
  const rd=new FileReader();
  rd.onerror=()=>{lastImport={ng:true,msg:'ファイルを読み込めませんでした（'+esc(f.name)+'）。'};toast('ファイルを読み込めませんでした');renderSet()};
  rd.onload=()=>{
    try{
      const {text,enc}=decodeCSV(rd.result);
      if(!text){
        lastImport={ng:true,msg:'ファイルの文字コードを判定できませんでした。CSVを「UTF-8」で保存し直してお試しください。',enc:enc,file:f.name};
        toast('文字コードを判定できませんでした');renderSet();return;
      }
      const rows=parseCSV(text);
      if(!rows.length){
        lastImport={ng:true,msg:'中身が空のファイルです。',enc:enc,file:f.name};
        toast('データがありません');renderSet();return;
      }
      const hr=findHeaderRow(rows);
      if(hr<0){
        const peek=(rows[0]||[]).slice(0,6).map(c=>String(c).slice(0,12)).join(' , ');
        lastImport={ng:true,file:f.name,enc:enc,
          msg:'「問題文」の列が見つかりませんでした。'+(/[�]/.test(text)?'文字が化けています。':'')
             +'この教材が書き出したCSVをそのまま取り込むか、1行目を列名の行にしてください。',
          peek:'読み取れた1行目: '+peek};
        toast('「問題文」の列が見つかりません');renderSet();return;
      }
      const head=rows[hr].map(normHead);
      const ix=n=>head.indexOf(normHead(n));
      const iQ=ix('問題文');
      const iId=ix('問題ID');
      const iT=ix('形式'),iO=[ix('選択肢1'),ix('選択肢2'),ix('選択肢3'),ix('選択肢4')],iA=ix('正解番号'),
            iP=ix('要点'),iLim=ix('字数'),iY=ix('年代'),iC=ix('章・分野'),iE=ix('解説'),
            iSt=ix('状態'),iDue=ix('復習予定日'),iS=ix('安定度'),iD=ix('難易度'),
            iR=ix('復習回数'),iL=ix('間違えた回数'),iOk=ix('正答数'),iNg=ix('誤答数');
      const cell=(row,i)=>(i>=0&&row[i]!==undefined?String(row[i]).trim():'');
      const key=c=>JSON.stringify([c.t,foldText(c.q),(c.o||[]).map(foldText),
                                   c.a===undefined?null:c.a,
                                   ptsList(c.pts).map(foldText),c.lim===undefined?'':String(c.lim),
                                   foldText(c.c),c.y===undefined?'':String(c.y),foldText(c.ex)]);
      let added=0,updated=0,nochange=0,prog=0,skipped=0,qEdited=0,damaged=0;
      const notes=[];
      const usedId=new Set();   /* 同じIDが複数行にある場合、2行目以降は新規として扱う */
      for(let r=hr+1;r<rows.length;r++){
        const row=rows[r];
        const qt=cell(row,iQ);
        if(!qt){skipped++;if(notes.length<5)notes.push((r+1)+'行目: 問題文が空です');continue}
        const o=iO.every(k=>k>=0)?iO.map(k=>cell(row,k)):['','','',''];
        const pts=ptsList(cell(row,iP));
        const tRaw=cell(row,iT);
        const type=tRaw?(tRaw.indexOf('論述')>=0?'essay':'mc')
                       :(o.every(x=>x)?'mc':(pts.length?'essay':''));
        let v;
        if(type==='essay'){
          if(!pts.length){skipped++;if(notes.length<5)notes.push((r+1)+'行目: 論述なのに「要点」が空です');continue}
          v={t:'essay',q:qt,pts:pts,lim:cell(row,iLim)||'400',
             c:cell(row,iC),y:cell(row,iY),ex:cell(row,iE)};
        }else if(type==='mc'){
          const a=parseInt(cell(row,iA))-1;
          if(o.some(x=>!x)){skipped++;if(notes.length<5)notes.push((r+1)+'行目: 選択肢1〜4に空があります');continue}
          if(!(a>=0&&a<=3)){skipped++;if(notes.length<5)notes.push((r+1)+'行目: 正解番号が1〜4ではありません');continue}
          v={t:'mc',q:qt,o:o,a:a,c:cell(row,iC),y:cell(row,iY),ex:cell(row,iE)};
        }else{skipped++;if(notes.length<5)notes.push((r+1)+'行目: 形式を判別できません（選択肢も要点も空）');continue}
        if(v.y&&!/^-?\d{1,4}$/.test(v.y))v.y='';
        /* 照合は「問題ID」を最優先にする。IDで結びつけることで、
           問題文そのものを書き換えた行も同じ問題の更新として反映できる。
           ID列が無い古いCSVのために、問題文での照合も残す。 */
        const rid=cell(row,iId);
        let card=null, byId=false;
        if(rid&&!usedId.has(rid)){
          card=QS.find(x=>String(x.id)===rid);
          if(card){byId=true;usedId.add(rid)}
        }
        if(!card)card=QS.find(x=>x.q===qt);
        if(!card){const fq=foldText(qt);card=QS.find(x=>foldText(x.q)===fq)}
        if(card){
          const nc=toCard(v,card.id);
          /* 字形の差だけ（Shift_JIS往復で 〜→～ など）なら元の問題文を保つ。
             中身が本当に書き換えられている場合は新しい問題文を採用する。 */
          if(card.q!==qt){
            if(foldText(card.q)===foldText(qt))nc.q=card.q;
            else if(sameOrDamaged(qt,card.q))nc.q=card.q;
            else qEdited++;
          }
          /* 「?」に化けた箇所を元の文字で守る（Shift_JIS保存による欠落の巻き戻し） */
          const fixed=unDamage(nc,card);
          if(fixed)damaged+=fixed;
          if(key(card)===key(nc)){
            nochange++;               /* 内容が同じなら書き換えない（進捗の取り込みは続ける） */
          }else{
            for(const k of ['o','a','pts','lim','y'])if(!(k in nc))delete card[k];
            Object.assign(card,nc);
            if(isUserQ(card.id)){const u=UC.find(x=>x.id===card.id);if(u)Object.assign(u,nc)}
            else OV[card.id]=nc;
            updated++;
          }
        }else{
          card=toCard(v,'u'+Date.now()+'_'+r);
          UC.push(card);QS.push(card);added++;
        }
        if(withProg&&iSt>=0){
          const code=ST_CODE[cell(row,iSt)];
          if(code!==undefined&&code!==0){
            const dueRaw=cell(row,iDue);
            const dueMs=dueRaw?Date.parse(dueRaw):NaN;
            const sv=parseFloat(cell(row,iS)), dv=parseFloat(cell(row,iD));
            S[card.id]={st:code,step:0,
              S:isFinite(sv)&&sv>0?sv:1,
              D:isFinite(dv)&&dv>0?clamp(dv,1,10):5,
              due:isFinite(dueMs)?dueMs:Date.now(),last:Date.now(),
              reps:parseInt(cell(row,iR))||0,
              lapses:parseInt(cell(row,iL))||0,
              ok:parseInt(cell(row,iOk))||0,
              ng:parseInt(cell(row,iNg))||0};
            prog++;
          }
        }
      }
      const changed=added+updated+prog;
      if(changed){dirty=true;saveState()}
      updTotal();
      lastImport={file:f.name,enc:enc,rows:rows.length-hr-1,
        added:added,updated:updated,nochange:nochange,prog:prog,skipped:skipped,
        notes:notes,withProg:withProg,changed:changed,qEdited:qEdited,damaged:damaged,hasId:iId>=0};
      let msg=changed?('追加 '+added+' 問、更新 '+updated+' 問'):'変更はありませんでした';
      if(withProg&&prog)msg+='、進捗 '+prog+' 件';
      if(skipped)msg+='（不備 '+skipped+' 行は除外）';
      toast(msg);renderSet();
    }catch(e){
      lastImport={ng:true,file:f.name,msg:'取り込み中にエラーが起きました：'+((e&&e.message)||e)};
      toast('取り込みに失敗しました');renderSet();
    }
  };
  rd.readAsArrayBuffer(f);
}
/* 取り込み結果を設定画面に残して表示する（トーストは消えてしまうため） */
function importResultHTML(){
  const L=lastImport; if(!L)return '';
  if(L.ng){
    return '<div class="warnbox" style="margin-bottom:10px"><b>取り込めませんでした</b><br>'
      +esc(L.msg)+(L.file?'<br><span style="opacity:.8">ファイル: '+esc(L.file)+(L.enc?'／文字コード判定: '+esc(L.enc):'')+'</span>':'')
      +(L.peek?'<br><span style="opacity:.8">'+esc(L.peek)+'</span>':'')+'</div>';
  }
  const rows=[['データ行',L.rows+' 行'],['文字コード',L.enc],
    ['照合方法',L.hasId?'問題ID（確実）':'問題文（ID列なし）'],
    ['追加',L.added+' 問'],['更新',L.updated+' 問'],['内容が同じで変更なし',L.nochange+' 問']];
  if(L.qEdited)rows.push(['うち問題文を書き換えた行',L.qEdited+' 問']);
  if(L.damaged)rows.push(['文字化け（?）を元の文字で復元',L.damaged+' 箇所']);
  if(L.withProg)rows.push(['学習進捗の取り込み',L.prog+' 件']);
  if(L.skipped)rows.push(['除外（不備）',L.skipped+' 行']);
  const cls=L.changed?'goodbox':'warnbox';
  return '<div class="'+cls+'" style="margin-bottom:10px"><b>'
    +(L.changed?'取り込みました':'取り込みは成功しましたが、内容の変更はありませんでした')+'</b>'
    +'<br><span style="opacity:.85">ファイル: '+esc(L.file)+'</span>'
    +'<table class="imptbl">'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(String(r[1]))+'</td></tr>').join('')+'</table>'
    +(L.notes&&L.notes.length?'<div style="margin-top:6px;opacity:.9">除外した行の例<br>'+L.notes.map(esc).join('<br>')+'</div>':'')
    +(!L.hasId&&L.added?'<div style="margin-top:6px;opacity:.9">このCSVには「問題ID」列がありません。問題文を書き換えた行は既存の問題と結びつけられず、新しい問題として追加されます。書き出し直したCSVを編集してお使いください。</div>':'')
    +(!L.changed&&!L.skipped?'<div style="margin-top:6px;opacity:.9">この教材が書き出したCSVをそのまま取り込むと、全行が既存の問題と一致するため変更は起きません。内容を書き換えた行、または新しく足した行だけが反映されます。</div>':'')
    +(L.damaged?'<div style="margin-top:6px;opacity:.9">「?」に化けていた箇所は元の文字に戻しました。ExcelでCSVを保存するときは「CSV UTF-8（コンマ区切り）」を選んでください。Shift_JISで保存すると 〜 や簡体字が「?」に置き換わってしまいます。</div>':'')
    +(L.changed?'<button class="fbtn2" id="impGoList" style="margin-top:9px">一覧で確認する</button>':'')
    +'</div>';
}

  main.innerHTML=`

  <div class="row"><label>1回の出題上限（0=無制限）</label><input type="number" id="sm" min="0" max="300" value="${CFG.sessionMax}"></div>
  <div class="sect">出題設定</div>
  <div class="row"><label>目標記憶率</label><select id="rt">

    <option value="mix" ${CFG.bias==='mix'?'selected':''}>ランダム</option>
  </select></div>
  <div class="row"><label>新規の並び</label><select id="od">
    <option value="seq" ${CFG.order==='seq'?'selected':''}>収録順</option>

  </select></div>

  <div class="sect">書き出し・読み込み</div>
  <div class="fpanel">
    <div class="hd"><b>CSVで書き出す</b><br>全 ${QS.length} 問（4択 ${nMc}・論述 ${nEs}）を学習進捗つきで保存します。バックアップや他の端末への移行に使えます。</div>
    <button class="fbtn" id="csvOut">CSVファイルをダウンロード</button>
  </div>
  <div class="fpanel">
    <div class="hd"><b>CSVを読み込む</b><br>同じ形式のCSVを取り込みます。「問題ID」列で既存の問題と結びつけるため、問題文を書き換えた行もその問題の更新として反映されます。IDが無い行は新しい問題として追加します。</div>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <label style="font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:7px">
      <input type="checkbox" id="csvProg" checked> 学習進捗も一緒に取り込む
    </label>
    <button class="fbtn2" id="csvIn">選んだCSVを取り込む</button>
    <div id="impResult">${importResultHTML()}</div>
    <div class="hd" style="opacity:.85">ExcelでCSVを保存するときは「CSV UTF-8（コンマ区切り）」を選んでください。日本語版Excelの「CSV（コンマ区切り）」はShift_JISで保存されますが、その場合も自動判定して読み込みます。</div>
  </div>

  ${MIG_NOTE?`<div class="sect">収録データの更新</div><div class="ex" style="margin-top:0">${esc(MIG_NOTE)}<br>学習進捗は保持されています。</div>`:''}
  <div class="sect">データ</div>
  <div class="substat"><span>保存先 <b>${storageKind==='claude'?'アプリ内':storageKind==='local'?'この端末':'なし'}</b></span><span>収録 <b>${QS.length}</b> 問（追加分 ${UC.length}）</span></div>
  <button class="ghost" id="exp">学習記録をコピー用に書き出す（JSON）</button>
  <button class="danger" id="rst">学習記録をすべて消去する</button>

  <div class="sect">この教材について</div>
  <div class="ex" style="margin-top:0">
  収録：4択134問・論述58問の計192問。2026年9月に全問を再検証しました。一橋大学の2010〜2026年の全過去問の出題テーマと突き合わせ、年号・因果関係・選択肢の妥当性を確かめたうえで、答えが問題文から分かってしまう問いや正解が一つに決まらない問いを作り直し、解説はすべて「背景→因果→意義」と「混同しやすい事項との違い」を含む形にそろえています。欠けていた頻出テーマ（明清交代と東アジアの国際秩序、中華人民共和国の路線対立、14世紀の危機と東西ヨーロッパの分岐、中世の遠隔地商業と都市、唐滅亡後の東アジア、市民的公共圏と結社、ユグノーと宗教寛容、ヨーロッパ統合）を論述と4択で補い、共通テストで欠かせないロシア革命とナチス政権の成立を加えました。<br><br>
  「追加」タブでは4択・論述のどちらも作成できます。問題文でも語句だけでも入力でき、Claudeが問題と150字程度の解説（背景・因果・混同しやすい事項の違い）を作ります。返答を反映するときは、現在の内容と項目ごとに見比べて「現在のまま／置き換え／追記」を選べます。<br><br>
  復習間隔はFSRS-5アルゴリズムで自動計算されます。答えを見た後の自己評価（もう一度／難しい／普通／簡単）が次回の出題時期を決めます。
  </div>`;
  $('#np').onchange=e=>{CFG.newPerDay=clamp(+e.target.value|0,0,100);scheduleSave()};
  $('#sm').onchange=e=>{CFG.sessionMax=clamp(+e.target.value|0,0,300);scheduleSave()};
  $('#rt').onchange=e=>{CFG.retention=+e.target.value;scheduleSave()};
  $('#bs').onchange=e=>{CFG.bias=e.target.value;scheduleSave()};
  $('#od').onchange=e=>{CFG.order=e.target.value;scheduleSave()};

  const gl=document.getElementById('impGoList');
  if(gl)gl.onclick=()=>{listSort='regNew';renderList()};
  $('#exp').onclick=()=>{

    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('クリップボードにコピーしました')).catch(()=>toast('コピーできませんでした'));
    else toast('この環境ではコピーできません');
  };
  $('#rst').onclick=()=>{
    if(!confirm('すべての学習記録を消去します。追加した問題は残ります。よろしいですか？'))return;
    S={};LOG={date:'',newDone:0,revDone:0,streakDays:0,lastStudy:'',correct:0,total:0};
    dirty=true;saveState();toast('学習記録を消去しました');renderSet();
  };
}

/* ---- boot ---- */
$('#nav-home').onclick=renderHome;
$('#nav-list').onclick=renderList;
$('#nav-add').onclick=renderAdd;
$('#nav-stat').onclick=renderStat;
$('#nav-set').onclick=renderSet;
(async()=>{updTotal();await loadState();updTotal();renderHome()})();
window.addEventListener('beforeunload',()=>{if(dirty)saveState()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)saveState()});
</script>
