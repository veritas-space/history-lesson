<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>世界史問題集（4択・論述）</title>
<style>
:root{
  --paper:#F6F4EF;
  --paper-2:#EDEAE2;
  --ink:#1B2A4A;
  --ink-soft:#5C6B87;
  --ink-faint:#C3CAD8;
  --line:#DCD7CB;
  --seal:#9E2B25;
  --seal-soft:#F2E0DE;
  --good:#2C6149;
  --good-soft:#DFEDE6;
  --card:#FFFFFF;
  --radius:14px;
  --shadow:0 1px 2px rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{min-height:100%}
button,input,select,textarea{touch-action:manipulation;font-family:inherit}
body{
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px}
.stamp{width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-weight:700;line-height:1.1;transform:rotate(-4deg);text-align:center;flex:none}
.brand h1{font-size:14px;font-weight:700;letter-spacing:.03em}
.brand small{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:400;letter-spacing:.08em}
nav{display:flex;gap:1px}
nav button{background:none;border:none;font:inherit;font-size:11.5px;color:var(--ink-soft);padding:7px 7px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
main{flex:1;display:flex;flex-direction:column;padding:6px 18px 28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
.hero .date{font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:14px}
.counts{display:flex}
.count{flex:1;text-align:center;position:relative}
.count+.count::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.count b{display:block;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.count.due b{color:var(--seal)}
.count.done b{color:var(--good)}
.count span{font-size:11px;color:var(--ink-soft);letter-spacing:.06em}
.start{width:100%;margin-top:18px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font:inherit;font-size:16px;font-weight:700;padding:15px;cursor:pointer;letter-spacing:.05em}
.start:active{transform:scale(.985)}
.start:disabled{background:var(--ink-faint);color:#fff}
.substat{display:flex;justify-content:space-between;background:var(--paper-2);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;gap:8px;flex-wrap:wrap}
.substat b{color:var(--ink);font-variant-numeric:tabular-nums}
.notice{font-size:11px;color:var(--seal);background:var(--seal-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none;line-height:1.6}
.sect{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin:16px 0 8px}
.progress{height:3px;background:var(--paper-2);border-radius:2px;margin:4px 0 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .25s}
.qtags{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.qtags .tag-new{color:var(--seal);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.body{flex:1;padding:20px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.kind{display:inline-block;font-size:10px;letter-spacing:.1em;color:var(--seal);border:1px solid var(--seal);border-radius:5px;padding:2px 7px;margin-bottom:12px}
.stem{font-size:16px;line-height:1.85;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.6;cursor:pointer;color:var(--ink);display:flex;gap:9px}
.opt .num{color:var(--ink-soft);font-size:12px;flex:none;padding-top:2px}
.opt:active{background:var(--paper-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ng{border-color:var(--seal);background:var(--seal-soft)}
.opt[disabled]{cursor:default}
.ansbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:none}
.ansbox.show{display:block}
.ansline{font-size:15px;line-height:1.8;margin-bottom:8px}
.ansline .lab{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);display:block;margin-bottom:2px}
.ansline b{color:var(--good)}
.ex{font-size:13px;line-height:1.85;color:var(--ink-soft);background:var(--paper-2);border-radius:9px;padding:11px 13px;margin-top:10px}
.chaptag{font-size:11px;color:var(--ink-soft);margin-top:8px}
.reveal{border:none;border-top:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:16px;cursor:pointer;letter-spacing:.08em}
.grades{display:none;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.grades.show{display:grid}
.grades button{border:none;background:var(--card);font:inherit;padding:11px 3px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.grades button+button{border-left:1px solid var(--line)}
.grades b{font-size:12px;font-weight:700}
.grades small{font-size:10px;color:var(--ink-soft)}
.grades .g1 b{color:var(--seal)}
.grades .g4 b{color:var(--good)}
.editlink{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;margin-top:14px;padding:0}
.fin{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 20px;text-align:center}
.fin h2{font-size:19px;margin-bottom:8px}
.fin p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.row label{color:var(--ink-soft);font-size:12px}
.row input[type=number],.row select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);width:110px;text-align:right}
.row select{width:150px;text-align:left}
.tog{display:flex;flex-wrap:wrap;gap:7px}
.tog button{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
.tog button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.li{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:7px;font-size:13px;line-height:1.7;cursor:pointer}
.li .top{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px}
.li .w{color:var(--seal);font-weight:700}
.li .det{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12.5px}
.li.open .det{display:block}
.li .det .eb{margin-top:8px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:11.5px;cursor:pointer}
.ulabel{color:var(--seal);font-weight:700}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:15px;margin-bottom:10px;background:var(--card);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.danger{width:100%;border:1px solid var(--seal);background:none;color:var(--seal);border-radius:11px;padding:12px;font:inherit;font-size:13px;cursor:pointer;margin-top:6px}
.ghost{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:12px;font:inherit;font-size:13px;cursor:pointer;margin-top:6px}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.fpanel .hd{font-size:12.5px;line-height:1.75;color:var(--ink-soft)}
.fpanel .hd b{color:var(--ink)}
.frow label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.04em}
.frow input,.frow textarea,.frow select{
  width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);color:var(--ink);outline:none;
}
.frow textarea{resize:vertical;min-height:64px;font-size:14px;line-height:1.7}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:var(--ink-soft)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--good);flex:none}
.optrow input[type=text]{flex:1}
.fbtn{width:100%;border:none;background:var(--ink);color:var(--paper);font:inherit;font-size:14px;font-weight:700;border-radius:11px;padding:13px;cursor:pointer}
.fbtn2{width:100%;border:1px solid var(--ink);background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:11px;padding:13px;cursor:pointer}
.warnbox{background:var(--seal-soft);color:var(--seal);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.75;white-space:pre-wrap}
.dfield{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;background:var(--card)}
.dlab{font-size:12px;font-weight:700;letter-spacing:.04em}
.dlab span{color:var(--ink-soft);font-weight:400;font-size:11px}
.dsub{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:2px}
.dsub.new{color:var(--good)}
.dcur{font-size:13px;background:var(--paper-2);border-radius:8px;padding:8px 10px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.dnew{font-size:13px;background:var(--good-soft);border:1px solid #CFE3D8;border-radius:8px;padding:8px 10px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.dempty{color:var(--ink-faint)}
.dmark{color:var(--good);font-weight:700}
.dbtns{display:flex;gap:6px;flex-wrap:wrap}
.dbtn{flex:1;min-width:78px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12px;color:var(--ink-soft);border-radius:9px;padding:8px 6px;cursor:pointer}
.dbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.dbtn:active{transform:scale(.97)}
.dres textarea,.dres input[type=text]{width:100%;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);outline:none}
.dres textarea{resize:vertical;line-height:1.7}
.dres .optrow{margin-bottom:6px}
input[type=file]{width:100%;font:inherit;font-size:12px;padding:9px;border:1px dashed var(--line);border-radius:10px;background:var(--paper);color:var(--ink-soft)}
input[type=file]::-webkit-file-upload-button{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 12px;margin-right:10px;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#errbar{display:none;background:var(--seal);color:#fff;font-size:11px;padding:8px 12px;line-height:1.6}
.bar{height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good)}
.kind.essay{color:var(--paper);background:var(--seal);border-color:var(--seal);font-weight:700}
.kind+.kind{margin-left:6px}
.limnote{font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border-radius:8px;padding:8px 11px;margin-bottom:10px;line-height:1.7}
.memo{width:100%;min-height:120px;font:inherit;font-size:13.5px;line-height:1.8;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none;resize:vertical}
.memo:focus{border-color:var(--ink-soft)}
.pts{margin:4px 0 0;padding-left:1.35em;display:flex;flex-direction:column;gap:7px}
.pts li{font-size:13.5px;line-height:1.8}
.pts.sm li{font-size:12.5px;line-height:1.75}
.ex .exlab{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:3px}
.listctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ctlrow{display:flex;align-items:center;gap:8px}
.ctlrow label{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.ctlrow select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.li .bdg{display:inline-block;background:var(--seal);color:var(--paper);font-size:9px;letter-spacing:.06em;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.li .dlabm{font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin:8px 0 2px}
.goodbox{background:var(--good-soft);color:var(--good);border:1px solid #CFE3D8;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.75}
.imptbl{width:100%;margin-top:7px;border-collapse:collapse;font-size:12px}
.imptbl td{padding:3px 0;vertical-align:top}
.imptbl td:first-child{opacity:.85;width:58%}
.imptbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="app">
  <header>
    <div class="brand">
      <div class="stamp">史</div>
      <div><h1>世界史問題集</h1><small>全<span id="totalN">0</span>問 / 4択・論述 / FSRS</small></div>
    </div>
    <nav>
      <button id="nav-home">学習</button>
      <button id="nav-list">一覧</button>
      <button id="nav-add">追加</button>
      <button id="nav-stat">記録</button>
      <button id="nav-set">設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const QS=[{"id":"m001","t":"mc","q":"三十年戦争を終結させ、神聖ローマ帝国内の諸身分に領邦高権や一定の同盟権を認めた1648年の講和条約群は何か。","o":["アウクスブルクの和議","プラハ条約","ウェストファリア条約","ピレネー条約"],"a":2,"c":"【近世・ヨーロッパ】主権国家体制の形成","y":1648,"ex":"ボヘミアの新教徒反乱に始まった三十年戦争は、カトリックの仏が新教側で参戦して国家利害の戦争へ変質した。1648年の条約でカルヴァン派が公認され、スイスとオランダの独立が国際的に認められ、仏はアルザスの一部、スウェーデンは西ポンメルンを得た。諸身分には領邦高権や同盟権が認められたが帝国は存続したので、諸侯が完全な主権を得たと単純化しないこと。","w":"ウェストファリア条約"},{"id":"m002","t":"mc","q":"1648年のウェストファリア条約で、独立が国際的に承認された国の組み合わせとして正しいものはどれか。","o":["オランダ（ネーデルラント連邦共和国）とスイス","オランダ（ネーデルラント連邦共和国）とポルトガル","スイスとブランデンブルク＝プロイセン","ポルトガルとブランデンブルク＝プロイセン"],"a":0,"c":"【近世・ヨーロッパ】三十年戦争と国際秩序","y":1648,"ex":"ネーデルラント北部7州は1581年に独立を宣言し、1609年の休戦で事実上独立したが、国際的な正式承認は1648年である。スイスも神聖ローマ帝国からの離脱を認められた。ポルトガルは1640年にスペインから離反したが承認は1668年、プロイセン公国がポーランドの宗主権を脱したのは1657年。宣言・休戦・承認の年を区別し、オランダの商業覇権の前提として押さえる。","w":"オランダ（ネーデルラント連邦共和国）とスイス"},{"id":"m003","t":"mc","q":"スペイン継承戦争後の1713年、ユトレヒト条約でイギリスがスペインから獲得した地中海の拠点はどれか。","o":["ジブラルタルとミノルカ島","シチリア島とサルデーニャ島","マルタ島とキプロス島","コルシカ島とサルデーニャ島"],"a":0,"c":"【近世・ヨーロッパ】スペイン継承戦争と勢力均衡","y":1713,"ex":"ブルボン家のスペイン王位継承に英・墺などが反対したスペイン継承戦争は、1713年のユトレヒト条約で講和した。フェリペ5世の即位は認められたが仏西の合同は禁じられ、勢力均衡が図られた。イギリスはスペインからジブラルタルとミノルカ島、フランスからニューファンドランド・アカディア・ハドソン湾地方を得て海上覇権の基礎を築いた。マルタ島・キプロス島の獲得は19世紀である。","w":"ジブラルタルとミノルカ島"},{"id":"m004","t":"mc","q":"スペイン継承戦争後の1713年、ユトレヒト条約に関連してイギリスが得た、スペイン領アメリカへのアフリカ人奴隷供給を独占する契約を何というか。","o":["ナビオ・デ・ペルミソ","アシエント","エンコミエンダ制","アシエンダ制"],"a":1,"c":"【近世・大西洋世界】植民地貿易と奴隷貿易","y":1713,"ex":"スペイン王位がブルボン家に移るのを認める代わりに、英国はジブラルタルなどに加えアシエントを獲得し、南海会社が30年間スペイン領アメリカへの奴隷供給を担った。フランスから移ったこの権利は英国の大西洋三角貿易の優位を強めた。付随する年1隻の通商船派遣権ナビオ・デ・ペルミソは密貿易の温床となり、1739年のジェンキンズの耳の戦争につながった。","w":"アシエント"},{"id":"m005","t":"mc","q":"オーストリア継承戦争後、プロイセンに対抗するためオーストリアが従来の敵フランスと接近し、1756年に同盟を結んだ外交上の転換を何というか。","o":["外交革命","ウェストミンスター協約","英仏協商","神聖同盟"],"a":0,"c":"【近世・ヨーロッパ】七年戦争と外交関係","y":1756,"ex":"オーストリアはシュレジエン奪回を目指し、宰相カウニッツの主導で宿敵フランスと1756年に同盟した。これに先立ちイギリスがプロイセンとウェストミンスター協約を結んでおり、七年戦争は英・普対墺・仏・露の構図で戦われた。イタリア戦争以来のハプスブルク家とフランス王家（ヴァロワ家、のちブルボン家）の対立の終わりを示す転換である。1904年の英仏協商とは時代も当事国も異なる。","w":"外交革命"},{"id":"m006","t":"mc","q":"1740年に始まるシュレジエン戦争で同地を占領し、七年戦争でもオーストリアなどの奪還を退けたプロイセン王は誰か。","o":["フリードリヒ・ヴィルヘルム1世","フリードリヒ2世（フリードリヒ大王）","フリードリヒ1世","フリードリヒ・ヴィルヘルム2世"],"a":1,"c":"【近世・ヨーロッパ】プロイセンの台頭とシュレジエン戦争","y":1740,"ex":"1740年、マリア・テレジアの家督継承に諸国が異議を唱えると、フリードリヒ2世はシュレジエンに侵攻し、オーストリア継承戦争で領有を認めさせた。外交革命で包囲された七年戦争も耐え抜き、1763年のフベルトゥスブルク条約で確保した。プロイセンは列強に台頭し、墺普の対立が始まる。啓蒙専制君主の代表で、軍隊と官僚制を整えた父フリードリヒ・ヴィルヘルム1世と区別する。","w":"フリードリヒ2世（フリードリヒ大王）"},{"id":"m007","t":"mc","q":"1754年に北米で始まり、1756年に始まる七年戦争の北米戦線となった、イギリスとフランスの植民地争奪戦を何というか。","o":["フレンチ・インディアン戦争","アン女王戦争","ジェンキンズの耳の戦争","オーストリア継承戦争"],"a":0,"c":"【近世・北アメリカ】英仏植民地抗争と七年戦争","y":1754,"ex":"オハイオ川流域をめぐり、英仏の植民地勢力が先住民を巻き込んで1754年に衝突し、1756年から七年戦争の一部となった。1763年のパリ条約でフランスは北米大陸から後退したが、勝ったイギリスは戦費で財政難に陥り、植民地課税を強めてアメリカ独立革命を招いた。スペイン継承戦争に対応するアン女王戦争、オーストリア継承戦争に対応するジョージ王戦争と区別する。","w":"フレンチ・インディアン戦争"},{"id":"m008","t":"mc","q":"1763年のパリ条約で、フランスがイギリスに割譲した北米の主要地域の組み合わせはどれか。","o":["カナダとミシシッピ川以東のルイジアナ","カナダとミシシッピ川以西のルイジアナ","フロリダとミシシッピ川以東のルイジアナ","カナダとフロリダ"],"a":0,"c":"【近世・北アメリカ】七年戦争と植民地再編","y":1763,"ex":"七年戦争に敗れたフランスは、パリ条約でカナダとミシシッピ川以東のルイジアナをイギリスに割譲した。川以西のルイジアナは、フランスが前年にスペインへ譲っており、スペイン領となった。フロリダはスペインからイギリスへ渡ったため、割譲先の違いに注意したい。フランスは北米本土の広大な領土を失ったが、すべての権益を失ったわけではない。","w":"カナダとミシシッピ川以東のルイジアナ"},{"id":"m009","t":"mc","q":"1793年の第二次ポーランド分割に参加した国の組み合わせとして正しいものはどれか。","o":["ロシア・プロイセン・オーストリア","ロシアとプロイセン","ロシアとオーストリア","プロイセンとオーストリア"],"a":1,"c":"【近世・東ヨーロッパ】ポーランド分割","y":1793,"ex":"選挙王政と貴族の自由拒否権で弱体化したポーランドは、1772年に露・普・墺の第一次分割を受けた。1791年の五月三日憲法による改革にロシアが介入し、1793年に露・普の二国が第二次分割を行った（オーストリアは不参加）。1794年のコシューシコの蜂起鎮圧後、1795年の第三次分割で国家は消滅した。啓蒙専制君主による勢力均衡の犠牲で、独立回復は1918年。","w":"ロシアとプロイセン"},{"id":"m010","t":"mc","q":"アメリカ独立戦争に参加し、第二次ポーランド分割後の1794年に蜂起を指導したポーランドの愛国者は誰か。","o":["コシューシコ（コシチュシコ）","プワスキ","ドンブロフスキ","スタニスワフ・アウグスト・ポニャトフスキ"],"a":0,"c":"【近世・東ヨーロッパ】ポーランド分割とコシューシコの蜂起","y":1794,"ex":"第二次分割（1793年）で存亡の危機に立ったポーランドで、アメリカ独立戦争に義勇兵として参加したコシューシコは1794年に蜂起し、農民の賦役軽減を約して動員したが、露・普軍に敗れ、1795年の第三次分割で国家は消滅した。その名は民族運動の象徴として19世紀の蜂起に受け継がれる。同じく独立戦争に参加したプワスキ、最後の国王ポニャトフスキと混同しない。","w":"コシューシコ（コシチュシコ）"},{"id":"m011","t":"mc","q":"ナポレオン戦争後のウィーン会議を主導し、正統主義と勢力均衡を重視したオーストリアの外相（1821年以降は宰相）は誰か。","o":["カスルレー","メッテルニヒ","タレーラン","ハルデンベルク"],"a":1,"c":"【近代・ヨーロッパ】ウィーン体制","y":1814,"ex":"ナポレオン没落後のウィーン会議は、革命前の王朝と領土を基準とする正統主義と大国間の勢力均衡を原則に欧州を再編した。主宰したメッテルニヒは神聖同盟・四国同盟を背景に自由主義とナショナリズムを抑えるウィーン体制を築いたが、1848年の三月革命で失脚した。正統主義を唱えたのはフランス代表タレーランであり、英代表カスルレー、普代表ハルデンベルクとも区別する。","w":"メッテルニヒ"},{"id":"m012","t":"mc","q":"1815年、イェーナ大学の学生らが結成し、ドイツの統一と自由を求めた学生組合・運動を何というか。","o":["ヴァルトブルク祭","ブルシェンシャフト運動","ハンバッハ祭","フランクフルト国民議会"],"a":1,"c":"【近代・ドイツ】自由主義・ナショナリズム運動","y":1815,"ex":"ウィーン体制下でドイツの自由と統一を求め、学生組合ブルシェンシャフトが1815年に結成された。1817年にはヴァルトブルク祭で運動が表面化し、1819年、学生による暗殺事件を機にメッテルニヒがカールスバート決議を主導して大学や出版を弾圧した。ヴァルトブルク祭は運動そのものではなく、その集会である。","w":"ブルシェンシャフト運動"},{"id":"m013","t":"mc","q":"1830年の革命でオランダからの分離を宣言し、翌1831年にレオポルド1世を国王とする立憲君主国となった国はどこか。","o":["ベルギー","ギリシア","ポーランド","フランス"],"a":0,"c":"【近代・西ヨーロッパ】七月革命とベルギー独立","y":1831,"ex":"ウィーン会議でオランダに併合された南ネーデルラントは、宗教・言語・経済利害の違いから不満を強め、1830年、七月革命の影響で蜂起して独立を宣言した。1831年に立憲君主国が成立し、1839年のロンドン条約でオランダが承認、列強が永世中立を保証した。ウィーン体制の動揺を示す事件で、ドイツの中立侵犯は1914年のイギリス参戦の理由となる。同年のポーランド蜂起は鎮圧された。","w":"ベルギー"},{"id":"m014","t":"mc","q":"1848年の三月革命を受けて、ドイツ統一と憲法制定を議論するため、ドイツ各地から選出された代表が集まった議会は何か。","o":["プロイセン国民議会","ドイツ連邦議会","エアフルト議会","フランクフルト国民議会"],"a":3,"c":"【近代・ドイツ】1848年革命とドイツ統一","y":1848,"ex":"三月革命で自由主義者が台頭し、1848年5月、諸邦から選ばれた代表がフランクフルトに集まった。議員の多くは教授・法律家など教養市民層で、憲法を審議したが、大ドイツ主義と小ドイツ主義の対立で難航し、1849年にプロイセン王が帝冠を拒否して挫折した。この失敗はビスマルクの「鉄と血」による上からの統一へつながる。諸邦政府の代表からなるドイツ連邦議会と区別する。","w":"フランクフルト国民議会"},{"id":"m015","t":"mc","q":"1848年のフランクフルト国民議会で論じられた、オーストリアを除きプロイセンを中心にドイツを統一する構想を何と呼ぶか。","o":["大ドイツ主義","小ドイツ主義","ドイツ関税同盟","ドイツ連邦"],"a":1,"c":"【近代・ドイツ】ドイツ統一構想","y":1848,"ex":"フランクフルト国民議会では、ハプスブルク家領を含む大ドイツ主義と、オーストリアを除いてプロイセン主導の統一を目指す小ドイツ主義が対立した。議会は後者を選び、プロイセン王に帝冠を提示したが拒否され、統一は挫折する。のちにビスマルクが進めた1871年のドイツ帝国成立は、小ドイツ主義に基づく統一だった。","w":"小ドイツ主義"},{"id":"m016","t":"mc","q":"1545年、スペイン領ペルー副王領内（現在のボリビア）で発見され、アメリカ銀の大産地となった銀山は何か。","o":["サカテカス銀山","ポトシ銀山","セロ・デ・パスコ銀山","グアナフアト銀山"],"a":1,"c":"【近世・南アメリカ】ポトシ銀山と世界交易","y":1545,"ex":"1545年に発見されたポトシ銀山は、1570年代に副王トレドが先住民の輪番強制労働ミタ制を再編し、水銀アマルガム法を導入して産出が急増した。銀はセビリャ経由で欧州に流れ価格革命を招き、アカプルコからマニラ経由で明にも入り一条鞭法による銀納化を支えた。メキシコのサカテカス銀山や日本の石見銀山と産地・地域を取り違えないこと。","w":"ポトシ銀山"},{"id":"m017","t":"mc","q":"16世紀のヨーロッパで、人口増加やアメリカ産銀の流入などを背景に物価が長期的に上昇した現象を何と呼ぶか。","o":["商業革命","価格革命","囲い込み運動","重商主義"],"a":1,"c":"【近世・ヨーロッパ】価格革命と社会経済の変化","y":1550,"ex":"16世紀、人口増加による需要拡大に新大陸銀の流入が重なり物価が長期的に上昇した。固定地代に頼る西欧の領主は実質収入を減らし、商工業者やジェントリなどが台頭した。一方、西欧への穀物輸出が増えたエルベ川以東では領主が農奴支配を強めて農場領主制を営み、東西の国際分業が形成された。交易の中心が大西洋岸へ移った商業革命とは現象が異なる。","w":"価格革命"},{"id":"m018","t":"mc","q":"1565年、スペインがフィリピンとメキシコを結ぶ太平洋航路を開き、のちにマニラとメキシコ太平洋岸の港との間で定期化した交易を何と呼ぶか。","o":["フロタ（銀船団）貿易","ガレオン貿易（アカプルコ貿易）","大西洋三角貿易","朱印船貿易"],"a":1,"c":"【近世・太平洋】マニラ・ガレオン貿易","y":1565,"ex":"1565年にウルダネータが帰路航路を見いだし、1571年にマニラがスペインの拠点となると、ガレオン船がメキシコ銀をマニラへ運び、中国商人の生糸・絹織物・陶磁器と交換した。新大陸銀は日本銀とともに明へ流入し、一条鞭法など銀経済化を支え、世界規模の銀の循環を生んだ。スペイン本国へ向かう大西洋のフロタ貿易や、日本の朱印船貿易と区別する。","w":"ガレオン貿易（アカプルコ貿易）"},{"id":"m019","t":"mc","q":"明代の張居正が1581年に全国的な実施を進め、各種の税・徭役を原則として銀納にまとめた税制改革を何というか。","o":["両税法","一条鞭法","里甲制","地丁銀制"],"a":1,"c":"【近世・東アジア】明代の税制改革と銀納化","y":1581,"ex":"明では商業の発達や海外銀の流入を背景に、銀納が広がった。張居正は1581年、一条鞭法を全国的に実施し、各種の税や徭役をまとめて銀で納めさせ、徴税の簡素化を図った。ただし銀を得にくい農民には負担となる場合もあった。清の地丁銀制は丁税を地税に統合した別の改革で、一条鞭法と同一ではない。","w":"一条鞭法"},{"id":"m020","t":"mc","q":"清の雍正帝の時代に広く実施され、固定した丁税を地税に組み込んで銀納させた税制改革を何というか。","o":["一条鞭法","地丁銀制","両税法","里甲制"],"a":1,"c":"【近世・東アジア】清代の税制改革","y":1723,"ex":"康熙帝は1712年、以後に増えた人丁には丁税を課さないと定め（盛世滋生人丁）、丁税額を固定した。これを前提に丁税を地税に繰り込んで銀納させる地丁銀制が、雍正帝期に全国へ広がった。人頭税が事実上消滅して戸口の隠匿が減り、新作物の普及とあいまって18世紀の人口急増の一因となった。税目を統合して銀納化した明の一条鞭法とは別の制度である。","w":"地丁銀制"},{"id":"m021","t":"mc","q":"近世の大西洋世界で、ヨーロッパ製品をアフリカへ運び、奴隷化されたアフリカ人をアメリカ大陸へ移送し、植民地産品をヨーロッパへ運ぶ貿易構造を何と呼ぶか。","o":["アシエント","中間航路（ミドル・パッセージ）","環大西洋貿易（三角貿易）","コロンブス交換"],"a":2,"c":"【近世・大西洋世界】三角貿易と奴隷貿易","y":1700,"ex":"先住民人口が激減したアメリカのプランテーションは、アフリカ人奴隷に依存した。欧州から武器・綿織物をアフリカへ、奴隷をアメリカへ（中間航路）、砂糖・タバコ・綿花を欧州へ運ぶ構造で、リヴァプールなどが繁栄し、アフリカでは人口流出と社会の荒廃が進んだ。産業革命の一因ともされるが、それだけに帰すのは単純化である。奴隷供給契約アシエントやコロンブス交換と区別する。","w":"環大西洋貿易（三角貿易）"},{"id":"m023","t":"mc","q":"オランダ東インド会社が1619年、ジャワ島北西岸のジャヤカルタを占領して築いたアジア貿易の拠点（現在のジャカルタ）はどこか。","o":["マラッカ","バタヴィア","ゴア","マニラ"],"a":1,"c":"【近世・東南アジア】オランダ東インド会社の進出","y":1619,"ex":"香辛料貿易をめぐり、オランダ東インド会社は1619年、ジャヤカルタを占領してバタヴィアと改称し、アジア交易の本拠とした。1623年のアンボイナ事件でイギリス勢力をモルッカ諸島から排除し、イギリスがインド経営へ重心を移す契機となった。1641年にはマラッカを奪い、のちジャワの領土支配へ進む。ポルトガルの拠点ゴア・マラッカ、スペインのマニラと区別する。","w":"バタヴィア"},{"id":"m024","t":"mc","q":"1651年、オランダの中継貿易を抑え、イギリス船や産地国の船によるイギリス向け輸送を促すために制定された法律は何か。","o":["航海法（航海条例）","穀物法","茶法","砂糖法"],"a":0,"c":"【近世・ヨーロッパ】重商主義と英蘭通商競争","y":1651,"ex":"中継貿易で世界商業を握ったオランダに対抗し、クロムウェルの共和政期のイギリス議会は1651年、輸送をイギリス船か産地国の船に限る航海法を制定し、第一次英蘭戦争を招いた。重商主義の柱として維持されたが、産業資本家が自由貿易を求めるなか、1846年の穀物法廃止に続いて1849年に廃止された。地主を保護した穀物法、植民地課税の砂糖法・茶法と区別する。","w":"航海法（航海条例）"},{"id":"m025","t":"mc","q":"イギリス東インド会社について述べた文として正しいものはどれか。","o":["1602年に設立され、条約締結権や軍隊保有権を与えられた最初の本格的な株式会社として発足した。","プラッシーの戦いでフランス東インド会社とベンガル太守の連合軍に敗れ、ベンガルから撤退した。","1813年に対インド貿易の独占権を廃止され、1833年には中国貿易の独占権も廃止されて商業活動を停止した。","シパーヒーの反乱後も存続し、1877年のインド帝国の成立とともに解散した。"],"a":2,"c":"【近世〜近代・南アジア】東インド会社と植民地支配","y":1813,"ex":"1600年設立の同社はアンボイナ事件後インドに重点を移し、プラッシーの戦い、1765年のディーワーニー獲得を経て統治機関化した。産業資本家の自由貿易要求で1813年に対インド貿易独占権が廃止され、英綿製品の流入でインド綿業は打撃を受けた。1833年の中国貿易独占廃止はアヘン戦争の背景となる。反乱後の1858年に解散し直接統治へ。1602年設立のオランダ東インド会社と区別する。","w":"1813年に対インド貿易の独占権を廃止され、1833年には中国貿易の独占権も廃止されて商業活動を停止した。"},{"id":"m026","t":"mc","q":"1757年、ロバート・クライヴ率いるイギリス東インド会社軍がベンガル太守シラージュ・ウッダウラを破った戦いは何か。","o":["プラッシーの戦い","バクサールの戦い","ワンディワッシュの戦い","カルナータカ戦争"],"a":0,"c":"【近世・南アジア】イギリス東インド会社の勢力拡大","y":1757,"ex":"会社の要塞化や特権をめぐり、ベンガル太守シラージュ・ウッダウラとイギリス東インド会社が対立した。1757年、クライヴの会社軍は、太守軍の有力者ミール・ジャーファルの離反もあって勝利し、ベンガルで政治的影響力を強めた。ただしインド全域の覇権確立を意味せず、ベンガルのディーワーニー獲得は1765年である。","w":"プラッシーの戦い"},{"id":"m027","t":"mc","q":"1765年、ムガル皇帝シャー・アーラム2世がイギリス東インド会社に認めた、ベンガル・ビハール・オリッサの収租権を何というか。","o":["ディーワーニー","ニザーマト","ザミンダーリー","ジャーギール"],"a":0,"c":"【近世・南アジア】東インド会社の徴税権獲得","y":1765,"ex":"バクサール（ブクサール）の戦い（1764年）で勝利した東インド会社は、1765年のアラーハーバード条約でムガル皇帝シャー・アーラム2世からベンガル・ビハール・オリッサのディーワーニー（租税徴収権）を得た。これは収租を含む民政上の権限で、会社の支配を支える財源となった。刑事司法・治安を担うニザーマトとは区別され、徴税権獲得はプラッシーの戦い直後ではない。","w":"ディーワーニー"},{"id":"m028","t":"mc","q":"アダム・スミスが1776年に刊行し、重商主義を批判して市場における分業や自由な交換の働きを論じた著作は何か。","o":["『道徳感情論』","『国富論』（『諸国民の富』）","『人口論』","『経済学および課税の原理』"],"a":1,"c":"【近代・イギリス】古典派経済学の成立","y":1776,"ex":"産業革命が始まりつつあるイギリスで、スミスは重商主義の保護・独占政策を批判し、分業と自由な交換が生産力を高める仕組みを論じた。『国富論』は古典派経済学の代表作だが、国家の役割を全面否定したわけではない。「見えざる手」は市場の調整を表す比喩で、著作全体を単純な自由放任論に還元しない。","w":"『国富論』（『諸国民の富』）"},{"id":"m029","t":"mc","q":"18世紀イギリスの綿工業で、飛び杼の普及により織布の能率が上がって綿糸が不足したことを背景に、1764年頃に発明された多軸の手動紡績機はどれか。","o":["ジェニー紡績機","水力紡績機","ミュール紡績機","力織機"],"a":0,"c":"【近代・イギリス】産業革命と綿工業の技術革新","y":1764,"ex":"インド産綿布の人気を背景に英国内の綿業が広がった。ジョン＝ケイの飛び杼（1733年）で織布が速まると綿糸が不足し、ハーグリーヴズのジェニー紡績機、アークライトの水力紡績機（1769年）、クロンプトンのミュール紡績機（1779年）が続き、糸が余ると力織機（1785年）が生まれた。この連鎖が工場制機械工業への移行を促した。家内で使えたジェニー機と工場制を促した水力紡績機を区別する。","w":"ジェニー紡績機"},{"id":"m030","t":"mc","q":"1811年以降、産業革命期のイギリスで、賃下げや熟練職人の仕事を脅かす機械の導入に抗議し、機械を打ち壊した運動は何か。","o":["スウィング暴動","ラッダイト運動","チャーティスト運動","ピータールーの虐殺"],"a":1,"c":"【近代・イギリス】産業革命と労働運動","y":1811,"ex":"1811年、ノッティンガム周辺の靴下編み職人らが機械を破壊し、運動はランカシャーなどにも広がった。機械そのものへの反発だけでなく、機械導入に伴う賃下げや熟練職人の地位低下が背景にあった。政府は1812年に機械破壊を死刑に処する法律を制定して弾圧した。農業機械を壊した1830年のスウィング暴動とは区別する。","w":"ラッダイト運動"},{"id":"m031","t":"mc","q":"七年戦争後の財政再建を図るイギリスが、1765年に北米植民地の新聞・パンフレット・法的文書などに印紙税を課した法律は何か。","o":["砂糖法","印紙法","タウンゼンド諸法","茶法"],"a":1,"c":"【近代・北アメリカ】アメリカ独立革命の前提","y":1765,"ex":"七年戦争後の財政負担を植民地にも担わせようと、イギリスは1765年、新聞・パンフレット・法的文書などに印紙税を課した。植民地側は議会に代表を送っていないのに課税されたとして反発し、「代表なくして課税なし」と抗議した。印紙法は翌年撤回されたが、議会の課税権を主張する宣言法も同時に制定され、対立は続いた。","w":"印紙法"},{"id":"m032","t":"mc","q":"1773年のボストン茶会事件に対し、イギリス本国がとった対応として正しいものはどれか。","o":["ボストン港の閉鎖などを定めた強圧的諸法（耐えがたき諸法）を制定した。","タウンゼンド諸法を制定し、茶・ガラス・紙などに輸入関税を課した。","宣言法を制定し、植民地に対する本国議会の立法権を確認した。","印紙法を制定し、新聞や証書などに印紙を貼らせた。"],"a":0,"c":"【近代・北アメリカ】アメリカ独立革命の展開","y":1773,"ex":"「代表なくして課税なし」と反発してきた植民地は、1773年の茶法が東インド会社に茶の独占販売を認めると、ボストンで同社の茶を海に投棄した。本国は1774年、ボストン港閉鎖などの強圧的諸法で応じ、植民地側は第1回大陸会議で対抗し、1775年の武力衝突へ至る。印紙法（1765年）→宣言法（1766年）→タウンゼンド諸法（1767年）→茶法（1773年）の順序を押さえる。","w":"ボストン港の閉鎖などを定めた強圧的諸法（耐えがたき諸法）を制定した。"},{"id":"m033","t":"mc","q":"トマス・ペインが1776年に刊行し、世襲君主制を批判して北米植民地の独立を論じたパンフレットは何か。","o":["『コモン・センス』（『常識』）","『アメリカの危機』","アメリカ独立宣言","『人間の権利』"],"a":0,"c":"【近代・北アメリカ】アメリカ独立革命の思想","y":1776,"ex":"独立戦争が始まった翌年の1776年1月、ペインは平易な英語のパンフレット『コモン・センス』を刊行し、世襲君主制を批判して独立と共和政を訴えた。7月のアメリカ独立宣言とは別の著作である。ペインの『アメリカの危機』も独立戦争中の著作だが、戦意を鼓舞する一連の論文であり、本書と混同しない。","w":"『コモン・センス』（『常識』）"},{"id":"m034","t":"mc","q":"トマス＝ジェファソンらが起草し、1776年に第2回大陸会議が採択した文書で、生命・自由・幸福の追求を天賦の権利とし、これを侵す政府を人民が改廃できると主張したものはどれか。","o":["ヴァージニア権利章典","アメリカ独立宣言","連合規約","アメリカ合衆国憲法"],"a":1,"c":"【近代・北アメリカ】アメリカ独立革命と自然権思想","y":1776,"ex":"印紙法などの課税に植民地は「代表なくして課税なし」と反発し、1775年に武力衝突が始まった。ペイン『コモン＝センス』で独立論が広がるなか採択された独立宣言は、ロックの自然権・革命権思想で独立を正当化し、フランス人権宣言にも影響したが、奴隷制は温存した。独立の承認は1783年のパリ条約、国家の枠組みは1787年の合衆国憲法であり区別する。","w":"アメリカ独立宣言"},{"id":"m035","t":"mc","q":"1787年制定のアメリカ合衆国憲法で、立法・行政・司法を別々の機関に担わせ、権力の集中を防ぐ原理を何というか。","o":["連邦主義","抑制と均衡","三権分立（権力分立）","人民主権"],"a":2,"c":"【近代・北アメリカ】合衆国憲法と権力分立","y":1787,"ex":"連合規約下の中央政府は課税権・通商規制権を欠き、財政難や州間対立が深刻だった。1787年憲法は連邦政府を強化しつつ、モンテスキューの影響を受けて三権分立を採用し、各機関が互いに抑制し合う仕組み（抑制と均衡）も設けた。連邦と州の権限配分である連邦主義とは区別する。中央集権を警戒する反連邦派に配慮し、1791年に権利章典が加えられた。","w":"三権分立（権力分立）"},{"id":"m036","t":"mc","q":"1789年7月14日、国王軍の集結などに不安を強めたパリ市民が、火薬や武器を求めて襲撃した王政の象徴的な監獄はどこか。","o":["バスティーユ牢獄","ヴェルサイユ宮殿","テュイルリー宮殿","ヴァンセンヌ城"],"a":0,"c":"【近代・フランス】フランス革命の勃発","y":1789,"ex":"三部会で第三身分は国民議会を結成したが、国王軍の集結とネッケル罷免で不安が高まり、パリ民衆は武器を求めて7月14日に専制の象徴バスティーユ牢獄を襲撃した。これを機に農村で「大恐怖」と農民蜂起が広がり、議会は8月4日に封建的特権の廃止を決議した（貢租は有償廃止）。民衆と農民の行動が議会の改革を押し進めた点が論述の要となる。","w":"バスティーユ牢獄"},{"id":"m037","t":"mc","q":"1789年8月、フランス国民議会が採択し、人間の自由・法の前の平等・国民主権・所有権などを掲げた文書は何か。","o":["アメリカ独立宣言","フランス人権宣言（人間と市民の権利の宣言）","1791年憲法","聖職者民事基本法"],"a":1,"c":"【近代・フランス】フランス革命と人権思想","y":1789,"ex":"8月4日の封建的特権廃止に続き、国民議会は人権宣言を採択した。啓蒙思想と米独立革命の影響を受け、自由・平等・国民主権・所有権の不可侵をうたって旧体制を原理的に否定した。ただし所有権の重視はブルジョワ的性格を示し、女性の権利は除外され、グージュが『女性の権利宣言』（1791年）で批判した。1791年憲法は立憲君主政と制限選挙を定めた別の文書。","w":"フランス人権宣言（人間と市民の権利の宣言）"},{"id":"m038","t":"mc","q":"1792年、王権停止後に召集され、王政を廃止して第一共和政を成立させた一院制の議会は何か。","o":["立法議会","国民公会","憲法制定国民議会","総裁政府"],"a":1,"c":"【近代・フランス】第一共和政の成立","y":1792,"ex":"対外戦争の危機のなか1792年8月10日の民衆蜂起で王権が停止され、男子普通選挙で選ばれた国民公会が9月に王政廃止を宣言して第一共和政を開いた。1793年1月のルイ16世処刑は第1回対仏大同盟を招き、公安委員会による恐怖政治へつながる。1791年憲法下の制限選挙による立法議会や、1795年憲法で成立した総裁政府と区別したい。","w":"国民公会"},{"id":"m039","t":"mc","q":"国民公会期にジャコバン派の山岳派で有力な指導者となり、恐怖政治を推進した後、テルミドール9日のクーデタで失脚した人物は誰か。","o":["ジョルジュ・ダントン","ジャン＝ポール・マラー","マクシミリアン・ロベスピエール","ジャック＝ルネ・エベール"],"a":2,"c":"【近代・フランス】ジャコバン独裁と恐怖政治","y":1794,"ex":"内外の危機のなか山岳派は1793年にジロンド派を追放し、公安委員会を中心に恐怖政治を行った。ロベスピエールは最高価格令や封建的貢租の無償廃止を進め、左のエベール派、右のダントン派を処刑したが、孤立してテルミドール9日（1794年7月）のクーデタで処刑された。以後革命は穏健化し総裁政府へ向かう。無償廃止で生まれた小農民は保守化した。","w":"マクシミリアン・ロベスピエール"},{"id":"m040","t":"mc","q":"1793年、フランス西部で、三十万人徴兵令や革命政府の反教会政策に反発して起きた大規模な王党派反乱は何か。","o":["大恐怖","ヴァンデの反乱","連邦派の反乱","バブーフの陰謀"],"a":1,"c":"【近代・フランス】革命への反革命運動","y":1793,"ex":"兵力不足に悩む国民公会は1793年2月に三十万人徴兵令を出した。聖職者民事基本法以来の宗教対立や国王処刑への反発も重なり、3月に西部ヴァンデの農民が王党派と結んで蜂起した。反乱は恐怖政治強化の一因となり、鎮圧は多数の犠牲を伴った。ジロンド派追放に反発した南部諸都市の連邦派の反乱、私有財産廃止をめざしたバブーフの陰謀（1796年）と区別する。","w":"ヴァンデの反乱"},{"id":"m041","t":"mc","q":"1799年のブリュメール18日のクーデタで権力を握ったナポレオンが1804年に公布し、法の前の平等、私有財産の不可侵、契約の自由などを定めて革命の成果を法的に定着させた法典は何か。","o":["フランス人権宣言","宗教協約（コンコルダート）","ナポレオン法典（フランス民法典）","1791年憲法"],"a":2,"c":"【近代・フランス】統領政府とナポレオン法典","y":1804,"ex":"総裁政府の不安定を嫌う有産市民や農民の支持でナポレオンは権力を握り、1801年に宗教協約で教皇と和解、1804年に民法典を公布した。民法典は革命で得た土地所有を保障して農民を体制に結びつけ、征服地にも導入されて近代市民法の模範となったが、家父長権を強め女性の権利は制約した。人権宣言は原理の宣言、民法典はそれを具体化した私法である。","w":"ナポレオン法典（フランス民法典）"},{"id":"m042","t":"mc","q":"ナポレオンは1806年の大陸封鎖令（ベルリン勅令）でイギリスを経済的に孤立させようとしたが、穀物の輸出先を失ってこの封鎖から離脱し、1812年にナポレオンの遠征を受けた国はどこか。","o":["プロイセン","オーストリア","ロシア","ポルトガル"],"a":2,"c":"【近代・ヨーロッパ】ナポレオンの大陸封鎖","y":1806,"ex":"トラファルガーの海戦でイギリスを破れなかったナポレオンは、ベルリン勅令で大陸諸国に対英通商を禁じ、フランス産業の市場確保もねらった。しかし工業製品の供給先と穀物の輸出先を失った諸国は反発し、ロシアは1810年に離脱した。これが1812年のロシア遠征失敗と解放戦争につながる。ポルトガル出兵（1807年）はイベリア半島での戦争の発端となった。","w":"ロシア"},{"id":"m043","t":"mc","q":"1791年に始まったサン＝ドマングの奴隷反乱で指導者となって島を掌握し、ハイチ独立への道を開いたが、ナポレオンの派兵で捕らえられ独立を見ずに獄死した人物は誰か。","o":["ジャン＝ジャック・デサリーヌ","トゥサン・ルーヴェルチュール","アレクサンドル・ペション","アンリ・クリストフ"],"a":1,"c":"【近代・カリブ海】ハイチ革命と奴隷解放","y":1791,"ex":"フランス革命の人権理念が伝わると、砂糖プランテーションの奴隷制に苦しむサン＝ドマングで1791年に大反乱が起き、1794年に国民公会は奴隷制廃止を決めた。トゥサンは島を掌握したが、ナポレオンの派兵で1802年に捕らえられ翌年獄死した。1804年にデサリーヌが独立を宣言し、初の黒人共和国ハイチが成立した。独立を達成したのはトゥサン自身ではない。","w":"トゥサン・ルーヴェルチュール"},{"id":"m044","t":"mc","q":"1819年、ボヤカの戦いなどでスペイン軍を破り、大コロンビア（ヌエバ・グラナダ、ベネズエラなど）の建国を主導した「解放者」は誰か。","o":["ホセ・デ・サン＝マルティン","アントニオ・ホセ・デ・スクレ","シモン・ボリバル","ベルナルド・オヒギンス"],"a":2,"c":"【近代・南アメリカ】スペイン領植民地の独立","y":1819,"ex":"ナポレオンのスペイン占領で本国支配が揺らぐと、クリオーリョ（植民地生まれの白人）が独立運動を主導した。ボリバルは1819年のボヤカの戦いでヌエバ・グラナダを解放し大コロンビアを建てた。市場を求めるイギリスは独立を支持し、モンロー宣言も欧州の干渉を牽制した。ただし大土地所有制は残り、大コロンビアは1830年に分裂。南部のサン＝マルティンと区別する。","w":"シモン・ボリバル"},{"id":"m045","t":"mc","q":"1817年、アンデス軍を率いてチリへ進軍し、スペイン軍を破って南米南部の独立運動を進めた革命家は誰か。","o":["ホセ・デ・サン＝マルティン","シモン・ボリバル","ベルナルド・オヒギンス","アントニオ・ホセ・デ・スクレ"],"a":0,"c":"【近代・南アメリカ】南部の独立運動","y":1817,"ex":"ナポレオンのスペイン占領を機にクリオーリョ主導の独立運動が広がった。ラプラタ出身のサン＝マルティンはアンデス軍を率いて1817年にアンデスを越え、チャカブコの戦いに勝ってオヒギンスとともにチリ独立を実現し、1821年にはペルー独立を宣言した。1822年のグアヤキル会談後に身を引いた。北部のボリバル、ペルー解放を完成させたスクレと区別する。","w":"ホセ・デ・サン＝マルティン"},{"id":"m046","t":"mc","q":"1774年のキュチュク・カイナルジャ条約後、オスマン帝国の弱体化と領土・海峡をめぐる列強の利害対立を背景に深まった国際問題を何と呼ぶか。","o":["バルカン問題","東方問題","海峡問題","ギリシア独立戦争"],"a":1,"c":"【近代・西アジア】オスマン帝国と東方問題","y":1774,"ex":"露土戦争後の1774年、キュチュク・カイナルジャ条約でロシアは黒海北岸への進出を進め、オスマン帝国の弱体化が列強間の争点となった。領土分割や海峡支配をめぐる一連の外交問題が東方問題で、特定の一事件ではない。バルカン問題や海峡問題はその一部であり、列強の対立はクリミア戦争などを通じて続いた。","w":"東方問題"},{"id":"m047","t":"mc","q":"1821年に始まったギリシア独立戦争について述べた文として最も適当なものはどれか。","o":["ウィーン体制を主導したメッテルニヒが、民族の独立を認める立場からギリシアを積極的に支援した。","イギリス・フランス・ロシアがナヴァリノの海戦でオスマン帝国・エジプト艦隊を破り、1830年のロンドン会議で独立が国際的に承認された。","エジプトのムハンマド＝アリーはギリシア側で参戦し、その見返りにシリアの統治権を得た。","1878年のベルリン条約で、セルビア・モンテネグロとともに独立が承認された。"],"a":1,"c":"【近代・東南ヨーロッパ】ギリシア独立戦争とウィーン体制","y":1821,"ex":"ウィーン体制下で自由主義・民族主義が抑圧されるなか、ギリシア人は1821年に蜂起し、バイロンらロマン主義者も支援した。メッテルニヒは正統主義から反乱を否認したが、英仏露は東地中海での影響力を競って介入し、ナヴァリノの海戦に勝利した。1830年の独立承認はウィーン体制の最初の大きな動揺である。オスマン側で参戦したムハンマド＝アリーは見返りにシリアを求めた。","w":"イギリス・フランス・ロシアがナヴァリノの海戦でオスマン帝国・エジプト艦隊を破り、1830年のロンドン会議で独立が国際的に承認された。"},{"id":"m048","t":"mc","q":"エジプト＝トルコ戦争をめぐって開かれた1840年のロンドン会議と、翌1841年の五国海峡協定の結果として正しいものはどれか。","o":["ロシアのみが軍艦をボスフォラス・ダーダネルス両海峡に通航させる特権を認められた。","平時における外国軍艦の両海峡通航が禁止され、ロシアの南下は阻まれた。","ムハンマド＝アリーがシリアの世襲統治権を認められ、エジプトはオスマン帝国から独立した。","黒海が中立化され、沿岸での軍事施設の保有が禁止された。"],"a":1,"c":"【近代・西アジア】エジプト＝トルコ戦争と東方問題","y":1840,"ex":"ギリシア独立戦争の見返りにシリアを求めたムハンマド＝アリーはオスマン帝国と戦い、1833年にはオスマン帝国を支援したロシアが海峡での優位を得た。これを警戒するイギリスが主導した1840年のロンドン会議で、彼はエジプトの世襲権のみを認められ、翌年の協定で外国軍艦の海峡通航が禁じられた。南下は阻まれた。黒海中立化は1856年パリ条約の内容である。","w":"平時における外国軍艦の両海峡通航が禁止され、ロシアの南下は阻まれた。"},{"id":"m049","t":"mc","q":"19世紀半ば、スルタンのアブデュルメジト1世のもとで始まり、司法・行政・財政・軍事を西欧化して中央集権的な近代国家をめざしたオスマン帝国の諸改革を何と呼ぶか。","o":["ニザーム＝ジェディード","パン＝イスラーム主義","青年トルコ革命","タンジマート"],"a":3,"c":"【近代・西アジア】オスマン帝国の近代化改革","y":1839,"ex":"ムハンマド＝アリーの自立や列強の干渉で帝国が揺らぐなか、1839年のギュルハネ勅令でタンジマートが始まり、法の前の平等や徴税・徴兵制度の整備で中央集権化を図った。だが外債依存と外国製品の流入で1875年に財政破綻し、改革の到達点が1876年のミドハト憲法となる。セリム3世の新式軍ニザーム＝ジェディードやパン＝イスラーム主義と区別する。","w":"タンジマート"},{"id":"m050","t":"mc","q":"1839年、オスマン帝国の全臣民に生命・名誉・財産の保護を約束し、タンジマートの開始を宣言した勅令は何か。","o":["ギュルハネ勅令（ギュルハネの勅書）","改革勅令（イスラハト勅令）","ミドハト憲法","アドリアノープル条約"],"a":0,"c":"【近代・西アジア】タンジマートの開始","y":1839,"ex":"エジプト総督ムハンマド＝アリーの自立などで帝国の危機が深まるなか、スルタンのアブデュルメジト1世は1839年、ギュルハネ勅令を発した。臣民の生命・名誉・財産の保護を掲げ、徴税・徴兵の公正化や法に基づく統治を目指した。ただし、非ムスリムの権利平等をより明確に定めたのは1856年の改革勅令であり、両者を区別したい。","w":"ギュルハネ勅令（ギュルハネの勅書）"},{"id":"m051","t":"mc","q":"1853年にロシアとオスマン帝国の間で始まり、翌年イギリス・フランスもオスマン側で参戦した戦争は何か。","o":["露土戦争（1877〜78年）","ギリシア独立戦争","クリミア戦争","エジプト＝トルコ戦争"],"a":2,"c":"【近代・西アジア】東方問題とクリミア戦争","y":1853,"ex":"ロシアは正教徒保護を口実に南下を図り、1853年にオスマン帝国と開戦した。ロシアの地中海進出を恐れる英仏が1854年に参戦し、サルデーニャも加わり、セヴァストーポリ攻防の末ロシアは敗れた。1856年のパリ条約で黒海は中立化された。敗戦で後進性を自覚したロシアは1861年に農奴解放令を出し、列強協調の崩壊はウィーン体制の終わりを示した。","w":"クリミア戦争"},{"id":"m052","t":"mc","q":"1876年に制定されたミドハト憲法（オスマン帝国憲法）について述べた文として最も適当なものはどれか。","o":["統一と進歩委員会が起草を主導し、スルタンの権力を否定する共和政を定めた。","非ムスリムを含む臣民の法的平等を初めて宣言し、これを機にタンジマートが始まった。","大宰相ミドハト＝パシャのもとで制定され、二院制議会を定めたが、アブデュルハミト2世は露土戦争を理由に1878年に議会を停止した。","制定の翌年、列強の圧力で廃止され、その後二度と復活しなかった。"],"a":2,"c":"【近代・西アジア】オスマン帝国の立憲改革","y":1876,"ex":"タンジマート下の財政破綻とバルカンの反乱という危機のなか、ミドハト＝パシャらは立憲制で帝国の統合を図り、アジア初の憲法とされるミドハト憲法を制定した。しかしアブデュルハミト2世は露土戦争を口実に議会を停止し専制を行った。憲法は廃止ではなく停止で、1908年の青年トルコ革命で復活する。臣民平等は1839年・1856年の勅令が先行した。","w":"大宰相ミドハト＝パシャのもとで制定され、二院制議会を定めたが、アブデュルハミト2世は露土戦争を理由に1878年に議会を停止した。"},{"id":"m053","t":"mc","q":"1878年、サン＝ステファノ条約の内容をめぐる列強の対立を調整するため、ベルリン会議を主宰し「誠実な仲介人」を自称したドイツ宰相は誰か。","o":["ベンジャミン・ディズレーリ","アレクサンドル・ゴルチャコフ","オットー・フォン・ビスマルク","ジュラ・アンドラーシ"],"a":2,"c":"【近代・ヨーロッパ】ベルリン会議と東方問題","y":1878,"ex":"露土戦争に勝ったロシアはサン＝ステファノ条約で大ブルガリアを保護下に置いたが、英・墺が強く反発した。列強の均衡によるフランス孤立を重視するビスマルクは会議を開き、大ブルガリアを縮小させ、オーストリアにボスニア・ヘルツェゴヴィナの行政権、イギリスにキプロスを与えた。南下を阻まれたロシアとの関係は冷えた。1884年のベルリン＝コンゴ会議と混同しない。","w":"オットー・フォン・ビスマルク"},{"id":"m054","t":"mc","q":"1878年のベルリン条約で、オスマン帝国からの独立が国際的に承認されたバルカン半島の三国はどれか。","o":["ルーマニア・セルビア・モンテネグロ","ルーマニア・セルビア・ブルガリア","ギリシア・ルーマニア・セルビア","セルビア・モンテネグロ・東ルメリ自治州"],"a":0,"c":"【近代・バルカン】ベルリン条約と東方問題","y":1878,"ex":"ロシアの勢力拡大に対する英・墺の反発を受け、ベルリン条約は3国の独立を認める一方、大ブルガリアを縮小してオスマン帝国宗主権下の自治公国とし、東ルメリを自治州とした。オーストリアが得たボスニア・ヘルツェゴヴィナの行政権は、1908年の併合とセルビアとの対立につながる。ブルガリアの完全独立は1908年、ギリシアの独立は1830年であり区別する。","w":"ルーマニア・セルビア・モンテネグロ"},{"id":"m055","t":"mc","q":"1908年の青年トルコ革命を主導し、1876年に制定されていたミドハト憲法の復活と議会の再開を実現させた組織は何か。","o":["青年オスマン人","統一と進歩委員会","共和人民党","ワフド党"],"a":1,"c":"【近代・西アジア】青年トルコ革命","y":1908,"ex":"アブデュルハミト2世は露土戦争を口実に憲法を停止し専制を続けた。これに反発した将校・官僚の統一と進歩委員会が1908年に蜂起し、憲法を復活させた。混乱に乗じてオーストリアがボスニア・ヘルツェゴヴィナを併合し、ブルガリアが独立した。委員会はのちトルコ民族主義を強め、第一次世界大戦で同盟国側に立つ。1876年憲法を準備した青年オスマン人と区別する。","w":"統一と進歩委員会"},{"id":"m056","t":"mc","q":"清が1757年にヨーロッパ船の来航を広州一港に限定したのち、外国商人との貿易を独占的に取り扱わせ、徴税や外国人の管理にもあたらせた特許商人の組合を何と呼ぶか。","o":["会館・公所","山西商人","公行","徽州（新安）商人"],"a":2,"c":"【近世・東アジア】清の広州貿易と公行","y":1757,"ex":"乾隆帝は1757年、ヨーロッパ船の来航を広州に限り、特許商人の組合である公行に貿易を独占させた。自由貿易を求めるイギリスはマカートニー（1793年）を派遣したが拒否され、茶貿易の赤字を埋めるアヘン密輸が拡大した。公行は1842年の南京条約で廃止された。同郷・同業商人の互助施設である会館・公所や、全国で活動した山西・徽州商人と区別する。","w":"公行"},{"id":"m057","t":"mc","q":"19世紀前半にイギリス・インド・清の間で展開した三角貿易で、①イギリス→インド、②インド→清、③清→イギリスへ運ばれた主な商品の組み合わせとして正しいものはどれか。","o":["①綿織物　②アヘン　③茶","①アヘン　②綿織物　③絹","①茶　②綿花　③アヘン","①銀　②綿織物　③陶磁器"],"a":0,"c":"【近代・東アジア】三角貿易とアヘン","y":1820,"ex":"イギリスでは茶の需要が急増したが、清は英国製品をあまり求めず、支払いの銀が清へ流れた。そこでイギリスは綿織物をインドへ、インド産アヘンを清へ運ぶ三角貿易で決済した。1820年代以降は清から銀が流出して銀価が高騰し、銀納の税負担が増した農民を圧迫した。これが林則徐のアヘン取締りとアヘン戦争の背景である。大西洋三角貿易と混同しない。","w":"①綿織物　②アヘン　③茶"},{"id":"m058","t":"mc","q":"1842年の南京条約で、アヘン戦争後に清がイギリスへ割譲した島はどこか。","o":["香港島","九龍半島南部","新界","マカオ"],"a":0,"c":"【近代・東アジア】アヘン戦争と香港割譲","y":1842,"ex":"アヘン戦争に敗れた清は南京条約で、香港島割譲、上海など5港の開港、公行廃止、賠償金を認めた。香港は自由貿易港としてイギリスの東アジア進出の拠点となる。九龍半島南部の割譲は1860年の北京条約、新界の租借は1898年で経緯が異なり、1997年の返還は新界の租借期限に合わせて一括で行われた。マカオは16世紀以来のポルトガルの居住地である。","w":"香港島"},{"id":"m059","t":"mc","q":"1843年の虎門寨追加条約で清がイギリスに認めた内容のうち、清が他国に新たな特権を与えた場合、同じ特権を自動的にイギリスにも与えるとする取り決めはどれか。","o":["領事裁判権","協定関税制","片務的最恵国待遇","内地通商権"],"a":2,"c":"【近代・東アジア】不平等条約体制の形成","y":1843,"ex":"1843年の五港通商章程・虎門寨追加条約で、清は領事裁判権、協定関税制、片務的最恵国待遇を認めた。最恵国待遇が片務的なため、1844年に米（望厦条約）・仏（黄埔条約）が得た権利もイギリスに及び、特権が連鎖的に拡大した。清はこれを伝統的な「恩恵」と捉えたが、不平等条約体制の起点となった。内地旅行・通商は1858年の天津条約で認められた。","w":"片務的最恵国待遇"},{"id":"m060","t":"mc","q":"洪秀全が拝上帝会を母体に1851年に建国し、清朝打倒を掲げ、のちに土地均分を理想とする『天朝田畝制度』を定めた政権は何か。","o":["捻軍","太平天国","義和団","白蓮教徒"],"a":1,"c":"【近代・東アジア】太平天国の乱","y":1851,"ex":"銀価高騰による農民の困窮や客家と土着民の対立を背景に、洪秀全は拝上帝会を率いて1851年に太平天国を建て「滅満興漢」を掲げた。1853年に南京を天京とし、天朝田畝制度で土地均分を構想し辮髪・纏足も禁じたが、実施は限られた。鎮圧の主力が漢人官僚の郷勇だったことは地方勢力の台頭と洋務運動につながる。白蓮教徒の乱、華北の捻軍と区別する。","w":"太平天国"},{"id":"m061","t":"mc","q":"太平天国の乱に際し、曾国藩が郷里の湖南で組織し、太平天国鎮圧の主力となった郷勇（義勇軍）は何か。","o":["淮軍","湘軍","常勝軍","緑営"],"a":1,"c":"【近代・東アジア】太平天国の乱と郷勇","y":1853,"ex":"太平天国の乱で八旗・緑営などの正規軍が無力をさらすと、漢人官僚の曾国藩は郷里湖南で湘軍を、李鴻章は安徽で淮軍を組織し、湘軍が1864年に天京を陥落させた。これにより軍事・財政の実権が漢人地方官僚に移り、彼らが洋務運動の担い手となった。淮軍はのちの北洋軍の母体となる。外国人が指揮した常勝軍、漢人の正規軍である緑営と区別する。","w":"湘軍"},{"id":"m062","t":"mc","q":"アロー戦争（第2次アヘン戦争）後、曾国藩・李鴻章らが西洋の軍事技術や産業を導入し、清朝の強化を図った1860年代以降の改革運動は何か。","o":["戊戌の変法","洋務運動","清末新政","義和団運動"],"a":1,"c":"【近代・東アジア】清の洋務運動","y":1861,"ex":"アロー戦争と太平天国で危機に陥った清は、同治年間に曾国藩・李鴻章ら漢人官僚を中心に軍需工場・造船所・紡績会社などを設け、1861年には総理各国事務衙門を置いた。伝統的体制を保ったまま西洋技術を導入する「中体西用」の立場で、官僚主導の分散的な改革にとどまった。その限界は日清戦争の敗北で露呈し、制度改革をめざす変法運動が起こった。","w":"洋務運動"},{"id":"m063","t":"mc","q":"1895年の下関条約で、清が日本に割譲した領土の組み合わせはどれか。","o":["台湾・澎湖諸島と遼東半島","台湾・澎湖諸島と山東半島","香港島と九龍半島南部","琉球諸島と遼東半島"],"a":0,"c":"【近代・東アジア】日清戦争と下関条約","y":1895,"ex":"朝鮮をめぐる日清戦争に敗れた清は、下関条約で朝鮮の独立、遼東半島・台湾・澎湖諸島の割譲、賠償金2億両、開港場での工場設立権などを認めた。遼東半島は三国干渉で返還された。工場設立権は最恵国待遇で列強にも及び、賠償金のための借款とあわせて資本輸出と1898年以降の租借地設定（中国分割）を招いた。山東半島の膠州湾はドイツの租借地である。","w":"台湾・澎湖諸島と遼東半島"},{"id":"m064","t":"mc","q":"日清戦争敗北後、康有為・梁啓超らが光緒帝を支えて進めた、政治・教育・軍事などの近代化を目指す1898年の改革運動は何か。","o":["洋務運動","戊戌の変法（変法自強運動）","清末新政","辛亥革命"],"a":1,"c":"【近代・東アジア】清末改革と戊戌の変法","y":1898,"ex":"日清戦争の敗北と下関条約による列強の中国進出への危機感から、康有為・梁啓超らは光緒帝のもと、教育・行政・軍制などの改革を進めた。明治日本を参考に立憲君主制を目指す構想もあったが、1898年に西太后ら保守派がクーデタを起こし、改革は約100日で挫折した。洋務運動が主に西洋技術の導入を図ったのに対し、戊戌の変法は制度改革にも踏み込んだ。","w":"戊戌の変法（変法自強運動）"},{"id":"m065","t":"mc","q":"義和団事件の敗北後、西太后のもとで清朝が進めた改革で、1905年の科挙廃止や1908年の憲法大綱発布・国会開設の公約などを含むものは何か。","o":["洋務運動","戊戌の変法","光緒新政（清末新政）","同治中興"],"a":2,"c":"【近代・東アジア】光緒新政と辛亥革命の前提","y":1905,"ex":"義和団事件の敗北で権威を失った清朝は、かつて戊戌の変法を弾圧した西太后のもとで改革に転じた。1905年に科挙を廃止して新式学校や留学を奨励し、新軍を編成し、1908年には憲法大綱を公布した。しかし1911年の皇族内閣は立憲派を失望させ、留学生や新軍から育った革命派が辛亥革命を起こした。弾圧された戊戌の変法（1898年）と区別したい。","w":"光緒新政（清末新政）"},{"id":"m066","t":"mc","q":"「扶清滅洋」を掲げ、1900年に外国人宣教師や中国人キリスト教徒を襲撃し、列強の出兵を招いた運動は何か。","o":["白蓮教徒の乱","太平天国の乱","義和団運動","捻軍の乱"],"a":2,"c":"【近代・東アジア】義和団事件と列強の出兵","y":1900,"ex":"天津・北京条約で内地布教が認められると各地で仇教運動が起こり、山東の義和団は「扶清滅洋」を掲げて教会・鉄道を破壊した。1900年に清朝も列強に宣戦したが、日露を主力とする8か国連合軍に敗れ、1901年の北京議定書で巨額賠償と外国軍駐留を認めた。ロシアの満洲占領は日英同盟・日露戦争を招く。反満の太平天国とは逆に清を扶ける点が特徴。","w":"義和団運動"},{"id":"m067","t":"mc","q":"義和団事件後の1901年、清が列強と結び、北京の公使館区域の設置や北京から海岸までの要地への外国軍駐留などを認めた協約は何か。","o":["北京条約","北京議定書（辛丑和約）","天津条約","下関条約"],"a":1,"c":"【近代・東アジア】義和団事件と北京議定書","y":1901,"ex":"義和団が北京の公使館区域を包囲すると清朝も列強に宣戦したが、日露を主力とする八か国連合軍に敗れた。1901年の北京議定書で清は4億5000万両の賠償金を負い、公使館区域の設置と外国軍の駐兵を認めた。賠償は関税・塩税を担保とし、清の財政と主権は列強にいっそう拘束された。アロー戦争後の1860年の北京条約と名称を混同しないこと。","w":"北京議定書（辛丑和約）"},{"id":"m068","t":"mc","q":"1905年、孫文が中国同盟会の機関誌『民報』の発刊の辞で示し、満洲人王朝の打倒、共和政の樹立、地権の平均（土地所有の不平等の是正）を柱として同盟会の指導理念となった思想は何か。","o":["三民主義","新三民主義","中体西用","扶清滅洋"],"a":0,"c":"【近代・東アジア】中国革命運動と三民主義","y":1905,"ex":"日清戦争後の列強による中国分割と清朝の改革の遅れを背景に、興中会・華興会・光復会などが東京で結集して中国同盟会が成立した。三民主義は民族・民権・民生の三原則で清朝打倒と共和政樹立を理論づけ、辛亥革命の指導理念となった。第1次国共合作期の1924年に連ソ・容共・扶助工農と結びついた新三民主義や、洋務運動の中体西用と区別したい。","w":"三民主義"},{"id":"m069","t":"mc","q":"1911年10月10日、四川保路運動への対応で湖北新軍の一部が四川へ移された後、革命派兵士が蜂起し、辛亥革命の発端となった都市はどこか。","o":["成都","武昌","広州","南京"],"a":1,"c":"【近代・東アジア】辛亥革命の勃発","y":1911,"ex":"清が外国借款による幹線鉄道の国有化を打ち出すと、民間資本で鉄道建設を進めていた地方の紳士・商人が反発し、四川で保路運動が起こった。鎮圧に湖北新軍の一部が移動した隙に、武昌の新軍内の革命派が蜂起し、各省が次々と独立を宣言して清朝は崩壊へ向かった。同年4月に失敗した広州蜂起や、臨時政府が置かれた南京と取り違えないこと。","w":"武昌"},{"id":"m070","t":"mc","q":"宣統帝の退位後、孫文の辞任を受けて中華民国臨時大総統に就任した北洋軍閥の指導者は誰か。","o":["宋教仁","黎元洪","袁世凱","段祺瑞"],"a":2,"c":"【近代・東アジア】辛亥革命と中華民国の成立","y":1912,"ex":"武昌蜂起後、清朝に起用された袁世凱は北洋軍を背景に革命派と交渉し、1912年2月に宣統帝を退位させた。孫文は臨時約法で権限を縛ることを条件に臨時大総統を譲ったが、袁は北京で就任し、宋教仁暗殺や第二革命鎮圧を経て独裁を強め帝政も図った。王朝は倒れたが軍事力を握る旧勢力に政権が移った。武昌で都督に推された黎元洪と区別したい。","w":"袁世凱"},{"id":"m071","t":"mc","q":"19世紀後半以降、欧米列強が独占資本・金融資本の形成を背景に、資本輸出先や原料・市場を求めてアジア・アフリカで植民地や勢力圏の獲得を競った動きを何と呼ぶか。","o":["重商主義","帝国主義","自由貿易帝国主義","新植民地主義"],"a":1,"c":"【近現代・欧米】帝国主義と世界分割","y":1870,"ex":"1873年からの大不況と第2次産業革命で独占資本が形成され、銀行資本と産業資本が融合した金融資本が資本輸出先・原料・市場を求めて列強の植民地獲得競争を促した。アフリカ分割や中国の勢力圏設定が進み、列強の対立は第一次世界大戦へとつながった。18世紀までの重商主義や、自由貿易で非公式支配を広げた19世紀半ばの英国とは区別したい。","w":"帝国主義"},{"id":"m072","t":"mc","q":"ビスマルクの提唱で開かれ、アフリカ分割に際して、沿岸部の領有には実効支配を要するという先占権の原則を定めた国際会議は何か。","o":["ベルリン会議（1878年）","ベルリン＝コンゴ会議","アルヘシラス会議","ハーグ万国平和会議"],"a":1,"c":"【近現代・アフリカ】帝国主義とアフリカ分割","y":1884,"ex":"コンゴ川流域をめぐりベルギー王レオポルド2世と英・仏・葡の利害が対立し、ビスマルクが調停者として1884〜85年に開催した。コンゴ自由国が王の私有地として承認され、先に実効支配した国が領有できる原則が確認されると、列強は内陸へ進出し、アフリカ人不在のまま分割が加速した。露土戦争後のバルカン問題を扱った1878年のベルリン会議と混同しないこと。","w":"ベルリン＝コンゴ会議"},{"id":"m073","t":"mc","q":"イギリスのアフリカ縦断政策とフランスのアフリカ横断政策がスーダンのナイル川上流で衝突し、フランスの譲歩で決着した1898年の事件は何か。","o":["第1次モロッコ事件","南アフリカ戦争","ファショダ事件","アドワの戦い"],"a":2,"c":"【近現代・アフリカ】帝国主義とアフリカ分割","y":1898,"ex":"スーダンではマフディー派を破ったキッチナーの英軍が南下し、西から横断を進めたマルシャン率いる仏軍とナイル上流のファショダで対峙した。仏はドレフュス事件で国内が揺れ、英との戦争を避けて撤退した。ドイツの台頭を警戒した両国は1904年の英仏協商でエジプトとモロッコの優越権を相互承認した。独がからむモロッコ事件と主体を混同しないこと。","w":"ファショダ事件"},{"id":"m074","t":"mc","q":"南欧・東欧系の新移民の増加に対する排外主義の高まりを背景に、1924年にアメリカで成立し、1890年の国勢調査を基準とする出身国別割当で移民数を制限するとともに、帰化不能とされたアジア系移民の入国を禁止した法律は何か。","o":["中国人移民排斥法","日米紳士協約","移民法（いわゆる排日移民法）","禁酒法"],"a":2,"c":"【近現代・アメリカ】移民制限と排外主義","y":1924,"ex":"19世紀末から南欧・東欧系の新移民が急増すると、北西欧系プロテスタント中心の社会で排外主義が強まり、1920年代にはKKKの復活や禁酒法とならんで移民制限が進んだ。1924年の移民法は新移民の少なかった1890年を基準に割当を定め、アジア系移民を禁じたため、日本では排日移民法と呼ばれ対米感情が悪化した。中国人に限った1882年の排斥法と区別。","w":"移民法（いわゆる排日移民法）"},{"id":"m075","t":"mc","q":"1875年にスエズ運河会社の株式を買収し、1882年にはウラービー運動を鎮圧してエジプトを軍事占領した国はどこか。","o":["イギリス","フランス","オスマン帝国","ドイツ"],"a":0,"c":"【近現代・アフリカ】帝国主義とアフリカ分割","y":1882,"ex":"スエズ運河は1869年に仏人レセップスが開通させたが、エジプトは近代化事業の債務で財政が破綻し、1875年に英首相ディズレーリが運河会社株を買収した。英仏の財政管理に抗し「エジプト人のためのエジプト」を掲げたウラービー運動を鎮圧した英国は、1882年にエジプトを単独で軍事占領した。正式な保護国化は1914年で、運河建設の仏と取り違えないこと。","w":"イギリス"},{"id":"m076","t":"mc","q":"19世紀、奴隷貿易・奴隷制の廃止が進むなかで、プランテーションや鉱山、鉄道建設の労働力として中国やインドから大量に海外へ渡った契約労働者を何と呼ぶか。","o":["華僑","アシエント","苦力（クーリー）","客家"],"a":2,"c":"【近現代・世界】帝国主義と国際労働移動・移民","y":1860,"ex":"英国が1833年に奴隷制廃止を決めるなど奴隷貿易・奴隷制の廃止が進むと、プランテーションや鉱山、鉄道建設の労働力として中国南部やインドから契約労働者が送り出された。清は北京条約（1860年）で海外渡航を公認し、キューバ・ペルーや北米へ渡航が拡大した。渡航費の債務に縛られ実態は奴隷に近かった。商業で定着した華僑一般とは区別したい。","w":"苦力（クーリー）"},{"id":"m077","t":"mc","q":"アロー戦争後の1860年、ロシアの仲介で清が英・仏と結び、天津の開港、イギリスへの九竜半島南部の割譲、中国人の海外渡航の公認などを定めた条約は何か。","o":["天津条約","北京条約","南京条約","北京議定書（辛丑和約）"],"a":1,"c":"【近代・東アジア】アロー戦争と北京条約","y":1860,"ex":"1858年の天津条約の批准をめぐって戦闘が再開し、英仏軍が北京を占領して円明園を破壊すると、清はロシアの仲介で北京条約を結んだ。天津開港・九竜半島南部割譲・賠償金増額が加わり、海外渡航の公認は苦力貿易と華僑の急増を促した。ロシアは仲介の代償に沿海州を得た。公使の北京駐在を認めた天津条約や1901年の北京議定書と区別したい。","w":"北京条約"},{"id":"m078","t":"mc","q":"1848年に金鉱が発見されてゴールドラッシュが起こり、人口の急増により1850年に州に昇格したカリフォルニアが、アメリカ合衆国の領土となった経緯として正しいものはどれか。","o":["フランスから買収して獲得した","スペインから買収して獲得した","イギリスとの協定で国境を画定して獲得した","アメリカ＝メキシコ戦争の講和でメキシコから割譲された"],"a":3,"c":"【近現代・アメリカ】領土拡大とゴールドラッシュ","y":1848,"ex":"「明白な天命」を掲げて西方へ拡大した合衆国は、1845年のテキサス併合を機にアメリカ＝メキシコ戦争を起こし、1848年の講和でカリフォルニアなどを獲得した。ゴールドラッシュで欧州や中国から人が殺到し、自由州としての加盟は奴隷制をめぐる南北対立を深めた。ルイジアナ（仏から購入）、フロリダ（西から購入）、オレゴン（英と協定）と経緯を区別したい。","w":"アメリカ＝メキシコ戦争の講和でメキシコから割譲された"},{"id":"m079","t":"mc","q":"1882年、アメリカ連邦議会が中国人労働者の入国を10年間停止するために制定した法律は何か。","o":["中国人移民排斥法","移民法（いわゆる排日移民法）","日米紳士協約","ホームステッド法"],"a":0,"c":"【近現代・アメリカ】移民制限と排外主義","y":1882,"ex":"大陸横断鉄道の建設などで流入した中国人労働者は、1870年代の不況下で白人労働者と雇用を争う存在とされ、排華運動が高まった。1882年の法は中国人労働者の入国を10年間停止し帰化も認めず、特定民族を対象とした初の入国禁止となった。のち恒久化され、中国が連合国となった1943年に廃止された。日本人を対象とした日米紳士協約や1924年の移民法と区別。","w":"中国人移民排斥法"},{"id":"m080","t":"mc","q":"ゴールドラッシュ以降の中国人移民への反発を背景に、1901年のオーストラリア連邦成立とともに移民制限法によって確立された、非白人（特にアジア系）の移民を制限する政策は何か。","o":["アパルトヘイト","多文化主義","白豪主義","中国人移民排斥法"],"a":2,"c":"【近現代・オセアニア】国際労働移動と移民排斥","y":1901,"ex":"1850年代のゴールドラッシュで中国人が流入すると、白人労働者は低賃金労働との競争を嫌って排斥を求め、各植民地が入国制限を設けた。1901年のオーストラリア連邦成立直後、移民制限法で書き取り試験を課して非白人を排除し、政策として確立した。1970年代に撤廃され多文化主義へ転じた。米国の中国人移民排斥法や南アのアパルトヘイトと主体を混同しないこと。","w":"白豪主義"},{"id":"m081","t":"mc","q":"イギリス帝国で奴隷制が廃止されると、インドの人々をモーリシャスやカリブ海地域、南アフリカのナタールなどのサトウキビ農園へ数年単位の契約で送り込んだ労働制度を何と呼ぶか。","o":["カンガーニー制度","インデンチャー・レイバー（年季契約労働）","強制栽培制度","ザミンダーリー制"],"a":1,"c":"【近現代・インド洋・カリブ海】帝国主義と国際労働移動・移民","y":1834,"ex":"1833年に英帝国で奴隷制廃止が決まると、砂糖プランテーションの労働力不足を補うため、翌34年からインドの農民がモーリシャスへ、のちカリブ海のガイアナ・トリニダードや南アのナタール、フィジーへ5年程度の年季契約で送られた。1917年に停止されたが、各地に印僑社会が残った。17世紀北米の年季奉公人やセイロン茶園のカンガーニー制度と区別したい。","w":"インデンチャー・レイバー（年季契約労働）"},{"id":"m082","t":"mc","q":"イギリス領マレー半島（マラヤ）では、産業ごとに異なる民族が労働力として導入され、複合社会が形成された。錫鉱山とゴム園のおもな労働力の組合せとして正しいものはどれか。","o":["錫鉱山―インド人（タミル人）　ゴム園―中国人","錫鉱山―マレー人　ゴム園―インド人（タミル人）","錫鉱山―中国人　ゴム園―インド人（タミル人）","錫鉱山―中国人　ゴム園―ジャワ人"],"a":2,"c":"【近現代・東南アジア】植民地経済と複合社会","y":1900,"ex":"英国は海峡植民地を拠点にマレー半島へ支配を広げ、1895年にマレー連合州を形成した。錫鉱山には苦力として渡った中国南部の人々が、20世紀初頭に拡大したゴム園には南インドのタミル人が導入され、マレー人は主に農村で稲作を営んだ。この民族別分業は独立後の民族対立の火種となり、1965年のシンガポール分離につながった。錫とゴムの担い手を逆にしないこと。","w":"錫鉱山―中国人　ゴム園―インド人（タミル人）"},{"id":"m083","t":"mc","q":"19世紀に中国南部から東南アジアへ移住し、現地社会に定着して商業や金融業などで経済的に大きな影響力をもった中国系住民を何と呼ぶか。","o":["苦力（クーリー）","印僑","華僑（華人）","客家"],"a":2,"c":"【近現代・東南アジア】帝国主義と国際労働移動・移民","y":1860,"ex":"明代以降、福建・広東から東南アジアへの移住は続いていたが、19世紀に欧米の植民地開発で錫鉱山やプランテーションの労働需要が高まり、北京条約（1860年）で渡航が公認されると移住者が急増した。定着者は流通や金融を担い植民地経済の仲介者となった一方、民族運動期には反発も受けた。契約労働者の苦力とは区別し、現地国籍を取得した者を華人と呼ぶ点にも注意。","w":"華僑（華人）"},{"id":"m084","t":"mc","q":"1840年代後半にアイルランドを襲い、約100万人が飢えや疫病で死亡し、100万人以上がアメリカ合衆国などへ移住する契機となった出来事は何か。","o":["穀物法廃止","第2次囲い込み","ジャガイモ飢饉","大不況"],"a":2,"c":"【近現代・アイルランド】飢饉と国際移民","y":1845,"ex":"英国に併合されたアイルランドでは、不在地主のもと小作農がジャガイモに依存して暮らしていたが、1845年から胴枯れ病で凶作が続き、約100万人が飢えと疫病で死亡した。穀物の輸出は続き、英政府の救済も乏しく反英感情が強まった。移民は米国東部の都市で低賃金労働を担い、カトリックとして排斥された。1846年の穀物法廃止は飢饉を契機とした英国の政策で別事項。","w":"ジャガイモ飢饉"},{"id":"m085","t":"mc","q":"19世紀末から20世紀初頭にアメリカ合衆国へ渡った「新移民」について述べた文として正しいものはどれか。","o":["主に北欧・西欧の出身でプロテスタントが多く、ホームステッド法を利用して西部の農地に入植した者が多かった。","主にアイルランドの出身で、1840年代のジャガイモ飢饉を機に渡米し、カトリックとして排斥された。","主に南欧・東欧の出身でカトリック・東方正教・ユダヤ教の信者が多く、都市の工場などで未熟練労働に従事した。","主に中国の出身で、1924年の移民法によって初めて入国を制限された。"],"a":2,"c":"【近現代・アメリカ】移民と社会変容","y":1890,"ex":"第2次産業革命で工業化した米国は大量の未熟練労働力を求め、蒸気船の普及もあってイタリア・ポーランド・ロシアなどから移民が急増した。ポグロムを逃れたユダヤ人も多い。彼らは大都市の工場や鉱山で低賃金労働を担い、北西欧系でプロテスタント中心の社会から排斥され、1924年の移民法で制限された。アイルランド系や独系は旧移民に属する点に注意。","w":"主に南欧・東欧の出身でカトリック・東方正教・ユダヤ教の信者が多く、都市の工場などで未熟練労働に従事した。"},{"id":"m086","t":"mc","q":"第一次世界大戦後、ヴェルサイユ条約などの講和条約に規約が盛り込まれ、1920年に集団安全保障の理念に基づいて発足した国際平和機構は何か。","o":["国際連合","国際連盟","国際労働機関（ILO）","常設仲裁裁判所"],"a":1,"c":"【近現代・国際】ヴェルサイユ体制と国際協調","y":1920,"ex":"ウィルソンの十四か条が掲げた国際平和機構の構想をもとに、規約がヴェルサイユ条約の冒頭に置かれ、1920年に本部をジュネーヴとして発足した。集団安全保障を初めて制度化したが、米国は上院の反対で不参加、独・ソは当初排除され、議決は全会一致で制裁も経済制裁に限られた。武力制裁を認める安全保障理事会をもつ1945年の国際連合と区別したい。","w":"国際連盟"},{"id":"m087","t":"mc","q":"国際連盟の総会・理事会の議決で採用され、アメリカ合衆国など大国の不参加とならんで連盟の実効性を弱めたとされる原則は何か。","o":["多数決の原則","大国一致の原則（拒否権）","全会一致の原則","加重投票制"],"a":2,"c":"【近現代・国際】ヴェルサイユ体制と国際協調","y":1920,"ex":"国際連盟は主権国家の対等を重んじ、総会・理事会の重要事項の議決に出席加盟国の全会一致を求めたため、一国の反対で決定が滞った。制裁も経済制裁が中心で、満州事変やエチオピア侵攻を止められず、日独伊の脱退で機能を失った。この反省から国際連合は総会に多数決、安全保障理事会に大国一致の原則（拒否権）を採用した。両者を取り違えないこと。","w":"全会一致の原則"},{"id":"m088","t":"mc","q":"1928年、アメリカ国務長官とフランス外相の提唱によりパリで締結され、国際紛争解決のために戦争に訴えることを否定し、国家の政策の手段としての戦争を放棄することを約した条約は何か。","o":["ロカルノ条約","九か国条約","不戦条約（ケロッグ＝ブリアン協定）","ロンドン海軍軍縮条約"],"a":2,"c":"【近現代・国際】ヴェルサイユ体制と国際協調","y":1928,"ex":"ロカルノ条約で独仏の和解が進んだ国際協調の時期に、仏外相ブリアンが米国に提案し、米国務長官ケロッグが多国間条約に広げてパリで締結された。日本やソ連も含め多数の国が参加し、戦争違法化の原点として戦後の国連憲章にも継承された。一方で自衛戦争の判断は各国に委ねられ制裁規定もなく、満州事変を防げなかった。1925年のロカルノ条約と年代を区別したい。","w":"不戦条約（ケロッグ＝ブリアン協定）"},{"id":"m089","t":"mc","q":"1929年にニューヨーク株式市場の株価暴落から始まった世界恐慌が、とりわけドイツに深刻な打撃を与えた理由として最も適切なものはどれか。","o":["ルール占領が続き、主要な工業地帯をフランスに押さえられていたため。","ドーズ案以降、アメリカ資本の貸付に依存して経済再建と賠償支払いを行っていたが、その資本が引き揚げられたため。","金本位制に復帰せず、インフレーションが続いていたため。","イギリス・フランスが形成したブロック経済によって、輸出市場から締め出されていたため。"],"a":1,"c":"【近現代・国際】世界恐慌と国際経済秩序","y":1929,"ex":"敗戦国ドイツは巨額の賠償に苦しみ1923年に激しいインフレに陥ったが、1924年のドーズ案で米資本が流入し、独の賠償→英仏の対米戦債返済→米資本の再投資という循環で相対的安定を得た。恐慌で米資本が引き揚げられると循環は崩れ、失業者が急増してナチ党台頭を招いた。ルール占領は1925年に終わっており、ブロック経済は恐慌後の対応である。","w":"ドーズ案以降、アメリカ資本の貸付に依存して経済再建と賠償支払いを行っていたが、その資本が引き揚げられたため。"},{"id":"m090","t":"mc","q":"世界恐慌に対し、イギリスが1932年のオタワ連邦会議で本国と自治領・植民地の間に特恵関税を設けたように、列強が自国の経済圏を囲い込み、域外に高関税を課した閉鎖的な経済体制は何か。","o":["金本位制","ニューディール","五か年計画","ブロック経済"],"a":3,"c":"【近現代・国際】世界恐慌と国際経済秩序","y":1932,"ex":"世界恐慌で輸出が激減すると、英国は1931年に金本位制を停止し、翌32年のオタワ連邦会議で英連邦内に特恵関税を設けるスターリング＝ブロックを形成した。仏も金ブロックを組み、米国も高関税で自国市場を守った。広い植民地をもたない独伊日は市場と資源を求めて武力による経済圏拡大に走った。この反省から戦後はGATTによる自由貿易体制が築かれた。","w":"ブロック経済"},{"id":"m091","t":"mc","q":"1944年、連合国44か国が参加し、戦後の国際通貨・金融秩序の再建を目的として開かれた会議で成立した、国際通貨基金（IMF）と国際復興開発銀行（IBRD）を柱とする体制を何と呼ぶか。","o":["ヴェルサイユ体制","ヤルタ体制","ブレトンウッズ体制","変動相場制"],"a":2,"c":"【近現代・国際】戦後国際経済秩序","y":1944,"ex":"1930年代のブロック経済と為替切り下げ競争が世界経済を分断し大戦の一因となった反省から、1944年に連合国が協定を結んだ。米ドルを金と固定比率で交換し各国通貨をドルに固定する金・ドル本位制のもと、IMFと世界銀行が設立され、1947年のGATTとともに自由貿易を支えた。1971年のニクソン＝ショックで金とドルの交換が停止され、崩壊へ向かった。","w":"ブレトンウッズ体制"},{"id":"m092","t":"mc","q":"ブレトンウッズ協定に基づいて設立され、為替相場の安定を図るとともに、国際収支が赤字となった加盟国に短期資金を融資する国際機関は何か。","o":["国際復興開発銀行（世界銀行）","国際通貨基金（IMF）","関税と貿易に関する一般協定（GATT）","ヨーロッパ経済協力機構（OEEC）"],"a":1,"c":"【近現代・国際】戦後国際経済秩序","y":1945,"ex":"ブレトンウッズ協定で1945年に発足し、各国通貨の対ドル為替レートを固定する体制を支えるため、国際収支が赤字となった加盟国に短期資金を融通して為替の安定を図った。戦災復興や途上国開発に長期資金を貸す国際復興開発銀行（世界銀行）、関税引き下げで貿易自由化を進めたGATTと役割を区別したい。変動相場制移行後は債務危機国の支援が中心となった。","w":"国際通貨基金（IMF）"},{"id":"m093","t":"mc","q":"1947年、アメリカ大統領がギリシア・トルコへの軍事・経済援助を議会に求めて表明し、共産主義の拡大を阻止する「封じ込め政策」の出発点となった外交方針は何か。","o":["マーシャル＝プラン","モンロー宣言","トルーマン＝ドクトリン","アイゼンハワー＝ドクトリン"],"a":2,"c":"【近現代・国際】冷戦の形成","y":1947,"ex":"大戦で疲弊した英国が、共産勢力との内戦が続くギリシアやソ連の圧力を受けるトルコへの支援を続けられなくなると、トルーマン大統領は両国への援助を議会に求め、共産主義の拡大阻止を掲げた。これが封じ込め政策の出発点となり、ソ連はコミンフォルム結成で対抗した。方針表明であるドクトリンと、同年に発表された欧州経済援助計画のマーシャル＝プランを区別したい。","w":"トルーマン＝ドクトリン"},{"id":"m094","t":"mc","q":"1947年、アメリカ合衆国の国務長官が提唱し、第二次世界大戦で荒廃したヨーロッパの経済復興を目的として実施された大規模な援助計画は何か。","o":["マーシャル＝プラン","トルーマン＝ドクトリン","ヨーロッパ経済協力機構（OEEC）","コメコン（経済相互援助会議）"],"a":0,"c":"【近現代・国際】冷戦の形成","y":1947,"ex":"大戦で荒廃した欧州では経済混乱の中で仏伊の共産党が勢力を伸ばしており、国務長官マーシャルは経済再建によって共産主義の浸透を防ごうとした。援助はソ連・東欧にも開かれていたが、ソ連は拒否して東欧諸国にも不参加を強い、コミンフォルムやコメコンで対抗したため欧州の東西分断が固まった。受入れ機関のOEECや方針表明のトルーマン＝ドクトリンと区別したい。","w":"マーシャル＝プラン"},{"id":"m095","t":"mc","q":"マーシャル＝プランに対抗して、ソ連と東欧諸国が1949年に結成した経済協力機構は何か。","o":["コミンフォルム（共産党情報局）","コメコン（経済相互援助会議）","ワルシャワ条約機構","コミンテルン（第3インターナショナル）"],"a":1,"c":"【近現代・ヨーロッパ】冷戦の形成","y":1949,"ex":"マーシャル＝プランの受入れを東欧諸国に禁じたソ連は、代わりの経済的結束として1949年にコメコンを設け、ソ連中心の国際分業体制を築いた。東欧諸国はソ連の原料と市場に依存し、西側との経済格差が広がった。1947年の情報交換機関コミンフォルム、1955年の軍事同盟ワルシャワ条約機構と役割・年代を区別したい。東欧革命後の1991年に解散した。","w":"コメコン（経済相互援助会議）"},{"id":"m096","t":"mc","q":"1949年、ソ連によるベルリン封鎖などで東西対立が深まるなか、アメリカ合衆国・カナダと西欧諸国が結成した集団防衛のための軍事同盟は何か。","o":["ブリュッセル条約（西ヨーロッパ連合条約）","ワルシャワ条約機構","東南アジア条約機構（SEATO）","北大西洋条約機構（NATO）"],"a":3,"c":"【近現代・ヨーロッパ・北アメリカ】冷戦の形成","y":1949,"ex":"1948年のチェコスロヴァキア＝クーデタやベルリン封鎖でソ連への脅威感が強まると、英仏ベネルクスのブリュッセル条約を土台に米国とカナダが加わり、1949年に北大西洋条約が結ばれた。米国が平時に欧州と軍事同盟を結ぶのは初めてで、孤立主義からの転換を示した。西独の加盟（1955年）に対抗してワルシャワ条約機構が生まれ、軍事的な東西対立が固定化した。","w":"北大西洋条約機構（NATO）"},{"id":"m097","t":"mc","q":"西ドイツのNATO加盟に対抗して、1955年にソ連と東欧社会主義諸国が結成した軍事同盟は何か。","o":["コメコン（経済相互援助会議）","コミンフォルム（共産党情報局）","ワルシャワ条約機構","中ソ友好同盟相互援助条約"],"a":2,"c":"【近現代・ヨーロッパ】冷戦の展開","y":1955,"ex":"1954年のパリ協定で西ドイツの再軍備とNATO加盟が決まり、1955年5月に加盟が実現すると、ソ連は直後に東欧7か国と相互援助条約を結び統一司令部を設けた。同盟は外敵への備えだけでなく東欧の統制にも用いられ、1968年のチェコスロヴァキアの自由化運動は条約機構軍が軍事介入で鎮圧した。経済機構のコメコン（1949年）と役割・年代を区別したい。","w":"ワルシャワ条約機構"},{"id":"m098","t":"mc","q":"1955年、インドのネルー、中国の周恩来、インドネシアのスカルノらが中心となり、アジア・アフリカの29か国が参加して平和十原則を採択した会議は何か。","o":["バンドン会議（第1回アジア・アフリカ会議）","第1回非同盟諸国首脳会議","ジュネーヴ4巨頭会談","コロンボ会議"],"a":0,"c":"【近現代・アジア・アフリカ】第三世界の台頭","y":1955,"ex":"戦後に独立したアジア諸国は東西いずれの陣営にも属さない第三勢力を志向し、1954年のネルー・周恩来会談の平和五原則を発展させて、反植民地主義や平和共存を掲げる平和十原則を採択した。参加国には軍事同盟加盟国も含まれた。この流れはアフリカの独立を後押しし、1961年にユーゴのティトーらが主導したベオグラードの非同盟諸国首脳会議へ引き継がれた。","w":"バンドン会議（第1回アジア・アフリカ会議）"},{"id":"m099","t":"mc","q":"1971年、アメリカ大統領が金とドルの交換停止などを発表し、ブレトンウッズ体制（固定相場制）崩壊のきっかけとなった出来事は何か。","o":["プラザ合意","ニクソン＝ショック","スミソニアン協定","第1次石油危機"],"a":1,"c":"【近現代・国際】戦後国際経済秩序の転換","y":1971,"ex":"ベトナム戦争の戦費や対外援助、西欧・日本の経済復興による貿易収支悪化でドルが大量に流出し、米国の金準備は減少していた。1971年8月、ニクソン大統領は金とドルの交換停止と輸入課徴金を発表した。同年末のスミソニアン協定で固定相場の維持が図られたが、1973年に主要国は変動相場制へ移行し、同年の石油危機とあわせて戦後の高度成長は終わった。","w":"ニクソン＝ショック"},{"id":"m100","t":"mc","q":"1989年12月、アメリカのブッシュ（父）大統領とソ連のゴルバチョフ書記長が地中海の島で会談し、冷戦の終結を宣言した出来事は何か。","o":["ヤルタ会談","ジュネーヴ4巨頭会談","中距離核戦力（INF）全廃条約","マルタ会談"],"a":3,"c":"【近現代・国際】冷戦の終結","y":1989,"ex":"ゴルバチョフの新思考外交で米ソ関係が改善し、1987年のINF全廃条約が結ばれたのち、1989年には東欧革命が進んでベルリンの壁が開放された。これを受け同年12月、地中海のマルタ島沖でブッシュとゴルバチョフが会談し冷戦の終結を確認した。翌90年の東西ドイツ統一、91年のソ連解体へと続く。大戦末期に戦後秩序を定めたヤルタ会談と取り違えないこと。","w":"マルタ会談"},{"id":"e01","t":"essay","q":"11世紀後半から12世紀前半にかけて展開した叙任権闘争について、その背景となった教会改革運動と神聖ローマ皇帝の統治構造に触れながら、闘争の経過と、それがドイツの政治に及ぼした影響を述べなさい。（400字以内）","pts":["クリュニー修道院を中心とする改革運動が聖職売買・聖職者妻帯を否定し、世俗権力からの教会の自立を求めた","皇帝はオットー1世以来の帝国教会政策により、司教・修道院長を任命して統治の支柱としていた（叙任権はその要）","教皇グレゴリウス7世が世俗叙任を禁止し、反発したハインリヒ4世を破門","1077年カノッサの屈辱。諸侯が破門を口実に皇帝廃位を図ったため、皇帝は屈服して破門解除を優先した","1122年ヴォルムス協約で妥協。聖職者としての叙任権は教皇、封土授与は皇帝という二元的解決","帰結として皇帝は教会組織を統治基盤にできなくなり、諸侯の自立が進んでドイツの分権化が決定的になった"],"lim":400,"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1077,"ex":"皇帝が司教を任命して統治に用いる帝国教会政策こそが争点である。皇帝は教会組織という支配の柱を失い、逆に諸侯は自立を強めた。カノッサでの屈服は諸侯による廃位の動きを封じる政治的判断であって、単純な教皇権の勝利ではない。教皇権の絶頂はおよそ1世紀後のインノケンティウス3世期であり、混同しないこと。","w":"11世紀後半から12世紀前半にかけて展開した叙任"},{"id":"e02","t":"essay","q":"十字軍運動が西ヨーロッパ社会にもたらした変化について、教皇権・封建諸侯・都市の三つの観点から述べなさい。（400字以内）","pts":["背景はセルジューク朝のアナトリア進出とビザンツ皇帝の救援要請で、教皇ウルバヌス2世がクレルモン宗教会議（1095）で聖地回復を提唱した","教皇権：提唱者として権威を高め、インノケンティウス3世期に絶頂を迎えたが、聖地回復の失敗と遠征の変質によって権威がゆらぎ、のちの王権への屈服（アナーニ事件・教皇のバビロン捕囚）の伏線となった","封建諸侯：遠征の戦費負担と戦死によって諸侯・騎士が没落し、遠征を指揮した国王の権威が相対的に高まった","戦費を必要とした諸侯は都市に特許状を与えて自治を認める代わりに資金を得ることが多く、都市の自立が進んだ","都市：兵員・物資の輸送を担ったヴェネツィア・ジェノヴァなど北イタリア諸都市が東方貿易（レヴァント貿易）で繁栄し、遠隔地商業と貨幣経済が発展した","貨幣経済の浸透は賦役から貨幣地代への移行を促し、領主と農民の関係を変えて荘園制を動揺させた（黒死病による労働力不足は14世紀の別要因として区別する）"],"lim":400,"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1096,"ex":"骨格は背景を一文で示したうえで、教皇権・諸侯・都市の三観点を順に書き、最後に封建社会の動揺でまとめる形。聖地回復の失敗そのものより副次的な影響が問われている。第4回十字軍（1204）は教皇権絶頂期のインノケンティウス3世のもとで起きたヴェネツィア主導の逸脱で、これを直ちに教皇権失墜の象徴とするのは時期的に不正確である。黒死病など後代の要因を十字軍の結果に混ぜるのも典型的な失点。諸侯の没落が王権の伸長と都市の自治獲得に結びつく連関を書けるかで差がつく。","w":"十字軍運動が西ヨーロッパ社会にもたらした変化につ"},{"id":"e03","t":"essay","q":"中世西ヨーロッパの都市はどのようにして自治を獲得したか。その経済的背景と、封建社会のなかで都市が占めた位置に言及しながら述べなさい。（400字以内）","pts":["11〜12世紀の農業生産力の上昇（三圃制・重量有輪犂）と人口増加、遠隔地商業の復活が前提","国王・諸侯・司教などの領主から特許状を得るか、金銭で買い取るか、武力闘争によって自治権を獲得した","北イタリアでは皇帝権が弱くコムーネが事実上の都市国家となり、ドイツでは皇帝直属の帝国都市が諸侯と並ぶ地位を得た","ロンバルディア同盟やハンザ同盟など都市同盟を結んで特権を守った","内部は商人ギルド、のち同職ギルド（ツンフト）が市政と市場を統制し、市参事会が運営した","都市は領主の特許状によって認められた特権団体として封建社会の内部に位置づけられ（北イタリアのコムーネは周辺農村を支配する領主ともなった）、「都市の空気は自由にする」の原則で農奴を受け入れつつ、王権と結んで諸侯に対抗した"],"lim":400,"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1100,"ex":"骨格は①農業生産力の上昇と遠隔地商業の復活という経済的背景、②特許状の取得・買い取り・武力闘争という自治獲得の方法、③地域差（北イタリアのコムーネ、ドイツの帝国都市）、④都市同盟とギルドによる運営、⑤封建社会における位置の順。都市を封建社会の外にある近代的存在と描くのが典型的な誤りで、領主の特許状に基づく特権団体として封建秩序の内部にあり、王権と結んで諸侯に対抗した点を書けると差がつく。","w":"中世西ヨーロッパの都市はどのようにして自治を獲得"},{"id":"e04","t":"essay","q":"歴代の神聖ローマ皇帝が繰り返したイタリア政策とはどのようなものか。その動機を説明したうえで、この政策がドイツとイタリア双方の政治にもたらした帰結を述べなさい。（300字以内）","pts":["動機はローマ皇帝の称号と教皇による戴冠がもたらす普遍的権威、および北イタリア都市の富の掌握","オットー1世の戴冠（962）以来、皇帝は繰り返しアルプスを越えて遠征した","シュタウフェン朝フリードリヒ1世の遠征はロンバルディア同盟と教皇に阻まれ、レニャーノの戦いで敗北した","ドイツでは皇帝の不在が常態化して諸侯が自立し、大空位時代を経て金印勅書（1356）が七選帝侯による選挙を定めて分権が固定化した","イタリアでは統一政権が生まれず、教皇党と皇帝党の抗争と都市国家の分立が続いた"],"lim":300,"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1155,"ex":"骨格は動機（皇帝の普遍的権威と北イタリアの富）→ 遠征の経過（オットー1世の戴冠、フリードリヒ1世のレニャーノでの敗北）→ ドイツへの帰結 → イタリアへの帰結の順。300字なので経過は最小限にして帰結に字数を割く。皇帝の不在が諸侯の自立を招き、金印勅書で分権が法的に固定された因果と、イタリアでも統一権力が生まれなかった「双方の分裂」という逆説を示せるかで差がつく。ドイツ側だけ書いて終わるのが典型的な失点。","w":"歴代の神聖ローマ皇帝が繰り返したイタリア政策とは"},{"id":"e05","t":"essay","q":"英仏百年戦争を単純な二つの国家間の戦争と捉えることができない理由を説明したうえで、この戦争がフランスの社会と王権にもたらした変化を述べなさい。（400字以内）","pts":["開戦時のイギリス王はフランス国内にギエンヌなどの所領を持つフランス王の封建家臣でもあり、封建的主従関係をめぐる争いという性格を持つ","争点は毛織物工業地帯フランドルの支配権とギエンヌのぶどう酒交易という経済的利害であった","カペー朝の断絶に際しエドワード3世が母を通じて王位継承権を主張した","戦争中、ブルゴーニュ派とアルマニャック派が対立するなどフランス封建諸侯間の内戦の側面が強い","黒死病と戦乱で農村が荒廃し、ジャックリーの乱など農民反乱が起きた","ジャンヌ＝ダルクの登場を機に戦局が転換し、カレーを除く大陸領をイギリスが失った","諸侯・騎士が没落し、常備軍と恒常的課税権を握った国王のもとで中央集権化と国民意識の形成が進んだ"],"lim":400,"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1337,"ex":"前半で「二国間戦争ではない理由」（英王がフランス王の封建家臣であったこと、王位継承問題、フランドルとギエンヌをめぐる経済的利害、ブルゴーニュ派とアルマニャック派の内戦）を示し、後半で社会と王権の変化を書く二部構成。開戦時から国民国家どうしの戦争として描き、近代の国境観を持ち込むのが典型的な誤り。戦争の長期化が騎士の没落と常備軍・恒常的課税を生み、中央集権化と国民意識の形成につながった「結果としての国家形成」を書けるかで差がつく。","w":"英仏百年戦争を単純な二つの国家間の戦争と捉えるこ"},{"id":"e06","t":"essay","q":"ルターの宗教改革がドイツの政治構造に与えた影響について、改革の発端からアウクスブルクの和議に至る経過を踏まえて述べなさい。（400字以内）","pts":["レオ10世によるサン＝ピエトロ大聖堂改築のための贖宥状販売に対し、九十五カ条の論題（1517）を発表した","信仰義認説・聖書のみ・万人祭司主義は教皇の権威と教会組織を否定する主張であった","皇帝権が弱く諸侯が自立的なドイツは「ローマの牝牛」と呼ばれる教皇の収奪の対象で、反教皇感情が広く存在した","ヴォルムス帝国議会で帝国追放となるがザクセン選帝侯に保護され、ドイツ語訳聖書が普及した","ドイツ農民戦争でルターが諸侯側に立ったため、改革は諸侯主導の運動へ転換した","シュマルカルデン同盟と皇帝カール5世の戦争。皇帝はオスマン帝国・フランスとの抗争を抱え妥協を迫られた","アウクスブルクの和議（1555）は諸侯に信仰選択権を認め、領邦教会制のもとで領邦君主の権力が強化された"],"lim":400,"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1517,"ex":"骨格は発端（贖宥状と九十五カ条の論題）→ 教義が教皇権を否定した意味 → ドイツ特有の条件（弱い皇帝権と「ローマの牝牛」）→ 農民戦争を機に諸侯主導へ → シュマルカルデン戦争 → アウクスブルクの和議の順。和議が認めたのは諸侯の信仰選択権であり、個人の信仰の自由やカルヴァン派の公認ではない点が頻出の誤り。改革が領邦教会制を通じて領邦君主の権力強化に組み込まれたこと、皇帝がオスマン・フランスとの抗争に縛られた事情まで結べると差がつく。","w":"ルターの宗教改革がドイツの政治構造に与えた影響に"},{"id":"e07","t":"essay","q":"16世紀の地中海世界におけるオスマン帝国とスペインの対立について、その宗教的・政治的背景を説明し、ヨーロッパの国際関係に与えた影響を述べなさい。（400字以内）","pts":["スレイマン1世期のオスマン帝国はイスラーム世界の盟主として拡大し、ハンガリーを制圧して第1次ウィーン包囲（1529）を行い、プレヴェザの海戦（1538）で地中海の制海権を握った","スペインはレコンキスタ（1492年グラナダ陥落）以来カトリックの守護者を自任し、スペイン・神聖ローマ帝国・ネーデルラントを支配するハプスブルク家が対オスマンの最前線に立った","ハプスブルク家に挟まれたフランスはイタリア戦争の延長で異教のオスマンと提携し、オスマンもハプスブルク牽制のためこれに応じてフランスにカピチュレーションを与えた","レパントの海戦（1571）でスペイン・ヴェネツィア・教皇の連合艦隊が勝利したが、オスマンはすぐに艦隊を再建しキプロスを確保した","スペインは対オスマン・オランダ独立戦争・対イギリスの多方面の戦争で国力を消耗し、覇権は北西ヨーロッパへ移った","宗教の違いを超えた仏・オスマン提携は、宗教より国家利害を優先する勢力均衡の論理を示し、主権国家体制への移行を先取りした"],"lim":400,"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1571,"ex":"骨格は①イスラーム世界の盟主としてのオスマンの拡大、②カトリックの守護者を自任するスペイン＝ハプスブルク、③フランスとオスマンの提携、④レパントの海戦とその限界、⑤国際関係への影響の順。宗教対立の外見の裏で、カトリック国フランスが異教のオスマンと結んだ事実に国家利害優先の勢力均衡が表れる点が得点の核心。レパントの敗北でオスマンが衰退したとするのは典型的な誤りで、オスマンは艦隊を再建しキプロスも確保した。","w":"16世紀の地中海世界におけるオスマン帝国とスペイ"},{"id":"e08","t":"essay","q":"三十年戦争の性格が宗教戦争から国際戦争へと変化していった過程を説明し、ウェストファリア条約がヨーロッパの国際秩序に対して持った意義を述べなさい。（400字以内）","pts":["発端はベーメンの新教徒の反乱。アウクスブルクの和議がカルヴァン派を認めなかった矛盾が背景にある","デンマーク、ついでスウェーデンのグスタフ＝アドルフが新教側で介入し、戦争は国際化した","カトリック国フランスが宰相リシュリューのもと新教側で参戦し、宗教よりも反ハプスブルクという国家利害が優先されたことが明確になった","ヴァレンシュタインらの傭兵と略奪によってドイツは荒廃し、人口が激減した","ウェストファリア条約（1648）はカルヴァン派を公認し、諸侯にほぼ完全な主権を認めて神聖ローマ帝国を事実上解体させた","オランダ・スイスの独立を国際的に承認し、フランスはアルザス、スウェーデンは西ポンメルンを獲得した","主権国家が対等な立場で条約により秩序を形成する体制が成立し、教皇・皇帝の普遍的権威は終わった"],"lim":400,"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1618,"ex":"骨格は発端（ベーメンの反乱とアウクスブルクの和議の矛盾）→ デンマーク・スウェーデンの介入 → フランスの新教側での参戦 → ウェストファリア条約の内容 → 国際秩序上の意義の順。カトリック国フランスが新教側についた事実が宗教から国家理性への転換を最も鮮明に示す。意義を主権国家体制の成立と神聖ローマ帝国の形骸化（「帝国の死亡診断書」）の両面で書けると差がつく。オランダ・スイス独立は既成事実の追認で、条約で初めて独立したと書くのは誤り。","w":"三十年戦争の性格が宗教戦争から国際戦争へと変化し"},{"id":"e09","t":"essay","q":"近世ヨーロッパにおける主権国家体制の形成について、常備軍・官僚制・重商主義政策の相互関係に着目して述べなさい。（300字以内）","pts":["教皇・皇帝・封建領主が重なり合う中世的な支配に代わり、明確な領域と最高権力を持つ国家が並立するようになった","火器と歩兵戦術の普及により傭兵から常備軍へ移行し、軍事費が巨額化した","戦費を賄う恒常的な課税には徴税機構が不可欠で、国王に直属する官僚制が整備された","重商主義は貿易黒字による金銀の蓄積を国富とみなし、輸出振興・保護関税・特権会社・植民地獲得を進めた（フランスのコルベール）","常備軍と官僚制の維持費が重商主義を要請し、重商主義がさらなる戦争を招く循環が生じた","主権国家は相互に勢力均衡を保つことで秩序を維持した"],"lim":300,"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1650,"ex":"骨格は中世的な多元的支配との対比から入り、①火器の普及による常備軍と戦費の増大、②戦費を賄う課税のための官僚制、③財源確保のための重商主義、④重商主義が商業戦争を招く、という循環として説明する。三要素を並列に説明するだけでは「相互関係」に答えたことにならず、失点の典型である。絶対王政の王権も特権身分や地方の抵抗に制約されていた点、主権国家の並立が勢力均衡を生んだ点まで触れると差がつく。","w":"近世ヨーロッパにおける主権国家体制の形成について"},{"id":"e10","t":"essay","q":"16世紀以降のアメリカ大陸産の銀の流入が、ヨーロッパおよびアジアの経済にどのような影響を与えたかを述べなさい。（400字以内）","pts":["スペインはポトシ銀山（1545年発見）で先住民をミタ制により強制労働させ、メキシコのサカテカスなどの銀山とあわせて大量の銀をヨーロッパへ運んだ","ヨーロッパでは価格革命が起こり、固定地代に依存する封建領主層が没落する一方、商工業者は利益を得て資本を蓄積した","西欧の商工業化に対し、東欧では再版農奴制のもとグーツヘルシャフトが穀物を西欧へ輸出する国際分業が成立した","貿易の中心が地中海から大西洋沿岸（アントウェルペン、のちアムステルダム・ロンドン）へ移った（商業革命）","銀はヨーロッパからアジアへも流出し、香辛料・絹・綿布・茶などアジア産品の代価として支払われた（ヨーロッパの対アジア貿易赤字を銀で決済）","アカプルコ・マニラ間のガレオン貿易でメキシコ銀が直接中国へ流入し、日本銀とあわせて明の一条鞭法、清の地丁銀制という銀納税制を可能にした","17世紀に銀の流入が減ると中国経済は停滞し、これを明末の混乱の一因とみる説もある"],"lim":400,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1545,"ex":"骨格は銀の産出（ラテンアメリカ）→ ヨーロッパ（価格革命、西欧と東欧の分業、商業の中心の移動）→ アジア（ヨーロッパ経由とマニラ経由の二つのルート、中国の銀納税制）の順。銀がヨーロッパを経てアジアへ流れた点を落とし、価格革命だけで終わるのが典型的な失点。西欧の資本蓄積・東欧の再版農奴制・中国の銀経済を一つの世界的循環として結べると差がつく。価格革命の主因や明の滅亡と銀の関係は学説が分かれるので断定しない。","w":"16世紀以降のアメリカ大陸産の銀の流入が、ヨーロ"},{"id":"e11","t":"essay","q":"イギリスで最初に産業革命が起こった理由について、農業・資本・労働力・市場・技術のそれぞれの条件に言及して述べなさい。（400字以内）","pts":["第2次囲い込みとノーフォーク農法による農業革命が増加する人口を養う食料を増産し、同時に土地を失った農民を都市の賃労働者として供給した","大西洋三角貿易と奴隷貿易、植民地経営で蓄積された商業資本が工業に投下された","インドをはじめ広大な植民地と、フランスとの植民地抗争に勝利して得た海外市場を持ち、インド産綿布（キャラコ）への旺盛な需要が綿織物の国産化を促した","石炭と鉄鉱石が国内に豊富で、運河網など輸送条件も整っていた","毛織物工業の伝統とギルド規制の弱さ、市民革命後の私的所有権の安定と特許制度が企業活動を促した","飛び杼以降、紡績と織布が交互に技術革新を促す連鎖が生じ、ワットの蒸気機関が動力を汎用化した"],"lim":400,"c":"【近代欧米】産業革命と労働問題・社会主義","y":1760,"ex":"骨格は設問の五条件を一つずつ示しつつ、「なぜフランスやオランダではなくイギリスか」という比較の視点でまとめる。囲い込みが食料と労働力の双方を供給した二重の役割、三角貿易による資本蓄積、インド産綿布への需要が綿工業の機械化を促した点は落とせない。発明家と機械名の羅列に終わるのが典型的な失点で、需要の拡大が発明を呼び、紡績と織布の不均衡が連鎖的な技術革新を生んだという因果で書けると差がつく。","w":"イギリスで最初に産業革命が起こった理由について、"},{"id":"e12","t":"essay","q":"産業革命が労働者の生活と社会構造にもたらした変化を述べ、それに対してイギリスの国家がどのような対応をとったかを説明しなさい。（400字以内）","pts":["工場制機械工業が成立し、産業資本家と労働者という新しい階級関係が生まれた","長時間労働・低賃金・女性や児童の労働が常態化し、マンチェスターなど工業都市では過密と衛生問題が深刻化した","初期の抵抗は機械打ちこわし（ラッダイト運動）で、団結禁止法のもと労働組合は非合法であった","団結禁止法の廃止（1824）で労働組合が認められ、工場法（1833）が児童労働を制限して工場監督官を置き、のち10時間労働法（1847）が制定された","新救貧法（1834）は救貧院収容を原則として救済を抑制し労働者の反発を招いた一方、公衆衛生法（1848）で都市環境の改善に着手した","第1回選挙法改正（1832）は腐敗選挙区を廃して産業資本家に参政権を与えたが労働者を除外した","参政権を求めるチャーティスト運動が起こったが、国家は請願を拒否し、労働者の政治参加は1867年以降の選挙法改正まで持ち越された"],"lim":400,"c":"【近代欧米】産業革命と労働問題・社会主義","y":1833,"ex":"「変化」と「国家の対応」の二段構成で書く。前半は資本家と労働者という階級関係の成立、長時間労働・児童労働、工業都市の衛生問題。後半は抑圧（団結禁止法）から容認・保護（組合の容認、工場法、公衆衛生法）へという国家の姿勢の変化を軸にする。選挙法改正が産業資本家を取り込み労働者を排除した結果チャーティスト運動を招いた因果が差のつく点。工場法を人道主義だけで説明するのは不十分で、労働力保全という資本側の必要にも触れたい。","w":"産業革命が労働者の生活と社会構造にもたらした変化"},{"id":"e13","t":"essay","q":"19世紀ヨーロッパにおける社会主義思想の展開について、初期社会主義からマルクス主義、および国際的な労働者組織の形成に至る過程を述べなさい。（400字以内）","pts":["産業革命がもたらした労働者の窮乏と、自由放任主義への批判が出発点である","オーウェンはニューラナークの工場経営と協同組合を実践し、サン＝シモン・フーリエらとともに初期社会主義と呼ばれる","マルクスとエンゲルスは『共産党宣言』（1848）で階級闘争と史的唯物論を説き、『資本論』で資本主義を分析した","二月革命後の臨時政府にルイ＝ブランが入り国立作業場が設けられたが、六月蜂起の鎮圧で挫折した","第1インターナショナル（1864）はマルクス派とバクーニンら無政府主義者の対立、パリ＝コミューン敗北の影響で解散した","第2インターナショナル（1889）はドイツ社会民主党を中心とし、ベルンシュタインの修正主義が台頭した","第一次世界大戦で各国の社会主義政党が自国の戦争を支持したため第2インターは崩壊し、のちコミンテルンが結成された"],"lim":400,"c":"【近代欧米】産業革命と労働問題・社会主義","y":1848,"ex":"骨格は産業革命下の労働者の窮乏 → 初期社会主義（オーウェン、サン＝シモン、フーリエ）→ 二月革命の国立作業場の挫折 → マルクス主義 → 第1インターの解散 → 第2インターと修正主義 → 大戦による崩壊の順。思想家と著作の羅列は典型的な失点で、運動の挫折が次の思想を生む連鎖として書く。「空想的社会主義」はエンゲルスらによる呼称である点、各国社会主義政党の戦争協力が第2インター崩壊とコミンテルン結成につながった点まで示せると差がつく。","w":"19世紀ヨーロッパにおける社会主義思想の展開につ"},{"id":"e14","t":"essay","q":"チャーティスト運動の要求内容とその背景を説明し、運動が挫折した理由およびその後のイギリス労働運動の展開について述べなさい。（300字以内）","pts":["第1回選挙法改正（1832）で産業資本家は参政権を得たが労働者は除外され、新救貧法への反発と不況が重なった","人民憲章（1838）は男性普通選挙、秘密投票、議員の財産資格廃止、議員への歳費支給、平等選挙区、毎年の議会改選を要求した","要求はいずれも政治的なもので、労働条件そのものの要求ではない点が特徴である","数百万の署名を集めた請願を議会は拒否し、穏健派と武力派の分裂、統一的指導の欠如が運動を弱めた","1850年代以降の好景気と穀物法廃止による生活改善が支持を失わせた","その後は熟練工中心の労働組合による労使交渉路線が主流となり、選挙法改正で参政権が拡大し、1900年の労働代表委員会を経て労働党が成立した"],"lim":300,"c":"【近代欧米】産業革命と労働問題・社会主義","y":1838,"ex":"300字なので、背景（第1回選挙法改正での労働者の排除、新救貧法と不況）→ 人民憲章の要求 → 挫折の理由 → その後の展開を各二文程度で書く。要求が労働条件ではなく普通選挙などの政治的要求だった点をまず示すこと。挫折の理由を弾圧だけに求めるのは不十分で、運動内部の分裂と1850年代の好況による支持の喪失を挙げると差がつく。毎年改選を除く要求はのちに実現し、運動が議会主義・労働組合主義へ引き継がれた点を結論に置く。","w":"チャーティスト運動の要求内容とその背景を説明し、"},{"id":"e15","t":"essay","q":"19世紀ドイツの工業化の特徴について、イギリスとの違いに留意しながら、政治的統一の過程および国家の役割に言及して述べなさい。（400字以内）","pts":["領邦分立による国内関税、農奴解放の遅れ、資本と市場の未成熟という後発国の条件から出発した","ドイツ関税同盟（1834）による経済的統一が政治的統一に先行した","リストら歴史学派は、後発国は幼稚産業を保護すべきと説き、イギリスの自由貿易に対抗する保護貿易論を展開した","鉄道建設が石炭・鉄鋼業の発展を牽引し、プロイセン国家は鉄道への助成とのちの国有化、軍需を通じて工業化を後押しした","ビスマルクによる統一（1871）で帝国の統一市場が成立し、フランスからの賠償金も投下された","鉄鋼・電気・化学など重化学工業が中心で、銀行資本と結びついたカルテル・コンツェルンが独占を形成した","社会主義者鎮圧法と災害・疾病・養老保険を組み合わせた「アメとムチ」で労働者を体制に統合した"],"lim":400,"c":"【近代欧米】産業革命と労働問題・社会主義","y":1834,"ex":"軽工業から自生的に始まり自由放任を基調としたイギリスと、重工業中心で国家と銀行が主導したドイツという対比が答案の軸になる。関税同盟による経済的統一が政治的統一に先行した順序と、リストの保護貿易論が自由貿易に対する後発国の応答である点は必須。工業化と統一を別々に書いて終わるのが典型的な失点で、統一市場と賠償金が工業化を加速し、社会保険と社会主義者鎮圧法で労働者を国家に統合した因果まで結べると差がつく。","w":"19世紀ドイツの工業化の特徴について、イギリスと"},{"id":"e16","t":"essay","q":"第一次世界大戦がイギリスとアメリカ合衆国の経済的地位をどのように転換させたかを説明し、その後の国際経済秩序において両国が果たした役割について述べなさい。（400字以内）","pts":["大戦前のイギリスはロンドンを中心とする金本位制のもと、世界の金融・海運を握る「世界の銀行」であった","巨額の戦費調達と物資輸入のためイギリスは海外資産の一部を売却し、アメリカに多額の戦債を負った。アメリカは債務国から世界最大の債権国へ転じ、ニューヨークが国際金融の中心として台頭した","戦後はドーズ案・ヤング案のように、アメリカ資本がドイツの賠償支払いと欧州復興を支える構造ができた","しかしアメリカは国際連盟に加盟せず孤立主義をとり、経済力に見合う政治的責任を引き受けなかった","イギリスは旧平価での金本位制復帰（1925）で輸出が不振となり、恐慌後は金本位制を停止してスターリング＝ブロックを形成した","第二次世界大戦後のブレトンウッズ体制で金ドル本位制が確立し、覇権の移行が制度として完成した"],"lim":400,"c":"【20世紀】世界経済秩序と覇権の移行","y":1918,"ex":"骨格は大戦前のイギリス中心の国際経済 → 大戦による債権債務関係の転換 → 戦間期のアメリカ資本依存（ドーズ案）と孤立主義 → イギリスの金本位制復帰と放棄 → ブレトンウッズでの覇権移行の完成の順。イギリスは対米債務を負ったが連合国への債権と海外投資を合わせれば純債権国であり、「債務国に転落」と書くのは不正確。1918年に覇権が移ったのではなく、経済力の逆転と秩序を担う意思の不在との時間差を書けるかで差がつく。","w":"第一次世界大戦がイギリスとアメリカ合衆国の経済的"},{"id":"e17","t":"essay","q":"1929年に始まる世界恐慌に対して各国がとった対応の違いを説明し、それが1930年代の国際秩序に与えた影響について述べなさい。（400字以内）","pts":["アメリカの過剰生産と農業不況を背景に株式投機が崩壊し、アメリカ資本の引き揚げと高関税政策（ホーリー＝スムート関税法）による報復関税の応酬で恐慌が世界へ波及した","アメリカはニューディール政策でAAA・NIRAによる生産調整、TVAなどの公共事業、ワグナー法による労働者保護を行い、修正資本主義へ転換した","イギリスは1931年に金本位制を停止してスターリング＝ブロックを、フランスは当初金本位制を維持して金ブロック（のちフラン＝ブロック）を形成し、本国と植民地を高関税で囲い込んだ","ソ連は五カ年計画により世界市場から切り離されていたため恐慌の影響を受けず、計画経済への評価が高まった","植民地や資本に乏しい「持たざる国」ドイツ・イタリア・日本はファシズム化と対外侵略で市場と資源を確保しようとした","世界市場の分断が国際協調を崩し、第二次世界大戦の経済的要因となった"],"lim":400,"c":"【20世紀】世界経済秩序と覇権の移行","y":1929,"ex":"骨格は恐慌の発生と波及 → 各国の対応（アメリカの修正資本主義、英仏のブロック経済、ソ連の計画経済、持たざる国のファシズム化と侵略）→ 国際秩序への影響の順。各国の政策を並べるだけで終わり、世界市場の分断が国際協調を崩した点に接続しないのが典型的な失点。「持てる国」と「持たざる国」の対比で、ブロック経済が日独伊の対外膨張に口実を与えた因果を書けると差がつく。ニューディールの景気回復効果は限定的だったとする評価にも留意したい。","w":"1929年に始まる世界恐慌に対して各国がとった対"},{"id":"e18","t":"essay","q":"ブレトンウッズ体制が成立した理由とその仕組みを説明し、1970年代初頭にこの体制が崩壊した経緯について述べなさい。（400字以内）","pts":["戦間期のブロック経済と為替切り下げ競争が戦争を招いたという反省から、自由貿易と為替の安定を制度化しようとした","金1オンス＝35ドルで金とドルを結び、各国通貨をドルに固定する金ドル本位制をとった","IMFが為替安定のための短期融資を、IBRDが復興開発の長期融資を担い、GATTが関税引き下げと自由貿易を進めた","体制はアメリカの圧倒的な金保有と生産力、ドルへの信認を前提としていた","西欧・日本の復興によりアメリカの競争力が低下し、ベトナム戦争の戦費と対外援助でドルが流出してドル危機が生じた","1971年ニクソンが金とドルの交換停止を発表し、スミソニアン協定を経て1973年に主要国が変動相場制へ移行した","石油危機と重なり、以後は先進国首脳会議による政策協調が行われるようになった"],"lim":400,"c":"【20世紀】世界経済秩序と覇権の移行","y":1944,"ex":"骨格は成立理由（戦間期のブロック経済と為替切り下げ競争への反省）→ 仕組み（金ドル本位制と固定相場、IMF・IBRD・GATT）→ 前提（アメリカの圧倒的な金保有と経済力）→ 崩壊の経緯（西欧・日本の復興、ベトナム戦争とドル流出、金ドル交換停止、変動相場制）の順。崩壊をニクソン声明という一事件だけで説明するのが典型的な誤り。基軸通貨国がドルを供給するほど信認が揺らぐという構造的矛盾を示し、崩壊を制度の必然として描けると差がつく。","w":"ブレトンウッズ体制が成立した理由とその仕組みを説"},{"id":"e19","t":"essay","q":"1973年の石油危機が生じた経緯を説明し、それが世界経済および産油国の国際的地位に与えた影響について述べなさい。（400字以内）","pts":["20世紀前半から、中東の油田はイラン・イラク・サウジアラビアなどで欧米の国際石油資本（メジャー）に支配され、産油国は価格決定権を持たなかった","資源ナショナリズムの高まりのなかでOPEC（1960）、アラブ産油国によるOAPEC（1968）が結成され、価格決定権の回復が目指された","パレスチナ問題を背景に中東戦争が繰り返され、第3次中東戦争でのイスラエルの占領がアラブ諸国の反発を強めた","第4次中東戦争に際しOAPECが親イスラエル国への供給削減・禁輸という石油戦略を発動し、OPECが原油価格を大幅に引き上げた","先進国ではインフレと不況が併存するスタグフレーションが生じ、高度経済成長が終わり省エネルギー化と産業構造の転換が進んだ","産油国の発言力が高まり、国連資源特別総会で新国際経済秩序（NIEO）樹立宣言が採択された","非産油途上国はかえって打撃を受け、途上国間の格差（南南問題）が表面化した"],"lim":400,"c":"【20世紀】世界経済秩序と覇権の移行","y":1973,"ex":"経緯は長期的背景（国際石油資本の支配と資源ナショナリズム、OPEC・OAPECの結成）と直接の契機（第4次中東戦争とアラブ産油国の石油戦略）の二層で示し、影響を先進国経済（スタグフレーション、高度成長の終焉、省エネと産業構造の転換）と産油国の地位（NIEO宣言）に分けて書く。中東戦争だけで原因を説明するのが典型的な失点。非産油途上国が打撃を受け南南問題が表面化した点まで書けると、視野の広さで差がつく。","w":"1973年の石油危機が生じた経緯を説明し、それが"},{"id":"e20","t":"essay","q":"冷戦期における社会主義陣営の結束と動揺について、東欧諸国の自立の動きおよび中ソ対立に言及しながら述べなさい。（400字以内）","pts":["コミンフォルム（1947）、コメコン（1949）、ワルシャワ条約機構（1955）によってソ連を中心とする統制体制が築かれた","最初の亀裂はユーゴスラヴィアで、ティトーの自主路線によりコミンフォルムを除名され、のち非同盟運動を主導した","フルシチョフのスターリン批判と平和共存路線（1956）が衝撃を与え、ポーランドではポズナニ暴動後にゴムウカが事態を収拾してソ連の介入を回避したが、ワルシャワ条約機構脱退を表明したハンガリーではナジ＝イムレ政権をソ連軍が鎮圧した","中国は平和共存路線を修正主義と批判し、中ソ論争が公然化、ソ連は技術援助を停止し、1969年には国境紛争に至った","プラハの春（1968）でドプチェクが「人間の顔をした社会主義」を掲げたが、ワルシャワ条約機構軍が弾圧しブレジネフ＝ドクトリンが唱えられた","中ソ対立は米中接近を促し、冷戦構造そのものを多極化させた","ゴルバチョフの新思考外交による制限主権論の否定が、1989年の東欧革命を可能にした"],"lim":400,"c":"【20世紀】冷戦と社会主義陣営","y":1956,"ex":"骨格はソ連による統制体制の構築 → ユーゴスラヴィアの離反 → スターリン批判を契機とするポーランド・ハンガリーの動揺 → 中ソ対立 → プラハの春とブレジネフ＝ドクトリン → 米中接近と多極化 → 東欧革命の順。一枚岩とされた陣営が民族主義と路線の違いから裂けていく過程として書く。中ソ対立の起点を国境紛争とするのは誤りで、スターリン批判と平和共存路線への反発が先にある。ポーランドとハンガリーで結果が分かれた理由を書けると差がつく。","w":"冷戦期における社会主義陣営の結束と動揺について、"},{"id":"e21","t":"essay","q":"19世紀半ば、東アジアの伝統的な国際秩序が欧米との条約体制へと転換していった過程について、清朝の対外関係の変化を中心に述べなさい。（400字以内）","pts":["伝統的秩序は中華思想に基づく冊封・朝貢体制で、民間の互市と組み合わされ、ヨーロッパ船は広州一港と公行に限定されていた","イギリスはマカートニーらを派遣して自由貿易を求めたが拒否され、茶の代価としての銀流出を補うためインド産アヘンを介する三角貿易を行った","林則徐のアヘン取り締まりを機にアヘン戦争が起こり、南京条約（1842）で5港開港、香港島割譲、公行廃止が定められた","五港通商章程・虎門寨追加条約（1843）で領事裁判権、協定関税制、片務的最恵国待遇という不平等条項が加わり、翌年には米仏とも同様の条約を結んだ","アロー戦争の結果の天津条約・北京条約（1860）で外国公使の北京駐在、キリスト教布教の自由、天津などの開港、九竜半島南部の割譲が認められた","総理各国事務衙門が設置され、対外関係が儀礼ではなく外交として扱われるようになった","清仏戦争でベトナム、日清戦争で朝鮮の宗主権を失い、冊封体制は最終的に解体した"],"lim":400,"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1842,"ex":"骨格は伝統的秩序（冊封・朝貢と互市、広州一港体制）→ イギリスの自由貿易要求と三角貿易 → アヘン戦争と南京条約・不平等条項 → アロー戦争と北京条約 → 総理衙門の設置 → 周辺属国の喪失の順。朝貢から条約へという転換を、清が対等な主権国家間の外交という世界観を受け入れさせられた過程として描くと差がつく。冊封体制の解体はアヘン戦争で完結したのではなく、日清戦争で朝鮮の宗主権を失って最終的に崩れる点を混同しないこと。","w":"19世紀半ば、東アジアの伝統的な国際秩序が欧米と"},{"id":"e22","t":"essay","q":"19世紀後半、朝鮮をめぐって清と日本はどのように対立したか。朝鮮国内の政治動向にも触れながら、日清戦争に至る過程とその結果を述べなさい。（400字以内）","pts":["朝鮮は清の冊封国であったが、日本は江華島事件を機に結んだ日朝修好条規（1876）で朝鮮を「自主の国」と規定し、清の宗主権を否定した","朝鮮国内では大院君の攘夷政策と閔氏政権の開化政策が対立した","壬午軍乱（1882）に清が出兵して影響力を強めた","甲申政変（1884）で金玉均ら独立党が日本の援助でクーデタを起こしたが清軍に鎮圧され、天津条約で両国の撤兵と出兵時の事前通告が定められた","甲午農民戦争（東学の乱、1894）を機に両国が出兵し日清戦争が勃発した","下関条約（1895）で清は朝鮮の独立を承認し、台湾・遼東半島を割譲、賠償金2億両を支払った（遼東半島は三国干渉で返還）","清の弱体が露呈して列強の中国分割が加速し、朝鮮ではロシアの影響力が強まった"],"lim":400,"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1894,"ex":"骨格は日朝修好条規の「自主の国」規定 → 朝鮮国内の対立（大院君と閔氏、開化派）→ 壬午軍乱と甲申政変での清の優位 → 天津条約 → 甲午農民戦争と日清戦争 → 下関条約とその後の順。朝鮮が清の属邦か独立国かという宗属関係をめぐる争いとして捉えるのが要点。三事件の順序や、壬午軍乱・甲申政変ではいずれも清が優位に立った点を取り違えるのが典型的な誤り。朝鮮内部の政争が清・日本の介入を招いた構図を書けると差がつく。","w":"19世紀後半、朝鮮をめぐって清と日本はどのように"},{"id":"e23","t":"essay","q":"洋務運動と変法自強運動を比較し、それぞれの理念・担い手・挫折の理由を述べなさい。（400字以内）","pts":["洋務運動は太平天国とアロー戦争の衝撃を受け、郷勇を率いた曽国藩・李鴻章・左宗棠ら漢人の地方大官が主導した","理念は「中体西用」で、儒教的な体制を維持したまま軍事技術と工業のみを導入した（江南製造総局、北洋艦隊、留学生派遣）","政治制度や社会の改革を伴わず、事業が地方ごとに分散したため、清仏戦争と日清戦争の敗北で限界が露呈した","日清戦争の敗北で洋務運動の限界が明らかになり、中国分割の危機のなか、康有為・梁啓超ら公羊学派の知識人が光緒帝を擁し、明治維新に学んで立憲君主制や科挙改革など制度そのものの変革を目指した（戊戌の変法、1898）","改革派は光緒帝の権威以外に官僚・軍の支持基盤を持たず改革も急進的であったため、西太后ら保守派のクーデタ（戊戌の政変）により約100日で失敗し、光緒帝は幽閉され康・梁は日本へ亡命した","義和団事件後に清自身が光緒新政を進めたが遅きに失し、孫文らの革命運動へ流れが移った"],"lim":400,"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1861,"ex":"比較問題なので、理念・担い手・挫折の理由の三項目それぞれで両運動を対照させると採点者に伝わりやすい。技術のみか制度まで踏み込むかという改革の深さの違いが軸。担い手は地方の漢人官僚と中央の若い知識人で対照的だが、ともに清朝の維持を前提とした点で共通する。変法の挫折を保守派の弾圧だけで説明するのは不十分で、改革派が皇帝の権威以外に支持基盤を持たなかった弱さまで書けると差がつく。時系列に並べるだけの答案は比較になっていない。","w":"洋務運動と変法自強運動を比較し、それぞれの理念・"},{"id":"e24","t":"essay","q":"辛亥革命が起こった背景を説明し、この革命が達成したものとその限界について述べなさい。（400字以内）","pts":["日清戦争の敗北と列強による中国分割、義和団事件後の巨額賠償とそれに伴う増税が清朝への不満を高めた","光緒新政による科挙廃止で知識人は留学や新軍へ向かい、革命思想の担い手となった","孫文は興中会を経て東京で中国同盟会を結成（1905）し、三民主義を掲げた","幹線鉄道国有化に反対する四川暴動を機に武昌で新軍が蜂起し（1911）、立憲派や地方の有力者に支えられた各省が次々と清からの独立を宣言した","1912年に中華民国が成立して孫文が臨時大総統となったが、袁世凱が宣統帝を退位させる見返りにその地位を得た","共和国（中華民国）が樹立され、2000年以上続いた皇帝支配が終わった点が最大の達成である","袁世凱の独裁と帝政復活の試み、その死後の軍閥割拠が続き、農村社会の変革や列強の権益除去には至らず、五四運動を経て国民革命へ向かった"],"lim":400,"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1911,"ex":"何を壊し何を壊せなかったかで構成する。骨格は背景（分割の危機、賠償と増税、新政の副作用）→ 革命派の組織化 → 武昌蜂起と各省の独立 → 中華民国の成立と袁世凱の台頭 → 達成と限界の順。最大の達成は皇帝支配の終焉と共和政の樹立。限界を袁世凱個人の野心だけで説明するのが典型的な失点で、革命派が独自の軍事力を持たず、立憲派・郷紳など旧来の有力者に依存したため、農村社会の変革や列強の権益除去に進めなかった点を示すと差がつく。","w":"辛亥革命が起こった背景を説明し、この革命が達成し"},{"id":"e25","t":"essay","q":"ロシア・ソ連と中国の関係が19世紀から1920年代にかけてどのように変化したかを、両国の国内情勢に触れながら述べなさい。（400字以内）","pts":["帝政ロシアはアイグン条約・北京条約で黒竜江以北と沿海州を獲得し、東清鉄道の敷設、旅順・大連の租借など列強と同様の権益を得た","日露戦争の敗北で南満州の権益は日本へ移ったが、ロシアは北満州や外モンゴルで影響力を保った","ロシア革命（1917）後のカラハン宣言（1919）は帝政期の対中不平等条約と権益の放棄を表明した","宣言は五四運動期の中国知識人に強い衝撃を与え、社会主義への共感を広げた","コミンテルンの指導のもと中国共産党が結成され（1921）、第1次国共合作（1924）が成立し、ソ連は軍事顧問を送り黄埔軍官学校の設立を支援した","実際にはソ連は東清鉄道の権益や外モンゴルへの影響力を手放さず、宣言と実態には乖離があった","蒋介石の上海クーデタ（1927）で合作は崩壊した"],"lim":400,"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1919,"ex":"骨格は帝政ロシアの南下と権益獲得 → 日露戦争後の後退 → ロシア革命とカラハン宣言 → 中国共産党の結成と国共合作へのソ連の支援 → 宣言と実態の乖離 → 国共合作の崩壊の順。中国側の認識が「侵略者」から「解放の味方」へ転じた点と、ソ連が東清鉄道や外モンゴルへの影響力を手放さなかった二重性を対比させるのが得点の核心。ソ連を一貫して中国の味方として描くのが典型的な誤り。両国の国内情勢の変化が関係を変えた因果として書くこと。","w":"ロシア・ソ連と中国の関係が19世紀から1920年"},{"id":"n001","t":"mc","q":"800年、教皇レオ3世がフランク王に帝冠を授け、西ローマ帝国の復活が宣言された出来事を何と呼ぶか。","o":["カールの戴冠","オットー1世の戴冠","ピピンの寄進","クローヴィスの改宗"],"a":0,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":800,"ex":"8世紀、聖像禁止令をめぐってビザンツ皇帝と対立した教皇は、ランゴバルド人を討ってピピンの寄進で教皇領を与えたフランク王国に保護を求めた。カールの戴冠によって教皇は東方から自立し、ローマの古典文化・キリスト教・ゲルマンが融合した西ヨーロッパ世界が成立した。962年のオットー1世の戴冠（神聖ローマ帝国の起源）と混同しないこと。","w":"カールの戴冠"},{"id":"n002","t":"mc","q":"神聖ローマ皇帝が司教や修道院長を任命して封土を与え、教会組織を帝国統治の支柱とした政策を何と呼ぶか。","o":["クリュニー改革","帝国教会政策","イタリア政策","金印勅書"],"a":1,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":962,"ex":"オットー1世らは、所領を世襲できない聖職者に土地と統治権を与え、自立的な諸侯を抑える支柱とした。しかし皇帝が聖職叙任権を握るこの体制こそ教会改革派の批判の的となり、叙任権闘争を招いた。1122年のヴォルムス協約で叙任権を手放すと帝国統治の基盤は弱まり、皇帝がイタリア政策に傾いて本国を留守にしがちだったことも重なって諸侯が自立し、ドイツの領邦分立が進んだ。","w":"帝国教会政策"},{"id":"n003","t":"mc","q":"10世紀初めにフランスに創設され、聖職売買や聖職者の妻帯を批判して中世の教会刷新運動の中心となった修道院はどこか。","o":["モンテ＝カシノ修道院","シトー修道会","クリュニー修道院","フランチェスコ修道会"],"a":2,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":910,"ex":"ベネディクトゥスの戒律に立ち返り、世俗権力からの教会の自立を掲げた。この運動からグレゴリウス7世が現れ、叙任権闘争へ発展する。12世紀のシトー修道会は大開墾運動を担った点、托鉢修道会（フランチェスコ・ドミニコ）は13世紀の都市で活動した点と区別したい。","w":"クリュニー修道院"},{"id":"n004","t":"mc","q":"12世紀以降、ドイツ人がエルベ川以東のスラヴ人地域へ植民し、農地と都市を建設していった運動を何と呼ぶか。","o":["レコンキスタ","東方植民","大開墾運動","東方貿易"],"a":1,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1150,"ex":"三圃制や重量有輪犂の普及による農業生産の向上と人口増加を背景に、諸侯やドイツ騎士団が主導した。ブランデンブルク辺境伯領やドイツ騎士団領（のちのプロイセン）が形成された。西欧内部の森林や沼沢を開いた大開墾運動に対し、こちらは外部への植民である点で区別する。近世にこの地域は農場領主制（グーツヘルシャフト）と再版農奴制のもとで、西欧への穀物供給地となった。","w":"東方植民"},{"id":"n005","t":"mc","q":"1303年、聖職者への課税をめぐる対立から、フランス王フィリップ4世が教皇ボニファティウス8世を捕らえた事件を何と呼ぶか。","o":["カノッサの屈辱","ヴォルムス協約","アナーニ事件","教会大分裂"],"a":2,"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1303,"ex":"国王が教皇を屈服させた点で、皇帝が教皇に謝罪したカノッサの屈辱とは力関係が逆転している。フィリップ4世は前年に三部会を招集して国内の支持を固めており、事件後、教皇庁は南仏へ移されて教皇のバビロン捕囚、さらに教会大分裂へと向かった。","w":"アナーニ事件"},{"id":"n006","t":"mc","q":"1494年、スペインとポルトガルが植民地獲得の境界線を定め、のちにブラジルがポルトガル領となる根拠となった条約は何か。","o":["トルデシリャス条約","サラゴサ条約","ユトレヒト条約","アシエント"],"a":0,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1494,"ex":"教皇が定めた分界線をポルトガルに有利な西側へ修正したもので、南北に引かれた線の東側がポルトガル、西側がスペインの領域とされた。この線がブラジルを横切ったため同地はポルトガル領となる。太平洋側の境界を定めた1529年のサラゴサ条約と区別すること。","w":"トルデシリャス条約"},{"id":"n007","t":"mc","q":"大航海時代以降、新旧両大陸のあいだで作物・家畜・病原菌が大規模に行き来した現象を何と呼ぶか。","o":["価格革命","商業革命","コロンブス交換","大西洋三角貿易"],"a":2,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1500,"ex":"トウモロコシやジャガイモが旧大陸の人口増加を支え、砂糖やコーヒーはプランテーションで栽培された。一方、天然痘など免疫のない病原菌がアメリカ先住民の人口を激減させ、その労働力不足が大西洋奴隷貿易を拡大させた。貿易の中心が大西洋へ移った商業革命とは指す内容が異なる。","w":"コロンブス交換"},{"id":"n008","t":"mc","q":"スペインがアメリカ大陸で、先住民のキリスト教化を条件に植民者へその統治を委ねた制度を何と呼ぶか。","o":["アシエント","エンコミエンダ制","ミタ制","アシエンダ制"],"a":1,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1503,"ex":"名目はキリスト教化だが実態は鉱山や農園での酷使で、ラス＝カサスが激しく批判した。先住民人口の激減を受けて制度は衰え、大農園を経営するアシエンダ制へ移行する。ミタはインカ以来の強制労働制度をポトシ銀山などに転用したもので、別の制度である。","w":"エンコミエンダ制"},{"id":"n009","t":"mc","q":"1588年、スペイン王フェリペ2世が無敵艦隊（アルマダ）をイギリスに派遣した背景として最も適当なものはどれか。","o":["エリザベス1世がオランダ独立戦争を支援し、私掠船がスペインの船や植民地を襲撃していた","イギリスが航海法を制定し、スペインを中継貿易から排除した","イギリスがレパントの海戦でスペイン艦隊を破り、地中海の制海権を握った","イギリスがスペイン継承戦争に介入し、ジブラルタルを占領した"],"a":0,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1588,"ex":"ポルトガル併合（1580）で「太陽の沈まぬ国」を築いたスペインに対し、エリザベス1世はオランダ独立戦争を支援し、私掠船もスペイン船を襲った。メアリ＝ステュアートの処刑（1587）が派遣の引き金となる。敗北は英蘭台頭の象徴だが、スペイン衰退の主因は銀に頼った経済と財政破綻である。レパントの海戦（1571）はオスマン帝国との戦い、航海法（1651）はオランダを狙った法である。","w":"エリザベス1世がオランダ独立戦争を支援し、私掠船がスペインの船や植民地を襲撃していた"},{"id":"n010","t":"mc","q":"1602年に設立され、喜望峰以東での貿易独占権に加えて条約締結権や軍隊保有権まで与えられた会社は何か。","o":["イギリス東インド会社","フランス東インド会社","オランダ東インド会社","オランダ西インド会社"],"a":2,"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1602,"ex":"複数の先駆会社を統合した恒常的な株式会社で、バタヴィアを拠点にアンボイナ事件（1623）でイギリスを排除し、香辛料貿易を独占した。その利益でアムステルダムは国際金融の中心となる。1600年設立のイギリス東インド会社は当初航海ごとに出資を募り、恒常的な株式会社となるのは1657年である点が対照的。フランス東インド会社（1664年再建）とも区別する。","w":"オランダ東インド会社"},{"id":"n011","t":"mc","q":"ウィルバーフォースらの運動を受け、イギリスが1807年に制定した法は何か。","o":["奴隷貿易廃止法","奴隷制度廃止法","穀物法廃止","工場法"],"a":0,"c":"【近現代欧米】市民社会と政治・社会変動","y":1807,"ex":"奴隷の売買を禁じた法であり、植民地の奴隷制そのものの廃止は1833年の奴隷制度廃止法まで待たねばならない。両者の26年の差は頻出の論点。背景には福音主義に基づく人道主義運動やハイチ革命の衝撃があり、産業革命によって西インドの砂糖植民地の経済的比重が低下したことを重視する説（ウィリアムズ）もある。以後、イギリス海軍は他国の奴隷貿易の取締りにも乗り出した。","w":"奴隷貿易廃止法"},{"id":"n012","t":"mc","q":"南北戦争中の1863年にリンカン大統領が発した奴隷解放宣言について述べた文として正しいものはどれか。","o":["反乱状態にある南部諸州の奴隷を対象とし、北部側にとどまった境界州の奴隷は対象外であった","合衆国全土の奴隷制をただちに廃止し、奴隷制廃止の憲法修正を不要にした","解放された黒人男性に選挙権を保障し、これにより南部の再建が完了した","南部連合がこれを受け入れたことが、南北戦争終結の直接の契機となった"],"a":0,"c":"【近現代欧米】市民社会と政治・社会変動","y":1863,"ex":"開戦当初は連邦維持を掲げたリンカンは、この宣言で戦争目的に奴隷解放を加え、南部の綿花に依存する英仏の南部承認・介入を封じ、黒人の北軍参加も促した。ただし対象は反乱州の奴隷に限られ、全国的な廃止は1865年の憲法修正第13条、黒人男性の選挙権は1870年の修正第15条による。解放後も南部では分益小作のもとで黒人の従属が続いた。","w":"反乱状態にある南部諸州の奴隷を対象とし、北部側にとどまった境界州の奴隷は対象外であった"},{"id":"n013","t":"mc","q":"南北戦争後の再建期が終わったのち、アメリカ南部で黒人の選挙権や公共施設の利用を制限した一連の州法の総称は何か。","o":["黒人取締法（ブラック＝コード）","シャーマン反トラスト法","ホームステッド法","ジム＝クロウ法"],"a":3,"c":"【近現代欧米】市民社会と政治・社会変動","y":1896,"ex":"再建期が終わり（1877）連邦軍が南部から撤退すると、南部諸州は識字テストや人頭税で黒人の投票を事実上封じ、公共施設での人種分離を定めた。1896年の最高裁判決は「分離すれど平等」としてこれを合憲とした。奴隷解放直後に黒人の自由を制限した黒人取締法（ブラック＝コード）とは時期が異なる。1954年のブラウン判決を経て、1964年の公民権法と65年の投票権法で撤廃された。","w":"ジム＝クロウ法"},{"id":"n014","t":"mc","q":"1848年、ルイ＝フィリップの七月王政を倒し、フランスに第二共和政を成立させた革命は何か。","o":["七月革命","二月革命","パリ＝コミューン","三月革命"],"a":1,"c":"【近現代欧米】市民社会と政治・社会変動","y":1848,"ex":"選挙権拡大を求める改革宴会の弾圧が契機で、臨時政府は男性普通選挙を実現した。この報がウィーンやベルリンの三月革命を誘発し、諸国民の春としてウィーン体制を崩壊させた。ただし六月蜂起で労働者が鎮圧され、ルイ＝ナポレオンの台頭を招いた点まで押さえたい。","w":"二月革命"},{"id":"n015","t":"mc","q":"世界で最初に女性の国政選挙権を認めた国はどこか。","o":["ニュージーランド","イギリス","アメリカ合衆国","フランス"],"a":0,"c":"【近現代欧米】市民社会と政治・社会変動","y":1893,"ex":"1893年に実現した例外的に早い事例で、多くの国では第一次世界大戦の総力戦で女性が生産を担ったことが参政権拡大の契機となった。イギリスは1918年に30歳以上の女性へ、1928年に男女平等の普通選挙を実現し、アメリカは1920年、フランスは第二次世界大戦末期の1944年に認められ、行使は1945年の選挙からである。","w":"ニュージーランド"},{"id":"n016","t":"mc","q":"日露戦争後に保護国化を進めた日本が、1910年に朝鮮を植民地とした条約は何か。","o":["江華島条約（日朝修好条規）","第2次日韓協約","韓国併合条約","下関条約"],"a":2,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1910,"ex":"日露戦争中の第1次日韓協約で財政・外交に顧問を置き、戦後の第2次日韓協約（1905）で外交権を奪って統監府を設置、軍隊解散と義兵闘争の鎮圧を経て併合に至った。朝鮮総督府が憲兵警察による武断政治を行い、土地調査事業で農民が土地を失った。1876年の日朝修好条規は朝鮮を「自主の国」と規定して清の宗主権を否定した条約で、段階が異なる。","w":"韓国併合条約"},{"id":"n017","t":"mc","q":"1919年、日本の植民地支配に対して朝鮮で起こり、独立宣言の発表から全土に広がった民族運動は何か。","o":["三・一独立運動","五四運動","甲午農民戦争","義兵闘争"],"a":0,"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"ex":"パリ講和会議の民族自決の理念が刺激となった。運動は武力で鎮圧されたが、日本は統治方法を武断政治から「文化政治」へ転換せざるをえなくなった。同年5月に中国で起きた五四運動と時期が近く、標的も性格も異なるため混同しやすい。","w":"三・一独立運動"},{"id":"n018","t":"mc","q":"パリ講和会議で二十一カ条の要求の取り消しが認められなかったことに抗議して、中国で起こった運動は何か。","o":["義和団事件","新文化運動","五四運動","変法自強運動
