<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>世界史問題集（4択・論述）</title>
<style>
:root{
  --paper:#F6F4EF;
  --paper-2:#EDEAE2;
  --ink:#1B2A4A;
  --ink-soft:#5C6B87;
  --ink-faint:#C3CAD8;
  --line:#DCD7CB;
  --seal:#9E2B25;
  --seal-soft:#F2E0DE;
  --good:#2C6149;
  --good-soft:#DFEDE6;
  --card:#FFFFFF;
  --radius:14px;
  --shadow:0 1px 2px rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
body{min-height:100%}
button,input,select,textarea{touch-action:manipulation;font-family:inherit}
body{
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px}
.stamp{width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-weight:700;line-height:1.1;transform:rotate(-4deg);text-align:center;flex:none}
.brand h1{font-size:14px;font-weight:700;letter-spacing:.03em}
.brand small{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:400;letter-spacing:.08em}
nav{display:flex;gap:1px}
nav button{background:none;border:none;font:inherit;font-size:11.5px;color:var(--ink-soft);padding:7px 7px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
main{flex:1;display:flex;flex-direction:column;padding:6px 18px 28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
.hero .date{font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:14px}
.counts{display:flex}
.count{flex:1;text-align:center;position:relative}
.count+.count::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.count b{display:block;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.count.due b{color:var(--seal)}
.count.done b{color:var(--good)}
.count span{font-size:11px;color:var(--ink-soft);letter-spacing:.06em}
.start{width:100%;margin-top:18px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font:inherit;font-size:16px;font-weight:700;padding:15px;cursor:pointer;letter-spacing:.05em}
.start:active{transform:scale(.985)}
.start:disabled{background:var(--ink-faint);color:#fff}
.substat{display:flex;justify-content:space-between;background:var(--paper-2);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;gap:8px;flex-wrap:wrap}
.substat b{color:var(--ink);font-variant-numeric:tabular-nums}
.notice{font-size:11px;color:var(--seal);background:var(--seal-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none;line-height:1.6}
.sect{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);margin:16px 0 8px}
.progress{height:3px;background:var(--paper-2);border-radius:2px;margin:4px 0 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .25s}
.qtags{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.qtags .tag-new{color:var(--seal);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.body{flex:1;padding:20px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.kind{display:inline-block;font-size:10px;letter-spacing:.1em;color:var(--seal);border:1px solid var(--seal);border-radius:5px;padding:2px 7px;margin-bottom:12px}
.stem{font-size:16px;line-height:1.85;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.6;cursor:pointer;color:var(--ink);display:flex;gap:9px}
.opt .num{color:var(--ink-soft);font-size:12px;flex:none;padding-top:2px}
.opt:active{background:var(--paper-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ng{border-color:var(--seal);background:var(--seal-soft)}
.opt[disabled]{cursor:default}
.ansbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:none}
.ansbox.show{display:block}
.ansline{font-size:15px;line-height:1.8;margin-bottom:8px}
.ansline .lab{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);display:block;margin-bottom:2px}
.ansline b{color:var(--good)}
.ex{font-size:13px;line-height:1.85;color:var(--ink-soft);background:var(--paper-2);border-radius:9px;padding:11px 13px;margin-top:10px}
.chaptag{font-size:11px;color:var(--ink-soft);margin-top:8px}
.reveal{border:none;border-top:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:16px;cursor:pointer;letter-spacing:.08em}
.grades{display:none;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.grades.show{display:grid}
.grades button{border:none;background:var(--card);font:inherit;padding:11px 3px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.grades button+button{border-left:1px solid var(--line)}
.grades b{font-size:12px;font-weight:700}
.grades small{font-size:10px;color:var(--ink-soft)}
.grades .g1 b{color:var(--seal)}
.grades .g4 b{color:var(--good)}
.editlink{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;margin-top:14px;padding:0}
.fin{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 20px;text-align:center}
.fin h2{font-size:19px;margin-bottom:8px}
.fin p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.row label{color:var(--ink-soft);font-size:12px}
.row input[type=number],.row select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);width:110px;text-align:right}
.row select{width:150px;text-align:left}
.tog{display:flex;flex-wrap:wrap;gap:7px}
.tog button{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
.tog button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.li{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:7px;font-size:13px;line-height:1.7;cursor:pointer}
.li .top{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px}
.li .w{color:var(--seal);font-weight:700}
.li .det{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12.5px}
.li.open .det{display:block}
.li .det .eb{margin-top:8px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:11.5px;cursor:pointer}
.ulabel{color:var(--seal);font-weight:700}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:15px;margin-bottom:10px;background:var(--card);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.danger{width:100%;border:1px solid var(--seal);background:none;color:var(--seal);border-radius:11px;padding:12px;font:inherit;font-size:13px;cursor:pointer;margin-top:6px}
.ghost{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:12px;font:inherit;font-size:13px;cursor:pointer;margin-top:6px}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.fpanel .hd{font-size:12.5px;line-height:1.75;color:var(--ink-soft)}
.fpanel .hd b{color:var(--ink)}
.frow label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.04em}
.frow input,.frow textarea,.frow select{
  width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);color:var(--ink);outline:none;
}
.frow textarea{resize:vertical;min-height:64px;font-size:14px;line-height:1.7}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:var(--ink-soft)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--good);flex:none}
.optrow input[type=text]{flex:1}
.fbtn{width:100%;border:none;background:var(--ink);color:var(--paper);font:inherit;font-size:14px;font-weight:700;border-radius:11px;padding:13px;cursor:pointer}
.fbtn2{width:100%;border:1px solid var(--ink);background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:11px;padding:13px;cursor:pointer}
.warnbox{background:var(--seal-soft);color:var(--seal);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.75;white-space:pre-wrap}
.dfield{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;background:var(--card)}
.dlab{font-size:12px;font-weight:700;letter-spacing:.04em}
.dlab span{color:var(--ink-soft);font-weight:400;font-size:11px}
.dsub{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:2px}
.dsub.new{color:var(--good)}
.dcur{font-size:13px;background:var(--paper-2);border-radius:8px;padding:8px 10px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.dnew{font-size:13px;background:var(--good-soft);border:1px solid #CFE3D8;border-radius:8px;padding:8px 10px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.dempty{color:var(--ink-faint)}
.dmark{color:var(--good);font-weight:700}
.dbtns{display:flex;gap:6px;flex-wrap:wrap}
.dbtn{flex:1;min-width:78px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12px;color:var(--ink-soft);border-radius:9px;padding:8px 6px;cursor:pointer}
.dbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.dbtn:active{transform:scale(.97)}
.dres textarea,.dres input[type=text]{width:100%;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);outline:none}
.dres textarea{resize:vertical;line-height:1.7}
.dres .optrow{margin-bottom:6px}
input[type=file]{width:100%;font:inherit;font-size:12px;padding:9px;border:1px dashed var(--line);border-radius:10px;background:var(--paper);color:var(--ink-soft)}
input[type=file]::-webkit-file-upload-button{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 12px;margin-right:10px;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#errbar{display:none;background:var(--seal);color:#fff;font-size:11px;padding:8px 12px;line-height:1.6}
.bar{height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good)}
.kind.essay{color:var(--paper);background:var(--seal);border-color:var(--seal);font-weight:700}
.kind+.kind{margin-left:6px}
.limnote{font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border-radius:8px;padding:8px 11px;margin-bottom:10px;line-height:1.7}
.memo{width:100%;min-height:120px;font:inherit;font-size:13.5px;line-height:1.8;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none;resize:vertical}
.memo:focus{border-color:var(--ink-soft)}
.pts{margin:4px 0 0;padding-left:1.35em;display:flex;flex-direction:column;gap:7px}
.pts li{font-size:13.5px;line-height:1.8}
.pts.sm li{font-size:12.5px;line-height:1.75}
.ex .exlab{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:3px}
.listctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ctlrow{display:flex;align-items:center;gap:8px}
.ctlrow label{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.ctlrow select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.li .bdg{display:inline-block;background:var(--seal);color:var(--paper);font-size:9px;letter-spacing:.06em;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.li .dlabm{font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin:8px 0 2px}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="app">
  <header>
    <div class="brand">
      <div class="stamp">史</div>
      <div><h1>世界史問題集</h1><small>全<span id="totalN">0</span>問 / 4択・論述 / FSRS</small></div>
    </div>
    <nav>
      <button id="nav-home">学習</button>
      <button id="nav-list">一覧</button>
      <button id="nav-add">追加</button>
      <button id="nav-stat">記録</button>
      <button id="nav-set">設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const QS=[{"id":"m001","t":"mc","q":"1648年に締結され、各諸侯に主権を認め「主権国家体制（ウェストファリア体制）」の確立の契機となった条約は何か。","o":["フランクフルト国民議会","ポーランド分割","ウェストファリア条約","コシチュシコ"],"a":2,"c":"【第1章】欧州主権国家体制の形成と変容","w":"ウェストファリア条約","ex":"三十年戦争の講和。神聖ローマ帝国は事実上解体した。","y":1648},{"id":"m002","t":"mc","q":"ウェストファリア条約によって独立が正式に承認された、北海交易で繁栄した新興国家はどこか（2つ）。","o":["ジブラルタル（およびミノルカ島）","オランダ（ネーデルラント連邦共和国）、スイス","アシエント（奴隷供給契約）","ブルシェンシャフト運動"],"a":1,"c":"【第1章】欧州主権国家体制の形成と変容","w":"オランダ（ネーデルラント連邦共和国）、スイス","ex":"独立は事実上以前から。この条約で国際的に承認された。","y":1648},{"id":"m003","t":"mc","q":"1713年のユトレヒト条約で、イギリスがスペインから獲得し、地中海進出の拠点とした戦略的要衝はどこか。","o":["ジブラルタル（およびミノルカ島）","メッテルニヒ","ブルシェンシャフト運動","オランダ（ネーデルラント連邦共和国）、スイス"],"a":0,"c":"【第1章】欧州主権国家体制の形成と変容","w":"ジブラルタル（およびミノルカ島）","ex":"現在も英領。地中海の出入口を押さえる要衝。","y":1713},{"id":"m004","t":"mc","q":"1713年のユトレヒト条約で、イギリスがスペインから獲得した、黒人奴隷を供給する独占的権利を何と呼ぶか。","o":["外交革命","アシエント（奴隷供給契約）","ポーランド分割","ジブラルタル（およびミノルカ島）"],"a":1,"c":"【第1章】欧州主権国家体制の形成と変容","w":"アシエント（奴隷供給契約）","ex":"スペイン領植民地への黒人奴隷供給の独占権。","y":1713},{"id":"m005","t":"mc","q":"1756年にオーストリアのハプスブルク家が、プロイセンに対抗するために長年の宿敵であったフランス・ブルボン家と結んだ同盟（外交的転換）を何と呼ぶか。","o":["外交革命","ブルシェンシャフト運動","アシエント（奴隷供給契約）","ウェストファリア条約"],"a":0,"c":"【第1章】欧州主権国家体制の形成と変容","w":"外交革命","ex":"墺仏の宿敵関係を転換。七年戦争の前提となった。","y":1756},{"id":"m006","t":"mc","q":"シュレジエンの奪還を目指したシュレジエン戦争・七年戦争におけるプロイセンの国王は誰か。","o":["小ドイツ主義","フリードリヒ2世（フリードリヒ大王）","メッテルニヒ","ブルシェンシャフト運動"],"a":1,"c":"【第1章】欧州主権国家体制の形成と変容","w":"フリードリヒ2世（フリードリヒ大王）","ex":"啓蒙専制君主。「君主は国家第一の僕」と称した。","y":1740},{"id":"m007","t":"mc","q":"イギリスとフランスの植民地争奪戦において、北米での七年戦争と並行して戦われた戦いは何か。","o":["ウェストファリア条約","ブルシェンシャフト運動","フランクフルト国民議会","フレンチ・インディアン戦争"],"a":3,"c":"【第1章】欧州主権国家体制の形成と変容","w":"フレンチ・インディアン戦争","ex":"七年戦争の北米戦線。英が勝利し北米の覇権を握る。","y":1754},{"id":"m008","t":"mc","q":"1763年のパリ条約で、イギリスがフランスから獲得した北米の地域はどこか（主要な2つ）。","o":["カナダ、ミシシッピ川以東のルイジアナ","ベルギー","フランクフルト国民議会","小ドイツ主義"],"a":0,"c":"【第1章】欧州主権国家体制の形成と変容","w":"カナダ、ミシシッピ川以東のルイジアナ","ex":"仏は北米大陸の領土をほぼ喪失した。","y":1763},{"id":"m009","t":"mc","q":"1772年、1793年、1795年の3回にわたり、ロシア・プロイセン・オーストリアによって実施された領土分割を何と呼ぶか。","o":["小ド c":"【第7章】20世紀の国際体制・冷戦・経済秩序","w":"バンドン会議（第1回アジア・アフリカ会議）","ex":"平和十原則を採択。正しくはスカルノ大統領。","y":1955},{"id":"m099","t":"mc","q":"1971年、ドルの金引き換え停止を発表し、ブレトンウッズ体制（固定相場制）を崩壊させたアメリカ大統領の発表（ドル＝ショック）は何か。","o":["国際通貨基金（IMF）","ブロック経済","ニクソン＝ショック","トルーマン＝ドクトリン"],"a":2,"c":"【第7章】20世紀の国際体制・冷戦・経済秩序","w":"ニクソン＝ショック","ex":"固定相場制が崩れ変動相場制へ移行する契機。","y":1971},{"id":"m100","t":"mc","q":"1989年、米ソの首脳（ブッシュとゴルバチョフ）が会談し、冷戦の終結を世界に宣言した出来事は何か。","o":["不戦条約（ケロッグ＝ブリアン協定）","ブロック経済","マルタ会談","国際通貨基金（IMF）"],"a":2,"c":"【第7章】20世紀の国際体制・冷戦・経済秩序","w":"マルタ会談","ex":"「ヤルタからマルタへ」と表現される転換点。","y":1989},{"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1077,"lim":400,"q":"11世紀後半から12世紀前半にかけて展開した叙任権闘争について、その背景となった教会改革運動と神聖ローマ皇帝の統治構造に触れながら、闘争の経過と、それがドイツの政治に及ぼした影響を述べなさい。（400字以内）","pts":["クリュニー修道院を中心とする改革運動が聖職売買・聖職者妻帯を否定し、世俗権力からの教会の自立を求めた","皇帝はオットー1世以来の帝国教会政策により、司教・修道院長を任命して統治の支柱としていた（叙任権はその要）","教皇グレゴリウス7世が世俗叙任を禁止し、反発したハインリヒ4世を破門","1077年カノッサの屈辱。諸侯が破門を口実に皇帝廃位を図ったため、皇帝は屈服して破門解除を優先した","1122年ヴォルムス協約で妥協。聖職者としての叙任権は教皇、封土授与は皇帝という二元的解決","帰結として皇帝は教会組織を統治基盤にできなくなり、諸侯の自立が進んでドイツの分権化が決定的になった"],"ex":"皇帝が司教を任命して統治に用いる帝国教会政策こそが争点である。皇帝は教会組織という支配の柱を失い、逆に諸侯は自立を強めた。カノッサでの屈服は諸侯による廃位の動きを封じる政治的判断であって、単純な教皇権の勝利ではない。教皇権の絶頂はおよそ1世紀後のインノケンティウス3世期であり、混同しないこと。","id":"e01","t":"essay"},{"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1096,"lim":400,"q":"十字軍運動が西ヨーロッパ社会にもたらした変化について、教皇権・封建諸侯・都市の三つの観点から述べなさい。（400字以内）","pts":["背景はセルジューク朝の進出とビザンツ皇帝の救援要請、クレルモン宗教会議（1095、ウルバヌス2世）","教皇権は当初主唱者として権威が高まったが、遠征の失敗が続いて失墜し、のちの教皇のバビロン捕囚・教会大分裂へつながる","諸侯・騎士は遠征の戦費負担と戦死によって没落し、相対的に国王権力が伸長した","ヴェネツィア・ジェノヴァなど北イタリア諸都市が東方貿易で繁栄し、貨幣経済が農村にも浸透した","貨幣地代への移行と黒死病後の労働力不足が重なり、荘園制・農奴制が解体に向かう","ビザンツ・イスラーム文化の流入が12世紀ルネサンスを促した"],"ex":"聖地回復という本来の目的は達成されず、副次的影響こそが重要である。諸侯・騎士の没落と王権の伸長、イタリア商業都市の繁栄と貨幣経済の浸透が、封建社会を内側から崩していった。第4回十字軍がコンスタンティノープルを占領してラテン帝国を建てた逸脱は、教皇権失墜の象徴としてしばしば問われる。","id":"e02","t":"essay"},{"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1100,"lim":400,"q":"中世西ヨーロッパの都市はどのようにして自治を獲得したか。その経済的背景と、封建社会のなかで都市が占めた位置に言及しながら述べなさい。（400字以内）","pts":["11〜12世紀の農業生産力の上昇（三圃制・重量有輪犂）と人口増加、遠隔地商業の復活が前提","国王・諸侯・司教などの領主から特許状を得るか、金銭で買い取るか、武力闘争によって自治権を獲得した","北イタリアでは皇帝権が弱くコムーネが事実上の都市国家となり、ドイツでは皇帝直属の帝国都市が諸侯と並ぶ地位を得た","ロンバルディア同盟やハンザ同盟など都市同盟を結んで特権を守った","内部は商人ギルド、のち同職ギルド（ツンフト）が市政と市場を統制し、市参事会が運営した","「都市の空気は自由にする」に示されるように、封建的支配の外に立つ第三の勢力として王権と結び、また対抗した"],"ex":"都市の自立は農業生産力の上昇と商業の復活が前提である。自治の形は地域差が大きく、皇帝権の弱い北イタリアではコムーネが都市国家化し、ドイツでは帝国都市が分権化を促した。ギルドによる厳格な規制は営業の自由と対立し、のちに近代化の障害ともなった点まで押さえたい。","id":"e03","t":"essay"},{"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1155,"lim":300,"q":"歴代の神聖ローマ皇帝が繰り返したイタリア政策とはどのようなものか。その動機を説明したうえで、この政策がドイツとイタリア双方の政治にもたらした帰結を述べなさい。（300字以内）","pts":["動機はローマ皇帝の称号と教皇による戴冠がもたらす普遍的権威、および北イタリア都市の富の掌握","オットー1世の戴冠（962）以来、皇帝は繰り返しアルプスを越えて遠征した","シュタウフェン朝フリードリヒ1世の遠征はロンバルディア同盟と教皇に阻まれ、レニャーノの戦いで敗北した","ドイツでは皇帝の不在が常態化して諸侯が自立し、大空位時代を経て金印勅書（1356）が七選帝侯による選挙を定めて分権が固定化した","イタリアでは統一政権が生まれず、教皇党と皇帝党の抗争と都市国家の分立が続いた"],"ex":"皇帝の普遍的権威と北イタリアの富を求めた遠征が、結果としてドイツ・イタリア双方の分裂を長期化させたという逆説が要点である。皇帝がドイツを留守にする間に諸侯が自立し、金印勅書で分権が法的に固定された。両国の統一が19世紀まで遅れた遠因として論じられる。","id":"e04","t":"essay"},{"c":"【中世ヨーロッパ】教会・皇帝権と封建社会","y":1337,"lim":400,"q":"英仏百年戦争を単純な二つの国家間の戦争と捉えることができない理由を説明したうえで、この戦争がフランスの社会と王権にもたらした変化を述べなさい。（400字以内）","pts":["開戦時のイギリス王はフランス国内にギエンヌなどの所領を持つフランス王の封建家臣でもあり、封建的主従関係をめぐる争いという性格を持つ","争点は毛織物工業地帯フランドルの支配権とギエンヌのぶどう酒交易という経済的利害であった","カペー朝の断絶に際しエドワード3世が母を通じて王位継承権を主張した","戦争中、ブルゴーニュ派とアルマニャック派が対立するなどフランス封建諸侯間の内戦の側面が強い","黒死病と戦乱で農村が荒廃し、ジャックリーの乱など農民反乱が起きた","ジャンヌ＝ダルクの登場を機に戦局が転換し、カレーを除く大陸領をイギリスが失った","諸侯・騎士が没落し、常備軍と恒常的課税権を握った国王のもとで中央集権化と国民意識の形成が進んだ"],"ex":"開戦時の英王がフランス王の封建家臣でもあった点が最大の論点で、戦争は主権国家同士の対決ではなく、封建的関係と諸侯間の内戦を含む。長期化のなかで騎士の戦術的価値が下がり、常備軍と恒常的課税に支えられた中央集権的王権が生まれた。近代の国境観を持ち込まないことが要点である。","id":"e05","t":"essay"},{"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1517,"lim":400,"q":"ルターの宗教改革がドイツの政治構造に与えた影響について、改革の発端からアウクスブルクの和議に至る経過を踏まえて述べなさい。（400字以内）","pts":["レオ10世によるサン＝ピエトロ大聖堂改築のための贖宥状販売に対し、九十五カ条の論題（1517）を発表した","信仰義認説・聖書のみ・万人祭司主義は教皇の権威と教会組織を否定する主張であった","皇帝権が弱く諸侯が自立的なドイツは「ローマの牝牛」と呼ばれる教皇の収奪の対象で、反教皇感情が広く存在した","ヴォルムス帝国議会で帝国追放となるがザクセン選帝侯に保護され、ドイツ語訳聖書が普及した","ドイツ農民戦争でルターが諸侯側に立ったため、改革は諸侯主導の運動へ転換した","シュマルカルデン同盟と皇帝カール5世の戦争。皇帝はオスマン帝国・フランスとの抗争を抱え妥協を迫られた","アウクスブルクの和議（1555）は諸侯に信仰選択権を認め、領邦教会制のもとで領邦君主の権力が強化された"],"ex":"ルターが農民戦争で諸侯側に立ったことにより、改革は領邦君主の権力強化に組み込まれた。和議が認めたのは諸侯の選択権であって、個人の信仰の自由でもカルヴァン派の公認でもない。この限界がのちの三十年戦争の火種となる。皇帝がオスマン・フランスと抗争中だった事情も答案に入れたい。","id":"e06","t":"essay"},{"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1571,"lim":400,"q":"16世紀の地中海世界におけるオスマン帝国とスペインの対立について、その宗教的・政治的背景を説明し、ヨーロッパの国際関係に与えた影響を述べなさい。（400字以内）","pts":["スレイマン1世の全盛期、オスマン帝国はハンガリーを征服し第1次ウィーン包囲（1529）、プレヴェザの海戦で地中海の制海権を握った","ハプスブルク家はスペイン・神聖ローマ・ネーデルラントを支配し、キリスト教世界の防衛者を自任して対オスマンの最前線に立った","フランスはハプスブルク包囲網に対抗するため異教のオスマンと提携しカピチュレーションを得た。宗教より国家利害を優先する勢力均衡の典型である","オスマン側にとってもフランスとの提携はハプスブルクを牽制する手段であった","レパントの海戦（1571）でスペイン中心の連合艦隊が勝利したが、オスマンは艦隊を再建しキプロスを確保した","スペインは対オスマン・オランダ独立戦争・対イギリスで国力を消耗し、覇権は北西ヨーロッパへ移った"],"ex":"宗教対立という外見の裏で、フランスがオスマンと結ぶなど国家理性に基づく勢力均衡が働いた点が一橋の好む論点である。レパントの勝利は象徴的なもので、オスマンはすぐに艦隊を再建した。スペイン衰退の主因は銀依存の経済構造と多方面の戦費であり、レパントの結果ではない。","id":"e07","t":"essay"},{"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1618,"lim":400,"q":"三十年戦争の性格が宗教戦争から国際戦争へと変化していった過程を説明し、ウェストファリア条約がヨーロッパの国際秩序に対して持った意義を述べなさい。（400字以内）","pts":["発端はベーメンの新教徒の反乱。アウクスブルクの和議がカルヴァン派を認めなかった矛盾が背景にある","デンマーク、ついでスウェーデンのグスタフ＝アドルフが新教側で介入し、戦争は国際化した","カトリック国フランスが宰相リシュリューのもと新教側で参戦し、宗教よりも反ハプスブルクという国家利害が優先されたことが明確になった","ヴァレンシュタインらの傭兵と略奪によってドイツは荒廃し、人口が激減した","ウェストファリア条約（1648）はカルヴァン派を公認し、諸侯にほぼ完全な主権を認めて神聖ローマ帝国を事実上解体させた","オランダ・スイスの独立を国際的に承認し、フランスはアルザス、スウェーデンは西ポンメルンを獲得した","主権国家が対等な立場で条約により秩序を形成する体制が成立し、教皇・皇帝の普遍的権威は終わった"],"ex":"カトリック国フランスが新教側で参戦した事実に、宗教から国家理性への転換が最も鮮明に表れる。条約は主権国家体制の出発点とされる一方、ドイツにとっては分裂の固定化であり「帝国の死亡証明書」と呼ばれた。オランダ・スイスの独立は事実上の状態の追認である点にも注意したい。","id":"e08","t":"essay"},{"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1650,"lim":300,"q":"近世ヨーロッパにおける主権国家体制の形成について、常備軍・官僚制・重商主義政策の相互関係に着目して述べなさい。（300字以内）","pts":["教皇・皇帝・封建領主が重なり合う中世的な支配に代わり、明確な領域と最高権力を持つ国家が並立するようになった","火器と歩兵戦術の普及により傭兵から常備軍へ移行し、軍事費が巨額化した","戦費を賄う恒常的な課税には徴税機構が不可欠で、国王に直属する官僚制が整備された","重商主義は貴金属の蓄積を国力とみなし、輸出振興・保護関税・特権会社・植民地獲得を進めた（コルベール）","常備軍と官僚制の維持費が重商主義を要請し、重商主義がさらなる戦争を招く循環が生じた","主権国家は相互に勢力均衡を保つことで秩序を維持した"],"ex":"戦費が官僚制と重商主義を生み、それがまた戦争を支えるという循環として主権国家の形成を説明するとよい。絶対王政期の王権も無制限ではなく、特権身分や地方の抵抗に制約されていた。国富を固定量とみなす重商主義は、のちのアダム＝スミス流の自由主義と正面から対立する。","id":"e09","t":"essay"},{"c":"【近世ヨーロッパ】宗教改革と主権国家体制","y":1545,"lim":400,"q":"16世紀以降のアメリカ大陸産の銀の流入が、ヨーロッパおよびアジアの経済にどのような影響を与えたかを述べなさい。（400字以内）","pts":["ポトシ銀山やメキシコの銀山では先住民がミタ制で酷使され、人口減少後はアフリカ人奴隷が導入された","ヨーロッパでは価格革命が起こり、固定地代に依存する封建領主層が没落する一方、商工業者は利益を得て資本を蓄積した","西欧の商工業化に対し、東欧では再版農奴制のもとグーツヘルシャフトが穀物を輸出する国際分業が成立した","貿易の中心が地中海から大西洋沿岸（アントウェルペン、のちアムステルダム・ロンドン）へ移動した","ガレオン貿易によりメキシコ銀がマニラ経由で中国へ流入し、明の一条鞭法や清の地丁銀制など銀納税制を支えた","17世紀に銀の流入が細ると明は財政難に陥り、王朝交代の一因となった"],"ex":"銀はヨーロッパの物価問題にとどまらず、世界の一体化を示す指標である。西欧の資本蓄積、東欧の再版農奴制、中国の銀納税制がひとつながりで動いた点を示せると強い答案になる。価格革命の主因を銀ではなく人口増加に求める学説がある点にも触れられるとよい。","id":"e10","t":"essay"},{"c":"【近代欧米】産業革命と労働問題・社会主義","y":1760,"lim":400,"q":"イギリスで最初に産業革命が起こった理由について、農業・資本・労働力・市場・技術のそれぞれの条件に言及して述べなさい。（400字以内）","pts":["第2次囲い込みとノーフォーク農法による農業革命が食料を増産し、同時に土地を失った農民を賃労働者として供給した","大西洋三角貿易と奴隷貿易、植民地経営で蓄積された商業資本が工業に投下された","インドをはじめ広大な植民地と、フランスとの抗争に勝利して得た海外市場を独占していた","石炭と鉄鉱石が国内に豊富で、運河網など輸送条件も整っていた","毛織物工業の伝統とギルド規制の弱さ、市民革命後の私的所有権の安定と特許制度が企業活動を促した","飛び杼以降、紡績と織布が交互に技術革新を促す連鎖が生じ、ワットの蒸気機関が動力を汎用化した"],"ex":"「なぜ他国ではなくイギリスか」という比較の視点で条件を並べるのが定石である。囲い込みが食料と労働力の双方を供給した二重の役割、奴隷貿易の利潤が資本源となった点は落とせない。技術の発明は原因というより結果であり、需要の拡大が発明を呼んだ連鎖として説明したい。","id":"e11","t":"essay"},{"c":"【近代欧米】産業革命と労働問題・社会主義","y":1833,"lim":400,"q":"産業革命が労働者の生活と社会構造にもたらした変化を述べ、それに対してイギリスの国家がどのような対応をとったかを説明しなさい。（400字以内）","pts":["工場制機械工業が成立し、産業資本家と労働者という新しい階級関係が生まれた","長時間労働・低賃金・女性や児童の労働が常態化し、マンチェスターなど工業都市では過密と衛生問題が深刻化した","初期の抵抗は機械打ちこわし（ラッダイト運動）で、団結禁止法のもと労働組合は非合法であった","団結禁止法の廃止（1824）で労働組合が合法化された","工場法（1833）が児童労働を制限して監督官を置き、のち10時間労働法（1847）が制定された","第1回選挙法改正（1832）は腐敗選挙区を廃して産業資本家に参政権を与えたが労働者を除外し、チャーティスト運動を招いた","穀物法廃止（1846）・航海法廃止（1849）により自由貿易体制へ移行した"],"ex":"「変化」と「国家の対応」を二段構成で書く。選挙法改正が産業資本家を体制内に取り込む一方で労働者を排除し、それがチャーティスト運動を生んだという因果が答案の軸になる。工場法は人道主義のみならず、労働力の再生産という資本の側の必要からも説明できる。","id":"e12","t":"essay"},{"c":"【近代欧米】産業革命と労働問題・社会主義","y":1848,"lim":400,"q":"19世紀ヨーロッパにおける社会主義思想の展開について、初期社会主義からマルクス主義、および国際的な労働者組織の形成に至る過程を述べなさい。（400字以内）","pts":["産業革命がもたらした労働者の窮乏と、自由放任主義への批判が出発点である","オーウェンはニューラナークの工場経営と協同組合を実践し、サン＝シモン・フーリエらとともに初期社会主義と呼ばれる","マルクスとエンゲルスは『共産党宣言』（1848）で階級闘争と史的唯物論を説き、『資本論』で資本主義を分析した","二月革命後の臨時政府にルイ＝ブランが入り国立作業場が設けられたが、六月蜂起の鎮圧で挫折した","第1インターナショナル（1864）はマルクス派とバクーニンら無政府主義者の対立、パリ＝コミューン敗北の影響で解散した","第2インターナショナル（1889）はドイツ社会民主党を中心とし、ベルンシュタインの修正主義が台頭した","第一次世界大戦で各国の社会主義政党が自国の戦争を支持したため第2インターは崩壊し、のちコミンテルンが結成された"],"ex":"思想を羅列せず、労働者の現実と運動の挫折が次の思想を生む連鎖として書くこと。空想的・科学的という呼称はマルクス側からの評価である点に注意したい。第2インターが戦争協力で崩壊し、その反省からロシア革命後に第3インターが生まれる流れまで見通せると強い。","id":"e13","t":"essay"},{"c":"【近代欧米】産業革命と労働問題・社会主義","y":1838,"lim":300,"q":"チャーティスト運動の要求内容とその背景を説明し、運動が挫折した理由およびその後のイギリス労働運動の展開について述べなさい。（300字以内）","pts":["第1回選挙法改正（1832）で産業資本家は参政権を得たが労働者は除外され、新救貧法への反発と不況が重なった","人民憲章（1838）は男性普通選挙、秘密投票、議員の財産資格廃止、議員への歳費支給、平等選挙区、毎年の議会改選を要求した","要求はいずれも政治的なもので、労働条件そのものの要求ではない点が特徴である","数百万の署名を集めた請願を議会は拒否し、穏健派と武力派の分裂、統一的指導の欠如が運動を弱めた","1850年代以降の好景気と穀物法廃止による生活改善が支持を失わせた","その後は熟練工中心の労働組合による労使交渉路線が主流となり、選挙法改正で参政権が拡大し、1900年の労働代表委員会を経て労働党が成立した"],"ex":"要求が経済的でなく政治的（普通選挙）である点をまず示す。毎年の議会改選を除く要求はのちにすべて実現しており、運動は敗れたが要求は勝ったと評価できる。挫折後の路線が革命ではなく議会主義へ向かったことが、イギリス労働運動の性格を決定づけた。","id":"e14","t":"essay"},{"c":"【近代欧米】産業革命と労働問題・社会主義","y":1834,"lim":400,"q":"19世紀ドイツの工業化の特徴について、イギリスとの違いに留意しながら、政治的統一の過程および国家の役割に言及して述べなさい。（400字以内）","pts":["領邦分立による国内関税、農奴解放の遅れ、資本と市場の未成熟という後発国の条件から出発した","ドイツ関税同盟（1834）による経済的統一が政治的統一に先行した","リストら歴史学派は、後発国は幼稚産業を保護すべきと説き、イギリスの自由貿易に対抗する保護貿易論を展開した","プロイセンが鉄道建設と軍需を主導し、国家が工業化の推進主体となった","ビスマルクによる統一（1871）で帝国の統一市場が成立し、フランスからの賠償金も投下された","鉄鋼・電気・化学など重化学工業が中心で、銀行資本と結びついたカルテル・コンツェルンが独占を形成した","社会主義者鎮圧法と災害・疾病・養老保険を組み合わせた「アメとムチ」で労働者を体制に統合した"],"ex":"軽工業から始まり自由放任を基調としたイギリスと、重化学工業から始まり国家が主導したドイツという対比が答案の軸になる。関税同盟が政治統一に先行した点、リストの保護主義がアダム＝スミス流の自由貿易に対する後発国の応答である点が骨格として使える。","id":"e15","t":"essay"},{"c":"【20世紀】世界経済秩序と覇権の移行","y":1918,"lim":400,"q":"第一次世界大戦がイギリスとアメリカ合衆国の経済的地位をどのように転換させたかを説明し、その後の国際経済秩序において両国が果たした役割について述べなさい。（400字以内）","pts":["大戦前のイギリスはロンドンを中心とする金本位制のもと、世界の金融・海運を握る「世界の銀行」であった","巨額の戦費調達と物資輸入によりイギリスは債務国へ転落し、対照的にそれらを供給したアメリカは世界最大の債権国へ転換した","戦後はドーズ案・ヤング案のように、アメリカ資本がドイツの賠償支払いと欧州復興を支える構造ができた","しかしアメリカは国際連盟に加盟せず孤立主義をとり、経済力に見合う政治的責任を引き受けなかった","イギリスは旧平価での金本位制復帰（1925）で輸出が不振となり、恐慌後は金本位制を停止してスターリング＝ブロックを形成した","第二次世界大戦後のブレトンウッズ体制で金ドル本位制が確立し、覇権の移行が制度として完成した"],"ex":"1918年に覇権が移ったのではない。経済的実力の逆転（債務国・債権国）と、国際秩序を担う意思の不在との時間差こそが戦間期の不安定の核心である。アメリカが責任を引き受けたのは1944年以降という段差を書けると評価が高い。単語の羅列でなく因果で結ぶこと。","id":"e16","t":"essay"},{"c":"【20世紀】世界経済秩序と覇権の移行","y":1929,"lim":400,"q":"1929年に始まる世界恐慌に対して各国がとった対応の違いを説明し、それが1930年代の国際秩序に与えた影響について述べなさい。（400字以内）","pts":["アメリカの過剰生産と農業不況を背景に株式投機が崩壊し、アメリカ資本の引き揚げによって恐慌が世界へ波及した","アメリカはニューディール政策でAAA・NIRAによる生産調整、TVAなどの公共事業、ワグナー法による労働者保護を行い、修正資本主義へ転換した","イギリスは1931年に金本位制を停止してスターリング＝ブロックを、フランスは当初金本位制を維持して金ブロック（のちフラン＝ブロック）を形成し、本国と植民地を高関税で囲い込んだ","ソ連は五カ年計画により世界市場から切り離されていたため恐慌の影響を受けず、計画経済への評価が高まった","植民地や資本に乏しい「持たざる国」ドイツ・イタリア・日本はファシズム化と対外侵略で市場と資源を確保しようとした","世界市場の分断が国際協調を崩し、第二次世界大戦の経済的要因となった"],"ex":"「対応の違い」と「国際秩序への影響」を必ず接続すること。ブロック経済が持たざる国の侵略に口実を与えた点が出題の狙いである。ニューディールの景気回復効果は限定的で、決定打は軍需だったという評価もある。ソ連を対照例に入れると比較の幅が出る。","id":"e17","t":"essay"},{"c":"【20世紀】世界経済秩序と覇権の移行","y":1944,"lim":400,"q":"ブレトンウッズ体制が成立した理由とその仕組みを説明し、1970年代初頭にこの体制が崩壊した経緯について述べなさい。（400字以内）","pts":["戦間期のブロック経済と為替切り下げ競争が戦争を招いたという反省から、自由貿易と為替の安定を制度化しようとした","金1オンス＝35ドルで金とドルを結び、各国通貨をドルに固定する金ドル本位制をとった","IMFが為替安定のための短期融資を、IBRDが復興開発の長期融資を担い、GATTが関税引き下げと自由貿易を進めた","体制はアメリカの圧倒的な金保有と生産力、ドルへの信認を前提としていた","西欧・日本の復興によりアメリカの競争力が低下し、ベトナム戦争の戦費と対外援助でドルが流出してドル危機が生じた","1971年ニクソンが金とドルの交換停止を発表し、スミソニアン協定を経て1973年に主要国が変動相場制へ移行した","石油危機と重なり、以後は先進国首脳会議による政策協調が行われるようになった"],"ex":"体制の設計思想が戦間期の失敗の否定にある点を冒頭に置くと論旨が通る。基軸通貨国は国際流動性の供給と通貨の信認維持を同時に果たせないという構造的矛盾に触れられると差がつく。崩壊は事故ではなく制度の必然として描きたい。","id":"e18","t":"essay"},{"c":"【20世紀】世界経済秩序と覇権の移行","y":1973,"lim":400,"q":"1973年の石油危機が生じた経緯を説明し、それが世界経済および産油国の国際的地位に与えた影響について述べなさい。（400字以内）","pts":["第一次世界大戦後のオスマン帝国解体と英仏の委任統治を経て、中東の油田は国際石油資本に支配されていた","資源ナショナリズムの高まりのなかでOPEC（1960）、アラブ産油国によるOAPEC（1968）が結成され、価格決定権の回復が目指された","パレスチナ問題を背景に中東戦争が繰り返され、第3次中東戦争でのイスラエルの占領がアラブ諸国の反発を強めた","第4次中東戦争に際しOAPECが親イスラエル国への供給削減・禁輸という石油戦略を発動し、OPECが原油価格を大幅に引き上げた","先進国ではインフレと不況が併存するスタグフレーションが生じ、高度経済成長が終わり省エネルギー化と産業構造の転換が進んだ","産油国の発言力が高まり、国連資源特別総会で新国際経済秩序（NIEO）樹立宣言が採択された","非産油途上国はかえって打撃を受け、途上国間の格差（南南問題）が表面化した"],"ex":"中東戦争という政治的事件と、資源ナショナリズムという長期的潮流の二層で説明するのが定石である。石油危機は先進国に減量経営と省エネを促し、結果的に日本の競争力を高めるという逆説を生んだ。非産油途上国が打撃を受けた点まで書けると視野の広さを示せる。","id":"e19","t":"essay"},{"c":"【20世紀】世界経済秩序と覇権の移行","y":1956,"lim":400,"q":"冷戦期における社会主義陣営の結束と動揺について、東欧諸国の自立の動きおよび中ソ対立に言及しながら述べなさい。（400字以内）","pts":["コミンフォルム（1947）、コメコン（1949）、ワルシャワ条約機構（1955）によってソ連を中心とする統制体制が築かれた","最初の亀裂はユーゴスラヴィアで、ティトーの自主路線によりコミンフォルムを除名され、のち非同盟運動を主導した","フルシチョフのスターリン批判と平和共存路線（1956）が衝撃を与え、ポーランドではポズナニ暴動が起きたがゴムウカが事態を収拾してソ連の介入を回避し、ハンガリーではナジ＝イムレの改革にソ連軍が介入して鎮圧した","中国は平和共存路線を修正主義と批判し、中ソ論争が公然化、ソ連は技術援助を停止し、1969年には国境紛争に至った","プラハの春（1968）でドプチェクが「人間の顔をした社会主義」を掲げたが、ワルシャワ条約機構軍が弾圧しブレジネフ＝ドクトリンが唱えられた","中ソ対立は米中接近を促し、冷戦構造そのものを多極化させた","ゴルバチョフの新思考外交による制限主権論の否定が、1989年の東欧革命を可能にした"],"ex":"一枚岩とされた陣営が民族主義と発展段階の違いから裂けていく過程として書く。中ソ対立の起点はスターリン批判と平和共存への反発であり、領土問題は後から前面化した。ブレジネフ＝ドクトリンの否定が1989年の東欧革命を可能にした点まで結べるとよい。","id":"e20","t":"essay"},{"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1842,"lim":400,"q":"19世紀半ば、東アジアの伝統的な国際秩序が欧米との条約体制へと転換していった過程について、清朝の対外関係の変化を中心に述べなさい。（400字以内）","pts":["伝統的秩序は中華思想に基づく冊封・朝貢体制で、民間の互市と組み合わされ、ヨーロッパ船は広州一港と公行に限定されていた","イギリスはマカートニーらを派遣して自由貿易を求めたが拒否され、茶の代価としての銀流出を補うためインド産アヘンを介する三角貿易を行った","林則徐のアヘン取り締まりを機にアヘン戦争が起こり、南京条約（1842）で5港開港、香港島割譲、公行廃止が定められた","虎門寨追加条約などで領事裁判権、協定関税制、片務的最恵国待遇という不平等条項が加わった","アロー戦争の結果の天津・北京条約で外国公使の北京駐在、キリスト教布教の自由、九竜半島の割譲が認められた","総理各国事務衙門が設置され、対外関係が儀礼ではなく外交として扱われるようになった","清仏戦争でベトナム、日清戦争で朝鮮の宗主権を失い、冊封体制は最終的に解体した"],"ex":"朝貢から条約へという転換を、清が世界観の変更を迫られた過程として描く。総理衙門の設置は、対外関係を儀礼ではなく外交として扱い始めた象徴である。冊封体制の最終的な解体は日清戦争であり、アヘン戦争の時点では完結していない点を混同しないこと。","id":"e21","t":"essay"},{"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1894,"lim":400,"q":"19世紀後半、朝鮮をめぐって清と日本はどのように対立したか。朝鮮国内の政治動向にも触れながら、日清戦争に至る過程とその結果を述べなさい。（400字以内）","pts":["朝鮮は清の冊封国であったが、日本は江華島事件を機に結んだ日朝修好条規（1876）で朝鮮を「自主の国」と規定し、清の宗主権を否定した","朝鮮国内では大院君の攘夷政策と閔氏政権の開化政策が対立した","壬午軍乱（1882）に清が出兵して影響力を強めた","甲申政変（1884）で金玉均ら独立党が日本の援助でクーデタを起こしたが清軍に鎮圧され、天津条約で両国の撤兵と出兵時の事前通告が定められた","甲午農民戦争（東学の乱、1894）を機に両国が出兵し日清戦争が勃発した","下関条約（1895）で清は朝鮮の独立を承認し、台湾・遼東半島を割譲、賠償金2億両を支払った（遼東半島は三国干渉で返還）","清の弱体が露呈して列強の中国分割が加速し、朝鮮ではロシアの影響力が強まった"],"ex":"朝鮮が清の属邦か独立国かという宗属関係の定義をめぐる争いとして捉えるのが要点で、日朝修好条規の「自主の国」規定が伏線になる。壬午軍乱・甲申政変・甲午農民戦争の順序と、それぞれで清と日本のどちらが優位に立ったかを取り違えないこと。","id":"e22","t":"essay"},{"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1861,"lim":400,"q":"洋務運動と変法自強運動を比較し、それぞれの理念・担い手・挫折の理由を述べなさい。（400字以内）","pts":["洋務運動は太平天国とアロー戦争の衝撃を受け、郷勇を率いた曽国藩・李鴻章・左宗棠ら漢人の地方大官が主導した","理念は「中体西用」で、儒教的な体制を維持したまま軍事技術と工業のみを導入した（江南製造総局、北洋艦隊、留学生派遣）","政治制度や社会の改革を伴わず、事業が地方ごとに分散したため、清仏戦争と日清戦争の敗北で限界が露呈した","変法自強運動は康有為・梁啓超ら公羊学派の知識人が光緒帝を擁し、日本の明治維新に学んで立憲君主制や学校制度など制度そのものの変革を目指した","西太后ら保守派のクーデタにより約100日で失敗し、光緒帝は幽閉され康・梁は日本へ亡命した","義和団事件後に清自身が光緒新政を進めたが遅きに失し、孫文らの革命運動へ流れが移った"],"ex":"技術のみか制度まで踏み込むかという改革の深さの違いが軸である。担い手も地方の漢人高官と中央の若い知識人で対照的だが、いずれも清朝の維持を前提とした点で共通し、その限界が革命へ道を開いた。変法の挫折理由は外圧でなく宮廷内の権力闘争に求めるのが正確。","id":"e23","t":"essay"},{"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1911,"lim":400,"q":"辛亥革命が起こった背景を説明し、この革命が達成したものとその限界について述べなさい。（400字以内）","pts":["日清戦争の敗北と列強による中国分割、義和団事件後の巨額賠償とそれに伴う増税が清朝への不満を高めた","光緒新政による科挙廃止で知識人は留学や新軍へ向かい、革命思想の担い手となった","孫文は興中会を経て東京で中国同盟会を結成（1905）し、三民主義を掲げた","幹線鉄道国有化に反対する四川保路運動に乗じて武昌で新軍が蜂起し、各省が次々と独立を宣言した","1912年に中華民国が成立して孫文が臨時大総統となったが、袁世凱が宣統帝を退位させる見返りにその地位を得た","アジア最初の共和国が樹立され、2000年以上続いた皇帝支配が終わった点が最大の達成である","袁世凱の独裁と帝政復活の試み、その死後の軍閥割拠が続き、農村社会の変革や列強の権益除去には至らず、五四運動を経て国民革命へ向かった"],"ex":"何を壊し何を壊せなかったかで構成するとよい。皇帝政治は終わったが、軍閥・列強の権益・農村の旧構造は残り、これが五四運動と国民革命につながる。袁世凱が実権を握れたのは北洋軍を握っていたためで、革命派に独自の軍事力がなかった弱さの裏返しである。","id":"e24","t":"essay"},{"c":"【近現代東アジア】国際秩序の変容と中国の近代化","y":1919,"lim":400,"q":"ロシア・ソ連と中国の関係が19世紀から1920年代にかけてどのように変化したかを、両国の国内情勢に触れながら述べなさい。（400字以内）","pts":["帝政ロシアはアイグン条約・北京条約で黒竜江以北と沿海州を獲得し、東清鉄道の敷設、旅順・大連の租借など列強と同様の権益を得た","日露戦争の敗北で南満州の権益は日本へ移ったが、ロシアは北満州や外モンゴルで影響力を保った","ロシア革命（1917）後のカラハン宣言（1919）は帝政期の対中不平等条約と権益の放棄を表明した","宣言は五四運動期の中国知識人に強い衝撃を与え、社会主義への共感を広げた","コミンテルンの指導のもと中国共産党が結成され（1921）、第1次国共合作（1924）が成立し、ソ連は軍事顧問を送り黄埔軍官学校の設立を支援した","実際にはソ連は東清鉄道の権益や外モンゴルへの影響力を手放さず、宣言と実態には乖離があった","蒋介石の上海クーデタ（1927）で合作は崩壊した"],"ex":"侵略者から解放の味方へという中国側の認識の転換と、実際には権益を保持し続けた二重性を対比させるのが要点である。カラハン宣言が五四運動後の思想状況に与えた衝撃が、中国共産党の結成と国共合作の前提になるという因果を落とさないこと。","id":"e25","t":"essay"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":800,"q":"800年、教皇レオ3世がフランク王に帝冠を授け、西ローマ帝国の復活が宣言された出来事を何と呼ぶか。","o":["カールの戴冠","オットー1世の戴冠","ピピンの寄進","クローヴィスの改宗"],"a":0,"ex":"ビザンツ皇帝から自立した西ヨーロッパ世界の成立を象徴する。ローマの古典文化・キリスト教・ゲルマンの要素が融合し、教皇は東方教会に対抗する保護者を得た。962年のオットー1世の戴冠（神聖ローマ帝国の起源）とは160年の差があり、混同しやすいので区別すること。","id":"n001","t":"mc","w":"カールの戴冠"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":962,"q":"神聖ローマ皇帝が司教や修道院長を任命して封土を与え、教会組織を帝国統治の支柱とした政策を何と呼ぶか。","o":["クリュニー改革","帝国教会政策","ピピンの寄進","金印勅書"],"a":1,"ex":"オットー1世が確立した体制で、世襲しない聖職者を統治に用いることで諸侯の自立を抑える狙いがあった。この聖職叙任権こそが叙任権闘争の争点であり、闘争に敗れた皇帝は統治の柱を失って、ドイツの分権化が決定的となった。","id":"n002","t":"mc","w":"帝国教会政策"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":910,"q":"10世紀初めにフランスに創設され、聖職売買や聖職者の妻帯を批判して中世の教会刷新運動の中心となった修道院はどこか。","o":["モンテ＝カシノ修道院","シトー修道会","クリュニー修道院","フランチェスコ修道会"],"a":2,"ex":"ベネディクトゥスの戒律に立ち返り、世俗権力からの教会の自立を掲げた。この運動からグレゴリウス7世が現れ、叙任権闘争へ発展する。12世紀のシトー修道会は大開墾運動を担った点、托鉢修道会（フランチェスコ・ドミニコ）は13世紀の都市で活動した点と区別したい。","id":"n003","t":"mc","w":"クリュニー修道院"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1150,"q":"12世紀以降、ドイツ人がエルベ川以東のスラヴ人地域へ植民し、農地と都市を建設していった運動を何と呼ぶか。","o":["レコンキスタ","東方植民","大開墾運動","東方貿易"],"a":1,"ex":"人口増加と農業技術の向上を背景に、ドイツ騎士団や諸侯が主導した。ブランデンブルク辺境伯領やプロイセンが形成され、のちのドイツ東方領の基礎となる。この地域は近世に農場領主制（グーツヘルシャフト）と再版農奴制の地帯となり、西欧への穀物供給地となった。","id":"n004","t":"mc","w":"東方植民"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1303,"q":"1303年、聖職者への課税をめぐる対立から、フランス王フィリップ4世が教皇ボニファティウス8世を捕らえた事件を何と呼ぶか。","o":["カノッサの屈辱","ヴォルムス協約","アナーニ事件","教会大分裂"],"a":2,"ex":"国王が教皇を屈服させた点で、皇帝が教皇に謝罪したカノッサの屈辱とは力関係が逆転している。フィリップ4世は前年に三部会を招集して国内の支持を固めており、事件後、教皇庁は南仏へ移されて教皇のバビロン捕囚、さらに教会大分裂へと向かった。","id":"n005","t":"mc","w":"アナーニ事件"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1494,"q":"1494年、スペインとポルトガルが植民地獲得の境界線を定め、のちにブラジルがポルトガル領となる根拠となった条約は何か。","o":["トルデシリャス条約","サラゴサ条約","ユトレヒト条約","アシエント"],"a":0,"ex":"教皇が定めた分界線をポルトガルに有利な西側へ修正したもので、南北に引かれた線の東側がポルトガル、西側がスペインの領域とされた。この線がブラジルを横切ったため同地はポルトガル領となる。太平洋側の境界を定めた1529年のサラゴサ条約と区別すること。","id":"n006","t":"mc","w":"トルデシリャス条約"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1500,"q":"大航海時代以降、新旧両大陸のあいだで作物・家畜・病原菌が大規模に行き来した現象を何と呼ぶか。","o":["価格革命","商業革命","コロンブス交換","産業革命"],"a":2,"ex":"トウモロコシやジャガイモが旧大陸の人口増加を支え、砂糖やコーヒーはプランテーションで栽培された。一方、天然痘など免疫のない病原菌がアメリカ先住民の人口を激減させ、その労働力不足が大西洋奴隷貿易を拡大させた。貿易の中心が大西洋へ移った商業革命とは指す内容が異なる。","id":"n007","t":"mc","w":"コロンブス交換"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1503,"q":"スペインがアメリカ大陸で、先住民のキリスト教化を条件に植民者へその統治を委ねた制度を何と呼ぶか。","o":["アシエント","エンコミエンダ制","ミタ制","アシエンダ制"],"a":1,"ex":"名目はキリスト教化だが実態は鉱山や農園での酷使で、ラス＝カサスが激しく批判した。先住民人口の激減を受けて制度は衰え、大農園を経営するアシエンダ制へ移行する。ミタはインカ以来の強制労働制度をポトシ銀山などに転用したもので、別の制度である。","id":"n008","t":"mc","w":"エンコミエンダ制"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1588,"q":"1588年、スペイン王フェリペ2世がイギリス征服のために派遣し、敗北した艦隊を何と呼ぶか。","o":["レパントの海戦の艦隊","無敵艦隊（アルマダ）","プレヴェザの艦隊","トラファルガーの艦隊"],"a":1,"ex":"オランダ独立戦争へのイギリスの支援が派遣の直接の契機である。この敗北はスペイン衰退の象徴とされるが、実際の主因は銀に依存した経済構造、度重なる財政破綻、オランダ・オスマンとの多方面の戦費であり、艦隊はその後再建されている点に注意したい。","id":"n009","t":"mc","w":"無敵艦隊（アルマダ）"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1602,"q":"1602年に設立され、喜望峰以東での貿易独占権に加えて条約締結権や軍隊保有権まで与えられた会社は何か。","o":["イギリス東インド会社","ハンザ同盟","オランダ東インド会社","西インド会社"],"a":2,"ex":"複数の会社を統合した世界初の本格的な株式会社で、バタヴィアを拠点にアンボイナ事件でイギリスを締め出し、香辛料貿易を独占した。アムステルダムは国際金融の中心となる。1600年設立のイギリス東インド会社とは設立年も性格も異なるので取り違えないこと。","id":"n010","t":"mc","w":"オランダ東インド会社"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1807,"q":"ウィルバーフォースらの運動を受け、イギリスが1807年に制定した法は何か。","o":["奴隷貿易廃止法","奴隷制度廃止法","穀物法廃止","工場法"],"a":0,"ex":"奴隷の売買を禁じた法であり、植民地の奴隷制そのものの廃止は1833年の奴隷制度廃止法まで待つ必要がある。両者の26年の差は頻出の論点。背景には人道主義や福音主義に加え、産業革命により砂糖植民地の相対的価値が低下したことや、ハイチ革命の衝撃があった。","id":"n011","t":"mc","w":"奴隷貿易廃止法"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1863,"q":"南北戦争中の1863年、リンカン大統領が発した宣言は何か。","o":["独立宣言","奴隷解放宣言","ホームステッド法","人民憲章"],"a":1,"ex":"反乱状態にある南部諸州の奴隷を対象とした戦時措置で、奴隷制を支持しないイギリスなどの介入を防ぎ、戦争の大義を掲げる狙いがあった。全面的な廃止は戦後の憲法修正第13条による。自営農地法（ホームステッド法）とともに北部が内外の支持を固めた施策である。","id":"n012","t":"mc","w":"奴隷解放宣言"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1877,"q":"南北戦争後の再建期が終わったのち、アメリカ南部で黒人の選挙権や公共施設の利用を制限した一連の州法の総称は何か。","o":["ワグナー法","シャーマン反トラスト法","ホームステッド法","ジム＝クロウ法"],"a":3,"ex":"奴隷制廃止後も識字テストや人頭税で投票を事実上封じ、「分離すれど平等」とした1896年の最高裁判決によって合憲とされた。法的な解放と実質的な平等が一致しなかった典型例で、この体制は1960年代の公民権法・投票権法まで存続する。","id":"n013","t":"mc","w":"ジム＝クロウ法"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1848,"q":"1848年、ルイ＝フィリップの七月王政を倒し、フランスに第二共和政を成立させた革命は何か。","o":["七月革命","二月革命","パリ＝コミューン","三月革命"],"a":1,"ex":"選挙権拡大を求める改革宴会の弾圧が契機で、臨時政府は男性普通選挙を実現した。この報がウィーンやベルリンの三月革命を誘発し、諸国民の春としてウィーン体制を崩壊させた。ただし六月蜂起で労働者が鎮圧され、ルイ＝ナポレオンの台頭を招いた点まで押さえたい。","id":"n014","t":"mc","w":"二月革命"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1893,"q":"世界で最初に女性の国政選挙権を認めた国はどこか。","o":["ニュージーランド","イギリス","アメリカ合衆国","フランス"],"a":0,"ex":"1893年に実現した例外的に早い事例で、多くの国では第一次世界大戦の総力戦で女性が生産を担ったことが参政権拡大の契機となった。イギリスは1918年に30歳以上の女性へ、1928年に男女平等の普通選挙を実現し、アメリカは1920年、フランスは第二次世界大戦末期の1944年に認められ、行使は1945年の選挙からである。","id":"n015","t":"mc","w":"ニュージーランド"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1910,"q":"日露戦争後に保護国化を進めた日本が、1910年に朝鮮を植民地とした条約は何か。","o":["江華島条約（日朝修好条規）","第2次日韓協約","韓国併合条約","下関条約"],"a":2,"ex":"日露戦争中の第1次日韓協約で財政・外交に顧問を置き、戦後の第2次日韓協約（1905）で外交権を奪って統監府を設置、軍隊解散と義兵闘争の鎮圧を経て併合に至った。朝鮮総督府が憲兵警察による武断政治を行い、土地調査事業で農民が土地を失った。1876年の日朝修好条規は朝鮮を「自主の国」と規定して清の宗主権を否定した条約で、段階が異なる。","id":"n016","t":"mc","w":"韓国併合条約"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"q":"1919年、日本の植民地支配に対して朝鮮で起こり、独立宣言の発表から全土に広がった民族運動は何か。","o":["三・一独立運動","五四運動","甲午農民戦争","義兵闘争"],"a":0,"ex":"パリ講和会議の民族自決の理念が刺激となった。運動は武力で鎮圧されたが、日本は統治方法を武断政治から「文化政治」へ転換せざるをえなくなった。同年5月に中国で起きた五四運動と時期が近く、標的も性格も異なるため混同しやすい。","id":"n017","t":"mc","w":"三・一独立運動"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"q":"パリ講和会議で二十一カ条の要求の取り消しが認められなかったことに抗議して、中国で起こった運動は何か。","o":["義和団事件","新文化運動","五四運動","変法自強運動"],"a":2,"ex":"山東の旧ドイツ権益が日本に引き継がれたことへの抗議として北京大学の学生から始まり、商工業者や労働者を巻き込んで全国に広がった。中国政府はヴェルサイユ条約の調印を拒否した。陳独秀らの新文化運動を思想的基盤とし、中国共産党結成や国民革命の前提となる。","id":"n018","t":"mc","w":"五四運動"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1947,"q":"1947年、台湾で本省人の抗議行動を国民党政権が武力で弾圧した事件を何と呼ぶか。","o":["霧社事件","二・二八事件","天安門事件","台湾出兵"],"a":1,"ex":"日本の敗戦で台湾統治を引き継いだ国民党政権の腐敗や経済混乱に対し、先住の本省人が反発したことが背景にある。以後、国共内戦に敗れて移った国民党政権のもとで長期の戒厳令が敷かれた。1930年の霧社事件は日本統治期の先住民の蜂起であり、時期も主体も異なる。","id":"n019","t":"mc","w":"二・二八事件"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1972,"q":"1972年、日本と中華人民共和国が国交を正常化した際に発表された文書は何か。","o":["日中平和友好条約","日華平和条約","日中共同声明","上海コミュニケ"],"a":2,"ex":"1971年に国連の中国代表権が中華民国から中華人民共和国へ移り、ニクソン訪中が実現した流れのなかで結ばれた。これにより日本は中華民国と結んでいた日華平和条約を終了させた。条約としての日中平和友好条約の締結は1978年で、6年の差がある点に注意したい。","id":"n020","t":"mc","w":"日中共同声明"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1857,"q":"1857年に始まり、東インド会社の解散とムガル帝国の滅亡をもたらしたインドの大規模な反乱は何か。","o":["プラッシーの戦い","シパーヒーの反乱（インド大反乱）","ベンガル分割令反対運動","非暴力・不服従運動"],"a":1,"ex":"牛と豚の脂を用いた薬包の使用が直接の契機だが、背景には藩王国の併合政策、重い地税、社会慣行への干渉に対する広範な反発があった。鎮圧後、ムガル皇帝は廃位され東インド会社は解散、イギリス本国による直接統治へ移行した。","id":"n021","t":"mc","w":"シパーヒーの反乱（インド大反乱）"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1877,"q":"1877年、ヴィクトリア女王が皇帝を兼ねる形で成立した、イギリスによるインド直接統治の体制を何と呼ぶか。","o":["ムガル帝国","インド帝国","インド連邦","東インド会社領"],"a":1,"ex":"ディズレーリ保守党内閣がスエズ運河株の買収と並行して進めた帝国主義政策の一環である。全土を直轄領と藩王国に分け、藩王を温存して分割統治を行った。同時期に成立したインド国民会議は当初、知識人の穏健な協議機関として発足した点も押さえたい。","id":"n022","t":"mc","w":"インド帝国"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1905,"q":"1905年、イギリスがヒンドゥーとムスリムの分断をねらってベンガル州を分割しようとした法令は何か。","o":["ローラット法","インド統治法","ベンガル分割令","塩の専売法"],"a":2,"ex":"民族運動の中心地を宗教別に分断する狙いだったが、かえって反英運動を高揚させた。国民会議派はカルカッタ大会で英貨排斥・スワデーシ・スワラージ・民族教育の四綱領を採択して急進化し、一方でイギリスの支援のもと全インド＝ムスリム連盟が結成され、のちの分離独立の遠因となった。","id":"n023","t":"mc","w":"ベンガル分割令"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1930,"q":"1930年、ガンディーが植民地政府の塩の専売に抗議して海岸まで行進した非暴力の抵抗を何と呼ぶか。","o":["非協力運動","塩の行進","ローラット法反対闘争","セポイの反乱"],"a":1,"ex":"生活必需品への課税という誰にでも理解できる争点を選び、第2次非暴力・不服従運動の象徴となった。1919年のローラット法とアムリットサール事件を受けた第1次非協力運動（1920年〜）とは時期が異なる。以後の円卓会議を経て1935年インド統治法が制定された。","id":"n024","t":"mc","w":"塩の行進"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1947,"q":"1947年、インドとパキスタンが分離して独立する根拠となったイギリスの法は何か。","o":["インド統治法","インド独立法","ラホール決議","インド帝国法"],"a":1,"ex":"ムスリム連盟のジンナーが掲げた二民族論に基づき、宗教別に二つの自治領が成立した。統一インドを求めたガンディーは分離に反対し、翌年暗殺される。分離に伴う住民の大移動で多数の犠牲が出て、藩王国カシミールの帰属をめぐり印パ戦争が繰り返された。","id":"n025","t":"mc","w":"インド独立法"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":800,"lim":400,"q":"800年のカールの戴冠が持つ歴史的意義について、フランク王国と教皇およびビザンツ帝国との関係に触れながら述べなさい。また、イスラーム勢力の地中海進出が西ヨーロッパ世界の成立に果たした役割をめぐる議論（ピレンヌ＝テーゼ）にも言及しなさい。（400字以内）","pts":["ゲルマン人の大移動後、フランク王国はクローヴィスのアタナシウス派改宗によってローマ系住民とローマ教会の支持を得た","ローマ教会は聖像禁止令をめぐりビザンツ皇帝と対立し、ランゴバルド人の圧迫に対抗する政治的保護者を必要としていた","ピピンの寄進で教皇領が成立し、教会と王権の提携が形をとった","カールはランゴバルド王国を滅ぼしイスラーム勢力やアヴァール人と戦い、西方キリスト教世界の守護者となった","戴冠はビザンツ皇帝の権威から自立した西ローマ帝国の復活を意味し、ローマの古典文化・キリスト教・ゲルマンの要素が融合した西ヨーロッパ世界が成立した","教皇が帝冠を授けるという形式は、のちの皇帝権と教皇権の関係に争いの種を残した","ピレンヌ＝テーゼは、ゲルマン人の移動ではなくイスラーム勢力の地中海制圧が古代地中海世界の一体性を断ち、西欧が内陸の農業社会として自立する契機になったと説き、「ムハンマドなくしてカールなし」と要約される","この説には地中海交易が完全には途絶しなかったとの批判もあるが、西欧世界の成立を地中海全体の構造変動から捉える視点を提供した"],"ex":"戴冠の意義は、教会がビザンツから自立した保護者を得た点と、西ヨーロッパという新しい文化圏が成立した点にある。ピレンヌ＝テーゼはこれをイスラーム勢力の地中海進出と結びつけ、西欧の成立を地中海全体の構造変動から説明する。962年のオットー1世の戴冠と混同しないこと。","id":"f01","t":"essay"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":962,"lim":400,"q":"オットー1世の戴冠によって成立した神聖ローマ帝国の統治構造について、帝国教会政策の内容と意義を説明し、この帝国がフランスやイギリスと異なる発展をたどった理由を述べなさい。（400字以内）","pts":["オットー1世はマジャール人をレヒフェルトの戦いで撃退し、西方キリスト教世界の防衛者としての権威を得て教皇から戴冠された","部族大公の自立が強く世襲的な家産的基盤が弱かったため、皇帝は世襲しない聖職者を統治に用いた","帝国教会政策により司教・修道院長を任命して封土を与え、その軍事力と財力を帝国統治の支柱とした","この体制は聖職叙任権を前提とするため、教会改革運動と正面から衝突して叙任権闘争を招いた","皇帝はローマ皇帝の称号にこだわってイタリア政策を繰り返し、ドイツを留守にしたため諸侯の自立が進んだ","大空位時代を経て金印勅書（1356）が七選帝侯による皇帝選挙を定め、分権が法的に固定された","フランスやイギリスでは国王が官僚制と常備軍を整えて中央集権化したのに対し、帝国は領邦の集合体にとどまり、統一は19世紀まで遅れた"],"ex":"皇帝が世襲しない聖職者を統治に用いた帝国教会政策が、この帝国の強みであり弱点でもあった。叙任権闘争でその柱を失い、イタリア政策で本国を留守にした結果、諸侯が自立して金印勅書で分権が固定される。西欧の中央集権化との対比で論じるのが定石である。","id":"f02","t":"essay"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1150,"lim":400,"q":"11世紀から13世紀の西ヨーロッパにおける大開墾運動と東方植民について、その前提となった農業技術の変化を説明し、これらが社会と経済にもたらした影響を述べなさい。（400字以内）","pts":["三圃制の普及、重量有輪犂と馬耕の導入、水車の利用によって農業生産力が上昇した","生産力の上昇が人口増加をもたらし、新たな耕地を求める動きが強まった","シトー修道会が森林の開墾や沼沢地の干拓を主導し、オランダでは干拓が進んだ","ドイツ人はエルベ川以東のスラヴ人地域へ東方植民を行い、ドイツ騎士団や諸侯が農村と都市を建設した","余剰生産物が定期市や遠隔地商業を支え、都市の発展と貨幣経済の浸透を促した","領主は貨幣地代への移行を進め、農民の地位が向上して自立的な農民層が現れた","14世紀の黒死病による人口激減が労働力不足を招き、農民の待遇改善と農奴解放が進んだ（西欧）","一方エルベ以東は近世に農場領主制と再版農奴制の地帯となり、西欧へ穀物を輸出する国際分業の一方の極となった"],"ex":"農業技術の向上が人口増加を生み、開墾と植民、都市と商業の発展、そして貨幣地代への移行を通じて荘園制を解体させたという連鎖で書く。東方植民地帯が近世には逆に再版農奴制の地域となり、西欧と東欧の分業が生まれる点まで結べると評価が高い。","id":"f03","t":"essay"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1198,"lim":400,"q":"中世西ヨーロッパにおける教皇権の絶頂から衰退までの過程を、世俗権力との関係の変化に着目して述べなさい。（400字以内）","pts":["クリュニー改革から叙任権闘争を経て、教会は世俗権力からの自立を進めた","インノケンティウス3世の時代に教皇権は絶頂に達し、イギリス王ジョンやフランス王を破門して屈服させ、「教皇は太陽、皇帝は月」と称された","第4回十字軍がコンスタンティノープルを占領してラテン帝国を建てるなど、十字軍の逸脱と失敗が教皇の権威を傷つけた","各国で王権が伸長し、フィリップ4世は聖職者課税をめぐり教皇ボニファティウス8世と対立、三部会を招集して国内の支持を固めた","アナーニ事件（1303）で国王が教皇を捕らえ、カノッサとは逆に世俗権力の優位が示された","教皇庁がアヴィニョンへ移されて教皇のバビロン捕囚となり、続く教会大分裂で複数の教皇が並立して権威は失墜した","コンスタンツ公会議が分裂を収拾しフスを処刑したが、ウィクリフ・フスの批判は教会の腐敗を突き、のちの宗教改革につながった"],"ex":"教皇権の絶頂と衰退を、王権の伸長という同時進行の動きと対で捉えるのが要点である。カノッサとアナーニの力関係の逆転が転換点を示す。十字軍の失敗が権威を傷つけ、バビロン捕囚と大分裂で決定的となり、教会批判が宗教改革の前史を形づくった。","id":"f04","t":"essay"},{"c":"【中世ヨーロッパ】キリスト教世界と王権・国家形成","y":1215,"lim":300,"q":"中世後期のイギリスとフランスにおける身分制議会の成立について、それぞれの成立事情と王権との関係の違いに着目して述べなさい。（300字以内）","pts":["封建社会では国王も封建的契約に拘束され、重要事項には家臣の助言と同意を必要とした","イギリスではジョン王の失政と重税に対し、貴族がマグナ＝カルタ（1215）を認めさせ、課税には高位聖職者と貴族の同意を要すると定めた","シモン＝ド＝モンフォールの反乱を経て、エドワード1世が模範議会（1295）を招集し、騎士と市民が参加した","のち貴族院と庶民院の二院制となり、課税承認権を通じて王権を制限する伝統が育った","フランスではフィリップ4世が教皇との対立に際して三部会（1302）を招集し、国内の支持を得るために用いた","三部会は身分別に分かれ、王権を制限するよりも王権を補強する機能を果たし、百年戦争後は常設の課税権を得た王によってほとんど開かれなくなった","この違いが、のちのイギリスの議会政治とフランスの絶対王政という対照的な展開の前提となった"],"ex":"同じ身分制議会でも、王権を制限する方向に働いたイギリスと、王権を補強する道具となったフランスという違いが論点である。マグナ＝カルタの課税同意原則が議会の淵源となり、三部会は絶対王政期に停止される。近代の議会制民主主義と同一視しないよう注意したい。","id":"f05","t":"essay"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1492,"lim":400,"q":"大航海時代が始まった背景を説明し、それが世界の結びつきとヨーロッパ経済にもたらした変化について述べなさい。（400字以内）","pts":["オスマン帝国の進出により東方貿易の陸路が圧迫され、香辛料を直接入手する動機が強まった","マルコ＝ポーロの『世界の記述』による東方への関心と、キリスト教布教の情熱（レコンキスタの延長）が動機に加わった","羅針盤の実用化、カラベル船、地球球体説の普及など航海技術の前提が整った","ポルトガルはエンリケの事業を起点にアフリカ西岸を南下し、ヴァスコ＝ダ＝ガマがインド航路を開いてゴア・マラッカを拠点に香辛料貿易を独占した","スペインはコロンブスの航海以後アメリカ大陸へ進出し、コルテス・ピサロがアステカ・インカを滅ぼして銀山を開発した","商業革命により貿易の中心が地中海から大西洋岸（リスボン、アントウェルペン、のちアムステルダム）へ移り、イタリア諸都市は衰退した","アメリカ銀の流入が価格革命を起こし、固定地代に依存する領主層が没落する一方、商工業者が資本を蓄積した","ガレオン貿易により銀がアジアへ流れ、世界が一つの交易網で結ばれる一方、アメリカ先住民社会の破壊と奴隷貿易の拡大をもたらした"],"ex":"香辛料・布教・技術という三つの前提から説き起こし、結果を商業革命と価格革命という二つの語で整理するのが定石である。ヨーロッパの繁栄が先住民社会の破壊と奴隷貿易の上に成立した点、銀を通じてアジアまで一体化した点を落とさないこと。","id":"f06","t":"essay"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1500,"lim":400,"q":"コロンブス交換とは何か説明し、それがアメリカ大陸・ヨーロッパ・アフリカの社会にそれぞれどのような影響を与えたかを述べなさい。（400字以内）","pts":["新旧両大陸の間で作物・家畜・人間・病原菌が双方向に移動した現象を指す","アメリカ大陸には小麦・サトウキビ・馬・牛が持ち込まれ、大農園と牧畜が広がった","天然痘・麻疹など免疫のない病原菌が持ち込まれ、先住民人口が激減した（征服の成功を説明する最大の要因）","エンコミエンダ制やミタ制のもとでの酷使が人口減少に拍車をかけた","旧大陸にはトウモロコシ・ジャガイモ・サツマイモが伝わり、寒冷地や痩地でも栽培できたためヨーロッパと中国の人口増加を支えた","ジャガイモ依存はアイルランドのジャガイモ飢饉のような脆弱性も生んだ","砂糖・タバコ・綿花はプランテーション作物となり、先住民労働力の枯渇を補うため大西洋奴隷貿易が拡大した","アフリカは人口の流出と社会の混乱を被り、ヨーロッパは三角貿易の利潤を産業革命の資本として蓄積した"],"ex":"生態系の交換が三大陸の人口構造を変えたという視点で書く。旧大陸では新作物が人口を増やし、新大陸では疫病が人口を激減させ、その労働力不足がアフリカからの奴隷貿易を生んだという因果の連鎖が答案の骨格になる。征服の主因が疫病であった点は重要。","id":"f07","t":"essay"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1556,"lim":400,"q":"16世紀に「太陽の沈まぬ国」と呼ばれたスペインが、17世紀に入って衰退した理由について述べなさい。（400字以内）","pts":["カルロス1世（カール5世）はハプスブルク家の広大な領土を継ぎ、フェリペ2世はポルトガルを併合して世界的な帝国を築いた","ポトシ銀山などアメリカの銀が富の源泉であったが、国内産業の育成に向かわず輸入品の支払いに流出した","銀の流入による物価騰貴が国内の毛織物工業の競争力を奪い、ユダヤ教徒・ムスリムの追放が商工業の担い手を失わせた","カトリックの盟主を自任して対オスマン戦、オランダ独立戦争、イギリスとの戦いを同時に抱え、戦費が財政を圧迫して国家財政は繰り返し破綻した","ネーデルラントの重税と新教徒弾圧が独立戦争を招き、北部7州が独立して最も富裕な地域を失った","無敵艦隊の敗北（1588）は制海権喪失の象徴とされるが、艦隊は再建されており衰退の決定的原因ではない","三十年戦争とウェストファリア条約でオランダの独立が国際的に承認され、覇権はオランダ、ついでイギリスへ移った"],"ex":"銀という富が国内産業に結びつかず流出した構造的要因と、多方面の戦費という財政要因を軸に書く。無敵艦隊の敗北を衰退の原因と短絡させないことが差のつく点である。最も富裕なネーデルラントを失ったことが、覇権移動を決定づけた。","id":"f08","t":"essay"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1648,"lim":400,"q":"17世紀にオランダが世界商業の覇権を握ることができた理由を説明し、その覇権が後退していった経緯について述べなさい。（400字以内）","pts":["スペインからの独立戦争を通じて、商工業者が主導する連邦共和国という体制が生まれた","アントウェルペン陥落後、その商人と技術がアムステルダムへ流入した","バルト海貿易で穀物と木材を扱い、造船業と安価な輸送力（フライト船）で中継貿易を握った","東インド会社が株式会社として資本を集め、条約締結権と軍隊保有権を持ってバタヴィアを拠点に香辛料貿易を独占、アンボイナ事件でイギリスを排除した","アムステルダム銀行と証券取引所が国際金融の中心を形成し、宗教的寛容が各地から人材と資本を呼び込んだ","中継貿易中心で国内工業の基盤が弱く、イギリスの航海法と三次にわたる英蘭戦争で中継貿易の利益を削られた","ルイ14世の侵略戦争に対抗するための軍事費が財政を圧迫し、陸続きの大国との戦いで消耗した","名誉革命を経てイギリスが金融制度と植民地を拡大し、18世紀には覇権がイギリスへ移った"],"ex":"中継貿易と金融という強みが、同時に国内工業基盤の弱さという弱点でもあった点を軸に書く。航海法と英蘭戦争はその弱点を突く政策であった。オランダの衰退は絶対的な没落ではなく、陸の大国フランスと海の大国イギリスに挟まれた構造的な後退として描きたい。","id":"f09","t":"essay"},{"c":"【近世ヨーロッパ】交易の拡大と覇権の交代","y":1756,"lim":400,"q":"17世紀から18世紀にかけてのイギリスとフランスの植民地抗争について、重商主義政策との関係に触れながら、その経過と結果を述べなさい。（400字以内）","pts":["重商主義は国富を貴金属の量とみなし、輸出振興・保護関税・特権会社・植民地獲得を国家が主導した","フランスはコルベールのもとで特権マニュファクチュアと東インド会社を整備し、イギリスは航海法でオランダを排除した","北米ではイギリスの13植民地とフランスのカナダ・ルイジアナが対立し、インドではベンガルとデカンで両国が現地勢力と結んで争った","ヨーロッパの戦争と連動し、スペイン継承戦争のユトレヒト条約でイギリスはニューファンドランドとアシエントを得た","オーストリア継承戦争・七年戦争と並行して、北米ではフレンチ＝インディアン戦争、インドではプラッシーの戦いが戦われた","パリ条約（1763）でイギリスはカナダとミシシッピ川以東のルイジアナを獲得し、フランスはインドと北米の拠点をほぼ失った","植民地市場と奴隷貿易の利潤がイギリスの資本蓄積を支え、産業革命の前提となった","一方で戦費が本国の財政を圧迫し、植民地への課税強化がアメリカ独立革命を、フランスでは財政危機が革命を招いた"],"ex":"第2次英仏百年戦争を、重商主義の論理が必然的に生んだ抗争として描く。勝利したイギリスが産業革命の前提を得た一方、両国とも戦費の負担が本国の政治危機（アメリカ独立とフランス革命）を招いたという逆説まで書けると論旨が締まる。","id":"f10","t":"essay"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1833,"lim":400,"q":"イギリスにおける奴隷貿易廃止から奴隷制度廃止に至る過程を説明し、奴隷制が廃止された理由を複数の観点から述べなさい。（400字以内）","pts":["大西洋三角貿易でイギリスはリヴァプールなどを拠点に奴隷貿易の最大の担い手となっていた","啓蒙思想の人権意識とクエーカー・福音主義の宗教的動機から、ウィルバーフォースらが廃止運動を組織した","ハイチ革命（1804）は黒人自身の蜂起によって奴隷制を打ち破り、支配の維持費用と危険を強く印象づけた","産業革命の進展により、富の源泉が砂糖植民地から工業製品の輸出と自由貿易へ移り、独占的な奴隷制植民地の相対的価値が低下した","1807年に奴隷貿易廃止法が成立し、1833年の奴隷制度廃止法で植民地の奴隷制そのものが廃止された","イギリスは海軍力で他国の奴隷貿易も取り締まり、人道主義を掲げつつ自国の優位を確保した","解放後の労働力不足を補うためインドや中国から年季契約労働者（インデンチャー・レイバー、苦力）が導入され、新たな移民社会と搾取が生まれた"],"ex":"人道主義だけで説明せず、ハイチ革命という奴隷自身の抵抗と、産業革命による経済構造の転換を並べるのが要点である。貿易廃止（1807）と制度廃止（1833）の区別、そして廃止後に年季契約労働者が導入され搾取が形を変えた点まで書きたい。","id":"f11","t":"essay"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1861,"lim":400,"q":"アメリカ南北戦争が起こった原因を経済構造の違いから説明し、戦争の結果と、戦後の再建が抱えた限界について述べなさい。（400字以内）","pts":["北部は保護関税を求める商工業地帯で自由労働に基づき、南部は綿花のプランテーションを軸にイギリスへの輸出を重視して自由貿易と奴隷制を求めた","西部の新州を自由州とするか奴隷州とするかをめぐり、ミズーリ協定やカンザス・ネブラスカ法で対立が激化した","共和党のリンカンの当選を機に南部諸州が連邦を離脱してアメリカ連合国を結成した","リンカンはホームステッド法で西部農民の支持を集め、奴隷解放宣言でイギリスなどの南部支援を封じて戦争の大義を掲げた","北部の工業力が勝敗を決し、連邦が維持され、憲法修正第13条で奴隷制が廃止された","戦後は国内市場が統一され、保護関税のもとで急速な工業化が進んで19世紀末には世界最大の工業国となった","解放された黒人に土地は与えられず、分益小作（シェアクロッパー）として経済的に従属した","再建期の終了後、南部ではジム＝クロウ法と「分離すれど平等」の判決により人種隔離が法制化され、実質的平等は1960年代の公民権運動まで実現しなかった"],"ex":"原因は奴隷制の道徳問題に還元せず、関税・西部・労働力をめぐる二つの経済構造の対立として説明する。結果として工業国アメリカが誕生した一方、解放が土地を伴わなかったために人種隔離が長期化したという「限界」が問われやすい論点である。","id":"f12","t":"essay"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1848,"lim":400,"q":"1848年に各国で起きた革命（諸国民の春）の展開を説明し、それらが短期的には挫折しながら、ヨーロッパの政治と社会に何を残したかを述べなさい。（400字以内）","pts":["ウィーン体制のもとで抑えられていた自由主義とナショナリズムが、産業革命による社会問題と凶作・恐慌を背景に噴出した","フランスの二月革命で七月王政が倒れ第二共和政が成立し、男性普通選挙が実現した","ウィーン三月革命でメッテルニヒが失脚してウィーン体制は崩壊し、ベルリンでも三月革命が起きた","ドイツではフランクフルト国民議会が統一と憲法を討議したが、小ドイツ主義と大ドイツ主義の対立とプロイセン王の帝冠拒否で失敗した","ハンガリーのコシュート、ベーメンの民族運動は多民族帝国内の対立もあって鎮圧された","フランスでは国立作業場の廃止に反発した労働者の六月蜂起が鎮圧され、市民層と労働者の分裂が露呈してルイ＝ナポレオンの台頭を許した","多くは挫折したが、農奴制の廃止（オーストリア）、男性普通選挙の経験、憲法制定の要求は定着した","自由主義的な統一の失敗はドイツ・イタリアで「上からの統一」（ビスマルク、カヴール）という現実主義の路線を準備した"],"ex":"自由主義とナショナリズムの噴出、市民層と労働者の分裂による挫折、その後の上からの統一への転換という三段で構成する。六月蜂起は自由主義と社会主義が袂を分かった瞬間として重要である。挫折した革命が何を残したかを問う設問が多い。","id":"f13","t":"essay"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1918,"lim":400,"q":"19世紀後半から20世紀前半にかけての欧米における参政権の拡大について、その要因を説明し、大衆社会の成立と結びつけて述べなさい。（400字以内）","pts":["産業革命により都市労働者が増加し、労働組合や社会主義政党が組織されて政治的発言力を求めた","イギリスでは第2回・第3回選挙法改正で都市労働者、ついで農業・鉱山労働者へ参政権が拡大したが、21歳以上の男性普通選挙が実現したのは1918年の第4回改正である","ドイツでは帝国議会が男性普通選挙で選ばれ、社会民主党が第一党へ成長した","義務教育の普及で識字率が上昇し、安価な大衆新聞が世論を形成する基盤となった","女性参政権運動は当初弾圧されたが、第一次世界大戦の総力戦で女性が軍需生産を担ったことが決定的な契機となった","イギリスは1918年に30歳以上の女性、1928年に男女平等の普通選挙を実現し、アメリカは1920年、フランスは1944年であった","大衆が有権者となったことで政党は組織化と宣伝を重視し、大衆迎合的な政治やナショナリズムの動員も可能になった","戦間期には大衆の支持を背景にファシズムが台頭し、大衆社会が民主主義と独裁の双方の基盤になりうることが示された"],"ex":"参政権拡大を権利の進歩としてだけでなく、総力戦による動員の見返りという側面から説明するのが要点である。大衆社会の成立は民主主義の基盤であると同時に、宣伝による動員とファシズム台頭の条件でもあったという両義性まで書きたい。","id":"f14","t":"essay"},{"c":"【近現代欧米】市民社会と政治・社会変動","y":1870,"lim":300,"q":"第2次産業革命の特徴を第1次産業革命と比較して説明し、それが企業のあり方と国際関係に与えた影響について述べなさい。（300字以内）","pts":["第1次が軽工業（綿工業）と石炭・蒸気機関を基盤としたのに対し、第2次は重化学工業（鉄鋼・電気・化学・石油）を中心とする","技術は科学的研究と結びつき、ドイツとアメリカが先行してイギリスの優位が揺らいだ","巨額の設備投資が必要となり、銀行資本と結合した独占体（カルテル・トラスト・コンツェルン）が形成された","資本の集中が金融資本を生み、国外への資本輸出が利潤の重要な源泉となった","原料供給地・市場・投資先を求める動きが帝国主義的な植民地獲得競争を加速させた","鉄道・汽船・電信が世界を結び、大量生産と大量消費を前提とする社会が現れた","列強間の経済的対立が同盟関係の形成と軍拡競争を招き、第一次世界大戦の背景となった"],"ex":"軽工業から重化学工業へ、個人企業から独占資本へ、自由貿易から資本輸出と帝国主義へ、という三つの転換で整理する。イギリスの相対的後退とドイツ・アメリカの台頭が、第一次世界大戦に至る国際対立の経済的基盤をなした点が結論になる。","id":"f15","t":"essay"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1895,"lim":400,"q":"17世紀から20世紀半ばにかけて、台湾の帰属と統治はどのように変化したかを、その時々の国際関係と結びつけて述べなさい。（400字以内）","pts":["17世紀にオランダが南部を拠点化し、鄭成功がこれを追って反清活動の根拠地としたのち、康熙帝の時代に清朝に編入され福建省の一部とされた","19世紀後半、列強の進出と日本の台湾出兵を受けて清は防衛を強化し、1885年に台湾省を設置した","日清戦争の下関条約（1895）で日本へ割譲され、住民の抵抗を鎮圧して総督府が設置された","日本統治下ではインフラ整備と製糖業の育成が進む一方、同化政策と差別が行われ、霧社事件のような抵抗も起きた","第二次世界大戦中のカイロ宣言で中国への返還が表明され、日本の敗戦により中華民国の統治下に入った","国民党政権の統治に対する本省人の不満から二・二八事件（1947）が起こり、武力弾圧された","国共内戦に敗れた国民党政権が1949年に台北へ移り、中華民国政府が台湾を統治する体制となった","朝鮮戦争の勃発でアメリカが台湾海峡に介入し、台湾は東アジア冷戦の最前線に組み込まれた"],"ex":"帰属の変化を、その都度の国際関係（清の海禁と鄭氏、日清戦争、第二次世界大戦、国共内戦と冷戦）と結びつけて時系列で整理する。二・二八事件と1949年の政府移転を区別し、朝鮮戦争が台湾の地位を冷戦構造のなかで固定した点まで押さえたい。","id":"f16","t":"essay"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1910,"lim":400,"q":"日本による朝鮮の植民地化の過程を説明し、それに対する朝鮮の民族運動がどのように展開したかを述べなさい。（400字以内）","pts":["日朝修好条規（1876）で朝鮮を「自主の国」と規定して清の宗主権を否定し、日清戦争の下関条約で清は朝鮮の独立を承認した","三国干渉後はロシアの影響力が強まり、日露戦争の勝利で日本が優位を確立した","日露戦争中の第1次日韓協約で財政・外交に顧問を置き、戦後の第2次日韓協約（1905）で外交権を奪って保護国化し、統監府を置いた","ハーグ密使事件を口実に皇帝を退位させ軍隊を解散させると、元兵士が加わった義兵闘争が広がった","1910年の韓国併合条約で植民地化し、朝鮮総督府が憲兵警察による武断政治を行った","土地調査事業により申告制度を利用して多くの農民が土地を失い、日本人地主と東洋拓殖会社の所有が拡大した","パリ講和会議の民族自決に刺激され、1919年に三・一独立運動が全土に広がったが武力で鎮圧された","日本は統治方法を「文化政治」へ転換し、一方で上海に大韓民国臨時政府が樹立され、国外の独立運動が続いた"],"ex":"段階的な権益の剥奪（修好条規→協約→保護国→併合）を順に押さえ、それぞれに対応する抵抗（義兵闘争→三・一独立運動）を対置する。三・一独立運動が武断政治から文化政治への転換をもたらした点が因果として重要である。","id":"f17","t":"essay"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1919,"lim":400,"q":"五四運動が起こった背景を説明し、この運動が中国の政治と思想にもたらした変化について述べなさい。（400字以内）","pts":["辛亥革命後も袁世凱の独裁と軍閥割拠が続き、共和政は実質を伴わなかった","第一次世界大戦中、日本は二十一カ条の要求を突きつけて山東の旧ドイツ権益などを認めさせた","大戦で列強のアジアへの関与が薄れたことにより民族資本が成長し、都市の労働者と学生層が厚みを増した","陳独秀の『新青年』や胡適の白話運動など新文化運動が儒教道徳を批判し、民主と科学を掲げていた","ロシア革命とカラハン宣言が社会主義への関心を高めた","パリ講和会議で二十一カ条の取り消しが認められず、1919年5月4日に北京の学生が抗議し、商人や労働者を巻き込んで全国に拡大した","中国政府はヴェルサイユ条約の調印を拒否し、大衆運動が外交を動かしうることが示された","知識人の一部がマルクス主義に向かい中国共産党の結成（1921）につながり、孫文も大衆の力を重視して中国国民党を改組、第1次国共合作へ向かった"],"ex":"二十一カ条という直接の契機だけでなく、新文化運動・民族資本の成長・ロシア革命という三つの下地を示すのが要点である。運動の意義は、知識人の思想運動が大衆運動へ転化し、国民党の改組と共産党の結成という政党政治の再編を準備した点にある。","id":"f18","t":"essay"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1937,"lim":400,"q":"1920年代から1940年代にかけての中国国民党と共産党の関係の変遷を、日本の中国侵略との関連に着目して述べなさい。（400字以内）","pts":["ソ連とコミンテルンの支援のもと第1次国共合作（1924）が成立し、黄埔軍官学校を基盤に北伐が進められた","蒋介石は上海クーデタ（1927）で共産党を弾圧して南京国民政府を樹立し、合作は崩壊した","共産党は農村に根拠地を築き、国民党の包囲攻撃を受けて長征を行い、延安を拠点とした","満洲事変と満洲国建国に対し蒋介石は「安内攘外」を掲げて共産党討伐を優先した","西安事件（1936）で張学良が蒋介石を監禁して内戦停止を迫り、抗日を優先する方向が定まった","盧溝橋事件（1937）による日中戦争の全面化を受け第2次国共合作が成立し、抗日民族統一戦線が形成された","国民政府は重慶へ移って持久戦を続け、共産党は農村で抗日根拠地を広げて支持を拡大した","日本の敗戦後に国共内戦が再燃し、1949年に中華人民共和国が成立、国民党政権は台湾へ移った"],"ex":"合作と決裂の反復を、日本の侵略という外圧が両者を結びつけ、その終息が再び対立を呼ぶという構図で整理する。西安事件が転換点である。戦時下に共産党が農村で支持を拡大したことが、戦後の内戦の帰趨を決めた点まで結べると評価が高い。","id":"f19","t":"essay"},{"c":"【近現代アジア】中国・朝鮮・台湾の国際関係","y":1950,"lim":400,"q":"朝鮮戦争が東アジアの国際秩序に与えた影響について、関係する諸国への影響に触れながら述べなさい。（400字以内）","pts":["日本の敗戦後、朝鮮半島は北緯38度線で米ソに分割占領され、1948年に大韓民国と朝鮮民主主義人民共和国が成立した","1950年に北朝鮮が南進して開戦し、国連軍（実質は米軍中心）が介入、中国人民義勇軍が参戦して戦線は38度線付近で膠着し、1953年に休戦協定が結ばれた","朝鮮半島の分断が固定化され、現在まで平和条約は結ばれていない","アメリカは台湾海峡に第7艦隊を派遣し、台湾の国民党政権を防衛して中華人民共和国との対立を固定化した","中国は米国と直接戦火を交えたことで国際的孤立が深まる一方、ソ連への依存を強めた","日本は特需景気により経済復興が加速し、サンフランシスコ平和条約と日米安全保障条約によって西側陣営の一員として独立した","警察予備隊が創設され、のちの自衛隊へとつながる再軍備が始まった","冷戦はヨーロッパにとどまらずアジアで熱戦となり、米国は日韓台を結ぶ同盟網を築いて封じ込めを世界化した"],"ex":"一国の戦争ではなく、東アジア全体の冷戦構造を確定させた出来事として書く。朝鮮の分断固定、台湾海峡への米軍介入、日本の独立と再軍備という三方向の影響を並べるのが定石。歴史総合型の設問では日本への影響が問われやすい。","id":"f20","t":"essay"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1793,"lim":400,"q":"イギリスによるインド支配の確立過程を説明し、その支配がインドの経済構造をどのように変えたかを述べなさい。（400字以内）","pts":["プラッシーの戦い（1757）でフランスとベンガル太守の連合軍を破ってベンガルでの優位を確立し、ブクサールの戦いを経て1765年にムガル皇帝からディーワーニー（徴税権）を獲得して支配の財源とした","マイソール戦争・マラーター戦争・シク戦争を経て全域を制圧し、藩王国を温存して分割統治を行った","ザミンダーリー制やライヤットワーリー制を導入して地税を貨幣で徴収し、土地の私有と課税を固定化した","重い地税が農民を現金作物の栽培や借金に追い込み、飢饉への抵抗力を弱めた","機械制の安価なイギリス製綿布が流入し、ダッカなどの伝統的綿織物業が破壊されて「脱工業化」が進んだ","インドは綿花・藍・アヘン・茶など原料の供給地かつイギリス製品の市場へと転換した","アヘンは中国へ輸出され、イギリス・インド・中国を結ぶ三角貿易の一環に組み込まれた","鉄道や灌漑は整備されたが、原料の搬出とイギリス資本の利益に奉仕する構造であった"],"ex":"徴税権の獲得が支配の財源となった点、そして世界最大の綿織物輸出地が原料供給地と市場へ転落した「脱工業化」が答案の中心である。鉄道建設などの近代化も本国の利益に沿うものだった点、アヘンを介して中国と結びついた点を落とさないこと。","id":"f21","t":"essay"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1857,"lim":300,"q":"シパーヒーの反乱（インド大反乱）が起こった原因を説明し、その結果イギリスのインド統治がどのように変わったかを述べなさい。（300字以内）","pts":["東インド会社は藩王に後継者がない場合に領土を接収する政策をとり、藩王・地主層の不満を高めていた","重い地税と綿織物業の没落により農民・手工業者が困窮していた","サティー（寡婦殉死）の禁止など社会慣行への干渉や布教活動が、宗教への介入と受け取られた","牛と豚の脂を塗ったとされる薬包を口で噛む必要があったことが、ヒンドゥー・ムスリム双方の宗教感情を害し直接の契機となった","傭兵シパーヒーの蜂起にデリー市民や旧支配層、農民が合流し、ムガル皇帝を擁立して北インド一帯に広がった","統一的な指導と目標を欠き、藩王の一部がイギリス側についたため鎮圧された","ムガル皇帝は廃位されて帝国は滅亡し、東インド会社は解散、本国政府による直接統治に移行した","1877年にヴィクトリア女王を皇帝とするインド帝国が成立し、以後は宗教・カーストの違いを利用する分割統治が強化された"],"ex":"薬包の噂は引き金にすぎず、併合政策・地税・社会慣行への干渉という構造的不満が本体である点を示す。結果として会社統治から本国の直接統治へ移り、インド帝国が成立した。宗教対立を利用する分割統治の強化が、のちの分離独立の遠因となる。","id":"f22","t":"essay"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1920,"lim":400,"q":"インド国民会議の結成から第二次世界大戦期に至るインド民族運動の展開について、イギリスの対応とヒンドゥー・ムスリム関係の変化に触れながら述べなさい。（400字以内）","pts":["1885年に結成されたインド国民会議は当初、知識人を中心とする穏健な協議機関であった","ベンガル分割令（1905）に反発してカルカッタ大会で英貨排斥・スワデーシ・スワラージ・民族教育の四綱領を採択し、急進化した","イギリスの支援で全インド＝ムスリム連盟が結成され、宗教別選挙区の導入が両者の分断を制度化した","第一次世界大戦に協力すれば自治を与えるという約束に反し、戦後のインド統治法は限定的で、ローラット法が令状なしの逮捕を認めた","アムリットサール事件の衝撃を受け、ガンディーが非暴力・不服従（サティヤーグラハ）を掲げて大衆運動へ転換させた","ネルーら急進派はプールナ＝スワラージ（完全独立）を決議し、塩の行進（1930）が第2次不服従運動の象徴となった","円卓会議を経た1935年インド統治法は州自治を認めたが中央の権限は残り、独立要求は収まらなかった","第二次世界大戦でイギリスが協議なく参戦させたため国民会議派は非協力を強め、ムスリム連盟はジンナーのもとパキスタン建国を決議して対立が決定的となった"],"ex":"穏健な協議機関が大衆運動へ転化する過程と、イギリスの譲歩が常に小出しで不十分だったことを対にして書く。ベンガル分割令と宗教別選挙区が宗教対立を制度に埋め込み、戦時の対応の違いが分離独立へ向かわせたという因果を軸にしたい。","id":"f23","t":"essay"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1947,"lim":400,"q":"インドとパキスタンが分離して独立するに至った要因を説明し、分離独立がもたらした帰結について述べなさい。（400字以内）","pts":["ムガル帝国以来ヒンドゥーとムスリムは共存していたが、イギリスの分割統治が宗教的差異を政治的対立に転化させた","ベンガル分割令と宗教別選挙区の導入により、宗教ごとに政治的利害を主張する構造がつくられた","国民会議派はヒンドゥー色の強い組織とみなされ、少数派のムスリムは独立後の地位に不安を抱いた","ジンナーは二民族論を唱え、1940年のラホール決議でムスリム国家パキスタンの樹立を掲げた","第二次世界大戦への協力をめぐり国民会議派とムスリム連盟の姿勢が分かれ、イギリスは後者への依存を強めた","戦争で疲弊したイギリスは早期撤退を決め、1947年のインド独立法で二つの自治領が成立した","ガンディーは統一を主張して分離に反対し、翌年ヒンドゥー至上主義者に暗殺された","宗教別の住民大移動で多数の犠牲者が出て、藩王国カシミールの帰属をめぐり印パ戦争が繰り返され、現在まで対立が続いている"],"ex":"分離を宗教対立の必然とせず、分割統治と宗教別選挙区が対立を制度化した結果として説明するのが要点である。イギリスの早期撤退が混乱を拡大させた点、カシミール問題が両国の核保有を含む長期対立の起点となった点まで結びたい。","id":"f24","t":"essay"},{"c":"【近現代インド】脱植民地化とグローバルサウス","y":1955,"lim":400,"q":"第二次世界大戦後のアジア・アフリカ諸国による非同盟の動きについて、その成立の背景と展開を説明し、南北問題との関係にも触れながら述べなさい。（400字以内）","pts":["戦後の脱植民地化で多くの独立国が生まれたが、冷戦の二極構造のもとで陣営への従属を迫られた","インドのネルーと中国の周恩来が平和五原則（1954）で主権尊重・内政不干渉・平和共存を確認した","バンドン会議（1955）は反植民地主義と平和共存を掲げる平和十原則を採択し、アジア・アフリカ諸国が国際政治の主体として登場した","ティトー、ナセル、ネルーらが主導して第1回非同盟諸国首脳会議（1961）が開かれた","1960年の「アフリカの年」で多数の独立国が生まれ、国連での発言力が増した","政治的独立を得ても経済は旧宗主国に従属し、単一の一次産品に依存するモノカルチャー経済が残った","先進国と途上国の経済格差が南北問題として意識され、国連貿易開発会議（UNCTAD）が交渉の場となった","資源ナショナリズムの高まりと石油危機を背景に新国際経済秩序（NIEO）樹立宣言が採択されたが、産油国と非産油国の格差（南南問題）も表面化し、この系譜が今日のグローバルサウスの主張につながる"],"ex":"非同盟を、冷戦の二極構造に対する第三の極として位置づけ、政治的独立が経済的自立を伴わなかったために南北問題へ課題が移行した流れで書く。バンドン会議と非同盟諸国首脳会議は別の会議である点、南南問題まで触れられると視野の広さを示せる。","id":"f25","t":"essay"}];

function nextD(D,g){const dd=-W[6]*(g-3);let Dp=D+dd*(10-D)/9;return clamp(W[7]*D0(4)+(1-W[7])*Dp,1,10)}
function recallS(D,S,R,g){const hard=g===2?W[15]:1,easy=g===4?W[16]:1;
  return clamp(S*(1+Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-R))-1)*hard*easy),0.1,36500)}
function forgetS(D,S,R){return clamp(Math.min(W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-R)),S),0.1,36500)}
const LEARN_STEPS=[1,10], RELEARN_STEPS=[10];
const DAY=86400000, MIN=60000;

/* ============ 状態 ============ */
let S={};
let CFG={retention:0.9,newPerDay:20,sessionMax:0,order:'seq',bias:'review'};
let LOG={date:'',newDone:0,revDone:0,streakDays:0,lastStudy:'',correct:0,total:0};
let UC=[];   // 追加した問題
let OV={};   // 収録問題への修正
let DL=[];   // 削除した収録問題のid
let storageOK=true,storageKind='none',dirty=false,saveTimer=null;
const KEY='wh-mc-v1';
const today=()=>new Date().toISOString().slice(0,10);
const isUserQ=id=>typeof id==='string'&&id[0]==='u';

async function storageGet(k){
  if(window.storage)return await window.storage.get(k);
  try{const v=localStorage.getItem(k);return v!=null?{key:k,value:v}:null}catch(e){throw e}
}
async function storageSet(k,v){
  if(window.storage){const r=await window.storage.set(k,v);if(!r)throw new Error('null応答');return r}
  try{localStorage.setItem(k,v);return{key:k,value:v}}catch(e){throw e}
}
function detectStorage(){
  if(window.storage){storageKind='claude';return true}
  try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__');storageKind='local';return true}
  catch(e){storageKind='none';return false}
}
function applyPayload(v){
  const o=JSON.parse(v);
  S=o.s||{};CFG=Object.assign(CFG,o.cfg||{});LOG=Object.assign(LOG,o.log||{});
  UC=o.uc||[];OV=o.ov||{};DL=o.dl||[];
  for(const q of UC)QS.push(q);
  for(const id in OV){const q=QS.find(x=>String(x.id)===String(id));if(q)Object.assign(q,OV[id]);}
  if(DL.length){const del=new Set(DL.map(String));
    for(let i=QS.length-1;i>=0;i--){if(del.has(String(QS[i].id)))QS.splice(i,1)}}
}
async function loadState(){
  storageOK=detectStorage();
  if(!storageOK)return;
  let done=false;
  try{
    const r=await storageGet(KEY);
    if(r&&r.value){applyPayload(r.value);done=true}
  }catch(e){}
  if(!done&&storageKind==='claude'){
    try{const bk=localStorage.getItem(KEY+'-bk');if(bk){applyPayload(bk);dirty=true;}}catch(e){}
  }
}
function scheduleSave(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveState,600)}
async function saveState(){
  if(!storageOK||!dirty)return false;
  clearTimeout(saveTimer);
  const payload=JSON.stringify({s:S,cfg:CFG,log:LOG,uc:UC,ov:OV,dl:DL});
  for(let i=0;i<4;i++){
    try{await storageSet(KEY,payload);dirty=false;
      try{localStorage.setItem(KEY+'-bk',payload)}catch(e){}
      return true}
    catch(e){await new Promise(r=>setTimeout(r,400*(i+1)))}
  }
  toast('保存に失敗しました。後で自動再試行します');
  return false;
}
setInterval(()=>{if(dirty)saveState()},10000);

/* ============ 採点 ============ */
function getSt(id){return S[id]||(S[id]={st:0,step:0,D:0,S:0,due:0,last:0,reps:0,lapses:0,ok:0,ng:0})}
function previewIvl(c,g){
  if(c.st===0||c.st===1||c.st===3){
    const steps=c.st===3?RELEARN_STEPS:LEARN_STEPS;
    const i=c.st===0?0:c.step;
    if(g===1)return fmtIvl(steps[0]*MIN);
    if(g===2)return fmtIvl((steps[Math.min(i,steps.length-1)])*MIN);
    if(g===3){ if(i+1<steps.length)return fmtIvl(steps[i+1]*MIN);
      const s=c.st===0?S0(3):(c.S||S0(3));return fmtIvl(nextInterval(s,CFG.retention)*DAY)}
    const s=c.st===0?S0(4):(c.S||S0(4));return fmtIvl(nextInterval(s,CFG.retention)*DAY);
  }
  const t=Math.max(0,(Date.now()-c.last)/DAY), R=retr(t,c.S);
  const ns=g===1?forgetS(c.D,c.S,R):recallS(c.D,c.S,R,g);
  if(g===1)return fmtIvl(RELEARN_STEPS[0]*MIN);
  return fmtIvl(nextInterval(ns,CFG.retention)*DAY);
}
function grade(id,g,correct){
  const c=getSt(id), now=Date.now(), isNew=c.st===0;
  if(correct===true)c.ok=(c.ok|0)+1; else if(correct===false)c.ng=(c.ng|0)+1;
  if(c.st===0){
    c.D=D0(g);c.S=S0(g);
    if(g<=2){c.st=1;c.step=0;c.due=now+LEARN_STEPS[0]*MIN}
    else if(g===3){ if(LEARN_STEPS.length>1){c.st=1;c.step=1;c.due=now+LEARN_STEPS[1]*MIN} else {c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY} }
    else{c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }else if(c.st===1||c.st===3){
    const steps=c.st===3?RELEARN_STEPS:LEARN_STEPS;
    if(g===1){c.step=0;c.due=now+steps[0]*MIN}
    else if(g===2){c.due=now+steps[Math.min(c.step,steps.length-1)]*MIN}
    else if(g===3){ if(c.step+1<steps.length){c.step++;c.due=now+steps[c.step]*MIN} else {c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY} }
    else{c.st=2;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }else{
    const t=Math.max(0,(now-c.last)/DAY), R=retr(t,c.S);
    const D=nextD(c.D,g);
    if(g===1){c.S=forgetS(c.D,c.S,R);c.D=D;c.lapses++;c.st=3;c.step=0;c.due=now+RELEARN_STEPS[0]*MIN}
    else{c.S=recallS(c.D,c.S,R,g);c.D=D;c.due=now+nextInterval(c.S,CFG.retention)*DAY}
  }
  c.last=now;c.reps++;
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0}
  if(isNew)LOG.newDone++;else LOG.revDone++;
  if(correct===true){LOG.correct=(LOG.correct|0)+1}
  if(correct!==null&&correct!==undefined){LOG.total=(LOG.total|0)+1}
  if(LOG.lastStudy!==today()){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    LOG.streakDays=(LOG.lastStudy===y)?(LOG.streakDays||0)+1:1;
    LOG.lastStudy=today();
  }
  scheduleSave();
}
function fmtIvl(ms){
  const m=ms/MIN;
  if(m<60)return '<'+Math.max(1,Math.round(m))+'分';
  if(ms<DAY)return Math.round(ms/3600000)+'時間';
  const d=ms/DAY;
  if(d<30)return Math.round(d)+'日';
  if(d<365)return (d/30.4).toFixed(1).replace(/\.0$/,'')+'ヶ月';
  return (d/365).toFixed(1).replace(/\.0$/,'')+'年';
}

/* ============ キュー ============ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){
  const now=Date.now();
  if(LOG.date!==today()){LOG.date=today();LOG.newDone=0;LOG.revDone=0}
  const due=[],learn=[],fresh=[];
  for(const q of QS){
    const st=S[q.id];
    if(!st||st.st===0){fresh.push(q);continue}
    if(st.due<=now){(st.st===2?due:learn).push(q)}
  }
  due.sort((a,b)=>S[a.id].due-S[b.id].due);
  learn.sort((a,b)=>S[a.id].due-S[b.id].due);
  const lim=Math.max(0,CFG.newPerDay-LOG.newDone);
  let nw=CFG.order==='rand'?shuffle(fresh.slice()):fresh;
  nw=nw.slice(0,lim);
  let q = CFG.bias==='new' ? [...nw,...learn,...due]
        : CFG.bias==='mix' ? [...learn,...shuffle([...due,...nw])]
        : [...learn,...due,...nw];
  const cap=CFG.sessionMax|0;
  if(cap>0&&q.length>cap)q=q.slice(0,cap);
  return {queue:q,dueN:due.length+learn.length,newN:nw.length,freshTotal:fresh.length};
}
function futureDue(){const now=Date.now();let n=0;for(const id in S){const c=S[id];if(c.st>0&&c.due>now&&c.due<=now+DAY)n++}return n}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}

function yearLabel(y){
  if(y===undefined||y===null||y==='')return '年代未設定';
  const n=Number(y);
  if(!isFinite(n))return String(y);
  return n<0?('前'+Math.abs(n)+'年頃'):(n+'年頃');
}
function ptsList(p){
  const a=Array.isArray(p)?p:String(p||'').split('\n');
  return a.map(x=>String(x).trim()).filter(x=>x);
}

/* ---- session ---- */
function startSession(){
  const q=buildQueue();
  queue=q.queue;qi=0;sessionDone=0;sessionTotal=queue.length;
  if(!sessionTotal){toast('出題できる問題がありません');return}
  renderCard();
}
function renderCard(){
  setNav('home');
  if(qi>=queue.length){renderFinish();return}
  let guard=queue.length-qi;
  while(guard-->0){
    const st=S[queue[qi].id];
    const notReady=st&&(st.st===1||st.st===3)&&st.due>Date.now()+2000;
    if(notReady&&qi<queue.length-1)queue.push(queue.splice(qi,1)[0]); else break;
  }
  const q=queue[qi], st=getSt(q.id), isNew=st.st===0;
  revealed=false;answered=null;
  const head=`
  <div class="progress"><i style="width:${sessionTotal?Math.round(sessionDone/sessionTotal*100):0}%"></i></div>
  <div class="qtags"><span class="${isNew?'tag-new':''}">${isNew?'新規':st.st===2?'復習':'学習中'}${isUserQ(q.id)?'・追加分':''}</span><span>残り ${queue.length-qi} 問</span></div>`;
  const grades=`
    <div class="grades" id="grades">
      <button class="g1" data-g="1"><b>もう一度</b><small>${previewIvl(st,1)}</small></button>
      <button class="g2" data-g="2"><b>難しい</b><small>${previewIvl(st,2)}</small></button>
      <button class="g3" data-g="3"><b>普通</b><small>${previewIvl(st,3)}</small></button>
      <button class="g4" data-g="4"><b>簡単</b><small>${previewIvl(st,4)}</small></button>
    </div>`;
  if(isEssay(q)){
    main.innerHTML=head+`
    <div class="card">
      <div class="body">
        <span class="kind essay">論述</span>${q.c?`<span class="kind">${esc(q.c)}</span>`:''}
        <div class="stem">${esc(q.q)}</div>
        <div class="limnote">目安 ${q.lim||400} 字　／　背景・因果・歴史的意義を軸に構成しましょう</div>
        <textarea class="memo" id="essayMemo" placeholder="答案の骨子をここにメモできます（保存されません）"></textarea>
        <div class="ansbox" id="ansbox"></div>
      </div>
      <button class="reveal" id="revealBtn">解答の骨子を見る</button>
      ${grades}
    </div>`;
  }else{
    main.innerHTML=head+`
    <div class="card">
      <div class="body">
        ${q.c?`<span class="kind">${esc(q.c)}</span>`:''}
        <div class="stem">${esc(q.q)}</div>
        <div class="opts" id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div class="ansbox" id="ansbox"></div>
      </div>
      <button class="reveal" id="revealBtn">わからない（答えを見る）</button>
      ${grades}
    </div>`;
    $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(revealed)return;
      reveal(q,+b.dataset.i===q.a,+b.dataset.i);
    });
  }
  $('#revealBtn').onclick=()=>{ if(!revealed)reveal(q,null); };
  $('#grades').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    grade(q.id,+b.dataset.g,answered);
    sessionDone++;qi++;renderCard();
  });
}
function reveal(q,correct,picked){
  revealed=true;answered=correct;
  let html='';
  if(isEssay(q)){

    html=`<div class="ansline"><span class="lab">正解</span><b>${q.a+1}. ${esc(q.o[q.a])}</b>${mark}</div>`;

let listQuery='',listSort='regOld',listType='all';
const SORTS=[['regNew','登録順が新しい順'],['regOld','登録順が古い順'],['histOld','歴史が古い順'],['histNew','歴史が新しい順']];
function sortItems(items){
  const pos=new Map(QS.map((x,i)=>[x.id,i]));
  const yv=x=>{const n=Number(x.y);return isFinite(n)?n:null};
  const a=items.slice();
  if(listSort==='regNew')a.sort((x,y)=>pos.get(y.id)-pos.get(x.id));
  else if(listSort==='regOld')a.sort((x,y)=>pos.get(x.id)-pos.get(y.id));
  else{
    const dir=listSort==='histNew'?-1:1;
    a.sort((x,y)=>{
      const vx=yv(x),vy=yv(y);
      if(vx===null&&vy===null)return pos.get(x.id)-pos.get(y.id);
      if(vx===null)return 1;   /* 年代未設定は常に末尾 */
      if(vy===null)return -1;
      if(vx!==vy)return (vx-vy)*dir;
      return pos.get(x.id)-pos.get(y.id);
    });
  }
  return a;
}

  <div class="substat"><span>該当 <b>${items.length}</b> 問</span><span>タップで解答表示</span></div>
  <div id="lw">${items.map(x=>{
    const st=S[x.id];
    const stn=!st||st.st===0?'未着手':st.st===2?'復習':'学習中';
    const det=isEssay(x)
      ? `<div class="dlabm">要点</div><ol class="pts sm">${ptsList(x.pts).map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`
        +(x.ex?`<div class="dlabm">解説</div><div>${esc(x.ex)}</div>`:'')
      : `正解：${x.a+1}. ${esc(x.o[x.a])}${x.ex?'<br>'+esc(x.ex):''}`;
    return `<div class="li" data-id="${esc(String(x.id))}">
      <div class="top"><span class="w">${isEssay(x)?'<span class="bdg">論述</span>':''}${esc(x.c||'（章未設定）')}</span>
      <span>${esc(yearLabel(x.y))}・${isUserQ(x.id)?'<span class="ulabel">追加分</span>・':''}${stn}</span></div>
      <div>${esc(x.q)}</div>
      <div class="det">${det}
      <button class="eb" data-edit="${esc(String(x.id))}">編集・削除</button></div></div>`;
  }).join('')||'<div class="substat">該当なし</div>'}</div>`;
  const s=$('#sq');
  s.oninput=()=>{listQuery=s.value;const p=s.selectionStart;renderList();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};

const EX_RULE=`■ 解説（ex）— 必ず作成すること

function extractJSON(text){
  let t=String(text).replace(/```json/gi,'').replace(/```/g,'');
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s<0||e<s)return null;
  const cand=t.slice(s,e+1);
  const d=tryParse(cand); if(d)return d;
  const f=normalizeQuotes(cand);
  return tryParse(f)||tryParse(firstObject(f)||'')||null;
}
function tryParse(s){try{return JSON.parse(s)}catch(e){return null}}
function normalizeQuotes(s){
  const DQ=/[“”„‟″〃＂]/;
  let out='',inStr=false,es=false;
  for(let i=0;i<s.length;i++){
    let ch=s[i];
    if(inStr){
      if(es){out+=ch;es=false;continue}
      if(ch==='\\'){out+=ch;es=true;continue}
      if(ch==='"'||DQ.test(ch)){
        let j=i+1;while(j<s.length&&/\s/.test(s[j]))j++;
        const nx=s[j];
        if(nx===undefined||nx===','||nx==='}'||nx===']'||nx===':'){out+='"';inStr=false;continue}
        out+=(ch==='"')?'\\"':ch;continue;
      }
      out+=ch;continue;
    }
    if(ch==='"'||DQ.test(ch)){out+='"';inStr=true;continue}
    out+=ch;
  }
  return out;
}
function firstObject(t){
  const s=t.indexOf('{');if(s<0)return null;
  let d=0,inStr=false,es=false;
  for(let i=s;i<t.length;i++){
    const ch=t[i];
    if(inStr){if(es)es=false;else if(ch==='\\')es=true;else if(ch==='"')inStr=false}
    else{if(ch==='"')inStr=true;else if(ch==='{')d++;else if(ch==='}'){d--;if(!d)return t.slice(s,i+1)}}
  }
  return null;
}

function normalizeReply(j,fallbackType){
  const type=(j.t==='essay'||j.t==='論述'||(Array.isArray(j.pts)&&j.pts.length&&!Array.isArray(j.o)))?'essay':
             (j.t==='mc'||Array.isArray(j.o))?'mc':fallbackType;
  const yv=(j.y===undefined||j.y===null||j.y==='')?'':(isFinite(Number(j.y))?String(parseInt(j.y,10)):'');
  const o=Array.isArray(j.o)?j.o.slice(0,4).map(x=>String(x)):null;
  return {t:type,
    q:j.q?String(j.q):'',
    o:(o&&o.length===4&&o.every(x=>x.trim()))?o:null,
    a:Math.max(0,Math.min(3,parseInt(j.a)||0)),
    pts:Array.isArray(j.pts)?ptsList(j.pts):(j.pts?ptsList(j.pts):null),
    lim:isFinite(Number(j.lim))&&Number(j.lim)>0?String(parseInt(j.lim,10)):'',
    c:j.c?String(j.c):'', y:yv, ex:j.ex?String(j.ex):''};
}

function sameOpts(c,n){
  if(!c.o||!n.o)return false;
  if(c.a!==n.a)return false;

function renderDiffPanel(host,cur,neu,commitLabel,onCommit,onCancel){
  const type=neu.t||cur.t||'mc';
  const essay=type==='essay';
  const hasOptsNew=!!(neu.o&&neu.o.length===4&&neu.o.every(x=>x&&String(x).trim()));
  const hasPtsNew=ptsList(neu.pts).length>0;
  const fields=[{k:'q',label:'問題文',append:false}]
    .concat(essay?[{k:'pts',label:'要点（1行に1項目）',append:true},{k:'lim',label:'字数',append:false}]
                 :[{k:'opts',label:'選択肢と正解',append:false}])
    .concat([{k:'c',label:'章・分野',append:false},{k:'y',label:'年代（西暦）',append:false},{k:'ex',label:'解説',append:true}]);
  let html='<div class="fpanel"><div class="hd"><b>現在の内容と比べて反映する</b><br>項目ごとに、どう扱うかを選んでください。反映される内容はそのまま手直しできます。</div>';
  if(cur.t&&neu.t&&cur.t!==neu.t){
    html+=`<div class="warnbox">⚠️ 形式が異なります（現在：${cur.t==='essay'?'論述':'4択'} → 提案：${essay?'論述':'4択'}）。反映すると形式が変わります。</div>`;
  }
  for(const f of fields){
    let curV,newV,same,hasNew;
    if(f.k==='opts'){
      curV=optsHTML(cur.o,cur.a); newV=optsHTML(neu.o,neu.a);
      hasNew=hasOptsNew; same=hasNew&&sameOpts(cur,neu);
    }else if(f.k==='pts'){
      curV=ptsHTML(cur.pts); newV=ptsHTML(neu.pts);
      hasNew=hasPtsNew; same=hasNew&&ptsList(cur.pts).join('\n')===ptsList(neu.pts).join('\n');
    }else{
      const cv=String(cur[f.k]||'').trim(), nv=String(neu[f.k]||'').trim();
      curV=cv?esc(cv):'<span class="dempty">（未入力）</span>';
      newV=esc(nv); hasNew=!!nv; same=hasNew&&cv===nv;
    }
    html+='<div class="dfield">';
    html+='<div class="dlab">'+f.label
      +(same?'<span>（変更なし）</span>':'')
      +(!hasNew?'<span>（Claudeの提案なし）</span>':'')+'</div>';
    html+='<div><div class="dsub">現在</div><div class="dcur">'+curV+'</div></div>';
    if(hasNew&&!same){
      html+='<div><div class="dsub new">Claudeの提案</div><div class="dnew">'+newV+'</div></div>';
      html+='<div class="dbtns">'
        +'<button class="dbtn" data-k="'+f.k+'" data-a="keep">現在のまま</button>'
        +'<button class="dbtn on" data-k="'+f.k+'" data-a="replace">置き換え</button>'
        +(f.append?'<button class="dbtn" data-k="'+f.k+'" data-a="append">追記</button>':'')
        +'</div>';
    }
    html+='<div class="dres"><div class="dsub">反映される内容（編集できます）</div>';
    if(f.k==='opts')html+='<div id="dOptWrap"></div>';
    else if(f.k==='pts')html+='<textarea id="d-pts" style="min-height:130px"></textarea>';
    else html+='<textarea id="d-'+f.k+'" style="min-height:'+(f.k==='q'?'64px':f.k==='ex'?'80px':'42px')+'"></textarea>';
    html+='</div></div>';
  }
  html+='<button class="fbtn" id="dCommit">'+esc(commitLabel)+'</button>';
  html+='<button class="fbtn2" id="dCancel">比較をやめる</button>';
  html+='</div>';
  host.innerHTML=html;

  if(!essay){
    const setOpts=(o,a)=>{document.getElementById('dOptWrap').innerHTML=optRows(o,a,'dAns','d-o')};
    const useNew=hasOptsNew&&!sameOpts(cur,neu);
    setOpts(useNew?neu.o.map(x=>String(x)):(cur.o||['','','','']), useNew?neu.a:(cur.a|0));
    host._setOpts=setOpts;
  }
  for(const f of fields){
    if(f.k==='opts')continue;
    if(f.k==='pts'){
      const cv=ptsList(cur.pts).join('\n'), nv=ptsList(neu.pts).join('\n');
      document.getElementById('d-pts').value=(nv&&nv!==cv)?nv:cv;
      continue;
    }
    const cv=String(cur[f.k]||'').trim(), nv=String(neu[f.k]||'').trim();
    document.getElementById('d-'+f.k).value=(nv&&nv!==cv)?nv:cv;
  }
  host.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,a=b.dataset.a;
    host.querySelectorAll('.dbtn[data-k="'+k+'"]').forEach(x=>x.classList.toggle('on',x===b));
    if(k==='opts'){
      if(a==='keep')host._setOpts(cur.o||['','','',''],cur.a|0);
      else host._setOpts(neu.o.map(x=>String(x)),neu.a);
      return;
    }
    const ta=document.getElementById('d-'+k);
    let cv,nv;
    if(k==='pts'){cv=ptsList(cur.pts).join('\n');nv=ptsList(neu.pts).join('\n')}
    else{cv=String(cur[k]||'').trim();nv=String(neu[k]||'').trim()}
    if(a==='keep')ta.value=cv;
    else if(a==='replace')ta.value=nv;
    else ta.value=cv?(cv+(k==='pts'?'\n':' ／ ')+nv):nv;
  });
  document.getElementById('dCancel').onclick=()=>{host.innerHTML='';if(onCancel)onCancel()};
  document.getElementById('dCommit').onclick=()=>{
    const r={t:type,
      q:document.getElementById('d-q').value.trim(),
      c:document.getElementById('d-c').value.trim(),
      y:document.getElementById('d-y').value.trim(),
      ex:document.getElementById('d-ex').value.trim()};
    if(essay){
      r.pts=ptsList(document.getElementById('d-pts').value);
      r.lim=document.getElementById('d-lim').value.trim();
    }else{
      r.o=[0,1,2,3].map(i=>document.getElementById('d-o'+i).value.trim());
      const sel=host.querySelector('input[name=dAns]:checked');
      r.a=sel?+sel.value:0;
    }
    onCommit(r);
  };
  host.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 手順①の入力が「問題文」として成立していそうなら、それを現在の内容として扱う */
function questionLikeInput(){
  const el=$('#f-in'); if(!el)return '';
  const v=el.value.trim();
  return (v.length>=15&&/[。？?）)]$/.test(v))?v:'';
}
function readForm(){
  const essay=!!document.getElementById('f-pts');
  const base={t:essay?'essay':'mc',
    q:$('#f-q').value.trim(),
    c:$('#f-c').value.trim(),
    y:$('#f-y').value.trim(),
    ex:$('#f-ex').value.trim()};
  if(essay){
    base.pts=ptsList($('#f-pts').value);
    base.lim=$('#f-lim').value.trim();
    base.o=null;base.a=0;
  }else{
    base.o=[0,1,2,3].map(i=>$('#f-o'+i).value.trim());
    const sel=document.querySelector('input[name=ansSel]:checked');
    base.a=sel?+sel.value:0;
    base.pts=[];base.lim='';
  }
  return base;
}
function validate(v){
  if(!v.q)return '問題文は必須です';
  if(v.t==='essay'){
    if(ptsList(v.pts).length<2)return '要点を2つ以上、1行に1項目で入力してください';
  }else{
    if((v.o||[]).some(x=>!x))return '4つの選択肢はすべて必須です';
    if(new Set(v.o).size<4)return '選択肢が重複しています';
  }
  if(!v.ex)return '解説は必須です（150文字程度で背景と因果を書いてください）';
  if(v.y&&!/^-?\d{1,4}$/.test(v.y))return '年代は西暦の数字で入力してください（紀元前は -221 のように）';
  return '';
}
function toCard(v,id){
  const card={id:id,t:v.t,q:v.q,c:v.c,ex:v.ex};
  if(v.y!=='')card.y=parseInt(v.y,10);
  if(v.t==='essay'){card.pts=ptsList(v.pts);card.lim=v.lim?parseInt(v.lim,10):400;card.w=v.q.slice(0,24)}
  else{card.o=v.o;card.a=v.a|0;card.w=v.o[v.a|0]}
  return card;
}
async function saveNew(){
  const v=readForm();
  const err=validate(v);
  if(err){toast(err);return}
  if(QS.some(x=>x.q===v.q)){toast('同じ問題文がすでに登録されています');return}
  const card=toCard(v,'u'+Date.now());
  UC.push(card);QS.push(card);
  dirty=true;const ok=await saveState();
  updTotal();
  toast(ok?'問題を追加しました':'追加しましたが保存はまだ完了していません');
  renderAdd();
}

async function applyEdit(q,v){
  const card=toCard(v,q.id);
  for(const k of ['o','a','pts','lim','y'])if(!(k in card))delete q[k];
  Object.assign(q,card);
  if(isUserQ(q.id)){const u=UC.find(x=>x.id===q.id);if(u)Object.assign(u,card)}
  else OV[q.id]=card;
  dirty=true;return await saveState();
}
function deleteQ(id){
  if(isUserQ(id))UC=UC.filter(x=>x.id!==id);
  else if(!DL.some(d=>String(d)===String(id)))DL.push(id);
  const i=QS.findIndex(x=>String(x.id)===String(id));
  if(i>=0)QS.splice(i,1);
  delete S[id];
  dirty=true;saveState();updTotal();
}
